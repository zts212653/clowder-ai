                          _: ""
                  "false":
                    of: $.project.duplicate
                    map:
                      "true":
                        t: settingsUi.project.label.true
                        args: [$.project.name, $.project.parent]
                      "false": $.project.name
                      _: ""
                  _: ""
              "1": " · "
              "2":
                t: settingsUi.drift.kind
                args: [$.k]
          sep: ""
        "false":
          t: settingsUi.drift.title.false
          args:
            - of: $.project.home
              map:
