  dlg.fileOverwrite:
    title: t:settingsUi.confirm.fileOverwrite.title
    text:
      t: settingsUi.confirm.fileOverwrite.text
      args: [$.name]
    ok: t:common.confirm
  dlg.routingPreferenceRetire:
    title: t:settingsUi.confirm.routingPreferenceRetire
    fields:
      - {id: dlg-reason, label: t:chatCards.field.reason, area: true}
    ok: t:common.confirm
  settings.watcher:
    vm: watcherSettings
    blocks:
      - type: section
        title: t:chatMessage.watcher.title
        blocks:
          - type: settings
            rows:
              - label: t:chatMessage.watcher.enabled
                control:
                  type: switch
                  label: t:chatMessage.watcher.enabled
                  value: $.config.enabled
                  act: watcherConfigSet
                  args:
                    field: enabled
                    value:
                      of: $.config.enabled
                      map: {"true": false, _: true}
              - label: t:chatMessage.watcher.scope
                control:
                  type: select
                  id: watcher-scope
                  value: $.config.scope
                  change: watcherConfig
                  args: {field: scope}
                  options:
                    - {v: all, label: t:common.all}
                    - {v: selected, label: t:chatMessage.watcher.selected}
              - label: t:member.title
                control:
                  type: select
                  id: watcher-member
                  value: $.config.memberCatId
                  change: watcherConfig
                  args: {field: memberCatId}
                  options:
                    - from: $.members
                      item:
                        v: "@catId"
                        label: "@displayName"
                        why:
                          of: "@capability.supported"
                          map: {"true": "", _: "@capability.reason"}
          - type: choices
            variant: multi
            from: $.availableLabels
            item: {label: "@name", active: "@muted"}
            act: watcherQuietLabel
            args: {id: "@id"}
          - type: box
            load:
              of: $.error.length
              gte: 1
              map: {"true": error, _: ""}
            error: $.error
            retry:
              act: set
              args: {path: ss.watcherError, v: ""}
            blocks: []
rows:
  member.row:
    layout: two
    key: "@id"
    lead:
      - {text: "@rank", num: true, variant: meta, when: "@rank"}
      - {who: "@id", form: avatar}
    title: {who: "@id", form: title}
    inline:
      - control:
          type: status
          tone:
            of: "@availability"
            map: {tight: warn, limited: warn, unavailable: danger, _: ""}
          text:
            of: "@availability"
            map:
              available: t:member.availability.label.available
              tight: t:members.routing.quotaTight
              limited: t:member.availability.label.limited
              unavailable: t:memoryOwners.stateNote.unavailable
              unknown: t:member.availability.label.unknown
              _: "@availability"
        when:
          - of: "@availability"
            map: {available: false, _: true}
          - of: "@availabilityWhen"
            map: {"false": false, _: true}
      - {parts: "@inline"}
      - {dot: "@run.tone", tip: "@run.tip", when: "@run"}
      - {text: "@run.timer", num: true, when: "@run.timer"}
      - {text: "@mark", variant: meta, when: "@mark"}
    sub:
      - {parts: "@sub"}
    cols:
      - v:
          - {control: "@ctl", when: "@ctl"}
        w: ctl
      - v:
          - {parts: "@stat"}
        w: auto
        when: "@stat"
      - {v: "@ctx.label", w: num, tone: "@ctx.tone", tip: "@ctx.tip", when: "@ctx"}
    acts: {slot: "@slot", ctx: "@actsCtx", items: "@acts"}
    tone: "@tone"
    color: {who: "@id"}
    bar: {pct: "@bar.pct", tone: "@bar.tone"}
    act: "@act"
    args: "@args"
    expand: "@expand"
    more: "@more"
  accounts.account:
    layout: two
    key: "@id"
    title:
      - control:
          type: input
          id: acc-rn
          value: "@name"
          label: t:accounts.editNote
          go: rename
          cancel: close
          args: {entity: account, id: "@id", path: s.renaming}
          goLabel: t:common.save
        when: "@renaming"
      - {text: "@name", when: "!@renaming"}
      - text:
          of: "@using"
          map:
            "true":
              t: settingsUi.account.vendor.true
              args: ["@vendor"]
            "false": "@vendor"
            _: "@using"
        variant: meta
        when: "!@renaming"
    sub:
      - control:
          type: status
          text:
            t: settingsUi.account.exception
            args: ["@state"]
          tone:
            of: "@state"
            map:
              none: warn
              nokey: warn
              expired: warn
              login: info
              cancelled: ""
              conflict: warn
              _: "@state"
        when: {$frag: ACCOUNT_EXCEPTION}
      - text:
          of: "@state"
          map:
            ok: t:settingsUi.account.normal.ok
            key: t:settingsUi.account.normal.key
            token: t:settingsUi.account.normal.token
            none: t:settingsUi.account.normal.none
            nokey: t:settingsUi.account.normal.nokey
            cancelled: t:settingsUi.account.normal.cancelled
            expired: ""
            login: ""
            conflict: ""
            _: "@state"
        when:
          of: {$frag: ACCOUNT_EXCEPTION}
          map: {"true": false, _: true}
    cols:
      - v:
          - {text: "@usersCount", when: "@hasUsers"}
          - {lit: —, when: "!@hasUsers"}
        w: num
        tip:
          t: settingsUi.account.usersTip
          args: ["@hasUsers", "@usersCount"]
    act: toggle
    args:
      path: ss.accOpen.{k}
      k: "@id"
    tone:
      of: "@open"
      map: {"true": selected, "false": "", _: "@open"}
    moreWhen: "@open"
    more:
      - type: settings
        when: "@open"
        rows:
          - label: t:accounts.detail.label
            ctls:
              - type: text
                variant: value
                parts:
                  - parts: "@users"
                    sep: 、
                    each:
                      parts:
                        - parts: ["@name", " ", "@handle"]
                          sep: ""
                when: "@hasUsers"
              - {type: text, variant: value, text: t:chip.empty, when: "!@hasUsers"}
          - label: t:accounts.detail.loginIdentity
            when: "@email"
            control: {type: text, variant: value, text: "@email"}
          - label: t:accounts.detail.endpoint
            when: "@is.key"
            control: {type: text, variant: value, text: "@url", mono: true}
          - label: t:accounts.form.availableModels
            when: "@is.key"
            ctls:
              - type: text
                variant: value
                parts:
                  - parts: "@models"
                    sep: 、
                    each: {text: "@"}
                mono: true
                when: "@models"
              - type: text
                variant: value
                text: t:pcf.unset
                mono: true
                when: "!@models"
          - label: t:accounts.detail.loginDirectory
            when: "@dir"
            control: {type: text, variant: value, text: "@dir", mono: true}
          - label: t:accounts.quota
            when: "@quota"
            ctls:
              - type: status
                tone:
                  of: "@quotaData.fail"
                  map:
                    renewal_required: warn
                    signin_required: warn
                    service_unreachable: danger
                    _: "@quotaData.fail"
                text:
                  t: accounts.quotaFailure
                  args: ["@quotaData.fail"]
                when: "@quotaData.fail"
              - type: status
                tone: danger
                text: t:settings.quotaOut
                when: ["@quotaData.out", "!@quotaData.fail"]
              - type: text
                variant: value
                parts:
                  - parts: "@quotaData.items"
                    sep: " · "
                    each:
                      parts:
                        - {text: "@label"}
                        - {text: " "}
                        - text:
                            t: settings.quotaLeft
                            args: ["@left"]
                tip: {of: "@quotaData.resets", sep: " · "}
                when: "@quotaData.items"
              - type: text
                variant: value
                text: {of: "@quotaData.at", fmt: hm}
                faint: true
                num: true
                when: "@quotaData.hasAt"
              - type: button
                label: t:accounts.switchAway
                items: {$frag: CODEX_ACCOUNT_ITEMS}
                when: "@quotaData.out"
              - type: button
                label:
                  t: settingsUi.account.quotaLabel
                  args: ["@quotaBusy"]
                act: accQuota
                args: {k: "@id"}
                disabled: "@quotaBusy"
                when: "!@quotaData.out"
          - label:
              t: settingsUi.account.actionsLabel
              args: ["@builtin"]
            ctls:
              - type: button
                label: t:accounts.switchTo
                act: accSwitch
                args: {k: "@id"}
                when: "@canSwitch"
              - type: button
                label: t:accounts.resolve
                act: accLogin
                args: {k: "@id", v: go}
                when:
                  of: "@state"
                  map: {login: true, _: false}
              - type: button
                label: t:common.cancel
                act: accLogin
                args: {k: "@id", v: cancel}
                when:
                  of: "@state"
                  map: {login: true, _: false}
              - type: button
                label: t:common.retry
                act: accLogin
                args: {k: "@id", v: refresh}
                when:
                  of: "@state"
                  map: {cancelled: true, _: false}
              - type: button
                label: t:accounts.deleteEntry
                act: accConflict
                args: {k: "@id", v: drop}
                when:
                  of: "@state"
                  map: {conflict: true, _: false}
              - type: button
                label: t:accounts.keep
                act: accConflict
                args: {k: "@id", v: keep}
                when:
                  of: "@state"
                  map: {conflict: true, _: false}
              - type: more
                args: {k: "@id"}
                size: m
                items:
                  - {scope: t:accounts.menu.group, when: "@builtin"}
                  - {label: t:accounts.menu.label, act: noop, when: "@builtin"}
                  - label: t:accounts.menu.editNote
                    act: rename
                    args: {entity: account, id: "@id"}
                    when: "!@builtin"
                  - label: t:accounts.menu.loginAgain
                    act: accRelogin
                    args: {id: "@id"}
                    when: ["!@builtin", "@managed"]
                  - label: t:common.edit
                    act: accOpen
                    args: {kind: acc, v: key, id: "@id"}
                    when: ["!@builtin", "@is.key"]
                  - label: t:accounts.menu.updateToken
                    act: tokenOpen
                    args: {kind: token, id: "@id"}
                    when: ["!@builtin", "@is.token"]
                  - label:
                      t: accounts.menu.deleteUsedRegistration
                      args: ["@usersCount"]
                    why:
                      t: accounts.delete.toast
                      args: ["@usersCount"]
                    tone: danger
                    when: ["!@builtin", "@hasUsers"]
                  - label: t:accounts.delete.ok
                    act: remove
                    args: {entity: account, id: "@id"}
                    tone: danger
                    when: ["!@builtin", "!@hasUsers"]
  mount.row:
    layout: two
    key: "@name"
    title: "@name"
    sub: {text: "@path", mono: true}
    inline:
      - text:
          of: "@ov"
          map:
            project: t:settingsUi.mcp.tag.project
            default: t:settingsUi.mcp.tag.default
            _: "@ov"
        variant: meta
        when: "@ov"
      - {text: t:capabilities.skill.mark, variant: meta, when: "@pointOff"}
      - text: t:capabilities.skill.text
        variant: meta
        tone: warn
        when: "@broken"
    cols:
      - control:
          type: switch
          value: "@on"
          act: setStatus
          args: {entity: mount, id: "@name"}
          label:
            t: skills.mount.sw
            args: ["@on", "@name"]
        when: "@rule"
      - control:
          type: switch
          value: "@on"
          disabled: "@pointOff"
          act: capSkillMount
          args: {n: "@skill", m: "@name"}
          label:
            t: capabilities.skill.mountSw
            args: ["@on", "@name"]
        when: "@skill"
    acts:
      - label: t:common.remove
        icon: delete
        act: remove
        args: {entity: mountCustom, id: "@i"}
        when: "@custom"
  drift.row:
    layout: two
    lead:
      - icon:
          of: "@home"
          map: {"true": home, "false": folder}
        size: s
        when: "@dir"
    title:
      - text:
          of: "@home"
          map:
            "true": t:settingsUi.project.scope.true
            "false":
              of: "@duplicate"
              map:
                "true":
                  t: settingsUi.project.label.true
                  args: ["@name", "@parent"]
                "false": "@name"
                _: ""
        when: "@dir"
      - text: "@name"
        mono: true
        when: ["!@dir", "@name"]
      - text: t:capabilities.drift.kind.detect_failed
        when: ["!@dir", "!@name"]
    sub:
      text: "@projectPath"
      mono: true
      when: ["@dir", "@projectPath"]
    inline:
      - control:
          type: status
          tone: warn
          text:
            t: capabilities.drift.details.count
            args: ["@items.length"]
        when: "@dir"
      - control:
          type: status
          tone: warn
          text:
            t: settingsUi.drift.itemText
            args:
              - t: capabilities.drift.kind
                args: ["@type"]
              - "@text"
        when: ["!@dir", "@name"]
      - control:
          type: status
          tone: warn
          text: t:capabilities.drift.details.syncUnavailable
        when: ["!@dir", "!@name"]
    cols:
      - w:
          of: "@dir"
          map: {"true": ctl, "false": icon}
        v:
          - control:
              type: button
              label: t:wsCommunity.sync
              iconOnly: true
              icon: refresh
              act: capSync
              args: {k: $.k, s: "@id"}
            when: "@dir"
          - icon: pen
            size: s
            when: ["!@dir", "@ov"]
        tip:
          of: "@ov"
          map: {"true": t:capabilities.drift.details.tip, _: ""}
