                  t: settingsUi.project.scope.true
                  args:
                    - of: $.project.duplicate
                      map:
                        "true":
                          of: [0, 1, 2]
                          item:
                            of: "@"
                            map: {"0": $.project.name, "1": " · ", "2": $.project.parent}
                          sep: ""
                        "false": $.project.name
                        _: ""
                "false":
                  of: $.project.duplicate
                  map:
                    "true":
                      of: [0, 1, 2]
                      item:
                        of: "@"
                        map: {"0": $.project.name, "1": " · ", "2": $.project.parent}
                      sep: ""
                    "false": $.project.name
