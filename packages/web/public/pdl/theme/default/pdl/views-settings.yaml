  dlg.drift:
    bare: true
    title:
      of: $.scoped
      map:
        "true":
          of: [0, 1, 2]
          item:
            of: "@"
            map:
              "0":
                of: $.project.home
                map:
                  "true":
                    t: settingsUi.project.scope.true
                    args:
                      - of: $.project.duplicate
                        map:
                          "true":
                            t: settingsUi.project.label.true
                            args: [$.project.name, $.project.parent]
