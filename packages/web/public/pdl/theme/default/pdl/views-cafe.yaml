          - type: button
            label: t:common.next
            act: set
            args: {path: ws.rtPage, add: "1"}
            disabled: $.rt.d.last
      - type: head
        variant: detail
        when: $.rt.filter
        actions:
          - type: button
            iconOnly: true
            icon: refresh
            label: t:common.refresh
            act: refresh
            args: {k: runtime}
      - type: toolbar
        when: $.rt.filter
        items:
          - type: seg
            value: $.rt.filter
            options:
              - {v: all, label: t:common.all}
              - {v: active, label: t:common.status.running}
              - {v: sealed, label: t:wsSessions.sealed}
              - {v: attention, label: t:wsEval.attention}
            act: set
            args: {path: ws.rtF}
      - type: list
        when: $.rt.filter
        from: $.rt.rows
        row: ops.runtime
        empty: t:workbench.runtime.noSessions
      - type: head
        variant: detail
        when: $.gov.d
        title: {text: $.gov.d.path, mono: true}
        sub:
          text:
            t: workbench.govern.versionSummary
