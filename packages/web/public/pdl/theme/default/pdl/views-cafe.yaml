          tune: t:evolutionFlow.decision.tune
          rollback: t:evolutionFlow.decision.rollback
          sunset: t:evolutionFlow.decision.sunset
          no_change: t:wsEvolution.detail.keepCurrent
          insufficient: t:evolutionFlow.evidenceInsufficient
