          "true": "@name"
          "false":
            t: workbench.evoName.false
            args: ["@name"]
          _: "@hasName"
    sub:
      parts:
        - {text: "@origin", when: "@origin"}
        - text:
            t: evolutionFlow.stage
            args: ["@stage"]
        - text:
            of: "@lifecycle"
            map:
              paused: t:workbench.evoState.paused
              terminal: t:workbench.evoState.terminal
              needs_expert: t:workbench.evoState.needs_expert
              needs_update: t:workbench.evoState.needs_update
              source_unavailable: t:workbench.evoState.source_unavailable
              source_invalid: t:workbench.evoState.source_invalid
              materializing: t:workbench.evoState.materializing
              unavailable: t:memoryOwners.stateNote.unavailable
              invalid: t:workbench.evoState.invalid
              active: ""
              submitted: ""
              recorded: ""
              available: ""
              connected: ""
              resolved: ""
              _: "@lifecycle"
      sep: " · "
    act: wsSub
    args: {k: evolution, v: "@id"}
    cols:
      - v: []
        w: auto
      - control: []
  evolution.detail:
    layout: two
    title:
      - text: "@title"
        when: ["!@preparation", "!@object"]
      - {text: "@title", when: "@object"}
      - text: "@title"
        when: ["@preparation", "@submission"]
      - text:
          of: "@section"
          map:
            object_map: evolutionFlow.preparation.object_map
            success_contract: evolutionFlow.preparation.success_contract
            measurement_plan: evolutionFlow.preparation.measurement_plan
            baseline_diagnosis: evolutionFlow.preparation.baseline_diagnosis
            _: "@section"
        when: ["@preparation", "!@submission"]
    sub:
      - text: "@sub"
        when: ["!@object", "!@preparation"]
      - text:
          of: "@choiceState"
          map:
            explore: t:evolutionFlow.choice.explore
            fixed: t:evolutionFlow.choice.fixed
            excluded: t:evolutionFlow.choice.excluded
            undecided: t:memoryOwners.stateNote.pending
            _: "@choiceState"
        when: "@object"
      - text:
          of: "@state"
          map:
            paused: t:workbench.evoState.paused
            terminal: t:workbench.evoState.terminal
            needs_expert: t:workbench.evoState.needs_expert
            needs_update: t:workbench.evoState.needs_update
            source_unavailable: t:workbench.evoState.source_unavailable
            source_invalid: t:workbench.evoState.source_invalid
            materializing: t:workbench.evoState.materializing
            unavailable: t:memoryOwners.stateNote.unavailable
            invalid: t:workbench.evoState.invalid
            active: ""
            submitted: ""
            recorded: ""
            available: ""
            connected: ""
            resolved: ""
            _: "@state"
        when: "@preparation"
    act:
      of: "@canOpen"
      map: {"true": msgJump, _: ""}
    args: {t: "@sourceAnchor.threadId", mid: "@sourceAnchor.messageId"}
    expand:
      - type: kv
        item: {$frag: EVO_FIELD_ITEM}
        from: "@fields"
        when: "@fields"
      - type: markdown
        text: "@body"
        when: {of: "@body.length", gte: 0}
      - {type: list, from: "@sources", row: evolution.source, optional: true}
      - type: each
        from: "@media"
        when: "@media"
        blocks:
          - {type: component, use: media, props: "@"}
      - type: disclosure
        key: "@trace.key"
        title: "@trace.title"
        when: "@trace"
        blocks:
          - type: each
            from:
              - {}
            item:
              fields:
                - field: axes
                  label: "@trace.xLabel"
                  axis: "@trace.yLabel"
                  unit: "@trace.unit"
            blocks:
              - type: kv
                from: "@fields"
                item: {$frag: EVO_FIELD_ITEM}
          - type: list
            from: "@trace.points"
            item: {$frag: EVO_TRACE_ITEM}
            row: record.row
    cols:
      - v: []
        w: auto
      - control: []
