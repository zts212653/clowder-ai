          label:
            t: wsSignals.list.selectNamed
            args: ["@title"]
    title: "@title"
    sub:
      parts:
        - parts:
            - parts: ["@src", " · ", "@time", " · ", t:wsSignals.tier, " ", "@tier"]
              sep: ""
        - {text: t:wsSignals.list.sub, when: "@note"}
        - text:
            t: wsSignals.list.studyCountSuffix
            args: ["@study"]
          when: "@study"
        - parts:
            - parts:
                - " · "
                - of: "@st"
                  map:
                    inbox: t:wsSignals.inbox
                    starred: t:threadRow.section.favorites
                    read: t:wsSignals.read
                    archived: t:workbench.signalState.archived
                    _: "@st"
              sep: ""
          when: $.list.allStates
      sep: ""
    cols:
      - w: auto
        control:
          type: more
          args: {k: "@id"}
          items:
            - label: t:wsSignals.markRead
              act: setStatus
              args: {entity: sig, id: "@id", v: read}
            - label:
                of: "@starred"
                map: {"true": t:workbench.star.true, "false": t:wsSignals.starred, _: "@starred"}
              act: setStatus
              args:
                entity: sig
                id: "@id"
                v:
                  of: "@starred"
                  map: {"true": inbox, "false": starred, _: "@starred"}
            - label: t:wsSignals.archive
              act: setStatus
              args: {entity: sig, id: "@id", v: archived}
      - control: []
    act: wsSub
    args: {k: signals, v: "@id"}
  signal.source:
    layout: two
    title: "@name"
    tone:
      of: "@on"
      map: {"true": "", "false": past, _: "@on"}
    sub:
      parts:
        - text: {of: "@url", fmt: urlLabel}
          mono: true
        - parts:
            - parts: [" · ", "@how", " · ", "@freq"]
              sep: ""
      sep: ""
    cols:
      - v: []
        w: auto
      - control:
          - type: button
            label:
              t: workbench.busyFetch
              args: ["@busy"]
            act: wsFetch
            args: {k: "@id"}
            disabled: "@busy"
          - type: switch
            value: "@on"
            act: setStatus
            args: {entity: src, id: "@id"}
            label:
              t: wsSignals.list.enableNamed
              args: ["@name"]
  signal.activity:
    layout: two
    title: "@title"
    sub:
      parts:
        - parts: ["@time", " · ", "@source"]
          sep: ""
    act: wsSub
    args: {k: signals, v: "@id"}
    cols:
      - w: auto
        v:
          parts:
            - chips: "@acts"
              each:
                chip:
                  t: workbench.timelineAct
                  args: ["@kind", "@who"]
            - control:
                type: button
                iconOnly: true
                icon: jump
                label: t:wsCommunity.openThread
                act: goThread
                args: {id: "@thread"}
          sep: ""
      - control: []
  signal.link:
    layout: two
    title: "@title"
    sub:
      text:
        t: wsSignals.detail.sub
        args: ["@linkedAt"]
    act: goThread
    args: {id: "@id"}
    cols:
      - w: auto
        control:
          type: button
          iconOnly: true
          icon: unlink
          label: t:wsSignals.detail.label
          act: remove
          args: {entity: sigLink, id: "@id"}
      - control: []
  signal.segment:
    layout: two
    title: "@title"
    sub: "@text"
    lead:
      - control:
          type: button
          iconOnly: true
          label:
            of: "@playing"
            map: {"true": t:player.pause, "false": t:player.play, _: "@playing"}
          icon:
            of: "@playing"
            map: {"true": pause, "false": play, _: "@playing"}
          act: fold
          args: {path: ws.playing, i: "@i", cast: num}
    cols:
      - w: auto
        control:
          type: button
          iconOnly: true
          icon: download
          label: t:wsSignals.detail.downloadAudio
          act: toast
          args: {msg: t:wsSignals.detail.msg}
      - control: []
