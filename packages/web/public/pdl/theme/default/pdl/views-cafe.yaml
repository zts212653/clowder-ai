        blocks:
          - {type: list, from: $.gov.d.prev.rows, row: ops.governPatch}
          - type: toolbar
            items:
              - type: button
                primary: true
                danger: $.gov.d.prev.undo
                label:
                  t: workbench.governApply
                  args: [$.gov.d.prev.undo, $.gov.d.prev.count]
                act: wsGovApply
      - type: head
        variant: detail
        when: $.gov.list
        actions:
          - type: button
            iconOnly: true
            icon: refresh
            label: t:common.refresh
            act: refresh
            args: {k: gov}
      - type: list
        when: $.gov.list
        from: $.gov.rows
        row: ops.governProject
      - type: head
        variant: detail
        when: $.brake
        actions:
          - {type: button, label: t:wsOps.previewReminder, act: wsBrakePreview}
      - type: settings
        when: $.brake
        rows:
          - label: t:workbench.brake.label
            control:
              type: switch
              value: $.brake.on
              act: toggle
              args: {path: ws.brake}
              label: t:workbench.brake.label
          - label: t:workbench.brake.interval
            control:
              type: range
              min: 30
              max: 240
              step: 15
              value: $.brake.minutes
              change: wsBrakeMin
              label: t:workbench.brake.interval
              unit: t:workbench.brake.unit
          - label: t:workbench.brake.mode
            help:
              - text:
                  t: workbench.brakeHelp
                  args: [$.brake.mode]
            control:
              type: seg
              value: $.brake.mode
              options:
                - {v: gentle, label: t:workbench.brake.gentle}
                - {v: hard, label: t:workbench.brake.strict}
              act: set
              args: {path: ws.brakeMode}
      - type: notice
        when: $.brake.hard
        tone: warn
        strong: t:wsOps.commitment
        text: t:wsOps.skipLimit
      - type: text
        variant: meta
        when: $.brake
        text: t:wsOps.nightSoft
        help: t:wsOps.nightSoftHelp
      - type: section
        when: $.cmd
        title: t:system.general
        blocks:
          - type: list
            from:
              - {command: /help, description: t:workbench.commands.viewHelp}
              - {command: /config, description: t:workbench.commands.viewConfiguration}
              - {command: /config set, description: t:workbench.commands.editConfiguration}
            row: ops.command
      - type: section
        when: $.cmd
        title: t:common.memory
        blocks:
          - type: list
            from:
              - {command: /remember, description: t:workbench.commands.remember}
              - {command: /recall, description: t:workbench.commands.recall}
              - {command: /approve, description: t:workbench.commands.approveMemory}
              - {command: /archive, description: t:wsSignals.archive}
            row: ops.command
      - type: section
        when: $.cmd
        title: t:workbench.commands.knowledgeLibrary
        blocks:
          - type: list
            from:
              - {command: /evidence, description: t:workbench.commands.findEvidence}
              - {command: /reflect, description: t:workbench.commands.reflect}
              - {command: /signals, description: t:workbench.commands.findSignals}
            row: ops.command
      - type: section
        when: $.cmd
        title: t:workbench.commands.games
        blocks:
          - type: list
            from:
              - {command: /game werewolf, description: t:workbench.commands.startWerewolf}
            row: ops.command
      - type: section
        when: $.cmd
        title: t:system.tasks
        blocks:
          - type: list
            from:
              - {command: /tasks extract, description: t:workbench.commands.extractTasks}
            row: ops.command
      - type: section
        when: $.cmd
        title: t:workbench.commands.vote
        blocks:
          - type: list
            from:
              - {command: /vote, description: t:chat.commands.title.vote}
            row: ops.command
      - type: section
        when: $.cmd
        title: t:workbench.commands.crossPlatform
        blocks:
          - type: list
            from:
              - {command: /where, description: t:workbench.commands.currentThreadCommand}
              - {command: /new, description: t:workbench.route.new}
              - {command: /threads, description: t:workbench.commands.listThreads}
              - {command: /use, description: t:workbench.commands.switchThread}
              - {command: /cats, description: t:workbench.commands.listMembers}
              - {command: /status, description: t:common.state}
              - {command: /focus, description: t:workbench.commands.focusMode}
            row: ops.command
      - type: section
        when: $.cmd
        title: t:workbench.commands.title
        blocks:
          - type: settings
            rows:
              - label: t:workbench.commands.toggleVoiceInput
                control:
                  type: text
                  parts:
                    - {text: ⌥V, mono: true}
              - label: t:workbench.commands.toggleSplit
                control:
                  type: text
                  parts:
                    - {text: ⌘\, mono: true}
              - label: t:workbench.commands.choosePane
                control:
                  type: text
                  parts:
                    - {text: ⌘1–⌘4, mono: true}
              - label: t:entryLayout.shell.collapseWorkbench
                control:
                  type: text
                  parts:
                    - {text: Esc, mono: true}
      - type: head
        variant: detail
        when: $.rescue
        desc:
          parts:
            - {text: $.facts.repairScope, mono: true}
        actions:
          - type: button
            primary: true
            label:
              t: workbench.scanLabel
              args: [$.rescue.scanning]
            act: wsScan
            disabled: $.rescue.scanning
            tip: t:wsOps.repairDesc
      - type: text
        variant: meta
        when: $.rescue.found
        text:
          t: wsOps.repairFound
          args: [$.facts.repairCount]
      - type: list
        when: $.rescue.found
        from: $.rescue.rows
        row: ops.repair
      - type: toolbar
        when: $.rescue.found
        items:
          - type: button
            primary: true
            label:
              t: workbench.rescue.fixLabel
              args: [$.rescue.count]
            act: wsRescue
            disabled: $.rescue.none
      - type: empty
        when: [$.rescue, "!$.rescue.found"]
        text: t:workbench.rescue.emptyText
      - type: text
        variant: meta
        when: $.rescue.last
        text:
          t: workbench.rescue.last
          args: [$.rescue.last]
  dlg.brakeAsk:
    title: t:workbench.rest.confirm.title
    text:
      - parts:
          - t: workbench.rest.confirm.text
            args: [$.minutes]
          - " "
          - t: workbench.brakeLevel
            args: [$.level]
        sep: ""
    ok: t:wsSignals.batchTag.ok
    fields:
      - id: brake-choice
        radios:
          - {v: rest, title: t:workbench.rest.confirm.rest}
          - {v: wrap_up, title: t:workbench.rest.confirm.wrap}
          - v: continue
            title: t:workbench.rest.confirm.go
            sub: t:workbench.rest.confirm.goSub
            when: "!$.bypassDisabled"
      - {id: dlg-in, label: t:hub.detail.reason, when: "!$.bypassDisabled"}
  cafe.ws.team:
    loading: t:wsTeam.load.loading
    error: t:wsTeam.load.error
    stale: t:wsTeam.load.stale
    empty: t:wsTeam.load.text
    vm: cafeWsTeam
    blocks:
      - type: head
        variant: detail
        when: $.detail.m
        title:
          parts:
            - {who: $.detail.m.id, form: avatar, size: lg}
            - {who: $.detail.m.id, form: title}
          sep: ""
        sub:
          parts:
            - parts: [$.detail.m.breed, " · ", $.detail.m.model]
              sep: ""
        actions:
          - type: button
            iconOnly: true
            icon: gear
            label: t:wsTeam.editInSettings
            act: open
            args: {page: $.detail.m.to}
      - type: status
        when: $.detail.m
        tone:
          of: $.detail.m.av
          map:
            available: ok
            tight: warn
            limited: warn
            unavailable: danger
            unknown: info
        text:
          of: $.detail.m.av
          map:
            available: t:member.availability.label.available
            tight: t:members.routing.quotaTight
            limited: t:member.availability.label.limited
            unavailable: t:memoryOwners.stateNote.unavailable
            unknown: t:member.availability.label.unknown
            _: $.detail.m.av
      - type: section
        when: $.detail.m
        title: t:wsTeam.abilities
        note: "2"
        blocks:
          - type: each
            from:
              - {}
            when: $.detail.m.prof
            item:
              rows:
                - kind: good
                  count: $.detail.m.prof.good.length
                  texts: $.detail.m.prof.good
                - kind: care
                  count: $.detail.m.prof.care.length
                  texts: $.detail.m.prof.care
            blocks:
              - {type: list, from: "@rows", row: team.profile}
          - type: text
            variant: meta
            when: $.detail.m.prof
            parts:
              - text:
                  of: $.detail.m.prof.hasDate
                  map: {"true": $.detail.m.prof.date, "false": —, _: $.detail.m.prof.hasDate}
                variant: meta
          - type: box
            variant: card
            when: "!$.detail.m.prof"
            blocks:
              - type: text
                parts:
                  - {text: t:wsTeam.profileMissing, strong: true}
      - type: disclosure
        when: $.detail.m
        key: $.detail.m.techKey
        title: t:wsTeam.evidenceDetails
        blocks:
          - type: kv
            from:
              - k: t:wsTeam.detail.memberIdentity
                v:
                  - parts:
                      - parts:
                          - $.detail.m.id
                          - " · "
                          - of: $.detail.m.tech.hasProvider
                            map:
                              "true": {of: $.detail.m.tech.provider, case: lower}
                              "false": —
                              _: $.detail.m.tech.hasProvider
                        sep: ""
                    mono: true
              - k: t:wsTeam.detail.profileVersion
                v:
                  - {text: $.detail.m.tech.version, mono: true, when: $.detail.m.prof}
                  - {text: t:wsTeam.detail.evidencePrefix, when: $.detail.m.prof}
                  - {text: $.detail.m.tech.evidence, mono: true, when: $.detail.m.prof}
                  - {text: t:wsTeam.detail.noAppliedProfiles, when: "!$.detail.m.prof"}
              - k: t:wsTeam.detail.statusEvidence
                v:
                  - text:
                      of: $.detail.m.av
                      map:
                        available: routing_signal:none
                        tight: routing_signal:none
                        limited: routing_signal:none
                        unavailable: routing_signal:none
                        unknown: t:workbench.routingEvidence.unknown
                        _: $.detail.m.av
                    mono: true
      - type: head
        variant: detail
        when: $.detail.p
        title: $.detail.p.name
        sub:
          text:
            t: wsTeam.detail.memberCount
            args: [$.detail.p.count]
      - type: list
        id: ws-prov-m
        when: $.detail.p
        from: $.detail.p.rows
        row: member.row
      - type: section
        when: $.detail.signal
        title: t:wsTeam.routeSignals
        note: "3"
        help: t:wsTeam.signalsHelp
        blocks:
          - type: text
            variant: meta
            parts:
              - text:
                  t: workbench.affectedPrefix
                  args: [$.detail.signal.count]
              - parts: $.detail.signal.affected
                sep: 、
                each:
                  parts:
                    - parts: ["@name", " ", "@handle"]
                      sep: ""
          - type: list
            from: $.detail.signal.rows
            row: team.assertion
            empty: t:wsTeam.noSignals
          - type: form
            id: wsSignal
            args: {subj: $.detail.signal.subj}
            blocks:
              - type: settings
                rows:
                  - kind: field
                    label: t:common.state
                    id: ws-sig-st2
                    control:
                      type: select
                      id: ws-sig-st2
                      options: [t:wsTeam.throttle, t:wsTeam.degraded, t:memoryOwners.stateNote.unavailable]
                      value: t:wsTeam.throttle
                  - kind: field
                    label: t:wsTeam.validFor
                    id: ws-sig-dur
                    control:
                      type: select
                      id: ws-sig-dur
                      options: [t:wsTeam.hours1, t:wsTeam.hours4, t:wsTeam.hours24, t:system.days7]
                      value: t:wsTeam.hours4
                  - kind: field
                    label: t:chatCards.field.reason
                    id: ws-sig-why
                    req: true
                    control: {type: input, id: ws-sig-why, mono: true, value: owner-constraint}
                    help: t:wsTeam.reasonHelp
                  - kind: field
                    label: t:common.note
                    id: ws-sig-note
                    control: {type: input, id: ws-sig-note, placeholder: t:common.optional}
              - type: toolbar
                items:
                  - {type: button, label: t:wsTeam.registerSignal, submit: true}
      - type: toolbar
        when: "!$.detail"
        note: "1"
        items:
          - type: seg
            value: $.view
            options:
              - {v: roster, label: t:member.title}
              - {v: prov, label: t:wsTeam.byService}
              - {v: prefs, label: t:wsTeam.list.preferences, count: $.ruleN}
              - {v: ledger, label: t:wsTeam.list.assignmentHistory}
            act: set
            args: {path: ws.teamV}
      - {type: list, when: $.isProv, from: $.prov, row: team.provider}
      - type: list
        when: $.isPrefs
        from: $.prefs
        row: team.preference
        empty: t:wsTeam.list.noPreferences
      - type: head
        variant: detail
        when: $.ledger
        actions:
          - type: button
            iconOnly: true
            icon: refresh
            label: t:wsTeam.refreshLedger
            act: refresh
            args: {k: ledger}
      - type: section
        when: $.ledger
        title: t:wsTeam.signalEvents
        help:
          t: wsTeam.list.evDesc
          args: [$.ledger.eventCount]
        blocks:
          - {type: list, from: $.ledger.events, row: team.event}
      - type: section
        when: $.ledger
        title: t:wsTeam.preferenceVersions
        help:
          t: wsTeam.list.evDesc
          args: [$.ledger.versionCount]
        blocks:
          - {type: list, from: $.ledger.versions, row: team.version}
      - type: head
        variant: detail
        when: $.roster
        actions:
          - type: button
            iconOnly: true
            icon: gear
            label: t:wsTeam.settingsMembers
            act: open
            args: {page: members}
      - type: notice
        when: $.roster.degraded
        tone: warn
        strong: t:wsTeam.routeIncomplete
        text:
          t: wsTeam.list.degradedText
          args:
            - of: [0, 1, 2]
              item:
                of: "@"
                map: {"0": $.roster.affected.0.name, "1": " ", "2": $.roster.affected.0.handle}
              sep: ""
            - of: [0, 1, 2]
              item:
                of: "@"
                map: {"0": $.roster.affected.1.name, "1": " ", "2": $.roster.affected.1.handle}
              sep: ""
        action:
          type: button
          label: t:frame.reload
          act: wsSim
          args: {k: team, v: ""}
      - type: toolbar
        when: $.roster
        items:
          - type: search
            id: ws-team-q
            placeholder: t:wsTeam.searchPlaceholder
            value: $.roster.q
            input: wsTeamQ
          - type: select
            id: ws-team-f
            change: wsTeamF
            label: t:wsTeam.memberFilter
            options:
              - v: all
                label:
                  of: [0, 1, 2]
                  item:
                    of: "@"
                    map: {"0": t:common.all, "1": " ", "2": $.roster.counts.all}
                  sep: ""
              - v: attention
                label:
                  of: [0, 1, 2]
                  item:
                    of: "@"
                    map: {"0": t:wsTeam.list.needsAttention, "1": " ", "2": $.roster.counts.attention}
                  sep: ""
              - v: noProfile
                label:
                  of: [0, 1, 2]
                  item:
                    of: "@"
                    map: {"0": t:wsTeam.list.missingProfile, "1": " ", "2": $.roster.counts.noProfile}
                  sep: ""
            value: $.roster.f
      - type: list
        id: ws-roster
        when: $.roster
        from: $.roster.items
        item:
          availabilityWhen:
            of: "@degraded"
            map: {"true": false, _: true}
          sub:
            of: "@degraded"
            map:
              "true":
                t: workbench.rosterSub.true
                args:
                  - "@breed"
                  - "@model"
                  - t: workbench.rosterProfile
                    args: ["@hasProfile", "@good"]
              "false":
                t: workbench.rosterSub.false
                args:
                  - "@breed"
                  - "@model"
                  - t: workbench.rosterProfile
                    args: ["@hasProfile", "@good"]
              _: "@degraded"
          act: wsSub
          args:
            k: team
            v:
              t: workbench.memberRef
              args: ["@id"]
        row: member.row
        empty: t:wsTeam.list.noMatchingMembers
        emptyAction:
          type: button
          label: t:skills.clearFilter
          act: set
          args:
            path: ws.teamByThread.{t}.q|ws.teamByThread.{t}.f|s.wsTeamQ
            v: "|all|"
            t: $.roster.thr
  signal.article:
    page: true
    vm: cafeWsSignals
    blocks:
      - type: head
        variant: detail
        when: $.detail.id
        eyebrow:
          parts:
            - parts:
                - t:wsSignals.tier
                - " "
                - $.detail.tier
                - " · "
                - of: $.detail.state
                  map:
                    inbox: t:wsSignals.inbox
                    starred: t:threadRow.section.favorites
                    read: t:wsSignals.read
                    archived: t:workbench.signalState.archived
                    _: $.detail.state
              sep: ""
        title: $.detail.title
        sub:
          - parts:
              - parts: [$.detail.source, " · "]
                sep: ""
          - text:
              of: [0, 1, 2]
              item:
                of: "@"
                map: {"0": $.detail.year, "1": /, "2": $.detail.time}
              sep: ""
            num: true
        actions:
          - type: button
            primary: true
            label: t:wsSignals.discussInChat
            act: wsDiscuss
            args: {k: $.detail.id, v: discuss}
            disabled: $.detail.discussing
          - type: more
            items:
              - {label: t:wsSignals.articleMenu.label, act: openUrl}
              - label: t:wsSignals.articleMenu.setInbox
                act: setStatus
                args: {entity: sig, id: $.detail.id, v: inbox}
              - label: t:wsSignals.markRead
                act: setStatus
                args: {entity: sig, id: $.detail.id, v: read}
              - label: t:wsSignals.starred
                act: setStatus
                args: {entity: sig, id: $.detail.id, v: starred}
              - label: t:common.delete
                act: remove
                args: {entity: sig, id: $.detail.id}
                tone: danger
      - type: split
        variant: aside
        scroll: panes
        when: $.detail.id
        left:
          - type: section
            title: t:wsSignals.aiSummary
            blocks:
              - {type: markdown, text: $.detail.sum}
          - type: section
            title: t:common.tags
            blocks:
              - type: tags
                from: $.detail.tags
                empty: t:wsSignals.noTags
                add:
                  id: ws-tag
                  act: add
                  args: {entity: sigTag, k: $.detail.id}
                  label: t:common.addTag
          - type: section
            title: t:wsSignals.body
            actions:
              - type: button
                iconOnly: true
                icon: refresh
                label: t:common.refresh
                act: wsSigRefresh
                args: {k: $.detail.id}
            blocks:
              - {type: markdown, text: $.detail.body, more: $.detail.more}
        right:
          - type: section
            title:
              t: wsSignals.studyCount
              args: [$.detail.study]
            actions:
              - type: button
                label: t:wsSignals.startLearning
                act: wsDiscuss
                args: {k: $.detail.id, v: learn}
              - type: button
                label: t:wsSignals.multiCatResearch
                act: wsDiscuss
                args: {k: $.detail.id, v: multiCatResearch}
            blocks:
              - type: text
                variant: meta
                text:
                  t: wsSignals.detail.lastStudy
                  args: [$.detail.lastStudyAt]
                when: $.detail.study
              - type: section
                title: t:wsSignals.linkedThreads
                blocks:
                  - {type: list, from: $.detail.links, row: signal.link}
                  - type: toolbar
                    items:
                      - type: input
                        add: true
                        id: ws-link
                        mono: true
                        placeholder: t:wsSignals.threadId
                        label: t:wsSignals.threadId
                        go: add
                        args: {entity: sigLink, k: $.detail.id}
                        goLabel: t:hub.related
              - type: section
                title: t:wsSignals.notes
                actions:
                  - type: select
                    id: sig-note
                    options:
                      - from: $.detail.notes
                        item:
                          v: "@v"
                          label:
                            t: workbench.noteName
                            args: ["@v", "@at"]
                    value: $.detail.noteId
                    label: t:wsSignals.notes
                    change: sigNote
                    args: {id: $.detail.id}
                    when: $.detail.notes
                blocks:
                  - type: disclosure
                    key: $.detail.noteKey
                    title:
                      parts:
                        - {text: $.detail.noteId, mono: true}
                        - text:
                            t: wsSignals.noteDone
                            args: [$.detail.noteDoneAt]
                      sep: ""
                    blocks:
                      - {type: text, variant: para, text: $.detail.noteSum}
              - type: section
                title: t:wsSignals.podcast
                actions:
                  - type: button
                    label: t:wsSignals.makeBrief
                    act: wsPodGen
                    args: {v: brief}
                  - type: button
                    label: t:wsSignals.makeDeep
                    act: wsPodGen
                    args: {v: deep}
                blocks:
                  - type: text
                    variant: meta
                    text:
                      t: wsSignals.detail.podGen
                      args:
                        - of: $.detail.podGen
                          map: {brief: t:wsSignals.brief, deep: t:wsSignals.deep, _: $.detail.podGen}
                    when: $.detail.podGen
                  - type: toolbar
                    when: $.detail.pods
                    items:
                      - type: each
                        from: $.detail.pods
                        control:
                          type: chip
                          label:
                            of: "@id"
                            slice: [0, 8]
                          act: set
                          args: {path: ws.pod, v: "@v", cast: num}
                          pressed: "@on"
                  - type: toolbar
                    when: $.detail.pod
                    items:
                      - type: text
                        variant: meta
                        text:
                          t: wsSignals.detail.line
                          args:
                            - of: $.detail.pod.kind
                              map: {brief: t:wsSignals.brief, deep: t:wsSignals.deep, _: $.detail.pod.kind}
                            - $.detail.pod.count
                            - $.detail.pod.minutes
                      - {type: grow}
                      - type: button
                        label:
                          of: $.detail.pod.playing
                          map:
                            "true": t:common.stop
                            "false": t:workbench.playingLabel.false
                            _: $.detail.pod.playing
                        icon:
                          of: $.detail.pod.playing
                          map: {"true": stop, "false": play, _: $.detail.pod.playing}
                        act: toggle
                        args: {path: ws.playAll}
                  - type: list
                    when: $.detail.pod
                    from: $.detail.pod.segs
                    row: signal.segment
                  - {type: empty, when: "!$.detail.pod", text: t:wsSignals.podcastEmpty}
              - type: section
                title: t:wsSignals.report
                blocks:
                  - type: list
                    from: $.detail.reports
                    item:
                      sub:
                        t: workbench.dayTime
                        args:
                          - {of: "@createdAt", fmt: day}
                          - {of: "@createdAt", fmt: hm}
                    row: record.row
                    optional: true
              - type: section
                title: t:wsSignals.studySet
                blocks:
                  - type: text
                    parts:
                      - chips: $.detail.sets
                        each: {chip: "@"}
                  - type: toolbar
                    items:
                      - type: select
                        id: ws-set
                        options:
                          - {v: "", label: t:wsSignals.addToSetMore}
                          - from: $.detail.setOpts
                            item: {v: "@", label: "@"}
                        value: ""
                        change: wsSetJoin
                        label: t:wsSignals.addToSet
                  - type: toolbar
                    items:
                      - type: input
                        add: true
                        id: ws-set-new
                        placeholder: t:wsSignals.newSetMore
                        label: t:wsSignals.newSet
                        go: add
                        args: {entity: sigSet, k: $.detail.id}
                        goLabel: t:wsSignals.newSet
          - type: section
            title: t:wsSignals.memo
            blocks:
              - type: toolbar
                items:
                  - type: input
                    rows: true
                    id: ws-note
                    args: {ws-note: $.detail.id}
                    value: $.detail.note
                    placeholder: t:wsSignals.memoPlaceholder
              - type: text
                variant: meta
                when: $.detail.noteSaved
                text: t:workbench.header.noteSaved
  cafe.ws.signals:
    loading: t:common.loading
    error: t:wsSignals.load.error
    empty: t:wsSignals.list.noArticles
    vm: cafeWsSignals
    blocks:
      - type: head
        variant: detail
        when: $.detail.gone
        title: t:wsSignals.articleDeleted
      - {type: view, id: signal.article, when: $.detail.id}
      - type: toolbar
        when: "!$.detail"
        note: "1"
        items:
          - type: seg
            value: $.view
            options:
              - {v: list, label: t:wsSignals.list.label}
              - {v: timeline, label: t:wsSignals.list.studyHistory}
              - {v: sources, label: t:wsSignals.list.sources}
            act: set
            args: {path: ws.sigView}
      - type: head
        variant: detail
        when: $.sources
        actions:
          - type: more
            items:
              - label: t:wsSignals.sourceMenu.label
                act: setStatus
                args: {entity: src, id: "*", v: "1"}
              - label: t:wsSignals.sourceMenu.disableAll
                act: setStatus
                args: {entity: src, id: "*", v: ""}
              - label: t:common.refresh
                act: refresh
                args: {k: sources}
      - type: notice
        when: $.sources.fetchRes
        parts:
          - t: signals.fetchSummary
            args:
              - {of: $.sources.fetchRes.newArticles, fmt: num}
              - {of: $.sources.fetchRes.fetchedArticles, fmt: num}
              - {of: $.sources.fetchRes.duplicateArticles, fmt: num}
        items: $.sources.fetchRes.errors
        each:
          parts: ["@source", "@message"]
          sep: " · "
        action:
          type: button
          label: t:common.gotIt
          act: close
          args: {path: ws.fetchRes}
      - type: each
        when: $.sources
        from: $.sources.groups
        blocks:
          - type: section
            title:
              t: workbench.sourceGroup
              args: [t:wsSignals.tier, "@tier", "@category"]
            help:
              t: env.system.count
              args: ["@count"]
            blocks:
              - {type: list, from: "@rows", row: signal.source}
      - type: toolbar
        when: $.timeline
        items:
          - type: seg
            value: $.timeline.days
            options:
              - {v: "7", label: t:system.days7}
              - {v: "14", label: t:system.days14}
              - {v: "30", label: t:system.days30}
            act: set
            args: {path: ws.tlDays}
      - type: each
        when: $.timeline
        from: $.timeline.groups
        blocks:
          - type: section
            title: "@day"
            blocks:
              - {type: list, from: "@rows", row: signal.activity}
      - type: empty
        when: $.timeline.empty
        text:
          t: wsSignals.list.empty
          args: [$.timeline.days]
      - type: head
        variant: detail
        when: $.list
        note: "2"
        desc:
          t: wsSignals.list.top
          args: [$.list.today, $.list.unread, $.list.week]
      - type: toolbar
        when: $.list
        form: wsSigQ
        items:
          - type: search
            id: ws-sig-q
            placeholder: t:wsSignals.searchPlaceholder
            label: t:wsSignals.searchPlaceholder
            value: $.list.q
            input: wsSigQ
      - type: toolbar
        when: $.list
        items:
          - type: select
            id: ws-sig-st
            options:
              - {v: inbox, label: t:wsSignals.inbox}
              - {v: starred, label: t:wsSignals.starred}
              - {v: read, label: t:wsSignals.read}
              - {v: archived, label: t:wsSignals.archive}
              - {v: all, label: t:common.all}
            value: $.list.fst
            change: wsSigSt
            label: t:common.state
          - type: select
            id: ws-sig-tier
            options:
              - {v: all, label: t:wsSignals.allTiers}
              - {v: "1", label: T1}
              - {v: "2", label: T2}
              - {v: "3", label: T3}
              - {v: "4", label: T4}
            value: $.list.ftier
            change: wsSigTier
            label: t:wsSignals.tier
          - type: select
            id: ws-sig-src
            options:
              - {v: all, label: t:memory.allSources}
              - from: $.list.srcs
                item: {v: "@v", label: "@label"}
            value: $.list.fsrc
            change: wsSigSrc
            label: t:common.source
      - type: toolbar
        when: $.list.nSel
        variant: selection
        note: "3"
        items:
          - type: text
            variant: meta
            text:
              t: wsSignals.list.selText
              args: [$.list.nSel]
          - {type: grow}
          - type: button
            label: t:wsSignals.markRead
            act: wsSigBatch
            args: {v: read}
          - type: button
            label: t:wsSignals.archive
            act: wsSigBatch
            args: {v: archived}
          - {type: button, label: t:wsSignals.addTag, act: wsSigBatchTag}
          - type: button
            label: t:common.delete
            act: wsSigBatch
            args: {v: del}
          - type: button
            label: t:wsSignals.clearSelection
            act: pick
            args: {path: ws.sigSel, none: "1"}
      - type: text
        variant: meta
        when: [$.list, "!$.list.nSel"]
        text:
          t: wsSignals.list.articleCount
          args: [$.list.count]
      - type: list
        when: $.list
        from: $.list.items
        row: signal.item
        empty: t:wsSignals.list.noArticles
  chat.header:
    vm: chatHeader
    bare: true
    blocks:
      - type: toolbar
        variant: head
        key: chat.header.bar
        kind: actions
        items:
          - key: navToggle
            locked: true
            type: button
            variant: drawer
            iconOnly: true
            icon: menu
            label: t:chatHeader.openList
            act: toggle
            args: {path: s.navOpen}
          - key: navExpand
            locked: true
            type: button
            variant: reveal
            iconOnly: true
            icon: menu
            label: t:chatHeader.expandNav
            act: toggle
            args: {path: cs.navHidden}
            when: $.navHidden
          - type: button
            variant: title
            label: $.title
            act: rename
            args: {entity: title}
            tip: t:common.rename
            note: "1"
            when: "!$.editing"
            locked: true
          - type: input
            variant: title
            id: title-edit
            value: $.title
            label: t:threadRow.name
            when: $.editing
            args: {path: s.renaming}
            on: {enter: renameCommit, esc: close, blur: renameCommit}
            locked: true
          - {type: grow}
          - type: button
            key: stack
            move: chat.header.bar
            who: $.people
            label: $.viewCatName
            act: popOpen
            args: {pop: people}
            tip: t:chatHeader.participants
            aria:
              t: chatHeader.actions.peopleLabel
              args: [$.peopleCount]
            note: "2"
          - type: button
            key: find
            move: chat.header.bar
            iconOnly: true
            icon: search
            label: t:chatHeader.findMessages
            act: popOpen
            args: {pop: find}
            pressed: $.findOpen
          - type: component
            key: more
            move: chat.header.bar
            use: rowMore
            props:
              k: $.id
              items:
                - label:
                    of: $.pinned
                    map: {"true": t:chat.thread.pinLabel.true, "false": t:composer.pin, _: $.pinned}
                  act: setStatus
                  args: {entity: pin, id: $.id}
                - label:
                    of: $.fav
                    map: {"true": t:workbench.star.true, "false": t:wsSignals.starred, _: $.fav}
                  act: setStatus
                  args: {entity: thread, id: $.id, field: fav}
                - label: t:chat.thread.menu.settings
                  act: modal
                  args: {v: tset, id: $.id}
                - label: t:chat.thread.menu.organize
                  act: modal
                  args: {v: org, id: $.id}
                - label: t:chat.thread.menu.exportPng
                  act: cafeExport
                  args: {v: png}
                - label: t:chat.thread.menu.downloadMarkdown
                  act: cafeExport
                  args: {v: md}
                - label: t:chat.thread.menu.downloadText
                  act: cafeExport
                  args: {v: txt}
                - label: t:theater.label
                  act: theater
                  args: {id: $.id}
                - label: t:threadSettings.reveal.title
                  act: cafeReveal
                  args: {id: $.id}
                - slot: chat.thread.more
                  args: {id: $.id}
                - label: t:chat.thread.menu.moveToTrash
                  act: remove
                  args: {entity: thread, id: $.id}
                  tone: danger
  memory.matters:
    vm: memoryMatters
    error: t:memoryOwners.matter.readError
    retry: {act: matterRead}
    blocks:
      - type: toolbar
        items:
          - type: button
            label: t:wsMem.allMemory
            act: matterOpen
            args: {id: ""}
            when: $.detail
          - type: search
            id: matter-query
            value: $.query
            input: matterQuery
            placeholder: t:memoryOwners.matter.search
            when: "!$.detail"
          - type: input
            add: true
            id: matter-new-title
            label: t:common.add
            placeholder: t:hub.create.placeholder
            go: matterSource
            goLabel: t:common.add
            when: "!$.detail"
      - type: box
        load:
          of: $.error.length
          gte: 1
          map: {"true": error, _: ""}
        error:
          of: $.error
          map:
            stale_revision: t:memoryOwners.matter.stale
            not_available: t:memoryOwners.matter.unavailable
            _: $.error
        retry:
          act:
            of: $.retryable
            map: {"true": matterRetry, _: matterRead}
        blocks: []
      - type: list
        id: memory-matters
        when: "!$.detail"
        from: $.items
        row: memory.item
        item:
          key: "@matterId"
          title: "@title"
          sub: "@description"
          act: matterOpen
          args: {id: "@matterId"}
          state: "@status"
        empty: t:memoryOwners.matter.empty
        next:
          key: memory-matters
          act: matterRead
          args: {more: true}
          when: $.cursor
          busy: $.loadingMore
      - type: head
        variant: detail
        title: $.matter.title
        when: $.matter
        label:
          text: {of: $.matter.updatedAt, fmt: at}
        actions:
          - {type: button, label: t:memoryOwners.matter.edit, act: matterEdit}
          - {type: button, label: t:memoryOwners.matter.addSource, act: matterSource}
      - type: notice
        text: t:memoryOwners.matter.sourcesChanged
        tone: warn
        when:
          of: $.summaryStatus
          map: {sources_changed: true, _: false}
      - {type: text, text: $.matter.description, when: $.matter.description}
      - type: list
        id: matter-entries
        when: $.matter
        from: $.entries
        row:
          layout: two
          key: "@entryId"
          title:
            - text: "@quote"
              when:
                of: "@sourceStatus"
                map: {current: true, _: false}
            - text: t:memoryOwners.matter.sourceChanged
              when:
                of: "@sourceStatus"
                map: {changed: true, _: false}
          sub:
            - {who: "@speaker", form: name}
            - text: {of: "@source.timestamp", fmt: stamp}
            - text:
                of: "@attribution"
                map: {quoted_in_message: t:memoryOwners.matter.quoted, _: ""}
            - text:
                of: "@status"
                map:
                  superseded: t:memoryOwners.matter.superseded
                  retired: t:memoryOwners.matter.retiredEntry
                  _: ""
          act: msgJump
          args: {t: "@source.threadId", mid: "@source.messageId"}
          acts:
            - label: t:memoryOwners.matter.replace
              icon: edit
              act: matterSource
              args: {entryId: "@entryId"}
              when:
                of: "@status"
                map: {active: true, _: false}
            - label: t:memoryOwners.matter.retireEntry
              icon: archive
              act: matterChange
              args: {operation: retire_entry, entryId: "@entryId"}
              when:
                of: "@status"
                map: {active: true, _: false}
        next:
          key: matter-entries
          act: matterRead
          args: {more: true}
          when: $.cursor
          busy: $.loadingMore
      - type: toolbar
        items:
          - type: button
            label: t:memoryOwners.matter.retire
            act: matterChange
            args: {operation: retire}
            when:
              of: $.matter.status
              map: {active: true, _: false}
          - type: button
            label: t:memoryOwners.matter.forget
            act: matterChange
            args: {operation: forget}
            when: $.matter
  dlg.matterEdit:
    title: t:memoryOwners.matter.edit
    ok: t:common.save
    fields:
      - id: matter-title
        label: t:hub.create.placeholder
        value: $.title
        req: true
        max: 160
      - id: matter-description
        label: t:memoryOwners.matter.description
        value: $.description
        area: true
        max: 4000
  dlg.matterSource:
    title: t:memoryOwners.matter.addSource
    ok: t:common.save
    fields:
      - id: matter-title
        label: t:hub.create.placeholder
        value: $.title
        req: true
        max: 160
        when: $.create
      - id: matter-description
        label: t:memoryOwners.matter.description
        area: true
        max: 4000
        when: $.create
      - {id: matter-link, label: t:memoryOwners.matter.messageLink, req: true}
      - id: matter-quote
        label: t:memoryOwners.matter.quote
        area: true
        max: 8000
        req: true
  dlg.matterConfirm:
    title:
      t: memoryOwners.matter.confirmTitle
      args: [$.operation, $.title]
    text:
      t: memoryOwners.matter.confirmText
      args: [$.operation]
    ok: t:common.confirm
    danger:
      of: $.operation
      map: {forget: true, _: false}
rows:
  thread.row:
    layout: two
    key: "@id"
    lead:
      - control:
          type: check
          variant: row
          value: "@selected"
          label: "@title"
          act: "@act"
          args: "@args"
        when: "@selectable"
    title:
      - {parts: "@title"}
    inline:
      - {text: ≈, when: "@fuzzy"}
    sub:
      - {parts: "@sub", when: "@sub"}
      - {text: "@threadRef", mono: true, when: "@search"}
      - {lit: " · ", when: "@search"}
      - text:
          of: "@projectName"
          map: {"": t:chat.projectPath., _: "@projectName"}
        when: "@search"
      - text: "@projectPath"
        mono: true
        when: ["@classify", "@projectPath"]
      - text: t:chat.projectPath.
        mono: true
        when: ["@classify", "!@projectPath"]
      - text:
          t: organize.dialog.inGroup
          args: ["@group"]
        when: "@group"
    cols:
      - control:
          type: each
          from: "@tags"
          control:
            type: chip
            check: true
            pressed: "@on"
            label: "@name"
            act: pick
            args:
              path: tid.{t}.tags
              t: "@threadId"
              id: "@id"
        when: "@tags"
      - v:
          - {who: "@who"}
        w: num
        tip: "@whoTip"
        when: "@who"
      - v: {of: "@time", fmt: ago}
        w: time
        tip: "@timeTip"
        when: "@time"
    act: "@act"
    args: "@args"
  memory.item:
    layout: two
    key: "@key"
    lead: {text: "@kind", variant: meta, when: "@kind"}
    title: "@title"
    inline:
      - text:
          t: memoryOwners.search.rank
          args: ["@rank"]
        when: "@rank"
      - text:
          t: memoryOwners.search.relevance
          args: ["@relevance.state"]
        when: "@relevance"
    sub:
      - parts: "@sub"
        when: "!@owner"
      - text: {of: "@aliases", sep: " · "}
        when: "@owner"
      - lit: " · "
        when:
          - "@owner"
          - "@aliases"
          - of: "@state"
            map: {active: false, current: false, _: true}
      - text:
          t: memoryOwners.stateNote
          args: ["@state"]
        when: "@owner"
      - lit: " · "
        when: ["@owner", "@layer"]
      - text:
          t: memoryOwners.layer
          args: ["@layer"]
        when: ["@owner", "@layer"]
    cols:
      - {v: "@hits", w: num, tip: t:memory.recallCount, when: "@hits"}
      - {v: "@conf", w: num, tip: t:memory.confidence, when: "@conf"}
      - {control: "@ctl", w: icon, when: "@ctl"}
    acts: {slot: "@slot", ctx: "@ctx"}
    act: "@act"
    args: "@args"
    tone: "@tone"
  inbox.item:
    layout: two
    key: "@id"
    lead:
      - {who: "@who", form: avatar, when: "@who"}
      - {glyph: "@glyph", when: "@glyph"}
      - control:
          type: check
          variant: row
          value: "@picked"
          label: {$frag: INBOX_TITLE}
          act: pick
          args: {path: cs.ib.apPick, id: "@id"}
        when: "@pickable"
    title:
      - text: {$frag: INBOX_TITLE}
      - control:
          type: status
          tone:
            of: "@state"
            map: {error: danger, restart: warn, config: warn, update: info}
          text:
            of: "@state"
            map:
              error: t:common.status.error
              restart: t:common.effectRestart
              config: t:ext.need.config
              update: t:ext.need.update
              _: "@state"
        when: "@review"
    sub:
      - {parts: "@sub", when: "@sub"}
      - parts:
          - of: "@subKind"
            map:
              mention:
                parts:
                  - "@name"
                  - " · "
                  - "@threadTitle"
                  - " · "
                  - {$frag: INBOX_TIME}
                sep: ""
              message:
                parts:
                  - "@threadTitle"
                  - " · "
                  - {$frag: INBOX_TIME}
                sep: ""
              _: "@subKind"
        when: "@subKind"
      - text:
          t: chat.inboxMeta
          args:
            - "@type"
            - {$frag: INBOX_TIME}
        when: "@type"
      - {text: " · ", when: "@history"}
      - text:
          of: "@result"
          map:
            reject: t:memoryOwners.stateNote.rejected
            accept: t:memoryOwners.stateNote.materialized
            _: "@result"
        tone: "@resultTone"
        when: "@history"
    cols:
      - control:
          - type: button
            label: t:inbox.tabs.recover
            act: remove
            args: {entity: ibIgnored, id: "@id"}
            when: "@ignored"
          - type: button
            label: t:inbox.tabs.returnToPending
            act: remove
            args: {entity: ibBack, id: "@id"}
            when: "@handled"
          - type: button
            label: t:inbox.tabs.handled
            act: remove
            args: {entity: ibHandled, id: "@id"}
            when: "@handled"
    acts: {slot: "@slot", ctx: "@ctx"}
    act: "@act"
    args: "@args"
    more:
      - type: each
        from: "@qs"
        blocks:
          - type: label
            text: ""
            when: "@canSkip"
            action:
              type: button
              label: t:chatCards.skip
              act: toggle
              args:
                path: cs.f.skip-{k}
                k: "@skipKey"
              pressed: "@skipped"
              stay: true
          - type: text
            variant: para
            parts:
              - {chip: "@header", when: "@header"}
              - {lit: " ", when: "@header"}
              - {text: "@question"}
            when: "!@skipped"
          - type: choices
            group: "@group"
            from: "@opts"
            when: ["!@skipped", "@opts", "!@multiSelect"]
          - type: choices
            variant: multi
            from: "@opts"
            act: toggle
            args:
              path: cs.f.m-{k}.{v}
              k: "@pickKey"
            when: ["!@skipped", "@opts", "@multiSelect"]
          - type: toolbar
            when:
              - "!@skipped"
              - of: "@isOther"
                map:
                  "true": true
                  _:
                    of: "@secret"
                    map:
                      "true": true
                      _:
                        of: "@opts.length"
                        map: {"0": true, _: false}
            items:
              - type: input
                id: "@freeId"
                placeholder:
                  of: "@secret"
                  map:
                    "true":
                      t: chat.freePlaceholder.true
                      args:
                        - t: chat.freePlain
                          args:
                            - {of: "@opts.length", gte: 1}
                    "false":
                      t: chat.freePlain
                      args:
                        - {of: "@opts.length", gte: 1}
                    _: "@secret"
                secret: "@secret"
        when: "@ask"
      - type: toolbar
        items:
          - type: button
            primary: true
            label: t:inbox.submitAnswer
            act: cafeAskSubmit
            args: {mid: "@id", p: ibq}
        when: "@ask"
      - type: kv
        from: "@dl"
        item:
          k:
            of: "@field"
            map:
              type: t:common.type
              occurredAt: t:memoryOwners.field.occurredAt
              duration: t:memoryOwners.field.duration
              topic: t:memoryOwners.topic
              uncertainty: t:memoryOwners.uncertain
              aliases: t:memoryOwners.aliases
              asOf: t:memoryOwners.field.asOf
              openingMode: t:memoryOwners.openingMode
              stance: t:memoryOwners.stance
              takeaway: t:memoryOwners.takeaway
              quotes: t:memoryOwners.quotes
              brakeQuote: t:memoryOwners.quotes
              brakeAction: t:memoryOwners.field.brakeAction
              brakeRule: t:memoryOwners.field.brakeRule
              why: t:memoryOwners.field.why
              after: t:skill.content
              advice: t:memoryOwners.field.advice
              goal: t:memoryOwners.field.goal
              _: "@field"
        when: ["@decide", "!@ask"]
      - {type: markdown, text: "@full", when: "@full"}
      - type: kv
        from: "@dl"
        item:
          k:
            of: "@field"
            map:
              type: t:common.type
              occurredAt: t:memoryOwners.field.occurredAt
              duration: t:memoryOwners.field.duration
              topic: t:memoryOwners.topic
              uncertainty: t:memoryOwners.uncertain
              aliases: t:memoryOwners.aliases
              asOf: t:memoryOwners.field.asOf
              openingMode: t:memoryOwners.openingMode
              stance: t:memoryOwners.stance
              takeaway: t:memoryOwners.takeaway
              quotes: t:memoryOwners.quotes
              brakeQuote: t:memoryOwners.quotes
              brakeAction: t:memoryOwners.field.brakeAction
              brakeRule: t:memoryOwners.field.brakeRule
              why: t:memoryOwners.field.why
              after: t:skill.content
              advice: t:memoryOwners.field.advice
              goal: t:memoryOwners.field.goal
              _: "@field"
        when: "@other"
      - type: toolbar
        when: "@history"
        items:
          - type: button
            label:
              t: inbox.tabs.viewNamed
              args: [t:inbox.tabs.approvalCard]
            act: set
            args: {path: cs.ib.apOpen, v: "@keys.card"}
            pressed: "@selected.card"
            stay: true
          - type: button
            label:
              t: inbox.tabs.viewNamed
              args: [t:inbox.tabs.origin]
            act: set
            args: {path: cs.ib.apOpen, v: "@keys.origin"}
            pressed: "@selected.origin"
            stay: true
          - type: button
            label:
              t: inbox.tabs.viewNamed
              args: [t:voice.techDetails]
            act: set
            args: {path: cs.ib.apOpen, v: "@keys.tech"}
            pressed: "@selected.tech"
            stay: true
      - type: pre
        text:
          t: chat.inboxCard
          args:
            - {$frag: INBOX_TITLE}
            - of: "@result"
              map: {accept: t:common.accept, reject: t:common.reject, _: "@result"}
            - {$frag: INBOX_TIME}
        when: ["@history", "@selected.card"]
      - type: pre
        text: "@origin"
        when: ["@history", "@selected.origin"]
      - type: pre
        text: "@tech"
        when: ["@history", "@selected.tech"]
    moreWhen: "@open"
  evolution.source:
    layout: two
    title:
      - {text: t:common.source, when: "@source"}
      - {text: t:evolutionFlow.choiceSource, when: "@choiceSource"}
      - text:
          t: evolutionFlow.use
          args: ["@use"]
        when: "@use"
      - text:
          of: "@hasTitle"
          map:
            "true": "@title"
            "false":
              t: workbench.evoEvidenceTitle.false
              args: ["@title"]
            _: "@hasTitle"
        when: "@evidence"
      - text: "@title"
        when: ["!@source", "!@choiceSource", "!@use", "!@evidence"]
    sub:
      - {text: "@sub"}
      - text: {of: "@occurredAt", fmt: ago}
        when: "@occurredAt"
      - text: t:evolutionFlow.evidenceInsufficient
        when: ["@evidence", "!@verified"]
    act:
      of: "@linkKind"
      map: {message: msgJump, url: openUrl, none: "", _: "@linkKind"}
    args: {t: "@threadId", mid: "@messageId", url: "@url"}
    cols:
      - v: []
        w: auto
      - control: []
  evolution.version:
    layout: two
    title:
      text:
        of: "@hasTitle"
        map:
          "true": "@title"
          "false":
            t: workbench.evoVersion.false
            args: ["@title"]
          _: "@hasTitle"
    act: evoVersion
    args: {programId: "@programId", versionRef: "@versionRef"}
    cols:
      - v: []
        w: auto
      - control: []
