                    of: "@field"
                    map: {pid: true, _: false}
                - text: {of: "@at", fmt: ago}
                  when:
                    of: "@field"
                    map: {heartbeat: true, _: false}
                - text: "@path"
                  mono: true
                  when:
                    of: "@field"
                    map: {log: true, _: false}
