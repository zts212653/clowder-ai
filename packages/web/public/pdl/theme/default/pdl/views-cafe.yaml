views:
  cafe.trash:
    page: true
    vm: cafeTrash
    blocks:
      - type: head
        title: t:trash.title
        note: "1"
        tools: {$frag: CAFE_SHELL_TOOLS}
      - type: section
        note: "2"
        keep: true
        blocks:
          - type: list
            id: cafeTrash
            from: $.items
            row:
              layout: line
              title:
                - {text: "@title", when: "@title"}
                - {text: t:chat.thread.trash.untitled, when: "!@title"}
              cols:
                - v:
                    of: "@deleted"
                    map:
                      "true":
                        t: trash.deletedAgo
                        args:
                          - {of: "@deletedAt", fmt: ago}
                      _: "@time"
                  w: time
                  tip: t:trash.deletedAt
              acts: {slot: cafe.trash.item, ctx: "@ctx"}
            empty: t:trash.isEmpty
  works.recent:
    vm: recentWorks
    blocks:
      - type: section
        title: t:home.recentWorks
        note: "5"
        keep: true
        actions:
          - type: button
            label: t:home.allWorks
            act: wsTool
            args: {k: works-t, view: global}
        blocks:
          - type: list
            id: home-rw
            from: $.rw.works.items
            row: works.item
            load: $.rw.load
            error: t:home.recentWorksError
            empty: t:home.recentWorksEmpty
            retry: {act: cafeRwRetry}
  cafe.home:
    vm: cafeHome
    blocks:
      - type: toolbar
        variant: head
        items:
          - type: button
            variant: drawer
            iconOnly: true
            icon: menu
            label: t:chatHeader.openList
            act: toggle
            args: {path: s.navOpen}
          - type: button
            variant: reveal
            iconOnly: true
            icon: menu
            label: t:chatHeader.expandNav
            act: toggle
            args: {path: cs.navHidden}
            when: $.navHidden
          - {type: grow}
      - type: box
        variant: hero
        blocks:
          - {type: head, variant: hero, title: t:home.greeting, note: "1"}
          - type: notice
            when: $.state
            tone:
              of: $.state
              map: {failed: danger, _: ""}
            strong:
              of: $.state
              map: {creating: "", sending: "", failed: t:chat.homeStrong.failed, _: $.state}
            text:
              t: chat.homeState
              args: [$.state]
            action:
              type: button
              label: t:home.reconnect
              act: cafeReconnect
              when:
                of: $.state
                map: {failed: true, _: false}
          - {type: view, id: chat.composer, when: "!$.preview"}
          - type: toolbar
            note: "4"
            items:
              - {type: slot, slot: home.actions}
              - type: button
                icon: link
                label: t:home.importSession
                act: modal
                args: {v: import}
          - {type: view, id: works.recent}
      - type: box
        variant: dock
        when: $.preview
        blocks:
          - {type: view, id: chat.composer}
      - {type: app, name: handle, region: panel}
  cafe.memory:
    page: true
    vm: cafeMemory
    title: t:common.memory
    blocks:
      - type: head
        title: t:common.memory
        note: "1"
        help: t:memory.desc
        tools: {$frag: CAFE_SHELL_TOOLS}
      - type: toolbar
        note: "2"
        items:
          - type: seg
            value: $.view
            options:
              - {v: all, label: t:wsMem.allMemory}
              - {v: matters, label: t:memoryOwners.matter.title}
              - {v: recall, label: t:memoryOwners.tabs.recallHistory}
              - {v: brakes, label: t:memoryOwners.tabs.interventions}
              - {v: library, label: t:memoryOwners.tabs.libraries}
              - {v: graph, label: t:memoryOwners.tabs.graph}
              - {v: status, label: t:memoryOwners.tabs.health}
            act: set
            args: {path: cs.m.view}
          - {type: grow}
          - type: search
            form: cafeMemQ
            note: "3"
            id: mem-q
            placeholder: t:memory.searchPlaceholder
            value: $.q
            input: cafeMemQ
      - type: view
        id: memory.matters
        when:
          of: $.view
          map: {matters: true, _: false}
      - type: box
        blocks:
          - type: toolbar
            when: $.all
            items:
              - type: seg
                options:
                  - from: $.all.cats
                    item:
                      v: "@v"
                      label:
                        of: "@v"
                        map:
                          taste: t:memoryOwners.category.taste
                          profile: t:memoryOwners.layer.primer
                          person: t:memoryOwners.category.person
                          entity: t:memoryOwners.category.entity
                          event: t:settingsUi.contribution.kind.events
                          meeting: t:memoryOwners.category.meeting
                          _: "@v"
                      count: "@count"
                  - {v: meeting, label: t:memoryOwners.category.meeting}
                value: $.all.cat
                act: set
                args: {path: cs.m.cat}
                variant: tabs
              - {type: grow}
              - type: select
                change: cafeSel
                id: mem-sort
                label: t:memory.sortTaste
                options:
                  - {v: recent, label: t:memory.sortRecent}
                  - {v: hits, label: t:memory.sortHits}
                value: $.all.sort
                when:
                  of: $.all.cat
                  map: {taste: true, _: false}
          - type: notice
            action: "@actions"
            text: "@text"
            strong: "@strong"
            tone: "@tone"
            from: $.all.corr
          - type: list
            id: cafeMem
            from: $.all.items
            item:
              act: memOpen
              tone:
                of: "@state"
                map: {retired: past, _: ""}
            row: memory.item
            next:
              key: cafeMem
              act: set
              args: {path: $.all.limitPath, add: 20}
              when:
                - $.all.more
                - of: $.all.cat
                  map: {meeting: false, _: true}
            empty:
              of: $.all.cat
              map:
                taste:
                  t: chat.memoryEmpty.taste
                  args:
                    - of: $.all.cat
                      map:
                        taste: t:memoryOwners.category.taste
                        profile: t:memoryOwners.layer.primer
                        person: t:memoryOwners.category.person
                        entity: t:memoryOwners.category.entity
                        event: t:settingsUi.contribution.kind.events
                        meeting: t:memoryOwners.category.meeting
                        _: $.all.cat
                profile:
                  t: chat.memoryEmpty.taste
                  args:
                    - of: $.all.cat
                      map:
                        taste: t:memoryOwners.category.taste
                        profile: t:memoryOwners.layer.primer
                        person: t:memoryOwners.category.person
                        entity: t:memoryOwners.category.entity
                        event: t:settingsUi.contribution.kind.events
                        meeting: t:memoryOwners.category.meeting
                        _: $.all.cat
                person:
                  t: chat.memoryEmpty.taste
                  args:
                    - of: $.all.cat
                      map:
                        taste: t:memoryOwners.category.taste
                        profile: t:memoryOwners.layer.primer
                        person: t:memoryOwners.category.person
                        entity: t:memoryOwners.category.entity
                        event: t:settingsUi.contribution.kind.events
                        meeting: t:memoryOwners.category.meeting
                        _: $.all.cat
                entity:
                  t: chat.memoryEmpty.taste
                  args:
                    - of: $.all.cat
                      map:
                        taste: t:memoryOwners.category.taste
                        profile: t:memoryOwners.layer.primer
                        person: t:memoryOwners.category.person
                        entity: t:memoryOwners.category.entity
                        event: t:settingsUi.contribution.kind.events
                        meeting: t:memoryOwners.category.meeting
                        _: $.all.cat
                event:
                  t: chat.memoryEmpty.taste
                  args:
                    - of: $.all.cat
                      map:
                        taste: t:memoryOwners.category.taste
                        profile: t:memoryOwners.layer.primer
                        person: t:memoryOwners.category.person
                        entity: t:memoryOwners.category.entity
                        event: t:settingsUi.contribution.kind.events
                        meeting: t:memoryOwners.category.meeting
                        _: $.all.cat
                meeting:
                  t: memory.meetingsMissing
                  args:
                    - of: $.all.cat
                      map:
                        taste: t:memoryOwners.category.taste
                        profile: t:memoryOwners.layer.primer
                        person: t:memoryOwners.category.person
                        entity: t:memoryOwners.category.entity
                        event: t:settingsUi.contribution.kind.events
                        meeting: t:memoryOwners.category.meeting
                        _: $.all.cat
                _: $.all.cat
            when: $.all
            load: $.all.load
            error: t:memory.eventsError
            retry:
              act: cafeMemRetry
              args: {v: eventsErr}
          - type: head
            variant: detail
            when: $.detail
            title:
              text:
                of: $.detail.unavailable
                map:
                  "true":
                    t: chat.memoryTitle.true
                    args: [$.detail.title]
                  "false": $.detail.title
                  _: $.detail.title
            help:
              t: memoryOwners.stateNote
              args: [$.detail.state]
            actions:
              - type: button
                primary: true
                label: t:memory.confirmSentence
                act: cafeMemAct
                args: {op: confirm}
                when: $.detail.candidate
              - type: button
                iconOnly: true
                icon: refresh
                label: t:memory.reread
                act: refresh
                args: {k: memory-owner}
              - type: more
                variant: row
                items:
                  - label: t:memoryOwners.forget
                    act: personForget
                    args:
                      personId: $.detail.personId
                      expectedPersonRevision: $.detail.personRevision
                    tone: danger
                    when:
                      of: $.detail.family
                      map: {person: true, _: false}
                  - label: t:common.edit
                    act: cafeMemAct
                    args:
                      family: $.detail.family
                      op: edit
                      id: $.detail.id
                      expectedRevision: $.detail.revision
                    when:
                      - $.detail.active
                      - of: $.detail.family
                        map: {person: false, _: true}
                  - label: t:memoryOwners.stateNote.retired
                    act: cafeMemAct
                    args:
                      family: $.detail.family
                      op: retire
                      id: $.detail.id
                      expectedRevision: $.detail.revision
                    when: [$.detail.canRetire, $.detail.taste]
                  - label: t:memoryOwners.stateNote.retired
                    act: setStatus
                    args:
                      entity: $.detail.retireEntity
                      id: $.detail.id
                      v: retired
                      field: status
                    when: [$.detail.canRetire, "!$.detail.taste"]
                  - label: t:chat.forgetTitle.false
                    act: cafeMemAct
                    args:
                      family: $.detail.family
                      op: forget
                      id: $.detail.id
                      expectedRevision: $.detail.revision
                    tone: danger
                    when:
                      - $.detail.family
                      - of: $.detail.family
                        map: {person: false, _: true}
                k: $.detail.id
                label: t:common.moreActions
          - {type: notice, tone: warn, when: $.detail.error, text: $.detail.error}
          - type: text
            variant: meta
            when: $.detail.receipt
            text:
              of: $.detail.receipt
              map:
                unavailable: t:memoryOwners.stateNote.unavailable
                pending_approval: t:memoryOwners.stateNote.pending
                not_now: t:memoryOwners.stateNote.not_now
                partially_materialized: t:memoryOwners.stateNote.partially_materialized
                materialized: t:memoryOwners.stateNote.materialized
                withdrawn: t:memoryOwners.stateNote.withdrawn
                active: t:memoryOwners.state.active
                current: t:memoryOwners.state.current
                retired: t:memoryOwners.stateNote.retired
                pending: t:memoryOwners.stateNote.pending
                approving: t:memoryOwners.stateNote.approving
                approved: t:memoryOwners.stateNote.approved
                rejected: t:memoryOwners.stateNote.rejected
                applied: t:memoryOwners.stateNote.applied
                replayed: t:memoryOwners.stateNote.replayed
                _: $.detail.receipt
          - type: each
            from:
              - {}
            when: $.detail
            item:
              fields:
                - {field: type, value: $.detail.family}
                - {field: aliases, value: $.detail.person.aliases, when: $.detail.person}
                - field: openingMode
                  value:
                    of: $.detail.profile.usage.error.length
                    gte: 1
                    map:
                      "true": $.detail.profile.usage.error
                      _:
                        of: $.detail.profile.usage.openingMode
                        map: {enabled: enabled, _: onDemand}
                  usageError:
                    of: $.detail.profile.usage.error.length
                    gte: 1
                    map: {"true": true, _: false}
                  when: $.detail.profile
                - field: aliases
                  value: $.detail.entity.attributes.aliases
                  when: $.detail.entity
                - field: stance
                  value: $.detail.entity.attributes.stance
                  when: $.detail.entity
                - {from: $.detail.fields, item: "@"}
            blocks:
              - type: kv
                from: "@fields"
                item:
                  label:
                    of: "@field"
                    map:
                      type: t:common.type
                      occurredAt: t:memoryOwners.field.occurredAt
                      duration: t:memoryOwners.field.duration
                      topic: t:memoryOwners.topic
                      uncertainty: t:memoryOwners.uncertain
                      aliases: t:memoryOwners.aliases
                      asOf: t:memoryOwners.field.asOf
                      openingMode: t:memoryOwners.openingMode
                      stance: t:memoryOwners.stance
                      takeaway: t:memoryOwners.takeaway
                      quotes: t:memoryOwners.quotes
                      brakeQuote: t:memoryOwners.quotes
                      brakeAction: t:memoryOwners.field.brakeAction
                      brakeRule: t:memoryOwners.field.brakeRule
                      why: t:memoryOwners.field.why
                      after: t:skill.content
                      advice: t:memoryOwners.field.advice
                      goal: t:memoryOwners.field.goal
                      _: "@field"
                  value: {$frag: CAFE_MEMORY_VALUE}
          - type: section
            title: t:memoryOwners.openingMode
            when: $.detail.profile.openingReference
            actions:
              - type: button
                label: t:common.edit
                act: cafeMemAct
                args:
                  family: profile
                  op: opening
                  id: $.detail.id
                  expectedRevision: $.detail.revision
              - type: button
                label: t:composer.cancelQuote
                act: profileOpening
                args: {op: cancel, id: $.detail.id, expectedRevision: $.detail.revision}
            blocks:
              - type: kv
                from:
                  - {k: t:memoryOwners.field.asOf, v: $.detail.profile.openingReference.asOf}
              - type: each
                from: $.detail.profile.openingReference.excerpts
                item:
                  relationship:
                    of: "@kind"
                    map:
                      relationship: true
                      _:
                        of: "@model.length"
                        gte: 1
                        map: {"true": false, _: true}
                blocks:
                  - type: label
                    text:
                      t: chat.openingLabel
                      args: ["@relationship", "@model"]
                  - {type: text, text: "@text"}
          - {type: markdown, text: $.detail.body, when: $.detail.body}
          - type: section
            title: t:memoryOwners.claims
            when: $.detail.person
            blocks:
              - type: list
                from: $.detail.person.claims
                item:
                  redacted:
                    of: "@payload.kind"
                    map: {redacted: true, _: false}
                  assessment:
                    of: "@payload.kind"
                    map: {user_assessment: true, _: false}
                  fact:
                    of: "@payload.kind"
                    map: {redacted: false, user_assessment: false, _: true}
                  valueText: {of: "@payload.value", fmt: jsonValue}
                row:
                  layout: two
                  key: "@claimId"
                  title:
                    - {text: t:memoryOwners.redacted, when: "@redacted"}
                    - {text: "@payload.statement", when: "@assessment"}
                    - parts:
                        - parts: ["@payload.predicate", ：, "@valueText"]
                          sep: ""
                      when: "@fact"
                  sub:
                    text:
                      t: memoryOwners.stateNote
                      args: ["@state"]
                  cols:
                    - control:
                        type: more
                        variant: row
                        items:
                          - label: t:common.edit
                            act: cafeMemAct
                            args: {family: person, op: claim, id: "@claimId", expectedRevision: "@revision"}
                          - label: t:memoryOwners.retireClaim
                            act: setStatus
                            args: {entity: personClaim, id: "@claimId", field: status, v: retired}
                        k: "@claimId"
                        label: t:common.moreActions
                      when: "@canRetire"
                      w: icon
                  expand:
                    - {type: list, from: "@sources", row: memory.source}
          - type: section
            title: t:memoryOwners.interactions
            when: $.detail.person
            blocks:
              - type: list
                from: $.detail.person.interactions
                item:
                  fields:
                    - {field: occurredAt, value: "@occurredAt"}
                    - {field: duration, value: "@duration"}
                    - {field: topic, value: "@importanceOrTopic"}
                    - {field: uncertainty, value: "@uncertaintyNotes"}
                row:
                  layout: two
                  key: "@eventId"
                  title: "@title"
                  sub:
                    text:
                      t: memoryOwners.stateNote
                      args: ["@state"]
                  expand:
                    - type: kv
                      from: "@fields"
                      item:
                        label:
                          of: "@field"
                          map:
                            type: t:common.type
                            occurredAt: t:memoryOwners.field.occurredAt
                            duration: t:memoryOwners.field.duration
                            topic: t:memoryOwners.topic
                            uncertainty: t:memoryOwners.uncertain
                            aliases: t:memoryOwners.aliases
                            asOf: t:memoryOwners.field.asOf
                            openingMode: t:memoryOwners.openingMode
                            stance: t:memoryOwners.stance
                            takeaway: t:memoryOwners.takeaway
                            quotes: t:memoryOwners.quotes
                            brakeQuote: t:memoryOwners.quotes
                            brakeAction: t:memoryOwners.field.brakeAction
                            brakeRule: t:memoryOwners.field.brakeRule
                            why: t:memoryOwners.field.why
                            after: t:skill.content
                            advice: t:memoryOwners.field.advice
                            goal: t:memoryOwners.field.goal
                            _: "@field"
                        value: {$frag: CAFE_MEMORY_VALUE}
                    - {type: list, from: "@sources", row: memory.source}
                    - type: toolbar
                      items:
                        - type: button
                          label: t:common.edit
                          act: cafeMemAct
                          when: "@canWrite"
                          args: {family: person, op: event, id: "@eventId", expectedRevision: "@revision"}
          - type: disclosure
            key: memory-sources
            title: t:common.source
            when:
              - $.detail.family
              - of: $.detail.family
                map: {person: false, _: true}
            blocks:
              - type: list
                from: $.detail.sources
                row: memory.source
                empty: t:memoryOwners.sourceMissing
          - type: disclosure
            key: memory-usage
            title: t:memoryOwners.usage
            when: $.detail.profile
            blocks:
              - type: stats
                when: "!$.detail.profile.usage.error"
                from:
                  - l: t:memoryOwners.metric.currentOpening
                    v: $.detail.profile.usage.currentVersion.opening
                  - l: t:memoryOwners.metric.currentRead
                    v: $.detail.profile.usage.currentVersion.read
                  - l: t:memoryOwners.metric.allOpening
                    v: $.detail.profile.usage.allVersions.opening
                  - l: t:memoryOwners.metric.allRead
                    v: $.detail.profile.usage.allVersions.read
              - type: list
                from: $.detail.profile.usageRows
                item:
                  kind:
                    of: "@kind"
                    map: {opening: opening, _: read}
                  sub: "@occurredAt"
                  act:
                    of: "@threadId.length"
                    gte: 1
                    map: {"true": msgJump, _: ""}
                  args: {t: "@threadId"}
                row:
                  layout: two
                  title:
                    - text:
                        t: memoryOwners.usageKind
                        args: ["@kind"]
                      when: ["!@preparation", "!@object"]
                    - {text: "@title", when: "@object"}
                    - text: "@title"
                      when: ["@preparation", "@submission"]
                    - text:
                        of: "@section"
                        map:
                          object_map: evolutionFlow.preparation.object_map
                          success_contract: evolutionFlow.preparation.success_contract
                          measurement_plan: evolutionFlow.preparation.measurement_plan
                          baseline_diagnosis: evolutionFlow.preparation.baseline_diagnosis
                          _: "@section"
                      when: ["@preparation", "!@submission"]
                  sub:
                    - text: {of: "@sub", fmt: ago}
                      when: ["!@object", "!@preparation"]
                    - text:
                        of: "@choiceState"
                        map:
                          explore: t:evolutionFlow.choice.explore
                          fixed: t:evolutionFlow.choice.fixed
                          excluded: t:evolutionFlow.choice.excluded
                          undecided: t:memoryOwners.stateNote.pending
                          _: "@choiceState"
                      when: "@object"
                    - text:
                        of: "@state"
                        map:
                          paused: t:workbench.evoState.paused
                          terminal: t:workbench.evoState.terminal
                          needs_expert: t:workbench.evoState.needs_expert
                          needs_update: t:workbench.evoState.needs_update
                          source_unavailable: t:workbench.evoState.source_unavailable
                          source_invalid: t:workbench.evoState.source_invalid
                          materializing: t:workbench.evoState.materializing
                          unavailable: t:memoryOwners.stateNote.unavailable
                          invalid: t:workbench.evoState.invalid
                          active: ""
                          submitted: ""
                          recorded: ""
                          available: ""
                          connected: ""
                          resolved: ""
                          _: "@state"
                      when: "@preparation"
                  act: "@act"
                  args: "@args"
                  expand:
                    - {type: kv, from: "@fields"}
          - type: disclosure
            key: memory-proposals
            title: t:memoryOwners.proposals
            when: {of: $.detail.owner.proposals.length, gte: 0}
            blocks:
              - type: list
                from: $.detail.proposals
                row: memory.proposal
                empty: t:memoryOwners.noProposals
          - type: disclosure
            key: memory-corrections
            title: t:memoryOwners.corrections
            when: {of: $.detail.owner.correctionProposals.length, gte: 0}
            blocks:
              - type: list
                from: $.detail.corrections
                row: memory.proposal
                empty: t:memoryOwners.noProposals
          - type: toolbar
            when: $.recall
            items:
              - type: seg
                options: $.recall.wins
                item:
                  label:
                    t: memoryOwners.recall.label
                    args: ["@v"]
                act: set
                args: {path: cs.m.win}
          - type: stats
            when: $.recall
            from: $.recall.kv
            item:
              l:
                of: "@metric"
                map:
                  catSearch: t:memory.catSearch
                  contextPush: t:memoryOwners.metric.contextPush
                  tasteExact: t:memoryOwners.metric.tasteExact
                  docs: t:common.artType.file
                  passages: t:memoryOwners.metric.passages
                  edges: t:memoryOwners.metric.edges
                  updatedAt: t:memory.updatedAt
                  nodes: t:memoryOwners.metric.nodes
                  relations: t:memoryOwners.metric.relations
                  depth: t:workspaceOwners.depth
                  center: t:memoryOwners.metric.center
                  totalDocs: t:memoryOwners.metric.totalDocs
                  contradictions: t:memoryOwners.metric.contradictions
                  stale: t:memoryOwners.metric.stale
                  currentOpening: t:memoryOwners.metric.currentOpening
                  currentRead: t:memoryOwners.metric.currentRead
                  allOpening: t:memoryOwners.metric.allOpening
                  allRead: t:memoryOwners.metric.allRead
                  harmfulConsumption: t:memoryOwners.harmfulConsumption
                  unmetDemandLowerBound: t:memoryOwners.unmetDemandLowerBound
                  attentionCost: t:memoryOwners.attentionCost
                  backend: t:memoryOwners.metric.backend
                  threads: t:memoryOwners.metric.threads
                  vectors: t:memoryOwners.metric.vectors
                  model: t:memoryOwners.metric.model
                  rebuilt: t:memoryOwners.metric.rebuilt
                  totalFiles: t:workspaceOwners.totalFiles
                  markdownFiles: t:workspaceOwners.markdownFiles
                  secretFindings: t:workspaceOwners.secretFindings
                  statusEdges: t:memoryOwners.metric.relations
                  statusPassages: t:memoryOwners.metric.passages
                  _: "@metric"
              v:
                t: chat.axisValue
                args:
                  - "@maturity"
                  - of: "@maturity"
                    map:
                      lower-bound: {of: "@v", fmt: num}
                      estimated: {of: "@v", fmt: num}
                      measured: {of: "@v", fmt: num}
                      _: "@v"
              warn:
                of: "@error"
                map: {"true": t:chat.recallWarning.true, _: ""}
              action:
                type: button
                link: true
                label: t:common.retry
                act: cafeMemRetry
                args: {v: recallErr}
          - type: split
            variant: aside
            when: $.recall
            left:
              - type: section
                title: t:memory.recallLog
                keep: true
                actions:
                  - type: select
                    change: cafeSel
                    id: mem-src
                    label: t:common.source
                    options:
                      - {v: all, label: t:memory.allSources}
                      - {v: cat, label: t:memory.catSearch}
                      - {v: system, label: t:memory.systemDelivery}
                    value: $.recall.src
