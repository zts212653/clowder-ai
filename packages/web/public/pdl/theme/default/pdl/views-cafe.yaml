                    value: $.recall.who
                blocks:
                  - type: list
                    id: mem-recall
                    groups: $.recall.groups
                    group:
                      title: "@title"
                      act: thread
                      args: {id: "@threadId"}
                    row:
                      layout: two
                      key: "@key"
                      lead: {who: "@who", form: avatar}
                      title:
                        text:
                          t: memoryOwners.recall.title
                          args: ["@name", "@at", "@count"]
                      sub:
                        text:
                          of: "@searched"
                          map: {"true": t:memory.catSearch, "false": t:memory.systemDelivery, _: "@searched"}
                      expand:
                        - {type: label, text: t:memory.delivery}
                        - {type: text, variant: list, from: "@items"}
                        - type: list
                          from: "@deliveries"
                          item:
                            sub: {of: "@sub", sep: " · "}
                          row: record.row
                        - type: toolbar
                          items:
                            - type: button
                              label: t:memory.locateReply
                              act: msgJump
                              args: {mid: "@mid", t: "@thread"}
