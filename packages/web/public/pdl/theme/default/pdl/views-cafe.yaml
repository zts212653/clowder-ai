                  label: t:memoryOwners.graphView.label
                  view: [0, 0, 680, 300]
                  edges: $.graph.graph.edges
                  nodes:
                    - from: $.graph.graph.nodes
                      item:
                        id: "@id"
                        x: "@x"
                        y: "@y"
                        shape: bubble
                        text: "@id"
                        hub: "@selected"
                        act: set
                        args: {path: cs.m.node, v: "@id"}
                blocks:
                  - {type: component, use: graph, props: "@"}
            right:
              - type: section
                title: $.graph.node
                help: {of: $.graph.nodeDesc, sep: " · "}
                keep: true
                blocks:
                  - {type: settings, plain: true, from: $.graph.rels}
              - type: section
                title: t:memory.stats
                blocks:
                  - type: stats
                    from:
                      - {l: t:memoryOwners.metric.nodes, v: $.graph.nodeCount}
                      - {l: t:memoryOwners.metric.relations, v: $.graph.relationCount}
                      - {l: t:workspaceOwners.depth, v: $.graph.depth}
                      - {l: t:memoryOwners.metric.center, v: $.graph.node}
              - type: section
                title: t:memory.relationTypes
                help: t:memory.graphOnly
                blocks:
                  - type: choices
                    variant: multi
                    from: $.graph.rel
                    act: toggle
                    args:
                      path: cs.m.rel.{v}
          - type: section
            when: $.status
            title: t:memoryOwners.curation
            blocks:
              - type: toolbar
                items:
                  - type: text
                    variant: meta
                    text:
                      t: memoryOwners.curatedBy
                      args: [$.status.curation.modelLabel]
                  - {type: grow}
                  - type: switch
                    label: t:memoryOwners.curation
                    value: $.status.curation.enabled
                    disabled: $.status.curation.blocked
                    act: toggle
                    args: {path: cs.m.curation.enabled}
              - type: notice
                tone: warn
                when: $.status.curation.error
                text: $.status.curation.error
          - type: section
            when: $.status
            title: t:memory.semanticService
            actions:
              - type: button
                iconOnly: true
                icon: refresh
                label: t:memory.refreshStatus
                act: refresh
                args: {k: mem-status}
              - type: button
                label: t:memory.rebuildIndex
                act: cafeMemRebuild
                args: {v: all}
                note: "4"
            blocks:
              - type: list
                id: cafeMemSvc
                from: $.status.svc
                row:
                  layout: two
                  key: "@id"
                  lead:
                    dot:
                      of: "@busy"
                      map:
                        "true": run
                        "false":
                          of: "@hasBlocked"
                          map:
                            "true": warn
                            "false":
                              of: "@status"
                              map: {healthy: ok, _: idle}
                            _: "@hasBlocked"
                        _: "@busy"
                  title: "@id"
                  sub:
                    parts:
                      - {text: "@port", when: "@port"}
                      - lit: " · "
                        when: ["@port", "@model"]
                      - {text: "@model", when: "@model"}
                    sep: ""
                  meta:
                    - control: {type: status, tone: warn, text: "@blocked"}
                      when: "@blocked"
                  inline:
                    - text:
                        of: "@state"
                        map:
                          healthy: t:common.status.running
                          unhealthy: t:common.status.disconnected
                          not_configured: t:common.status.notConfigured
                          installing: t:voice.options.installing
                          starting: t:memoryOwners.service.state.starting
                          stopping: t:serviceState.stopping
                          uninstalling: t:serviceState.uninstalling
                          notInstalled: t:common.status.notInstalled
                          disabled: t:execDetail.state.cancelled
                          _: "@state"
                      variant: meta
                  cols:
                    - control:
                        - type: button
                          label: t:common.install
                          act: cafeSvc
                          args: {id: "@id", op: install}
                          when: "@canInstall"
                        - type: button
                          label: t:mcpPreview.start
                          act: cafeSvc
                          args: {id: "@id", op: start}
                          when: "@canStart"
                        - type: button
                          label: t:common.stop
                          act: cafeSvc
                          args: {id: "@id", op: stop}
                          when: "@canStop"
                    - control:
                        type: more
                        variant: row
                        items:
                          - label: t:workspaceOwners.configure
                            act: semanticService
                            args: {id: "@id"}
                        k: "@id"
                        label: t:memory.serviceActions
                      when: "@canConfigure"
              - type: disclosure
                key: mem-tech
                title: t:voice.techDetails
                blocks:
                  - {type: pre, text: $.status.tech}
              - type: notice
                tone: warn
                when: $.status.warm
                strong: t:memory.warmupPending
                num:
                  of: [0, 1, 2]
                  item:
                    of: "@"
                    map:
                      "0": {of: $.status.passages, fmt: num}
                      "1": " / "
                      "2": {of: $.status.vectors, fmt: num}
                  sep: ""
                action: {type: button, label: t:memory.continueWarmup, act: cafeMemWarm}
          - type: stats
            when: $.status
            from:
              - {l: t:memoryOwners.metric.backend, v: $.status.evidence.backend}
              - l: t:common.artType.file
                v: {of: $.status.evidence.docs_count, fmt: num}
              - l: t:memoryOwners.metric.threads
                v: {of: $.status.evidence.threads_count, fmt: num}
              - l: t:memoryOwners.metric.passages
                v: {of: $.status.evidence.passages_count, fmt: num}
              - l: t:memoryOwners.metric.vectors
                v: {of: $.status.evidence.vectors_count, fmt: num}
              - l: t:memoryOwners.metric.relations
                v: {of: $.status.evidence.edges_count, fmt: num}
              - {l: t:memoryOwners.metric.model, v: $.status.evidence.embedding_model}
              - l: t:memoryOwners.metric.rebuilt
                v:
                  t: memoryOwners.metricValue.rebuilt
                  args:
                    - {of: $.status.evidence.last_rebuild_at, fmt: ago}
          - type: section
            when: $.status
            title: t:wsOps.featureFlags
            help: t:memory.flagsHelp
            blocks:
              - type: list
                from: $.status.flags
                item:
                  title:
                    - text:
                        of: "@curator"
                        map:
                          "true":
                            t: workbench.flagName.true
                            args: ["@name"]
                          "false": "@name"
                          _: "@curator"
                      tip: "@id"
                  sub: {parts: "@states", sep: " → "}
                  trail:
                    - text:
                        of: "@pending"
                        map:
                          "true": t:workbench.flagRestart.true
                          "false": t:common.effectRestart
                          _: "@pending"
                      variant: meta
                      tone:
                        of: "@pending"
                        map: {"true": warn, "false": "", _: ""}
                      when: "@restartRequired"
                    - control:
                        type: seg
                        act: wsFlag
                        value: "@value"
                        options:
                          - from: "@options"
                            item:
                              v: "@value"
                              label: "@value"
                              g: "@group"
                              why:
                                of: "@locked"
                                map: {"true": t:workbench.flagLocked.true, "false": "", _: "@locked"}
                row: record.row
          - type: section
            when: $.status
            title: t:memory.configRef
            blocks:
              - {type: pre, text: $.status.cfg}
          - type: section
            when: $.status
            title: t:memory.health
            actions:
              - type: button
                label: t:memory.evaluate
                act: open
                args: {node: eval, anchor: panel}
              - type: button
                iconOnly: true
                icon: refresh
                label: t:common.refresh
                act: refresh
                args: {k: mem-health}
            blocks:
              - type: stats
                from:
                  - l: t:memoryOwners.metric.totalDocs
                    v: {of: $.status.evidence.docs_count, fmt: num}
                  - l: t:memoryOwners.metric.contradictions
                    v: {of: $.status.maintenance.contradictions, fmt: num}
                  - l: t:memoryOwners.metric.stale
                    v:
                      of: [0, 1, 2]
                      item:
                        of: "@"
                        map:
                          "0": {of: $.status.maintenance.stale, fmt: num}
                          "1": " / "
                          "2": {of: $.status.maintenance.unverified, fmt: num}
                      sep: ""
              - type: settings
                from:
                  - {field: distribution}
                  - {field: anchors}
                  - {field: collections}
                  - {field: hitRate}
                  - {field: drift}
                  - {field: warning}
                  - {field: usage}
                item:
                  label:
                    of: "@field"
                    map:
                      distribution: t:memoryOwners.health.knowledgeDistribution
                      anchors: t:films.opinionState.open
                      collections: t:memoryOwners.health.libraryHealth
                      hitRate: t:memoryOwners.health.searchQuality
                      drift: t:memoryOwners.health.replayDrift
                      warning: t:memoryOwners.health.label
                      usage: t:wsOps.toolUsage
                  parts:
                    of: "@field"
                    map:
                      distribution:
                        parts:
                          - from: $.status.distribution
                            item:
                              t: memoryOwners.health.distributionShare
                              args: ["@type", "@pct"]
                        sep: " · "
                      anchors:
                        t: memoryOwners.health.brokenLinks
                        args: [$.status.staleAnchors]
                      collections:
                        t: memoryOwners.health.librarySummary
                        args: [$.status.collectionCount, $.status.archivedCount]
                      hitRate:
                        t: memoryOwners.health.hitRateWindow
                        args: [$.status.hitRate, $.status.windowDays]
                      drift: {text: $.status.replayDrift}
                      warning:
                        status:
                          tone: warn
                          text:
                            t: env.system.count
                            args: [$.status.staleAnchors]
                      usage:
                        t: memoryOwners.health.value
                        args:
                          - {of: $.status.searches, fmt: num}
                          - {of: $.status.reflections, fmt: num}
                          - $.status.windowDays
          - type: head
            variant: detail
            when: $.sdoc
            title: $.sdoc.title
            help:
              t: memory.docSource
              args: [$.sdoc.project]
          - {type: markdown, from: $.sdoc.paras, when: $.sdoc}
          - type: section
            when: $.search
            title:
              t: memoryOwners.search.title
              args: [$.search.query]
            keep: true
            actions:
              - type: button
                icon: close
                label: t:memory.closeSearch
                act: set
                args: {path: cs.m.view|cs.m.q|cs.m.searched, v: all||}
            blocks:
              - type: toolbar
                items:
                  - type: select
                    change: cafeSel
                    id: mem-type
                    label: t:common.type
                    options:
                      - {v: all, label: t:common.all}
                      - {v: memory, label: t:common.memory}
                      - {v: documents, label: t:common.artType.file}
                      - {v: conversations, label: t:common.threads}
                    value: $.search.type
                  - type: select
                    change: cafeSel
                    id: mem-depth
                    label: t:workspaceOwners.depth
                    options:
                      - {v: summary, label: t:evolutionFlow.summary}
                      - {v: raw, label: t:workspaceOwners.raw}
                    value: $.search.depth
                  - type: input
                    id: mem-limit
                    num: true
                    value: $.search.limit
                    label: t:workspaceOwners.limit
                    input: cafeMemLimit
              - type: list
                id: cafeMemRes
                from: $.search.items
                row: memory.item
                empty: t:memory.noResults
  member.card.popup:
    vm: memberCard
    bare: true
    blocks:
      - {type: pop, variant: card, label: $.rows.0.name, view: member.card}
  member.card:
    vm: memberCard
    blocks:
      - type: list
        inline: true
        from: $.rows
        item:
          ident: ["@breed", "@handle"]
        row:
          layout: two
          key: "@who"
          lead: {who: "@who", form: avatar, size: xl}
          title: "@name"
          sub: {of: "@ident", sep: " · "}
      - type: text
        parts:
          - {text: $.model, variant: meta}
        when: $.model
      - type: text
        parts:
          - {text: $.role}
        when: $.role
      - type: toolbar
        items:
          - type: button
            label: {lit: t:memberCard.at}
            act: mention
            args: {who: $.who}
          - type: button
            label: t:common.details
            act: open
            args: {page: member, p: $.who}
  cafe.inbox.float:
    vm: cafeInbox
    bare: true
    blocks:
      - type: component
        use: floatHtml
        props:
          className: inbox cafe-inbox
          label: t:inbox.title
          blocks:
            - {type: view, id: cafe.inbox}
  cafe.inbox:
    vm: cafeInbox
    title: t:inbox.title
    drill:
      - when: $.sub
        act: set
        args:
          path: cs.ib.{k}
          cast: "null"
          k: view
          v: main
    blocks:
      - type: head
        when: $.main
        variant: detail
        title: t:inbox.title
        actions:
          - type: button
            label: t:inbox.viewSchedule
            act: wsTool
            args: {k: schedule}
          - type: more
            items:
              - label:
                  t: inbox.historyMenu.label
                  args: [$.ignoredCount]
                act: set
                args: {path: cs.ib.view, v: ignored}
              - label: t:inbox.handledMentions
                act: set
                args: {path: cs.ib.view, v: handled}
              - label: t:inbox.approvals
                act: set
                args: {path: cs.ib.view, v: approvals}
              - label: t:inbox.historyMenu.ignoreTimeSpan
                act: modal
                args: {v: ibIgnore}
        close: inbox
      - type: toolbar
        when: $.undoReceipt
        items:
          - type: button
            label: t:wsTeam.signal.withdraw
            act: cafeIbUndo
            args: {undoId: $.undoReceipt.undoId}
          - {type: text, text: $.undoReceipt.remaining, variant: meta}
      - type: box
        when: $.main
        variant: scroll
        blocks:
          - {type: label, text: t:inbox.decide}
          - type: fold
            shape: bottom
            height: s
            key: ib-decide
            blocks:
              - type: list
                id: ib-decide
                from: $.main.decide
                item: {$frag: INBOX_DECISION}
                row: inbox.item
                empty: t:inbox.decideEmpty
                partial:
                  of: $.main.partial
                  map: {"true": t:inbox.error.partial, "false": "", _: $.main.partial}
          - type: fold
            shape: bottom
            height: s
            key: ib-review
            blocks:
              - type: list
                id: ib-review
                label: t:inbox.review
                from: $.main.review
                item:
                  act: open
                  args: {page: extItem, p: "@pluginId", exit: "x,esc"}
                  review: true
                  glyph: "@icon"
                row: inbox.item
                optional: true
          - type: label
            text: $.main.me
            action:
              type: seg
              value: $.main.time
              options:
                - {v: today, label: t:format.today}
                - {v: week, label: t:inbox.span.week}
                - {v: earlier, label: t:workspaceOwners.earlierEvents}
              act: set
              args: {path: cs.ib.time}
          - type: fold
            shape: bottom
            height: s
            key: ib-at
            blocks:
              - type: list
                id: ib-at
                from: $.main.at
                item:
                  act: fold
                  args: {path: cs.ib.open, v: "@id"}
                  title: {of: "@", fmt: withoutMention}
                  subKind: mention
                  slot: cafe.inbox.at
                row: inbox.item
                empty:
                  t: inbox.mentionEmpty
                  args: [$.main.me]
          - type: fold
            shape: bottom
            height: s
            key: ib-other
            blocks:
              - type: list
                id: ib-other
                label: t:inbox.other
                from: $.main.other
                item:
                  act: fold
                  args: {path: cs.ib.open, v: "@id"}
                  glyph: tasks
                  slot: cafe.inbox.other
                  other: true
                  dl:
                    - {field: advice, v: "@advice"}
                    - {field: goal, v: "@goal"}
                row: inbox.item
                optional: true
      - type: head
        variant: detail
        when: $.ignored
        title: t:inbox.ignored
        help: t:inbox.ignoredHelp
      - type: toolbar
        when: $.ignored
        items:
          - type: seg
            value: $.ignored.time
            options:
              - {v: today, label: t:format.today}
              - {v: week, label: t:inbox.span.week}
              - {v: earlier, label: t:workspaceOwners.earlierEvents}
            act: set
            args: {path: cs.ib.ignTime}
      - type: list
        id: ib-ignored
        when: $.ignored
        from: $.ignored.items
        item: {titleKind: message, subKind: message}
        row: inbox.item
        empty: t:inbox.ignoredEmpty
      - type: head
        variant: detail
        when: $.handled
        title: t:inbox.handledMentions
        sub:
          text:
            t: inbox.tabs.count
            args: [$.handled.count]
      - type: list
        id: ib-handled
        when: $.handled
        from: $.handled.items
        item: {titleKind: message, subKind: message}
        row: inbox.item
        empty: t:inbox.handledEmpty
      - type: head
        when: $.ap
        variant: detail
        title: t:inbox.approvals
        actions:
          - type: button
            iconOnly: true
            icon: refresh
            label: t:common.refresh
            act: refresh
            args: {k: ib-approvals}
      - type: toolbar
        when: $.ap
        items:
          - type: seg
            value: $.ap.tab
            options:
              - {v: pending, label: t:inbox.tabs.pending, count: $.ap.pendingCount}
              - {v: history, label: t:inbox.tabs.approvalHistory}
            act: set
            args: {path: cs.ib.apTab}
      - type: list
        id: ib-ap
        when: $.ap.pending
        from: $.ap.pendingItems
        item:
          pickable: true
          titleKind: decision
          name: {of: "@from", fmt: identityHandle}
        row: inbox.item
        empty: t:inbox.approvalsEmpty
      - type: toolbar
        when: $.ap.pendingItems
        items:
          - type: button
            label: t:inbox.batchReject
            act: cafeIbBatch
            args: {res: reject}
            disabled: $.ap.nonePicked
          - type: button
            primary: true
            label:
              t: inbox.tabs.acceptLabel
              args: [$.ap.pickedCount]
            act: cafeIbBatch
            args: {res: accept}
            disabled: $.ap.nonePicked
      - type: toolbar
        when: $.ap.history
        items:
          - type: select
            change: cafeSel
            id: ib-aptype
            options:
              - [all, t:inbox.allTypes]
              - [write, t:inbox.writePerm]
              - [thread, t:inbox.newThread]
              - [command, t:inbox.runCommand]
            value: $.ap.type
          - type: select
            change: cafeSel
            id: ib-apres
            options:
              - [all, t:common.all]
              - [accept, t:common.accept]
              - [reject, t:common.reject]
            value: $.ap.res
      - type: list
        id: ib-hist
        when: $.ap.history
        from: $.ap.histItems
        item:
          history: true
          name:
            of: "@name.length"
            gte: 1
            map:
              "true": "@name"
              _: {of: "@from", fmt: identityHandle}
          rejected:
            of: "@result"
            map: {reject: true, _: false}
          resultTone:
            of: "@result"
            map: {reject: warn, _: ""}
        row: inbox.item
        empty: t:inbox.noMatch
  cafe.ws.recall:
    vm: cafeWsRecall
    blocks:
      - type: toolbar
        when: $.filtered
        items:
          - type: button
            link: true
            label: t:skills.clearFilter
            act: set
            args: {path: ws.recallFor, v: ""}
      - type: text
        parts:
          - text:
              t: wsRecall.replies
              args: [$.replyCount]
            variant: meta
        help: t:wsRecall.help
        when: $.replyCount
      - type: list
        id: ws-recall
        groups: $.groups
        group:
          title:
            of: "@reply"
            map:
              "true":
                t: workbench.recallGroupTitle.true
                args:
                  - "@who.name"
                  - {of: "@at", fmt: hm}
                  - {of: "@eventAt", fmt: hm}
              "false":
                t: workbench.recallGroupTitle.false
                args:
                  - "@who.name"
                  - {of: "@at", fmt: hm}
                  - {of: "@eventAt", fmt: hm}
              _: "@reply"
          count:
            of: "@reply"
            map:
              "true":
                t: wsRecall.summary.count
                args: ["@count"]
              "false": ""
              _: "@reply"
        row:
          layout: two
          key: "@key"
          title: "@title"
          sub:
            parts:
              - parts:
                  - of: "@push"
                    map:
                      "true": t:memory.delivery
                      "false":
                        of: "@graph"
                        map:
                          "true":
                            t: workbench.recallTool
                            args: ["@tool"]
                          "false":
                            t: workbench.recallToolDefault.false
                            args:
                              - t: workbench.recallTool
                                args: ["@tool"]
                          _: "@graph"
                      _: "@push"
                  - " · "
                  - t: workbench.dayTime
                    args:
                      - {of: "@date", fmt: day}
                      - {of: "@date", fmt: hm}
                sep: ""
          expand:
            - type: each
              from: "@results"
              blocks:
                - type: text
                  parts:
                    - {text: "@title", when: "!@act"}
                    - control: {type: button, link: true, label: "@title", act: "@act", args: "@args"}
                      when: "@act"
                    - {text: "@sub", variant: meta, when: "@sub"}
            - type: toolbar
              items:
                - type: button
                  label: t:memory.locateReply
                  act: msgJump
                  args: {mid: "@mid", t: "@thread"}
                  when: "@canLocate"
        empty: t:wsRecall.empty
      - type: toolbar
        when: [$.events.next, "!$.filtered"]
        items:
          - type: button
            link: true
            label: t:workspaceOwners.earlierEvents
            act: recallEventsMore
            args: {cursor: $.events.next}
  cafe.ws.voice:
    vm: cafeWsVoice
    error: t:frame.loadError
    retry:
      act: refresh
      args: {k: voice}
    blocks:
      - type: toolbar
        when:
          of: $.service.state
          map: {running: false, _: true}
        items:
          - type: button
            parts:
              - control:
                  type: status
                  tone:
                    of: $.service.state
                    map:
                      error: danger
                      none: warn
                      stopped: warn
                      installing: warn
                      _: $.service.state
                  text:
                    of: [0, 1]
                    item:
                      of: "@"
                      map:
                        "0": $.service.name
                        "1":
                          of: $.service.state
                          map:
                            none: t:common.status.notInstalled
                            stopped: t:common.status.disabled
                            error: t:voice.options.tip
                            installing: t:ext.installing
                            _: $.service.state
                    sep: ""
            act: open
            args: {page: voice}
      - type: box
        load: $.load
        error: t:frame.loadError
        retry:
          act: refresh
          args: {k: voice}
        blocks:
          - type: toolbar
            items:
              - type: select
                id: voice-source
                from: $.capture.sourceOptions
                value: $.capture.sourceId
                label: t:common.source
                change: voiceCaptureSource
              - type: button
                primary: true
                icon: stop
                label: t:frame.stopRecording
                act: wsRec
                when: $.rec
              - type: button
                primary: true
                icon: mic
                label: t:voiceReview.recording.startRecording
                act: wsRec
                args: {op: start}
                when: $.capture.canStart
              - type: button
                label: t:player.pause
                act: wsRec
                args: {op: pause}
                when: $.capture.canPause
              - type: button
                label: t:player.play
                act: wsRec
                args: {op: resume}
                when: $.capture.canResume
          - type: status
            text: t:workbench.evoState.paused
            when: $.capture.canResume
          - type: section
            title: t:memoryOwners.categories.meeting
            blocks:
              - type: settings
                rows:
                  - label: t:voiceReview.advisory.mode
                    ctls:
                      - type: seg
                        value: $.advisoryMode
                        act: meetingAdvisoryMode
                        options:
                          - {v: passive, label: t:voiceReview.advisory.passive}
                          - {v: active, label: t:voiceReview.advisory.active}
                      - {type: button, label: t:voiceReview.advisory.dnd, act: meetingDnd}
          - type: toolbar
            when: $.capture.share
            items:
              - type: button
                label: t:voiceReview.shareMeeting
                act: meetingShare
                args: {op: start}
                when: "!$.capture.share.sharing"
              - type: button
                label: t:common.stop
                act: meetingShare
                args: {op: stop}
                when: $.capture.share.sharing
              - {type: text, text: $.capture.share.inputLabel}
          - type: each
            from: $.lines
            blocks:
              - {type: text, text: "@title"}
              - type: toolbar
                when: "@canEdit"
                items:
                  - type: input
                    id: "@speakerId"
                    value: "@draft"
                    input: cafeField
                    label: t:common.name
                    go: transcriptCorrect
                    args: {lineId: "@lineId"}
                    goLabel: t:common.save
                    icon: check
          - type: toolbar
            when: $.transcript
            items:
              - type: button
                label: t:cafeRows.bringToChat
                act: insert
                args:
                  into: chat-input
                  text: $.transcript
                  mode: append
                  captureId: $.transcriptSource.captureId
                  threadId: $.transcriptSource.threadId
          - type: toolbar
            when: $.capture.savedTranscriptLocator
            items:
              - {type: copy, value: $.capture.savedTranscriptLocator}
              - type: button
                label: t:common.open
                act: fileOpen
                args: $.capture.open
                when: $.capture.open
          - type: each
            from: $.items
            item:
              media:
                id: "@mediaId"
                kind: audio
                src: "@source"
                label: {of: "@path", fmt: basename}
            blocks:
              - type: toolbar
                items:
                  - type: text
                    text: {of: "@path", fmt: basename}
                  - type: button
                    iconOnly: true
                    icon: download
                    label: t:common.download
                    act: download
                    args:
                      source: "@source"
                      name: {of: "@path", fmt: basename}
                    when: "@canDownload"
              - {type: component, use: media, props: "@media", when: "@source"}
          - type: box
            load: $.callTranscript.load
            error: t:frame.loadError
            retry:
              act: refresh
              args: {k: voice}
            blocks:
              - type: list
                from: $.callTranscript.items
                row: record.row
                optional: true
  film.media:
    bare: true
    blocks:
      - type: component
        use: media
        props:
          data: "@"
          pick:
            - act: filmSelect
              args: {mediaId: "@id", id: "@project", screening: "@screening"}
              when: "@canPick"
          mark:
            - act: filmOpinionShow
              args: {id: "@annotationId", project: $.project, screening: $.screening}
              when: "@annotationId"
  cafe.ws.clips:
    vm: cafeWsClips
    loading: t:films.loading
    error: t:films.error
    blocks:
      - type: box
        when: "!$.project"
        blocks:
          - type: toolbar
            items:
              - type: seg
                value: $.layout
                options:
                  - {v: list, label: t:common.viewMode.list}
                  - {v: cards, label: t:common.viewMode.cards}
                act: set
                args: {path: ws.film.layout}
              - {type: grow}
              - type: button
                iconOnly: true
                icon: upload
                label: t:films.import
                act: filmImport
          - type: list
            id: ws-clips
            from: $.items
            empty: t:films.noProjects
            when:
              of: $.layout
              map: {cards: false, _: true}
            row:
              layout: two
              key: "@key"
              lead: {glyph: video}
              title: "@title"
              sub:
                text:
                  t: films.summary
                  args: ["@segments", "@screenings"]
              cols:
                - v: {of: "@dur", fmt: clock}
                  w: num
              act: filmOpen
              args: {id: "@key"}
              acts:
                - label: t:media.preview
                  icon: play
                  act: filmPreview
                  args: {id: "@key", screening: "@screening"}
                  when: "@hasScreening"
          - type: component
            use: cards
            props:
              from: $.items
              item:
                title: "@title"
                icon: video
                sub:
                  t: films.summary
                  args: ["@segments", "@screenings"]
                act: filmOpen
                args: {id: "@key"}
                preview: {kind: video, src: "@source", when: "@hasScreening"}
                actions:
                  - label: t:media.preview
                    icon: play
                    act: filmPreview
                    args: {id: "@key", screening: "@screening"}
                    when: "@hasScreening"
            when:
              of: $.layout
              map: {cards: true, _: false}
      - {type: view, id: film.project, when: $.project}
  film.project:
    vm: filmProject
    blocks:
      - type: head
        variant: detail
        title: $.title
        sub:
          text:
            t: films.inputVersion
            args: [$.inputRevision]
        actions:
          - type: button
            iconOnly: true
            icon: refresh
            label: t:common.refresh
            act: filmRefresh
            args: {id: $.id}
          - type: button
            label: t:reviewDetail.canon
            act: assetCanonRead
            args: {reference: $.reference}
          - type: button
            label: t:films.register
            act: dialog
            args: {kind: filmRegister}
            when: "!$.archived"
      - {type: notice, text: t:films.archived, when: $.archived}
      - type: notice
        tone: warn
        text:
          t: films.syncPending
          args: [$.sync]
        when: $.sync
        action:
          type: button
          label: t:films.syncRetry
          act: filmSync
          args: {id: $.id}
      - type: box
        when: "!$.archived"
        blocks:
          - type: toolbar
            when: $.hasScreening
            items:
              - type: select
                id: film-screening
                from: $.screens
                value: $.screening
                label: t:films.current
                change: filmScreening
              - type: select
                id: film-compare
                options:
                  - ["", t:films.noCompare]
                  - from: $.comparisonOptions
                    item: ["@0", "@1"]
                value: $.compare
                label: t:films.compare
                change: filmCompare
                when: $.canCompare
              - type: button
                label: t:media.preview
                act: filmPreview
                args: {id: $.id, screening: $.screening}
          - type: box
            blocks: {$frag: FILM_MEDIA_BLOCKS}
            when: $.hasScreening
          - {type: empty, text: t:films.noScreening, when: "!$.hasScreening"}
          - type: toolbar
            items:
              - type: seg
                value: $.tab
                options:
                  - {v: story, label: t:films.story}
                  - {v: assets, label: t:films.assets}
                  - {v: review, label: t:films.review}
                act: set
                args: {path: ws.film.tab}
          - {type: view, id: asset.canon, when: $.canon}
          - type: list
            from: $.chapters
            item:
              act:
                of: "@canLocate"
                map: {"true": mediaSeek, "false": "", _: "@canLocate"}
              args: {id: "@location.id", at: "@location.at"}
            row: record.row
            optional: true
            when: $.storyTab
          - type: list
            id: film-story
            from: $.story
            empty: t:films.noStory
            when: $.storyTab
            row:
              layout: two
              key: "@id"
              title: "@title"
              sub: "@sub"
              cols:
                - v:
                    parts:
                      - parts:
                          - {of: "@startTime", fmt: clock}
                          - " – "
                          - {of: "@endTime", fmt: clock}
                        sep: ""
                  w: time
                - control:
                    type: button
                    iconOnly: true
                    icon: locate
                    label: t:films.locate
                    act: mediaSeek
                    args: {id: "@location.id", at: "@location.at"}
                    when: "@canLocate"
              expand:
                - type: list
                  from: "@visuals"
                  optional: true
                  row:
                    layout: two
                    title:
                      - {text: "@title", when: "!@generated"}
                      - {text: t:films.generated, when: "@generated"}
                    sub: "@sub"
                    act:
                      of: "@known"
                      map: {"true": filmAssetPreview, _: ""}
                    args: {id: "@projectId", asset: "@assetId", version: "@version"}
                - type: list
                  from: "@events"
                  optional: true
                  row: {layout: two, title: "@title", sub: "@sub"}
          - type: list
            id: film-assets
            from: $.assets
            empty: t:films.noAssets
            when: $.assetsTab
            row:
              layout: two
              key: "@id"
              title: "@title"
              sub:
                parts:
                  - parts:
                      - "@kind"
                      - " · "
                      - {of: "@size", fmt: bytes}
                    sep: ""
              cols:
                - control:
                    type: button
                    iconOnly: true
                    icon: eye
                    label: t:media.preview
                    act: filmAssetPreview
                    args: {id: "@projectId", asset: "@id", version: "@stableRef"}
              expand:
                - type: toolbar
                  items:
                    - type: select
                      id: "@selectId"
                      options:
                        - from: "@versions"
                          item:
                            v: "@id"
                            label:
                              t: films.version
                              args: ["@n"]
                      value: "@selected"
                      label: t:films.reference
                      change: filmAssetVersion
                - type: list
                  from: "@uses"
                  empty: t:films.noUses
                  row:
                    layout: line
                    title: "@title"
                    act:
                      of: "@canLocate"
                      map: {"true": mediaSeek, _: ""}
                    args: {id: "@location.id", at: "@location.at"}
          - type: list
            id: film-opinions
            from: $.opinions
            item:
              state:
                of: "@last.kind"
                map:
                  addressed:
                    of: "@last.result.kind"
                    map: {not-changed: unchanged, _: modified}
                  _:
                    of: "@state"
                    map: {resolved: resolved, _: open}
            empty: t:films.noOpinions
            when: $.reviewTab
            row:
              layout: two
              key: "@id"
              title: "@title"
              sub:
                text:
                  of: "@state"
                  map:
                    unchanged: t:films.historyKind.unchanged
                    modified: t:films.opinionState.modified
                    resolved: t:films.historyKind.resolved
                    open: t:films.opinionState.open
                    _: "@state"
              cur: "@cur"
              cols:
                - control:
                    type: button
                    iconOnly: true
                    icon: locate
                    label: t:films.locate
                    act: mediaSeek
                    args: {id: "@location.id", at: "@location.at"}
                    when: "@canLocate"
              expand:
                - type: status
                  tone: warn
                  text: t:films.sourceChanged
                  when: "@sourceChanged"
                - type: list
                  from: "@history"
                  item:
                    displayKind:
                      of: "@kind"
                      map:
                        addressed:
                          of: "@result.kind"
                          map: {not-changed: unchanged, _: "@kind"}
                        _: "@kind"
                  optional: true
                  row:
                    layout: two
                    title:
                      text:
                        of: "@displayKind"
                        map:
                          created: t:films.historyKind.created
                          located: t:mediaMarks.located
                          replied: t:films.historyKind.replied
                          addressed: t:inbox.tabs.handled
                          reopened: t:films.historyKind.reopened
                          resolved: t:films.historyKind.resolved
                          unchanged: t:films.historyKind.unchanged
                          _: "@displayKind"
                    sub:
                      parts:
                        - {text: "@reason"}
                        - text: "@result.reason"
                          when:
                            of: "@result.kind"
                            map: {not-changed: true, _: false}
                      sep: " · "
                - type: list
                  from: "@replies"
                  optional: true
                  row:
                    layout: two
                    title: "@title"
                    sub:
                      text:
                        of: "@authorKind"
                        map:
                          cat: "@authorName"
                          human:
                            t: common.you
                            args: ["@authorName"]
                          user:
                            t: common.you
                            args: ["@authorName"]
                          _: "@authorKind"
                - type: toolbar
                  items:
                    - type: button
                      label: t:films.compareResult
                      act: filmOpinionCompare
                      args: {id: "@id", from: "@compare.from", to: "@compare.to"}
                      when: "@compare"
                    - type: button
                      label: t:films.source
                      act: filmOpinionSource
                      args: {thread: "@source.thread", mid: "@source.mid"}
                      when: "@source"
                    - type: button
                      label: t:films.reopen
                      act: filmReopen
                      args: {kind: filmReopen, id: "@id"}
                      when: "@canReopen"
  clip.preview:
    bare: true
    vm: filmPreview
    blocks:
      - type: dialog
        pop: clip.preview
        layout: viewport
        focus: true
        title:
          of: $.hasScreeningTitle
          map:
            "false": $.title
            "true":
              of: [0, 1, 2]
              item:
                of: "@"
                map: {"0": $.title, "1": " · ", "2": $.screeningTitle}
              sep: ""
            _: $.hasScreeningTitle
        actions:
          - type: button
            iconOnly: true
            icon: download
            label: t:common.download
            act: filmDownload
        blocks:
          - type: text
            variant: meta
            text:
              of: $.recordedAt
              slice: [0, 10]
            when: "!$.inputRevision"
          - type: text
            variant: meta
            text:
              t: films.inputVersion
              args: [$.inputRevision]
            when: $.inputRevision
          - type: box
            blocks: {$frag: FILM_MEDIA_BLOCKS}
  cafe.ws.evolution:
    loading: t:wsEvolution.load.loading
    error: t:wsEvolution.load.error
    stale: t:wsEvolution.load.stale
    empty: t:workbench.empty.emptyState
    vm: cafeWsEvo
    blocks:
      - type: head
        variant: detail
        when: $.detail
        eyebrow:
          text:
            t: reviewDetail.round
            args: [$.detail.cycle]
          when: "!$.detail.unavailable"
        title:
          - text:
              of: $.detail.unavailable
              map:
                "true":
                  t: workbench.evoHeaderName.true
                  args:
                    - of: $.detail.hasName
                      map:
                        "true": $.detail.name
                        "false":
                          t: workbench.evoName.false
                          args: [$.detail.name]
                        _: $.detail.hasName
                "false":
                  of: $.detail.hasName
                  map:
                    "true": $.detail.name
                    "false":
                      t: workbench.evoName.false
                      args: [$.detail.name]
                    _: $.detail.hasName
                _: $.detail.unavailable
            when: "!$.detail.renaming"
          - control:
              type: input
              id: evo-name
              value:
                of: $.detail.hasName
                map:
                  "true": $.detail.name
                  "false":
                    t: workbench.evoName.false
                    args: [$.detail.name]
                  _: $.detail.hasName
              label: t:common.name
              go: rename
              cancel: close
              args: {entity: evo, id: $.detail.id, path: s.renaming}
              goLabel: t:common.save
            when: $.detail.renaming
        sub: $.detail.sub
        note: "2"
        actions:
          - {type: status, text: t:workbench.evoState.paused, when: $.detail.paused}
          - type: more
            items:
              - label: t:common.rename
                act: rename
                args: {entity: evo, id: $.detail.id}
              - label: t:common.refresh
                act: refresh
                args: {k: evolution}
              - label:
                  t: workbench.evoLifecycleLabel
                  args: [$.detail.lifecycle.canPause]
                act: evoLifecycle
                args:
                  programId: $.detail.id
                  op:
                    of: $.detail.lifecycle.canPause
                    map: {"true": pause, "false": resume, _: $.detail.lifecycle.canPause}
                  expectedRevision: $.detail.lifecycle.revision
                when: $.detail.lifecycle.mutable
              - label: t:evolutionFlow.progress
                act: evoRequest
                args: {programId: $.detail.id, intent: progress}
                when: $.detail.progressRequest.canRequest
              - label: t:evolutionFlow.remind
                act: evoRequest
                args: {programId: $.detail.id, intent: remind}
                when: $.detail.progressRequest.canRequest
      - {type: notice, when: $.detail.error, tone: warn, text: $.detail.error}
      - type: notice
        when: $.detail.notice
        tone: warn
        text:
          t: workbench.evoNotice
          args: [$.detail.notice]
      - type: each
        from:
          - {}
        when: [$.detail, "!$.detail.unavailable"]
        item:
          steps:
            - i: 0
              stage: constituting
              on:
                of: $.detail.stage
                map: {"0": true, _: false}
              done: {of: $.detail.actualStage, gte: 1}
            - i: 1
              stage: instrumenting
              on:
                of: $.detail.stage
                map: {"1": true, _: false}
              done: {of: $.detail.actualStage, gte: 2}
            - i: 2
              stage: observing
              on:
                of: $.detail.stage
                map: {"2": true, _: false}
              done: {of: $.detail.actualStage, gte: 3}
            - i: 3
              stage: evaluating
              on:
                of: $.detail.stage
                map: {"3": true, _: false}
              done: {of: $.detail.actualStage, gte: 4}
            - i: 4
              stage: attributing
              on:
                of: $.detail.stage
                map: {"4": true, _: false}
              done: {of: $.detail.actualStage, gte: 5}
            - i: 5
              stage: awaiting_intervention
              on:
                of: $.detail.stage
                map: {"5": true, _: false}
              done: {of: $.detail.actualStage, gte: 6}
            - i: 6
              stage: awaiting_approval
              on:
                of: $.detail.stage
                map: {"6": true, _: false}
              done: {of: $.detail.actualStage, gte: 7}
            - i: 7
              stage: writing_back
              on:
                of: $.detail.stage
                map: {"7": true, _: false}
              done: {of: $.detail.actualStage, gte: 8}
            - i: 8
              stage: revalidating
              on:
                of: $.detail.stage
                map: {"8": true, _: false}
              done: {of: $.detail.actualStage, gte: 9}
            - i: 9
              stage: deciding
              on:
                of: $.detail.stage
                map: {"9": true, _: false}
              done: {of: $.detail.actualStage, gte: 10}
        blocks:
          - type: steps
            variant: progress
            when: $.detail
            from: "@steps"
            item:
              label:
                t: evolutionFlow.stage
                args: ["@stage"]
            act: fold
            args:
              path: ws.evoReading.{id}.stage
              id: $.detail.id
              cast: num
      - type: toolbar
        when: $.detail
        items:
          - type: seg
            options: []
            when: $.detail.unavailable
          - type: seg
            value: $.detail.view
            options:
              - {v: judge, label: t:evolutionFlow.thisRound}
              - {v: hist, label: t:wsEvolution.detail.changeHistory}
            act: set
            args:
              path: ws.evoReading.{id}.view
              id: $.detail.id
            when: "!$.detail.unavailable"
      - type: section
        when:
          - {$frag: EVO_JUDGE}
          - of: $.detail.stage
            map: {"0": true, _: false}
          - $.detail.owner.preparation
        title: t:evolutionFlow.objects
        blocks:
          - type: text
            text: $.detail.preparation.objectMap.goal
            when: $.detail.preparation.objectMap.goal
          - {type: markdown, text: $.detail.preparation.objectMap.summary}
          - type: list
            from: $.detail.preparation.objectMap.items
            item:
              object: true
              fields:
                - field: scope
                  value: {of: "@scope", sep: ；}
                  when:
                    of: "@scope"
                    map: {"0": true, "false": true, _: "@scope"}
                - field: reason
                  value: {of: "@why", sep: ；}
                  when:
                    of: "@why"
                    map: {"0": true, "false": true, _: "@why"}
                - field: boundary
                  value: {of: "@modifiability.reason", sep: ；}
                  when:
                    of: "@modifiability.reason"
                    map: {"0": true, "false": true, _: "@modifiability.reason"}
                - field: choiceReason
                  value: {of: "@choice.reason", sep: ；}
                  when:
                    of: "@choice.reason"
                    map: {"0": true, "false": true, _: "@choice.reason"}
                - field: nextAction
                  value: {of: "@nextAction", sep: ；}
                  when:
                    of: "@nextAction"
                    map: {"0": true, "false": true, _: "@nextAction"}
            row: evolution.detail
            empty: t:evolutionFlow.preparationUnavailable
          - type: list
            from: $.detail.preparation.objectMap.unknowns
            row: record.row
      - type: section
        when:
          - {$frag: EVO_JUDGE}
          - of: $.detail.stage
            map: {"0": true, _: false}
          - $.detail.owner.preparation
        title: t:evolutionFlow.success
        blocks:
          - {type: markdown, text: $.detail.preparation.success.summary}
          - type: list
            from: $.detail.preparation.success.criteria
            item:
              fields:
                - field: observationUnit
                  value: {of: "@observationUnit", sep: ；}
                  when:
                    of: "@observationUnit"
                    map: {"0": true, "false": true, _: "@observationUnit"}
                - field: estimator
                  value: {of: "@estimator", sep: ；}
                  when:
                    of: "@estimator"
                    map: {"0": true, "false": true, _: "@estimator"}
                - field: counterexample
                  value: {of: "@counterexample", sep: ；}
                  when:
                    of: "@counterexample"
                    map: {"0": true, "false": true, _: "@counterexample"}
                - field: validity
                  value: {of: "@validityBounds", sep: ；}
                  when:
                    of: "@validityBounds"
                    map: {"0": true, "false": true, _: "@validityBounds"}
                - field: nextAction
                  value: {of: "@nextAction", sep: ；}
                  when:
                    of: "@nextAction"
                    map: {"0": true, "false": true, _: "@nextAction"}
            row: evolution.detail
            empty: t:evolutionFlow.preparationUnavailable
      - type: section
        when:
          - {$frag: EVO_JUDGE}
          - of: $.detail.stage
            map: {"0": true, _: false}
          - $.detail.owner.preparation
        title: t:evolutionFlow.measurement
        blocks:
          - {type: markdown, text: $.detail.preparation.measurement.summary}
          - type: list
            from: $.detail.preparation.measurement.gtSources
            item:
              fields:
                - field: collection
                  value: {of: "@collection.method", sep: ；}
                  when:
                    of: "@collection.method"
                    map: {"0": true, "false": true, _: "@collection.method"}
                - field: validity
                  value: {of: "@validity.validFor", sep: ；}
                  when:
                    - of: "@validity.state"
                      map: {bounded: true, _: false}
                    - "@validity.validFor"
                - field: missing
                  value: {of: "@missingOrDisputed", sep: ；}
                  when:
                    of: "@missingOrDisputed"
                    map: {"0": true, "false": true, _: "@missingOrDisputed"}
            row: evolution.detail
            empty: t:evolutionFlow.preparationUnavailable
          - type: list
            from: $.detail.preparation.measurement.conditions
            item:
              fields:
                - field: boundary
                  value: {of: "@modifiability.reason", sep: ；}
                  when:
                    of: "@modifiability.reason"
                    map: {"0": true, "false": true, _: "@modifiability.reason"}
            row: evolution.detail
          - type: each
            from:
              - {}
            item:
              fields:
                - field: observationUnit
                  value: {of: $.detail.preparation.measurement.comparison.unit, sep: ；}
                  when:
                    of: $.detail.preparation.measurement.comparison.unit
                    map: {"0": true, "false": true, _: $.detail.preparation.measurement.comparison.unit}
                - field: variable
                  value: {of: $.detail.preparation.measurement.comparison.primaryVariable, sep: ；}
                  when:
                    of: $.detail.preparation.measurement.comparison.primaryVariable
                    map:
                      "0": true
                      "false": true
                      _: $.detail.preparation.measurement.comparison.primaryVariable
                - field: controls
                  value: {of: $.detail.preparation.measurement.comparison.controls, sep: ；}
                  when:
                    of: $.detail.preparation.measurement.comparison.controls
                    map:
                      "0": true
                      "false": true
                      _: $.detail.preparation.measurement.comparison.controls
                - field: holdout
                  value:
                    of: $.detail.preparation.measurement.comparison.independentHoldout
                    sep: ；
                  when:
                    of: $.detail.preparation.measurement.comparison.independentHoldout
                    map:
                      "0": true
                      "false": true
                      _: $.detail.preparation.measurement.comparison.independentHoldout
                - field: repeatability
                  value: {of: $.detail.preparation.measurement.comparison.repeatability, sep: ；}
                  when:
                    of: $.detail.preparation.measurement.comparison.repeatability
                    map:
                      "0": true
                      "false": true
                      _: $.detail.preparation.measurement.comparison.repeatability
            blocks:
              - type: kv
                from: "@fields"
                item: {$frag: EVO_FIELD_ITEM}
          - type: list
            from: $.detail.preparation.measurement.unknowns
            row: record.row
      - type: disclosure
        when:
          - {$frag: EVO_JUDGE}
          - of: $.detail.stage
            map: {"0": true, _: false}
          - $.detail.owner.preparation
        key: evo-baseline
        title: t:evolutionFlow.baseline
        blocks:
          - {type: markdown, text: $.detail.preparation.baseline.summary}
          - {type: list, from: $.detail.preparation.baseline.facts, row: record.row}
          - type: list
            from: $.detail.preparation.baseline.explanations
            row: record.row
      - type: section
        when:
          - {$frag: EVO_JUDGE}
          - {of: $.detail.stage, gte: 1}
          - of: $.detail.stage
            gte: 5
            map: {"true": false, _: true}
        title: t:evolutionFlow.exploration
        blocks:
          - type: notice
            tone: warn
            when: $.detail.exploration.unavailable
            text: t:evolutionFlow.explorationUnavailable
          - type: notice
            tone: warn
            when: $.detail.exploration.error
            text: $.detail.exploration.error
          - type: toolbar
            items:
              - type: select
                id: evo-node
                change: cafeSel
                label: t:evolutionFlow.reading
                options: $.detail.exploration.catalog
                value: $.detail.exploration.node
              - type: select
                when: $.detail.exploration.selectedExperiment
                id: evo-experiment
                change: cafeSel
                label: t:evolutionFlow.experiment
                options: $.detail.exploration.experiments
                value: $.detail.exploration.experiment
              - type: select
                id: evo-compare
                change: cafeSel
                label: t:evolutionFlow.comparison
                options:
                  - {v: "", label: t:evolutionFlow.noComparison}
                  - from: $.detail.exploration.comparisonOptions
                    item: {v: "@v", label: "@label"}
                value: $.detail.exploration.comparison
          - type: notice
            when: $.detail.exploration.publication.changed
            text: t:evolutionFlow.publicationChanged
            action:
              type: button
              label: t:evolutionFlow.readCurrent
              act: evoPublication
              args: {programId: $.detail.id}
          - {type: markdown, text: $.detail.exploration.body}
          - type: list
            when: {$frag: EVO_CASES}
            from: $.detail.exploration.cases
            row: evolution.detail
            empty: t:evolutionFlow.noCases
          - type: notice
            when: $.detail.exploration.compare.hasError
            tone: warn
            parts:
              - parts: $.detail.exploration.compare.errors
                sep: ；
                each:
                  text:
                    t: workbench.evoComparison
                    args: ["@"]
            action:
              type: button
              label:
                t: evolutionFlow.pairedSubset
                args: [$.detail.exploration.compare.subset.count]
              act: evoSubset
              args: {k: $.detail.exploration.compare.subset.k}
              when: $.detail.exploration.compare.subset
          - type: list
            when: [$.detail.exploration.compare, "!$.detail.exploration.compare.hasError"]
            from: $.detail.exploration.compare.metrics
            row:
              layout: two
              title: "@title"
              expand:
                - type: kv
                  item: {$frag: EVO_FIELD_ITEM}
                  from: "@fields"
          - type: split
            when: [$.detail.exploration.compare, "!$.detail.exploration.compare.hasError"]
            variant: compare
            left:
              - {type: label, text: $.detail.exploration.compare.left.title}
              - type: list
                from: $.detail.exploration.compare.left.cases
                row: evolution.detail
            right:
              - {type: label, text: $.detail.exploration.compare.right.title}
              - type: list
                from: $.detail.exploration.compare.right.cases
                row: evolution.detail
          - type: toolbar
            when: $.detail.exploration.request.canRequest
            items:
              - type: select
                id: evo-intent
                change: cafeSel
                label: t:evolutionFlow.request
                options:
                  - from: $.detail.exploration.request.intents
                    item:
                      v: "@"
                      label:
                        of: "@"
                        map:
                          explore: t:evolutionFlow.intent.explore
                          retest: t:evolutionFlow.requestIntent.retest
                          adopt: t:evolutionFlow.intent.adopt
                          _: "@"
                value: $.detail.exploration.request.intent
              - type: input
                id: evo-request
                label: t:evolutionFlow.request
                placeholder: t:evolutionFlow.requestPlaceholder
                value: $.detail.exploration.request.draft
                input: evoRequest
                max: 8000
                go: evoRequest
                args: {programId: $.detail.id}
                goLabel: t:common.send
          - type: text
            variant: meta
            when: $.detail.exploration.request.target
            text: $.detail.exploration.request.target
      - type: section
        when:
          - {$frag: EVO_JUDGE}
          - {of: $.detail.stage, gte: 5}
          - $.detail.owner.attribution
        title: t:wsEvolution.evalAttribution
        blocks:
          - {type: markdown, text: $.detail.judge.headline}
          - type: each
            from:
              - {}
            item:
              fields:
                - field: confidence
                  value: {of: $.detail.owner.attribution.confidence.label, sep: ；}
                  when:
                    of: $.detail.owner.attribution.confidence.label
                    map: {"0": true, "false": true, _: $.detail.owner.attribution.confidence.label}
                - field: comparability
                  value: {of: $.detail.owner.attribution.comparability.label, sep: ；}
                  when:
                    of: $.detail.owner.attribution.comparability.label
                    map: {"0": true, "false": true, _: $.detail.owner.attribution.comparability.label}
            blocks:
              - type: kv
                from: "@fields"
                item: {$frag: EVO_FIELD_ITEM}
          - type: list
            label: t:wsEvolution.evidenceOn
            from: $.detail.judge.evidence
            row: evolution.source
            optional: true
          - type: list
            label: t:wsEvolution.competing
            from: $.detail.judge.competing
            row: record.row
            optional: true
          - type: list
            label: t:wsEvolution.stillMissing
            from: $.detail.judge.unknowns
            row: record.row
            optional: true
      - type: disclosure
        when:
          - {$frag: EVO_JUDGE}
          - $.detail.owner.observation
        key: evo-observation
        title: t:wsEvolution.eyesAttached
        blocks:
          - {type: list, from: $.detail.judge.eyes, row: evolution.source}
          - {type: list, from: $.detail.judge.gaps, row: record.row}
          - type: text
            variant: meta
            text: {of: $.detail.judge.nextEvaluation, fmt: ago}
            when: $.detail.judge.nextEvaluation
      - type: section
        when:
          - {$frag: EVO_JUDGE}
          - {of: $.detail.stage, gte: 5}
          - $.detail.owner.lineage
        title: t:wsEvolution.approveRun
        blocks:
          - type: text
            text:
              of: $.detail.judge.change.status
              map:
                pending: t:evolutionFlow.change.pending
                approved: t:evolutionFlow.change.approved
                changed: t:evolutionFlow.change.changed
                no_change: t:evolutionFlow.change.no_change
                outcome: t:evolutionFlow.change.outcome
                rejected: t:memoryOwners.stateNote.rejected
                withdrawn: t:memoryOwners.stateNote.withdrawn
                superseded: t:evolutionFlow.change.superseded
                target_drift: t:evolutionFlow.change.target_drift
                _: $.detail.judge.change.status
          - type: toolbar
            items:
              - type: button
                label: t:evolutionFlow.sourceThread
                act: wsEvoApprove
                when: $.detail.judge.change.canReview
              - type: button
                label: t:evolutionFlow.sync
                act: evoChangeSync
                args: {programId: $.detail.id, expectedRevision: $.detail.lifecycle.revision}
                when: $.detail.judge.change.canSync
          - type: choices
            when: $.detail.judge.change.canDecide
            group: evoDecide
            from:
              - {v: keep, label: t:evolutionFlow.decision.keep}
              - {v: tune, label: t:evolutionFlow.decision.tune}
              - {v: rollback, label: t:evolutionFlow.decision.rollback}
              - {v: sunset, label: t:evolutionFlow.decision.sunset}
              - {v: no_change, label: t:wsEvolution.detail.keepCurrent}
            value: $.detail.judge.decide
            act: set
            args:
              path: ws.evoReading.{id}.decision
              id: $.detail.id
          - type: toolbar
            when: $.detail.judge.change.canDecide
            items:
              - type: button
                label: t:wsEvolution.submitDecision
                act: wsEvoDecide
                args: {programId: $.detail.id, expectedRevision: $.detail.lifecycle.revision}
                disabled: "!$.detail.judge.decide"
      - type: disclosure
        when:
          - {$frag: EVO_JUDGE}
          - "!$.detail.use.unavailable"
        key: evo-use
        title: t:wsEvolution.adopted
        blocks:
          - type: text
            parts:
              - parts: $.detail.use.currentTitles
                sep: " · "
                each:
                  text:
                    of: "@hasTitle"
                    map:
                      "true": "@title"
                      "false":
                        t: workbench.evoVersion.false
                        args: ["@title"]
                      _: "@hasTitle"
          - {type: list, from: $.detail.use.receipts, row: evolution.source}
          - {type: list, from: $.detail.use.observations, row: evolution.source}
          - type: toolbar
            items:
              - type: button
                label: t:evolutionFlow.rollbackSource
                act: evoVersion
                when: $.detail.use.rollback
                args:
                  programId: $.detail.use.rollback.programId
                  versionRef: $.detail.use.rollback.versionRef
      - type: section
        when:
          - {$frag: EVO_HIST}
          - $.detail.owner.preparation
        title: t:evolutionFlow.preparationHistory
        blocks:
          - type: list
            when:
              - {$frag: EVO_HIST}
              - $.detail.owner.preparation
            from: $.detail.hist.preparation
            item:
              preparation: true
              fields:
                - {field: summary, value: "@submission.body.summary", when: "@submission"}
            row: evolution.detail
      - type: section
        when:
          - {$frag: EVO_HIST}
          - "!$.detail.use.unavailable"
        title: t:wsEvolution.changesKept
        blocks:
          - {type: list, from: $.detail.hist.versions, row: evolution.version}
          - type: label
            when: $.detail.use.selected
            text:
              of: $.detail.use.selectedTitle.hasTitle
              map:
                "true": $.detail.use.selectedTitle.title
                "false":
                  t: workbench.evoVersion.false
                  args: [$.detail.use.selectedTitle.title]
                _: $.detail.use.selectedTitle.hasTitle
          - {type: markdown, text: $.detail.use.diff}
          - {type: list, from: $.detail.use.observations, row: evolution.source}
      - type: section
        when: {$frag: EVO_HIST}
        title: t:wsEvolution.roundResults
        blocks:
          - {type: list, from: $.detail.hist.rounds, row: evolution.round}
      - type: head
        variant: detail
        when: "!$.detail"
        note: "1"
        actions:
          - type: more
            items:
              - {label: t:wsEvolution.newGoal, act: wsEvoNew}
              - label: t:common.refresh
                act: refresh
                args: {k: evolution}
      - type: section
        when: ["!$.detail", "!$.load"]
        title: t:wsEvolution.inProgress
        help:
          t: calendar.count
          args: [$.activeCount]
        keep: true
        blocks:
          - type: list
            from: $.active
            row: evolution.program
            empty: t:workbench.empty.emptyState
      - type: section
        when: ["!$.detail", "!$.load"]
        title: t:wsEvolution.recentDone
        help: t:wsEvolution.doneHelp
        keep: true
        blocks:
          - type: list
            from: $.done
            row: evolution.program
            empty: t:wsEvolution.list.noFinishedItems
  cafe.ws.ops:
    loading: t:wsOps.load.loading
    error: t:wsOps.load.error
    stale: t:wsOps.load.stale
    empty: t:wsOps.load.empty
    vm: cafeWsOps
    blocks:
      - type: toolbar
        note: "1"
        items:
          - type: select
            id: ops-section
            change: wsOpsSec
            label: t:wsOps.sections
            options:
              - from: $.sections
                item:
                  v: "@"
                  label:
                    t: workbench.opsSection
                    args: ["@"]
            value: $.cur
      - type: head
        variant: detail
        when: $.quota
        desc:
          t: wsOps.lastRefresh
          args: [$.facts.refreshedAt]
        actions:
          - type: button
            iconOnly: true
            icon: refresh
            label: t:workbench.quota.refreshAll
            act: refresh
            args: {k: quota}
      - type: each
        from: $.quota.pools
        blocks:
          - type: section
            title: "@title"
            help: "@desc"
            blocks:
              - {type: list, from: "@items", row: ops.pool}
      - type: section
        when: $.quota
        title: t:wsOps.routeRules
        help: t:wsOps.routeHelp
        blocks:
          - type: settings
            rows:
              - label: t:workbench.quota.label
                help: t:workbench.quota.help
                control:
                  type: switch
                  value: $.quota.review
                  act: toggle
                  args: {path: ws.rpReview}
                  label: t:workbench.quota.avoidOpus
              - label: t:workbench.quota.designScope
                help: t:workbench.quota.preferOpus
                control:
                  type: switch
                  value: $.quota.archive
                  act: toggle
                  args: {path: ws.rpArch}
                  label: t:workbench.quota.preferOpus
          - type: text
            variant: meta
            text:
              t: workbench.routeNote
              args: [$.quota.constrained]
      - type: section
        when: $.quota
        title: t:wsOps.usage7d
        actions:
          - type: button
            iconOnly: true
            icon: refresh
            label: t:common.refresh
            act: refresh
            args: {k: usage}
        blocks:
          - type: list
            groups: $.quota.days
            group:
              title:
                t: workbench.dailyUsageTitle
                args:
                  - "@date"
                  - t: workbench.quota.text
                    args: ["@invocations"]
              count: ""
            row: ops.usage
          - type: text
            variant: meta
            parts:
              - text:
                  t: wsOps.usageTotal
                  args:
                    - $.facts.usage.calls
                    - $.facts.usage.total
                    - $.facts.usage.input
                    - $.facts.usage.output
                    - $.facts.usage.cost
                num: true
      - type: section
        when: $.quota
        title: t:wsOps.toolUsage
        help: t:wsOps.toolUsageHelp
        blocks:
          - type: toolbar
            items:
              - type: select
                id: ws-tool-cat
                options:
                  - {v: t:memory.allCats, label: t:memory.allCats}
                  - from: $.quota.cats
                    item:
                      v:
                        t: workbench.identity
                        args: ["@name", "@handle"]
                      label:
                        t: workbench.identity
                        args: ["@name", "@handle"]
                value:
                  of: $.quota.hasToolcat
                  map: {"true": $.quota.tf, "false": t:memory.allCats, _: $.quota.hasToolcat}
                change: wsToolCat
                label: t:common.cat
              - type: select
                id: ws-tool-type
                options:
                  - {v: t:inbox.allTypes, label: t:inbox.allTypes}
                  - {v: t:wsOps.nativeTools, label: t:wsOps.nativeTools}
                  - {v: t:wsOps.mcpBridge, label: t:wsOps.mcpBridge}
                  - {v: t:wsOps.skillCalls, label: t:wsOps.skillCalls}
                value:
                  of: $.quota.hasTooltype
                  map: {"true": $.quota.tt, "false": t:inbox.allTypes, _: $.quota.hasTooltype}
                change: wsToolType
                label: t:common.type
              - type: select
                id: ws-tool-range
                options:
                  - {v: t:wsOps.last7d, label: t:wsOps.last7d}
                  - {v: t:wsOps.last14d, label: t:wsOps.last14d}
                  - {v: t:wsOps.last30d, label: t:wsOps.last30d}
                  - {v: t:wsOps.last90d, label: t:wsOps.last90d}
                  - {v: t:common.all, label: t:common.all}
                value:
                  of: $.quota.hasToolrange
                  map: {"true": $.quota.tr, "false": t:wsOps.last7d, _: $.quota.hasToolrange}
                change: wsToolRange
                label: t:common.time
              - type: button
                iconOnly: true
                icon: refresh
                label: t:common.refresh
                act: refresh
                args: {k: toolLog}
          - type: stats
            from:
              - v: $.quota.toolStats.total
                l: t:workbench.quota.totalInvocations
                format: number
              - v: $.quota.toolStats.native
                l:
                  t: workbench.quota.nativeShare
                  args: [$.quota.toolStats.nativeShare]
                format: number
              - v: $.quota.toolStats.mcp
                l:
                  t: workbench.quota.mcpShare
                  args: [$.quota.toolStats.mcpShare]
                format: number
              - v: $.quota.toolStats.skill
                l:
                  t: workbench.quota.skillShare
                  args: [$.quota.toolStats.skillShare]
                format: number
          - type: component
            use: bars
            props:
              label: t:workbench.quota.dailyTrend
              from: $.quota.bars
              item:
                label:
                  of: "@date"
                  slice: [8]
                tip:
                  t: workbench.quota.usageBreakdown
                  args:
                    - of: "@date"
                      slice: [5]
                    - "@value"
                    - "@native"
                    - "@mcp"
                    - "@skill"
          - type: each
            from:
              - {}
            item:
              groups:
                - kind: tools
                  items:
                    - from: $.quota.tools
                      item: {tool: true}
                - {kind: cats, items: $.quota.toolCats}
            blocks:
              - type: list
                groups: "@groups"
                group:
                  title:
                    t: workbench.toolGroup
                    args: ["@kind"]
                  count: ""
                row: ops.toolUsage
      - type: toolbar
        when: $.lb
        items:
          - type: seg
            value:
              of: $.lb.hasRange
              map: {"true": $.lb.range, "false": t:common.all, _: $.lb.hasRange}
            options:
              - {v: t:common.all, label: t:common.all}
              - {v: t:system.days7, label: t:system.days7}
              - {v: t:system.days30, label: t:system.days30}
            act: set
            args: {path: ws.lbRange}
      - type: section
        when: $.lb
