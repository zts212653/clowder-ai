                blocks:
                  - type: list
                    id: cafeMemTop
                    from: $.recall.top
                    row:
                      layout: line
                      lead: {text: "@rank", num: true, variant: meta}
                      title: "@title"
                      cols:
                        - {v: "@hits", w: num, tip: t:memory.recallCount}
          - type: toolbar
            when: $.brakes
            items:
              - type: seg
                value: $.brakes.range
                act: set
                args: {path: cs.m.brakeRange}
                options:
                  - {v: "7", label: t:memory.last7d}
                  - {v: "30", label: t:memory.last30d}
                  - {v: "90", label: t:memory.last90d}
                  - {v: all, label: t:memory.allTime}
              - type: seg
                variant: tabs
                from: $.brakes.words
                item:
                  label:
                    of: "@v"
                    map: {all: t:common.all, _: "@v"}
                act: set
                args: {path: cs.m.brakeWord}
              - type: each
                from:
                  - {}
                item:
                  help:
                    - from: $.brakes.magicHelp
                      item:
                        t: chat.magicWord
                        args: ["@word", "@meaning", "@action"]
                blocks:
                  - type: text
                    help: {of: "@help", sep: "\n"}
          - type: split
            variant: aside
            when: $.brakes
            left:
              - type: list
                id: mem-brakes
                from: $.brakes.items
                row:
                  layout: two
                  key: "@k"
                  act: set
                  args: {path: cs.m.brakeSel, v: "@k"}
                  cur: "@cur"
                  title:
                    text:
                      t: memoryOwners.brakes.title
                      args: ["@word", "@name", "@handle", "@date"]
                  sub: "@q"
              - type: box
                load: $.brakes.load
                error: t:frame.loadError
                retry: {act: cafeBrakesMore}
                blocks: []
              - type: toolbar
                items:
                  - type: button
                    label: t:memory.moreBrakes
                    act: cafeBrakesMore
                    when: $.brakes.hasMore
                    disabled: $.brakes.loading
            right:
              - type: section
                title: t:memory.brakeDetail
                when: $.brakes.sel
                blocks:
                  - type: each
                    from:
                      - {}
                    item:
                      fields:
                        - {field: brakeQuote, value: $.brakes.sel.quote}
                        - {field: brakeAction, value: "", faint: true}
                        - {field: brakeRule, value: $.brakes.sel.rule}
                    blocks:
                      - type: kv
                        from: "@fields"
                        item:
                          label:
                            of: "@field"
                            map:
                              type: t:common.type
                              occurredAt: t:memoryOwners.field.occurredAt
                              duration: t:memoryOwners.field.duration
                              topic: t:memoryOwners.topic
                              uncertainty: t:memoryOwners.uncertain
                              aliases: t:memoryOwners.aliases
                              asOf: t:memoryOwners.field.asOf
                              openingMode: t:memoryOwners.openingMode
                              stance: t:memoryOwners.stance
                              takeaway: t:memoryOwners.takeaway
                              quotes: t:memoryOwners.quotes
                              brakeQuote: t:memoryOwners.quotes
                              brakeAction: t:memoryOwners.field.brakeAction
                              brakeRule: t:memoryOwners.field.brakeRule
                              why: t:memoryOwners.field.why
                              after: t:skill.content
                              advice: t:memoryOwners.field.advice
                              goal: t:memoryOwners.field.goal
                              _: "@field"
                          value: {$frag: CAFE_MEMORY_VALUE}
                  - type: toolbar
                    items:
                      - type: button
                        link: true
                        label: t:memory.viewSource
                        act: msgJump
                        args: {mid: $.brakes.sel.mid, t: $.brakes.sel.thread}
                        when: $.brakes.sel.canOpen
          - type: notice
            tone: warn
            when: $.library.error
            text: $.library.error
          - type: split
            variant: aside
            when: $.library
            left:
              - type: section
                title:
                  t: memoryOwners.libraries.candTitle
                  args: [$.library.candidateCount]
                keep: true
                actions:
                  - type: seg
                    value: $.library.tab
                    options:
                      - {v: pending, label: t:memoryOwners.libraries.label}
                      - {v: done, label: t:inbox.tabs.handled}
                    act: set
                    args: {path: cs.m.lib}
                blocks:
                  - type: list
                    id: mem-cands
                    when: $.library.pending
                    from: $.library.cands
                    empty: t:memory.nothingToCollect
                    row:
                      layout: two
                      key: "@id"
                      title: "@title"
                      sub:
                        - text:
                            of: "@state"
                            map:
                              unavailable: t:memoryOwners.stateNote.unavailable
                              pending_approval: t:memoryOwners.stateNote.pending
                              not_now: t:memoryOwners.stateNote.not_now
                              partially_materialized: t:memoryOwners.stateNote.partially_materialized
                              materialized: t:memoryOwners.stateNote.materialized
                              withdrawn: t:memoryOwners.stateNote.withdrawn
                              active: t:memoryOwners.state.active
                              current: t:memoryOwners.state.current
                              retired: t:memoryOwners.stateNote.retired
                              pending: t:memoryOwners.stateNote.pending
                              approving: t:memoryOwners.stateNote.approving
                              approved: t:memoryOwners.stateNote.approved
                              rejected: t:memoryOwners.stateNote.rejected
                              applied: t:memoryOwners.stateNote.applied
                              replayed: t:memoryOwners.stateNote.replayed
                              _: "@state"
                        - {lit: " · "}
                        - text:
                            t: chat.emptyValue
                            args: ["@visibility"]
                      expand:
                        - type: text
                          parts:
                            - {text: "@why"}
                        - type: notice
                          tone: warn
                          when: "@widens"
                          text:
                            t: memoryOwners.widen
                            args: ["@visibility", "@targetVisibility"]
                        - type: toolbar
                          items:
                            - {type: text, for: "@selId", text: t:memory.collectTo}
                            - type: select
                              change: cafeSel
                              id: "@selId"
                              options:
                                - {v: "", label: t:memoryOwners.chooseCollection}
                                - from: "@targets"
                                  item: {v: "@v", label: "@label"}
                              value: "@to"
                            - {type: grow}
                            - type: button
                              label: t:memory.skipCollect
                              act: setStatus
                              args: {entity: memCand, field: res, id: "@id", v: "0"}
                            - type: button
                              label: t:memory.collect
                              disabled: "@noTarget"
                              act: setStatus
                              args: {entity: memCand, field: res, id: "@id", v: "1"}
                  - type: list
                    id: cafeMemDone
                    when: "!$.library.pending"
                    from: $.library.done
                    row:
                      layout: two
                      title: "@title"
                      sub:
                        text:
                          of: "@state"
                          map:
                            unavailable: t:memoryOwners.stateNote.unavailable
                            pending_approval: t:memoryOwners.stateNote.pending
                            not_now: t:memoryOwners.stateNote.not_now
                            partially_materialized: t:memoryOwners.stateNote.partially_materialized
                            materialized: t:memoryOwners.stateNote.materialized
                            withdrawn: t:memoryOwners.stateNote.withdrawn
                            active: t:memoryOwners.state.active
                            current: t:memoryOwners.state.current
                            retired: t:memoryOwners.stateNote.retired
                            pending: t:memoryOwners.stateNote.pending
                            approving: t:memoryOwners.stateNote.approving
                            approved: t:memoryOwners.stateNote.approved
                            rejected: t:memoryOwners.stateNote.rejected
                            applied: t:memoryOwners.stateNote.applied
                            replayed: t:memoryOwners.stateNote.replayed
                            _: "@state"
                      cols:
                        - w: ctl
                          control:
                            type: button
                            label: t:wsTeam.signal.withdraw
                            act: cafeCandUndo
                            args: {id: "@id"}
                            when: "@canUndo"
                      expand:
                        - type: text
                          when: "@result"
                          parts:
                            - parts:
                                - "@result.path"
                                - " · "
                                - t: memoryOwners.indexResult
                                  args: ["@result.reindexed"]
                              sep: ""
              - type: section
                title:
                  t: memoryOwners.libraries.collTitle
                  args: [$.library.collectionCount]
                keep: true
                actions:
                  - type: button
                    iconOnly: true
                    icon: plus
                    label: t:memory.newLibrary
                    act: modal
                    args: {v: lib}
                blocks:
                  - type: list
                    id: mem-colls
                    from: $.library.colls
                    row:
                      layout: two
                      key: "@k"
                      title: "@name"
                      sub:
                        - {text: "@type"}
                        - {text: "@vis"}
                      tone:
                        of: "@rebuilding"
                        map:
                          "true": run
                          "false":
                            of: "@archived"
                            map: {"true": past, "false": "", _: "@archived"}
                          _: "@rebuilding"
                      cols:
                        - v: {of: "@docs", fmt: num}
                          w: num
                          tip: t:common.artType.file
                        - {v: "@upd", w: num, tip: t:memory.updatedAt}
                        - control:
                            type: more
                            variant: row
                            items:
                              - label: t:memory.rebuildIndex
                                act: cafeMemRebuild
                                args: {v: "@name"}
                              - label: t:memoryOwners.collection.unarchive
                                act: setStatus
                                args: {entity: coll, id: "@k", field: archived}
                                when: "@archived"
                              - label: t:memoryOwners.collection.archive
                                act: setStatus
                                args: {entity: coll, id: "@k", field: archived}
                                tone: danger
                                when: "!@archived"
                            k: "@k"
                            label: t:memory.libraryActions
                          w: icon
                      inline:
                        - text:
                            of: "@indexStatus"
                            map:
                              indexing: t:chat.indexStatus.indexing
                              ready: t:chat.indexStatus.ready
                              "": ""
                              rebuilding: t:memory.rebuilding
                              archived: t:common.status.archived
                              _: "@indexStatus"
                          variant: meta
                          when: "@indexStatus"
                      expand:
                        - type: list
                          id: "@documents.id"
                          label: t:common.artType.file
                          groups: "@documents.groups"
                          empty: t:list.empty
                          next:
                            key: "@documents.id"
                            act: set
                            args:
                              path: cs.m.docLimits.{id}
                              id: "@id"
                              add: 20
                            when: "@documents.hasMore"
                            busy: "@documents.load"
                          row:
                            layout: two
                            key: "@anchor"
                            title: "@title"
                            sub:
                              - {text: "@updatedAt"}
                              - {text: "@status"}
                            act: recallSource
                            args: {collection: "@collection", anchor: "@anchor"}
                        - type: box
                          load: "@documents.load"
                          error: t:frame.loadError
                          retry:
                            act: refresh
                            args: {k: mem-lib}
                          blocks: []
            right:
              - type: section
                title: t:memory.index
                blocks:
                  - type: stats
                    from:
                      - l: t:common.artType.file
                        v: {of: $.library.evidence.docs_count, fmt: num}
                      - l: t:memoryOwners.metric.passages
                        v: {of: $.library.evidence.passages_count, fmt: num}
                      - l: t:memoryOwners.metric.edges
                        v: {of: $.library.evidence.edges_count, fmt: num}
                      - {l: t:memory.updatedAt, v: $.library.evidence.x_demo.rebuildClock}
                  - type: list
                    id: cafeMemHealth
                    from:
                      - {metric: warnings}
                      - {metric: anchors}
                    item:
                      warnings:
                        of: "@metric"
                        map: {warnings: true, _: false}
                      anchors:
                        of: "@metric"
                        map: {anchors: true, _: false}
                      count:
                        of: "@metric"
                        map:
                          warnings: $.library.evidence.configWarnings.length
                          _: $.library.maintenance.staleAnchors
                    row:
                      layout: two
                      lead:
                        dot:
                          of: "@warnings"
                          map: {"true": warn, _: idle}
                      title:
                        - text:
                            t: memory.configReminders
                            args: ["@count"]
                          when: "@warnings"
                        - text:
                            t: memoryOwners.libraries.maintenanceCount
                            args: ["@count"]
                          when: "@anchors"
                      sub:
                        - {text: t:memoryOwners.libraries.configurationHelp, when: "@warnings"}
                        - text:
                            t: memoryOwners.libraries.brokenLinkCount
                            args: ["@count"]
                          when: "@anchors"
                  - type: toolbar
                    items:
                      - type: button
                        iconOnly: true
                        icon: refresh
                        label: t:memory.reread
                        act: refresh
                        args: {k: mem-lib}
          - type: toolbar
            when: $.graph
            form: cafeGraph
            items:
              - type: search
                id: mem-gq
                placeholder: t:memory.knowledgePlaceholder
                value: $.graph.q
                input: cafeField
                wide: true
          - type: toolbar
            when: $.graph
            items:
              - {type: text, variant: meta, text: t:memory.candidateNodes}
              - type: each
                from: $.graph.nodes
                control:
                  type: chip
                  label: "@label"
                  act: set
                  args: {path: cs.m.node, v: "@v"}
                  pressed: "@on"
          - type: split
            variant: aside
            when: $.graph
            left:
              - type: each
                from:
                  - {}
