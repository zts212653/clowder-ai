          - {type: list, from: $.lb.favorite, row: ops.rank}
      - type: section
        when: $.lb
        title: t:workbench.leaderboard.title
        blocks:
          - type: stats
            from:
              - {v: $.lb.workStats.commits, l: t:wsChanges.commit}
              - {v: $.lb.workStats.reviews, l: t:workbench.leaderboard.review}
              - {v: $.lb.workStats.bugFixes, l: t:workbench.leaderboard.fixBug}
      - type: section
        when: $.lb
        title: t:workbench.leaderboard.nightOwl
        blocks:
          - {type: list, from: $.lb.night, row: ops.rank}
      - type: section
        when: $.lb
        title: t:workbench.leaderboard.chatty
        blocks:
          - {type: list, from: $.lb.chatty, row: ops.rank}
      - type: section
        when: $.lb
        title: t:workbench.leaderboard.streak
        blocks:
          - {type: list, from: $.lb.streak, row: ops.rank}
      - type: section
