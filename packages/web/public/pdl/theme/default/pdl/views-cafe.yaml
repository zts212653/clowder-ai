              - of: $.gov.d.install
                map:
                  installed: t:market.installed
                  outdated: t:workbench.governState.outdated
                  missing: t:common.status.notInstalled
                  _: $.gov.d.install
              - $.gov.d.version
      - type: text
        variant: meta
        when: $.gov.d
        tone: ok
        text: t:wsOps.governanceReady
        help: t:wsOps.governanceHelp
      - {type: list, when: $.gov.d, from: $.gov.d.rows, row: ops.governOption}
      - type: toolbar
        when: $.gov.d
        items:
          - type: button
            label: t:wsOps.previewChanges
            act: wsGovPrev
            args: {v: add}
            disabled: $.gov.d.noneChecked
            tip:
              of: $.gov.d.noneChecked
              map: {"true": t:workbench.governDisabled.true, "false": "", _: $.gov.d.noneChecked}
          - type: button
            label: t:wsOps.previewUndo
            act: wsGovPrev
            args: {v: undo}
            disabled: $.gov.d.uninstalled
      - type: section
        when: $.gov.d.prev
