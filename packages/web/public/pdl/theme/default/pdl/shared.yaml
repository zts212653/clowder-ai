                id: f-vVar
                value: $.form.d.vVar
                placeholder: "0.3"
                input: md
                args: {k: vVar}
                mono: false
                invalid: $.form.invalid.vVar
                num: true
              foot:
                - {text: t:memberForm.access.text, tone: danger, when: $.form.invalid.vVar}
      help: t:memberForm.voiceHelp
    context:
      type: section
      id: ms-context
      title: t:memberForm.context
      keep: true
      blocks:
        - type: settings
          rows:
            - kind: field
              label: t:memberForm.fields.contextWindow
              id: f-ctxWin
              control:
                type: input
                id: f-ctxWin
                value: $.form.d.ctxWin
                placeholder: t:modeThumb.label.system
                input: md
                args: {k: ctxWin}
                mono: false
                invalid: $.form.invalid.ctxWin
                num: true
              foot:
                - text: t:memberForm.access.text
                  tone: danger
                  when: $.form.invalid.ctxWin
              help: t:memberForm.fields.contextWindowHelp
            - kind: field
              label: t:memberForm.fields.contextFullPolicy
              id: f-ctxStrat
              control:
                type: select
                id: f-ctxStrat
                value: $.form.d.ctxStrat
                change: md
                args: {k: ctxStrat}
                invalid: $.form.invalid.ctxStrat
                options:
                  - {v: handoff, label: t:memberForm.contextPolicy.ctxStrat}
                  - {v: compress, label: t:memberForm.contextPolicy.compressInPlace}
                  - {v: hybrid, label: t:memberForm.contextPolicy.compressThenHandoff}
              foot:
                - text: t:memberForm.access.text
                  tone: danger
                  when: $.form.invalid.ctxStrat
            - kind: field
              label: t:memberForm.fields.reminderThreshold
              id: f-ctxWarn
              control:
                type: range
                id: f-ctxWarn
                value: $.form.d.ctxWarn
                input: md
                args: {k: ctxWarn}
                label: t:memberForm.fields.reminderThreshold
                min: 50
                max: 100
                unit: "%"
              foot:
                - text: t:memberForm.access.text
                  tone: danger
                  when: $.form.invalid.ctxWarn
              help: t:memberForm.fields.reminderThresholdHelp
            - kind: field
              label:
                of: $.form.d.ctxStrat
                map:
                  compress: t:settingsUi.member.ctxLine.compress
                  handoff: t:settingsUi.member.ctxLine.hybrid
                  hybrid: t:settingsUi.member.ctxLine.hybrid
                  _: $.form.d.ctxStrat
              id: f-ctxLine
              control:
                type: range
                id: f-ctxLine
                value: $.form.d.ctxLine
                input: md
                args: {k: ctxLine}
                label:
                  of: $.form.d.ctxStrat
                  map:
                    compress: t:settingsUi.member.ctxLine.compress
                    handoff: t:settingsUi.member.ctxLine.hybrid
                    hybrid: t:settingsUi.member.ctxLine.hybrid
                    _: $.form.d.ctxStrat
                min: 30
                max: 100
                unit: "%"
              foot:
                - text: t:memberForm.access.text
                  tone: danger
                  when: $.form.invalid.ctxLine
              help:
                - text:
                    of: $.form.d.ctxStrat
                    map:
                      compress: t:settingsUi.member.ctxHelp.compress
                      handoff: t:settingsUi.member.ctxHelp.hybrid
                      hybrid: t:settingsUi.member.ctxHelp.hybrid
                      _: $.form.d.ctxStrat
            - kind: field
              label: t:memberForm.fields.maxCompressions
              id: f-ctxMax
              control:
                type: input
                id: f-ctxMax
                value: $.form.d.ctxMax
                placeholder: ""
                input: md
                args: {k: ctxMax}
                mono: false
                invalid: $.form.invalid.ctxMax
                num: true
              foot:
                - text: t:memberForm.access.text
                  tone: danger
                  when: $.form.invalid.ctxMax
              help: t:memberForm.fields.maxCompressionsHelp
              when: $.form.hybrid
            - kind: field
              label: t:memberForm.fields.executionStatus
              control:
                - type: status
                  tone: info
                  text: t:memberForm.fields.pendingSettings
                  when: $.form.ctxDirty
                - type: text
                  variant: meta
                  text: t:memberForm.fields.savedSettings
                  when: "!$.form.ctxDirty"
      when: "!$.form.cloud"
    advanced:
      type: section
      id: ms-advanced
      title: t:memberForm.advanced
      keep: true
      blocks:
        - type: kv
          from:
            - k: t:runtime.model
              rawLabel: $.form.preferences.modelLabel
              source: $.form.preferences.modelSource
              v:
                - {text: "@rawLabel"}
                - text:
                    of: "@source"
                    map: {$frag: MEMBER_MODEL_SOURCE}
                  tone: info
            - k: t:memberForm.fields.reasoningEffort
              rawLabel: $.form.preferences.effortLabel
              source: $.form.preferences.effortSource
              v:
                - {text: "@rawLabel"}
                - text:
                    of: "@source"
                    map: {$frag: MEMBER_MODEL_SOURCE}
                  tone: info
        - type: settings
          rows:
            - kind: field
              label: t:memberForm.fields.reasoningEffort
              id: f-effort
              control:
                - type: select
                  id: f-effort
                  value: $.form.d.effort
                  change: md
                  args: {k: effort}
                  options:
                    - {v: "", label: t:memberForm.runtime.follow}
                    - from: $.form.preferences.efforts
                      item: {v: "@value", label: "@label"}
                  when: $.form.preferences.efforts
                - type: input
                  id: f-effort
                  value: $.form.d.effort
                  input: md
                  args: {k: effort}
                  placeholder: t:memberForm.fields.clientDefault
                  when: "!$.form.preferences.efforts"
              foot:
                - text:
                    t: memberForm.runtime.inherited
                    args:
                      - of: $.form.preferences.effortSource
                        map: {$frag: MEMBER_MODEL_SOURCE}
                      - $.form.preferences.effortLabel
                  when: $.form.preferences.effortLabel
                - text: t:memberForm.runtime.invalidEffort
                  tone: danger
                  when: $.form.preferences.invalidEffort
            - kind: field
              label: t:threadSettings.speed
              id: f-speed
              control:
                type: select
                id: f-speed
                value: $.form.d.speed
                change: md
                args: {k: speed}
                invalid: $.form.invalid.speed
                options:
                  - {v: "", label: t:memberForm.contextPolicy.speed}
                  - {v: standard, label: t:memberForm.contextPolicy.speedStandard}
                  - {v: fast, label: t:memberForm.contextPolicy.speedFast}
              foot:
                - text: t:memberForm.access.text
                  tone: danger
                  when: $.form.invalid.speed
              help:
                - text:
                    of: $.form.astra
                    map: {"true": t:settingsUi.member.speedHelp.true, "false": "", _: $.form.astra}
              when: $.form.speedOn
            - kind: field
              label: t:memberForm.fields.extraCliArguments
              help: t:memberForm.fields.extraCliArgumentsHelp
              control:
                type: tags
                id: mc-args
                values: $.form.d.args
                k: args
                placeholder: --flag value
                label: t:mcpForm.fields.add
                empty: t:memberForm.fields.noExtraArguments
      when: "!$.form.cloud"
    routing:
      type: section
      id: ms-routing
      title: t:memberForm.route
      keep: true
      blocks:
        - type: list
          id: $.form.routing.list
          from: $.form.routing.rows
          row:
            layout: line
            key: "@key"
            title:
              - {text: "@st"}
              - {text: "@src", variant: meta}
            cols:
              - {v: "@t", w: date}
            expand:
              - type: text
                parts:
                  - {lit: t:memberForm.recordId}
                  - {text: "@id", mono: true}
              - type: text
                parts:
                  - {lit: t:memberForm.basis}
                  - {text: "@ev", mono: true}
          rows: 8
          load: $.form.routing.load
          error: t:memberForm.routeError
          empty: t:memberForm.routeEmpty
      note: "5"
      when: $.form.routing
      label:
        text:
          t: settingsUi.member.routing
          args:
            - $.form.on
            - t: settingsUi.member.last
              args: [$.form.last]
        pos: below
      actions:
        - type: button
          label: t:memberForm.viewInStatus
          act: open
          args: {node: team, anchor: panel}
  MEMBER_MODEL_SOURCE:
    member: t:memberForm.runtime.source.member
    client_report: t:memberForm.runtime.source.client_report
    tool_config: t:memberForm.runtime.source.tool_config
    account_config: t:memberForm.runtime.source.account_config
  INBOX_TITLE:
    t: chat.inboxTitle
    args: ["@titleKind", "@title", "@name"]
  INBOX_TIME:
    of: "@timestamp"
    map:
      "true":
        of: "@history"
        map:
          "true": {of: "@time", fmt: ago}
          _: {of: "@time", fmt: hm}
      _:
        of: "@time"
        map: {justNow: t:common.justNow, _: "@time"}
  EVO_TRACE_ITEM:
    title:
      t: workbench.point
      args: ["@x", "@y"]
    act:
      of: "@seekable"
      map: {"true": mediaSeek, "false": "", _: "@seekable"}
    args: {id: "@mediaId", at: "@seconds"}
  ACCOUNT_EXCEPTION:
    of: "@state"
    map:
      none: {of: "@usersCount", gte: 1}
      nokey: {of: "@usersCount", gte: 1}
      expired: true
      conflict: true
      login: true
      cancelled: {of: "@usersCount", gte: 1}
      _: false
  CHAT_QUOTE:
    when: "@quote"
    mid: "@quote.mid"
    from: "@quote.from"
    text:
      of: "@quote.derived"
      map:
        "true": {of: "@quote.text", max: 20}
        _: "@quote.text"
    state: "@quote.state"
    busy: "@quote.busy"
    time: "@quote.time"
  CHAT_DELIVERY:
    - from: "@delivery"
      item:
        who: "@who"
        thread: "@thread"
        title: "@title"
        state: "@state"
        live: "@live"
        time: "@time"
        mid: "@mid"
        detail: {of: "@detail", sep: " · "}
        open: "@open"
  CHAT_RICH:
