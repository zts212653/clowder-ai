nav: {cafe: nav.cafe.shell, settings: nav.settings.shell}
frags:
  refChip:
    icon:
      of: "@kind"
      map:
        missing: file
        file: file
        commit: git
        _:
          of: "@objectType"
          map: {issue: issue, _: pr}
    name:
      of: "@kind"
      map:
        missing: {of: "@reference", fmt: basename}
        file:
          parts:
            - {of: "@path", fmt: basename}
            - parts:
                - parts: [":", "@line"]
                  sep: ""
              when: "@line"
          sep: ""
        commit: "@title"
        _:
          parts:
            - parts:
                - parts: ["#", "@number"]
                  sep: ""
            - parts:
                - parts: [" ", "@title"]
                  sep: ""
              when: "@title"
          sep: ""
    tone:
      of: "@kind"
      map:
        missing: warn
        file: ""
        commit: ""
        _:
          of: "@checks"
          map:
            checksFailed: danger
            _:
              of: "@state"
              map: {closed: warn, _: ""}
    tip:
      of: "@kind"
      map:
        missing: t:chatCards.refs.missing
        file: "@absolutePath"
        commit:
          of: "@sha"
          slice: [0, 10]
        _:
          of: [0, 1, 2, 3]
          item:
            of: "@"
            map:
              "0": $.repo
              "1": "#"
              "2": $.number
              "3":
                of: $.checks
                map:
                  checksFailed:
                    of: [0, 1]
                    item:
                      of: "@"
                      map: {"0": " · ", "1": t:chatCards.refs.checksFailed}
                    sep: ""
                  _:
                    of: $.state
                    map:
                      closed:
                        of: [0, 1]
                        item:
                          of: "@"
                          map: {"0": " · ", "1": t:wsCommunity.closed}
                        sep: ""
                      _: ""
          sep: ""
    act:
      of: "@kind"
      map: {missing: "", file: fileOpen, commit: copy, _: openUrl}
    args:
      of: "@kind"
      map:
        file: {v: "@absolutePath", w: "@worktreeId"}
        commit: {v: "@sha"}
        _: {url: "@url"}
  MAIN: {anchor: main, as: cover}
  EXEC_MEMBER_ITEM:
    overview:
      - kind: usage
        when: "@currentSession.usage"
        input: "@currentSession.usage.in"
        output: "@currentSession.usage.out"
        cache: "@currentSession.cachePercent"
        cost: "@currentSession.usage.cost"
      - kind: context
        when: "@currentSession"
        hasCeiling: "@hasContext"
        used: "@context.used"
        ceiling: "@context.ceiling"
        source: "@context.source"
        pct: "@contextPercent"
        warn: "@contextWarn"
      - kind: runtime
        when: "@currentSession.runtime"
        runtimeKind: "@currentSession.runtime.kind"
        life: "@currentSession.runtime.life"
      - kind: started
        when: "@currentSession"
        created: "@currentSession.created"
        createdTimestamp: "@currentSession.createdTimestamp"
        messages: "@currentSession.msgs"
        compress: "@currentSession.compress"
        hasCompress:
          of: "@currentSession.compress"
          gte: 0
          map: {"true": true, _: false}
        compressed:
          of: "@currentSession.compress"
          gte: 1
          map: {"true": true, _: false}
    slot: ws.exec.cat
    actsCtx: {who: "@id", cur: "@hasSession", cli: "@session.cli", running: "@running"}
    expand:
      lit: {$frag: EXEC_CAT_EXPAND}
    ctx:
      of: "@hasContext"
      map:
        "true":
          label:
            t: workbench.percent
            args: ["@contextPercent"]
          tone:
            of: "@contextWarn"
            map: {"true": warn, "false": "", _: ""}
          tip:
            t: wsSessions.member.ctxTip
            args:
              - t: wsSessions.context.tip.value
                args:
                  - true
                  - {of: "@context.used", fmt: num}
                  - {of: "@context.ceiling", fmt: num}
                  - t: wsSessions.context.tip.source
                    args: ["@context.source"]
        _: null
    run:
      tone:
        of: {$frag: EXEC_RUN_STATE}
        map:
          idle: idle
          spawning: info
          streaming: info
          alive_but_silent: warn
          suspected_stall: warn
          error: danger
          _: {$frag: EXEC_RUN_STATE}
      tip:
        t: workbench.runTip
        args:
          - {$frag: EXEC_RUN_STATE}
          - {of: "@run.time", fmt: clock}
          - of: "@run.hasLast"
            map:
              "true":
                t: workbench.previousRun.true
                args: ["@run.last"]
              "false": ""
              _: "@run.hasLast"
      timer:
        of: "@running"
        map:
          "true": {of: "@run.time", fmt: clock}
          "false": ""
          _: "@running"
    tone:
      of: "@running"
      map:
        "true": run
        "false":
          of: "@current"
          map: {"true": "", "false": past, _: "@current"}
        _: "@running"
    ctl:
      - type: copy
        value:
          t: workbench.sessionNumber
          args: ["@sessionSeq"]
        v: "@sessionId"
        label: t:wsStatus.copySessionId
        tip:
          t: wsExec.session
          args: ["@sessionSeq"]
        when: "@hasSession"
    stat:
      - {text: —, tip: t:wsSessions.member.noCurrentSession, when: "!@hasSession"}
    bar:
      pct: "@contextPercent"
      tone:
        of: "@contextWarn"
        map: {"true": warn, "false": "", _: ""}
  EXEC_CAT_EXPAND:
    - type: list
      inline: true
      from: "@overview"
      row:
        layout: line
        title:
          text:
            of: "@kind"
            map:
              usage: t:wsSessions.member.overviewLabel.usage
              context: t:memberForm.context
              runtime: t:wsSessions.runtime
              started: t:wsSessions.started
              _: "@kind"
        cols:
          - v:
              parts:
                - of: "@kind"
                  map:
                    usage:
                      t: wsSessions.member.overviewValue.usage
                      args:
                        - {of: "@input", fmt: compact}
                        - {of: "@output", fmt: compact}
                        - "@cache"
                        - {of: "@cost", fmt: dec2}
                        - t: wsSessions.context.tip.value
                          args:
                            - "@hasCeiling"
                            - {of: "@used", fmt: num}
                            - {of: "@ceiling", fmt: num}
                            - t: wsSessions.context.tip.source
                              args: ["@source"]
                        - "@runtimeKind"
                        - "@life"
                        - of: "@createdTimestamp"
                          map:
                            "true": {of: "@created", fmt: ago}
                            _: "@created"
                        - "@messages"
                        - of: "@hasCompress"
                          map:
                            "false":
                              t: wsSessions.compression.value.false
                              args:
                                - t: wsSessions.compression.known
                                  args: ["@compressed", "@compress"]
                            "true":
                              t: wsSessions.compression.known
                              args: ["@compressed", "@compress"]
                            _: "@hasCompress"
                    context:
                      t: wsSessions.context.tip.value
                      args:
                        - "@hasCeiling"
                        - {of: "@used", fmt: num}
                        - {of: "@ceiling", fmt: num}
                        - t: wsSessions.context.tip.source
                          args: ["@source"]
                    runtime:
                      parts: ["@runtimeKind", " · ", "@life"]
                      sep: ""
                    started:
                      t: wsSessions.member.overviewValue.started
                      args:
                        - {of: "@input", fmt: compact}
                        - {of: "@output", fmt: compact}
                        - "@cache"
                        - {of: "@cost", fmt: dec2}
                        - t: wsSessions.context.tip.value
                          args:
                            - "@hasCeiling"
                            - {of: "@used", fmt: num}
                            - {of: "@ceiling", fmt: num}
                            - t: wsSessions.context.tip.source
                              args: ["@source"]
                        - "@runtimeKind"
                        - "@life"
                        - of: "@createdTimestamp"
                          map:
                            "true": {of: "@created", fmt: ago}
                            _: "@created"
                        - "@messages"
                        - of: "@hasCompress"
                          map:
                            "false":
                              t: wsSessions.compression.value.false
                              args:
                                - t: wsSessions.compression.known
                                  args: ["@compressed", "@compress"]
                            "true":
                              t: wsSessions.compression.known
                              args: ["@compressed", "@compress"]
                            _: "@hasCompress"
                    _: "@kind"
            w: auto
        bar:
          pct: "@pct"
          tone:
            of: "@warn"
            map: {"true": warn, "false": "", _: ""}
      optional: true
    - type: text
      parts:
        - text:
            t: wsSessions.member.ctxWarn
            args:
              - of: "@session.compressed"
                map:
                  "true": t:wsSessions.member.compressNext.true
                  "false": t:memberForm.contextPolicy.ctxStrat
                  _: "@session.compressed"
      tone: warn
      when: "@session.ctxWarn"
    - type: list
      label: t:wsSessions.plan
      count:
        t: workbench.planProgress
        args: ["@plan.doneCount", "@plan.count"]
      from: "@plan.items"
      row:
        layout: line
        lead:
          - {icon: check, size: s, when: "@done"}
          - dot:
              of: "@state"
              map: {completed: idle, in_progress: info, pending: idle, _: "@state"}
            when: "!@done"
        title: "@title"
        tone:
          of: "@done"
          map: {"true": done, "false": "", _: "@done"}
      optional: true
    - type: list
      id: "@runsId"
      label: t:wsSessions.sessions
      from: "@sessions"
      row:
        layout: line
        key: "@key"
        title:
          text:
            t: wsExec.session
            args: ["@seq"]
        inline:
          - control: {type: status, tone: info, text: t:wsExec.current}
            when: "@current"
          - text:
              t: wsSessions.sealReason
              args: ["@reason"]
            variant: meta
            when: ["@reason", "!@current"]
        cols:
          - v:
              text:
                of: "@current"
                map:
                  "true": ""
                  "false":
                    t: wsSessions.member.sessionAt.false
                    args:
                      - of: "@timestamp"
                        map:
                          "true": {of: "@at", fmt: ago}
                          _: "@at"
                  _: "@current"
            w: auto
          - control:
              - {type: copy, value: "", v: "@sid", label: t:wsStatus.copySessionId}
        expand:
          - type: list
            inline: true
            id: "@runsId"
            from: "@runs"
            item: {who: ""}
            row: exec.run
            empty: t:wsTrace.notFound
  EXEC_RUN_STATE:
    of: "@run.state"
    map:
      idle: idle
      spawning: spawning
      streaming: streaming
      alive_but_silent: alive_but_silent
      suspected_stall: suspected_stall
      error: error
      _: streaming
  LIVE_WAIT_DETAILS:
    - type: text
      tone: warn
      when:
        of: "@state"
        map:
          unknown: "1"
          ready_to_return: "@reason"
          waiting_for_update: "@reason"
          _: "@state"
      parts:
        - text:
            of: "@reason"
            map:
              deployment_evidence_unavailable:
                t: wsLive.wait.reason.label.deployment_evidence_unavailable
                args:
                  - of: "@state"
                    map:
                      unknown: t:wsLive.wait.reason.fallback.unknown
                      ready_to_return: ""
                      waiting_for_update: ""
                      _: "@state"
              deployment_evidence_incomplete:
                t: wsLive.wait.reason.label.deployment_evidence_incomplete
                args:
                  - of: "@state"
                    map:
                      unknown: t:wsLive.wait.reason.fallback.unknown
                      ready_to_return: ""
                      waiting_for_update: ""
                      _: "@state"
              deployment_match_pending_recheck:
                t: wsLive.wait.reason.label.deployment_match_pending_recheck
                args:
                  - of: "@state"
                    map:
                      unknown: t:wsLive.wait.reason.fallback.unknown
                      ready_to_return: ""
                      waiting_for_update: ""
                      _: "@state"
              "":
                of: "@state"
                map:
                  unknown: t:wsLive.wait.reason.fallback.unknown
                  ready_to_return: ""
                  waiting_for_update: ""
                  _: "@state"
              _: "@reason"
    - type: text
      parts:
        parts:
          - text:
              t: wsLive.wait.item.nextPrefix
              args: ["@ready"]
          - text:
              t: wsLive.wait.item.nextText
              args: ["@nextStep"]
        sep: ""
  CAFE_SHELL_TOOLS:
    - type: button
      variant: drawer
      iconOnly: true
      icon: menu
      label: t:chatHeader.openList
      act: toggle
      args: {path: s.navOpen}
    - type: button
      variant: reveal
      iconOnly: true
      icon: menu
      label: t:chatHeader.expandNav
      act: toggle
      args: {path: cs.navHidden}
      when: $.navHidden
  CAFE_MEMORY_VALUE:
    of:
      of: "@field"
      map:
        type: 0
        occurredAt: 1
        duration: 1
        topic: 1
        uncertainty: 1
        aliases: 1
        asOf: 1
        openingMode: 2
        stance: 1
        takeaway: 1
        quotes: 1
        brakeQuote: 1
        brakeAction: 3
        brakeRule: 1
        _: -1
    map:
      "0":
        of: "@value"
        map:
          taste: t:memoryOwners.category.taste
          profile: t:memoryOwners.layer.primer
          person: t:memoryOwners.category.person
          entity: t:memoryOwners.category.entity
          event: t:settingsUi.contribution.kind.events
          meeting: t:memoryOwners.category.meeting
          _: "@value"
      "1":
        of: "@field"
        map:
          aliases:
            t: chat.emptyValue
            args:
              - {of: "@value", sep: " · "}
          uncertainty: {of: "@value", sep: ；}
          quotes: {of: "@value", sep: "\n"}
          occurredAt:
            t: chat.emptyValue
            args:
              - of: "@value.kind"
                map: {exact: "@value.value", _: "@value.raw"}
          duration:
            t: chat.emptyValue
            args:
              - of: "@value.kind"
                map: {exact: "@value.value", _: "@value.raw"}
          topic:
            t: chat.emptyValue
            args: ["@value"]
          _: "@value"
      "2":
        of: "@usageError"
        map:
          "true": "@value"
          "false":
            of: "@value"
            map:
              enabled: t:control.enable
              onDemand: t:memoryOwners.mode.onDemand
              _: "@value"
          _: "@usageError"
      "3":
        t: memoryOwners.fieldValue.brakeAction
        args:
          - of: "@field"
            map:
              aliases:
                t: chat.emptyValue
                args:
                  - {of: "@value", sep: " · "}
              uncertainty: {of: "@value", sep: ；}
              quotes: {of: "@value", sep: "\n"}
              occurredAt:
                t: chat.emptyValue
                args:
                  - of: "@value.kind"
                    map: {exact: "@value.value", _: "@value.raw"}
              duration:
                t: chat.emptyValue
                args:
                  - of: "@value.kind"
                    map: {exact: "@value.value", _: "@value.raw"}
              topic:
                t: chat.emptyValue
                args: ["@value"]
              _: "@value"
          - of: "@value"
            map:
              taste: t:memoryOwners.category.taste
              profile: t:memoryOwners.layer.primer
              person: t:memoryOwners.category.person
              entity: t:memoryOwners.category.entity
              event: t:settingsUi.contribution.kind.events
              meeting: t:memoryOwners.category.meeting
              _: "@value"
          - of: "@usageError"
            map:
              "true": "@value"
              "false":
                of: "@value"
                map:
                  enabled: t:control.enable
                  onDemand: t:memoryOwners.mode.onDemand
                  _: "@value"
              _: "@usageError"
      _: "@field"
  INBOX_DECISION:
    act: fold
    args: {path: cs.ib.open, v: "@id"}
    titleKind: decision
    name: {of: "@from", fmt: identityHandle}
    decide: true
    ask:
      of: "@kind"
      map: {ask: true, _: false}
    slot: cafe.inbox.decide
    dl:
      - field: why
        v: "@why"
        when:
          of: "@kind"
          map: {ask: false, _: true}
      - field: after
        v: "@after"
        when:
          of: "@kind"
          map: {ask: false, _: true}
  FILM_MEDIA_BLOCKS:
    - {type: view, id: film.media, data: $.media, when: "!$.comparison"}
    - type: toolbar
      when: $.compareGroup
      items:
        - type: button
          iconOnly: true
          icon: play
          label: t:media.group.play
          act: mediaGroup
          args: {group: $.compareGroup.group, op: play}
        - type: button
          iconOnly: true
          icon: pause
          label: t:media.group.pause
          act: mediaGroup
          args: {group: $.compareGroup.group, op: pause}
        - type: select
          id: film-point
          options:
            - ["", t:media.group.point]
            - from: $.compareGroup.points
              item: ["@0", "@1"]
          value: ""
          change: mediaGroupPoint
          args: {group: $.compareGroup.group}
          label: t:media.group.point
          when: $.compareGroup.hasPoints
    - type: split
      variant: compare
      when: $.comparison
      left:
        - {type: text, variant: meta, text: $.primaryTitle}
        - {type: view, id: film.media, data: $.media}
      right:
        - {type: text, variant: meta, text: $.referenceTitle}
        - {type: view, id: film.media, data: $.comparison}
  EVO_JUDGE:
    of: $.detail.view
    map: {judge: true, _: false}
  EVO_FIELD_ITEM:
    label:
      of: "@field"
      map:
        content: "@label"
        axes: "@label"
        scope:
          t: mcp.scope
          args: ["@label"]
        reason:
          t: evolutionFlow.reason
          args: ["@label"]
        boundary:
          t: workbench.evoField.boundary
          args: ["@label"]
        choiceReason:
          t: workbench.evoField.choiceReason
          args: ["@label"]
        nextAction:
          t: guide.next
          args: ["@label"]
        observationUnit:
          t: workbench.evoField.observationUnit
          args: ["@label"]
        estimator:
          t: workbench.evoField.estimator
          args: ["@label"]
        counterexample:
          t: workbench.evoField.counterexample
          args: ["@label"]
        validity:
          t: workbench.evoField.validity
          args: ["@label"]
        collection:
          t: workbench.evoField.collection
          args: ["@label"]
        missing:
          t: workbench.evoField.missing
          args: ["@label"]
        variable:
          t: workbench.evoField.variable
          args: ["@label"]
        controls:
          t: workbench.evoField.controls
          args: ["@label"]
        holdout:
          t: workbench.evoField.holdout
          args: ["@label"]
        repeatability:
          t: workbench.evoField.repeatability
          args: ["@label"]
        confidence:
          t: workbench.evoField.confidence
          args: ["@label"]
        comparability:
          t: workbench.evoField.comparability
          args: ["@label"]
        summary:
          t: evolutionFlow.summary
          args: ["@label"]
        metric: "@label"
        comparison: "@label"
        _: "@field"
    v:
      parts:
        - parts: "@value"
          sep: ；
          each: {text: "@"}
          when: "@multiple"
        - parts:
            - of: "@field"
              map:
                content: "@value"
                axes:
                  parts: ["@axis", " · ", "@unit"]
                  sep: ""
                scope: "@value"
                reason: "@value"
                boundary: "@value"
                choiceReason: "@value"
                nextAction: "@value"
                observationUnit: "@value"
                estimator: "@value"
                counterexample: "@value"
                validity: "@value"
                collection: "@value"
                missing: "@value"
                variable: "@value"
                controls: "@value"
                holdout: "@value"
                repeatability: "@value"
                confidence: "@value"
                comparability: "@value"
                summary: "@value"
                metric:
                  of: "@measured"
                  map:
                    "true":
                      parts: ["@value", " ", "@unit"]
                      sep: ""
                    "false": —
                    _: "@measured"
                comparison:
                  parts:
                    - of: "@leftMeasured"
                      map: {"true": "@left", "false": —, _: "@leftMeasured"}
                    - " → "
                    - of: "@rightMeasured"
                      map: {"true": "@right", "false": —, _: "@rightMeasured"}
                    - " "
                    - "@unit"
                  sep: ""
                _: "@field"
          when: "!@multiple"
      sep: ""
  EVO_CASES:
    - $.detail.exploration.selectedExperiment
    - of: $.detail.exploration.compare.hasError
      map: {"false": false, _: true}
  EVO_HIST:
    of: $.detail.view
    map: {hist: true, _: false}
  CHAT_SYS_MARKDOWN:
    - from: "@commands"
      item:
        t: chat.helpLine
        args:
          - "@command"
          - of: "@command"
            map:
              /help: t:chat.commands.description./help
              /config: t:chat.commands.description./config
              /config set: t:chat.commands.description./config set
              /remember: t:chat.commands.description./remember
              /recall: t:chat.commands.description./recall
              /approve: t:chat.commands.description./approve
              /archive: t:chat.commands.description./archive
              /evidence: t:chat.commands.description./evidence
              /reflect: t:chat.commands.description./reflect
              /tasks extract: t:chat.commands.description./tasks extract
              /vote: t:chat.commands.description./vote
              /game werewolf: t:workbench.commands.startWerewolf
              /signals: inbox · search · sources · stats
              /thread: t:chat.commands.description./thread
              /file: t:chat.commands.description./file
              _: "@command"
    - of: "@command"
      map:
        help: ""
        vote: "@question"
        voteStatus: ""
        noVote: ""
        remember: ""
        recall:
          t: chat.commands.body.recall
          args:
            - "@question"
            - "@count"
            - of: "@sendMode"
              map:
                queue: t:composer.sendMode.queue
                steer: t:queue.send.steerReply
                _: "@sendMode"
            - t: gameLobby.dialog.board
              args: ["@board"]
            - of: "@mode"
              map:
                player: t:gameLobby.mode.player
                standard: t:gameLobby.mode.player
                _: "@mode"
            - of: "@voice"
              map: {"true": t:chat.gameVoice.true, "false": "", _: "@voice"}
        configSet: ""
        config:
          t: chat.commands.body.config
          args:
            - "@question"
            - "@count"
            - of: "@sendMode"
              map:
                queue: t:composer.sendMode.queue
                steer: t:queue.send.steerReply
                _: "@sendMode"
            - t: gameLobby.dialog.board
              args: ["@board"]
            - of: "@mode"
              map:
                player: t:gameLobby.mode.player
                standard: t:gameLobby.mode.player
                _: "@mode"
            - of: "@voice"
              map: {"true": t:chat.gameVoice.true, "false": "", _: "@voice"}
        tasks: ""
        evidence:
          t: chat.commands.body.evidence
          args:
            - "@question"
            - "@count"
            - of: "@sendMode"
              map:
                queue: t:composer.sendMode.queue
                steer: t:queue.send.steerReply
                _: "@sendMode"
            - t: gameLobby.dialog.board
              args: ["@board"]
            - of: "@mode"
              map:
                player: t:gameLobby.mode.player
                standard: t:gameLobby.mode.player
                _: "@mode"
            - of: "@voice"
              map: {"true": t:chat.gameVoice.true, "false": "", _: "@voice"}
        reflect: ""
        approve: ""
        archive: ""
        unknown: ""
        game:
          t: chat.commands.body.game
          args:
            - "@question"
            - "@count"
            - of: "@sendMode"
              map:
                queue: t:composer.sendMode.queue
                steer: t:queue.send.steerReply
                _: "@sendMode"
            - t: gameLobby.dialog.board
              args: ["@board"]
            - of: "@mode"
              map:
                player: t:gameLobby.mode.player
                standard: t:gameLobby.mode.player
                _: "@mode"
            - of: "@voice"
              map: {"true": t:chat.gameVoice.true, "false": "", _: "@voice"}
        _: ""
      when:
        of: "@command"
        map: {help: false, _: true}
  QUEUE_TARGET_STATE:
    of: "@failure.acceptance"
    map:
      unknown:
        of: "@dispatch.inputRead.status"
        map: {read: read_uncertain, _: uncertain}
      not_accepted: failed
      _:
        of: "@dispatch.appendAcceptance"
        map:
          pending: confirming
          written:
            of: "@dispatch.inputRead.status"
            map: {read: read_wait, _: written}
          _:
            of: "@dispatch.inputRead.status"
            map: {read: read, _: delivered}
  CHAT_POP_BACK_HEADER:
    of: $.from.kind
    map:
      plus:
        of: $.from.subpage
        map:
          main: plus.main
          mode: plus.mode
          prefer: plus.prefer
          whisper: plus.whisper
          game: plus.game
          gameMode: plus.gameMode
      projPick:
        of: $.from.subpage
        map: {browse: projPick.browse, _: projPick}
      _: $.from.kind
  CHAT_POP_HEADER:
    of: $.kind
    map:
      plus:
        of: $.subpage
        map:
          main: ""
          mode: plus.mode
          prefer: plus.prefer
          whisper: plus.whisper
          game: plus.game
          gameMode: plus.gameMode
      projPick:
        of: $.subpage
        map: {browse: projPick.browse, _: projPick}
      textsel: ""
      projView: ""
      _: $.kind
  THREAD_PROJECT_OPEN:
    of: "@override"
    map:
      "true": true
      "false": false
      _:
        of: "@idle"
        map: {"true": false, _: true}
  THREAD_SECTION_ITEM:
    key: "@key"
    rows: "@rows"
    collapsed:
      of: "@head.kind"
      map:
        proj:
          of: "@override"
          map:
            "true": false
            "false": true
            _:
              of: "@idle"
              map: {"true": true, _: false}
        _: "@collapsed"
    empty:
      of: "@head.kind"
      map:
        proj:
          of: "@head.unassigned"
          map: {"true": "", _: project}
        _:
          of: $.group
          map: {pinned: pinned, favorites: favorites, _: ""}
    head:
      kind: "@head.kind"
      id: "@head.id"
      name: "@head.name"
      path: "@head.path"
      tip: "@head.path"
      n: "@head.n"
      unassigned: "@head.unassigned"
      warn: "@head.warn"
      fixed: "@head.fixed"
      peek: "@head.peek"
      sort: "@head.sort"
      open:
        of: "@head.kind"
        map:
          proj: {$frag: THREAD_PROJECT_OPEN}
          _: "@head.open"
      add:
        of: "@head.kind"
        map:
          proj:
            of: "@head.unassigned"
            map: {"true": false, _: true}
          _: false
      note:
        of: $.route
        map:
          chat:
            of: $.group
            map:
              recent:
                of: "@key"
                map: {pinned: "10", _: ""}
              _: ""
          _: ""
  REPLAY_STREAM: {type: stream, id: theater, from: $.items}
  FILE_INFO:
    type: each
    from:
      - {}
    when: $.fileInfo
    item:
      fields:
        - {field: type, value: $.fileInfo.mime, when: $.fileInfo.mime}
        - field: size
          value: $.fileInfo.size
          when:
            of: $.fileInfo.size
            map: {"0": true, _: $.fileInfo.size}
        - field: modified
          value: $.fileInfo.modifiedAt
          when: $.fileInfo.modifiedAt
        - field:
            of: $.fileInfo.pageUnit.length
            gte: 1
            map: {"true": $.fileInfo.pageUnit, _: pages}
          value: $.fileInfo.pageCount
          when: $.fileInfo.pageCount
    blocks:
      - type: kv
        from: "@fields"
        item:
          k:
            of: "@field"
            map:
              type: t:common.type
              size: t:workbench.fileInfoField.size
              modified: t:workbench.fileInfoField.modified
              pages: t:workbench.fileInfoField.pages
              slides: t:workbench.fileInfoField.slides
              sheets: t:workbench.fileInfoField.sheets
              _: "@field"
          v:
            text:
              of: "@field"
              map:
                size: {of: "@value", fmt: bytes}
                modified: {of: "@value", fmt: ago}
                _: "@value"
  WORK_CARD:
    title: "@name"
    icon: "@type"
    sub:
      t: workbench.workCardSub
      args:
        - "@memberName"
        - {of: "@at", fmt: at}
    act: workOpen
    args: {k: "@id"}
    preview:
      kind:
        of: "@cover.state"
        map: {image: image, _: "@type"}
      src:
        of: "@cover.state"
        map: {image: "@coverSource", _: "@source"}
      when:
        of: "@type"
        map: {image: true, video: true, _: false}
    actions:
      - label: t:work.openInChat
        icon: jump
        act: cafeWorkSrc
        args: {i: "@index"}
      - label: t:works.cover.title
        icon: image
        act: workCoverOpen
        args: {id: "@id"}
        when: "@cover"
  WORKS_GROUPED:
    of: $.scope
    map:
      global:
        of: $.groupVal
        map: {none: false, _: $.items.length}
      _: false
  HUB_BLOCKS:
    - type: toolbar
      items:
        - type: seg
          options:
            - {v: list, label: t:workbench.hubView.list}
            - {v: deps, label: t:workbench.hubView.deps}
            - from: $.projects
              item: {v: "@target", label: "@name"}
          value: $.view
          act: set
          args: {path: ws.boardV}
        - {type: grow}
        - type: each
          from:
            - {}
          item:
            counts:
              - {state: suggested, n: $.counts.suggested}
              - {state: dispatched, n: $.counts.dispatched}
              - {state: done, n: $.counts.done}
          control:
            type: each
            from: "@counts"
            control:
              type: text
              variant: meta
              parts:
                - dot:
                    of: "@state"
                    map:
                      open: idle
                      suggested: warn
                      approved: warn
                      dispatched: info
                      done: ok
                      _: "@state"
                - " "
                - text:
                    of: "@state"
                    map:
                      open: t:hub.state.label.open
                      suggested: t:hub.state.label.suggested
                      approved: t:memoryOwners.stateNote.approved
                      dispatched: t:wsLive.live
                      done: t:common.status.completed
                      _: "@state"
                - " "
                - {text: "@n", num: true}
        - type: button
          iconOnly: true
          icon: plus
          label: t:hub.add
          act: dialog
          args: {kind: feat}
        - type: more
          items:
            - {label: t:hub.menu.label, act: wsImportBacklog}
            - {label: t:hub.menu.importProject, act: wsImportProject}
    - type: notice
      tone: danger
      text: t:hub.summary.policy
      when: $.policy
    - type: each
      from:
        - {}
      item:
        feats:
          - {from: $.feats, item: "@"}
          - id: __done
            selected: false
            state: done
            code: ""
            name: ""
            isDone: true
            doneCount: $.done.length
            doneItems: $.done
            when: $.done.length
      blocks:
        - type: list
          id: hub
          from: "@feats"
          item:
            isDone:
              of: "@isDone"
              map: {"true": true, _: false}
            selected: false
          row:
            layout: line
            key: "@id"
            tone:
              of: "@selected"
              map:
                "true": selected
                "false":
                  of: "@state"
                  map:
                    open: ""
                    suggested: ""
                    approved: ""
                    dispatched: ""
                    done: past
                    _: "@state"
                _: "@selected"
            lead:
              dot:
                of: "@state"
                map:
                  open: idle
                  suggested: warn
                  approved: warn
                  dispatched: info
                  done: ok
                  _: "@state"
              tip:
                of: "@isDone"
                map:
                  "true": ""
                  "false":
                    of: "@state"
                    map:
                      open: t:hub.state.label.open
                      suggested: t:hub.state.label.suggested
                      approved: t:memoryOwners.stateNote.approved
                      dispatched: t:wsLive.live
                      done: t:common.status.completed
                      _: "@state"
                  _:
                    of: "@state"
                    map:
                      open: t:hub.state.label.open
                      suggested: t:hub.state.label.suggested
                      approved: t:memoryOwners.stateNote.approved
                      dispatched: t:wsLive.live
                      done: t:common.status.completed
                      _: "@state"
            title:
              - text:
                  of: "@untagged"
                  map: {"true": —, "false": "@code", _: "@untagged"}
                mono: true
                when: "@code"
              - {text: "@name", when: "!@isDone"}
              - {text: t:hub.summary.name, when: "@isDone"}
            cols:
              - v: {icon: chat, size: xs, text: "@threads", when: "@threads"}
                w: num
                tip:
                  t: hub.feature.threadsTip
                  args: ["@threads"]
                when: ["!@isDone", "@threads"]
              - v:
                  parts:
                    - of: "@isDone"
                      map:
                        "true": "@doneCount"
                        "false":
                          parts: ["@doneCount", /, "@totalCount"]
                          sep: ""
                        _: "@isDone"
                w: num
                tip:
                  t: hub.feature.progressHint
                  args: ["@isDone"]
            expand:
              - type: toolbar
                when: "@deps"
                items:
                  - type: each
                    from: "@deps"
                    control:
                      type: chip
                      kind: "@id"
                      label:
                        of: "@kind"
                        map:
                          from: t:hub.evolvedFrom
                          block: t:hub.blocked
                          rel: t:hub.related
                          _: "@kind"
                      act:
                        of: "@known"
                        map: {"true": featOpen, _: null}
                      args: {k: "@id"}
                      tip:
                        of: "@known"
                        map:
                          "true":
                            t: hub.feature.dependencyTip.true
                            args:
                              - of: "@kind"
                                map:
                                  from: t:hub.evolvedFrom
                                  block: t:hub.blocked
                                  rel: t:hub.related
                                  _: "@kind"
                              - "@id"
                          "false":
                            t: hub.feature.dependencyTip.false
                            args:
                              - of: "@kind"
                                map:
                                  from: t:hub.evolvedFrom
                                  block: t:hub.blocked
                                  rel: t:hub.related
                                  _: "@kind"
                              - "@id"
                          _: "@known"
              - type: text
                from: "@phases"
                parts:
                  - {text: "@label"}
                  - text:
                      of: "@hasPct"
                      map:
                        "true":
                          t: workbench.percent
                          args: ["@pct"]
                        "false": —
                        _: "@hasPct"
                    num: true
                tip:
                  t: hub.feature.acceptance
                  args:
                    - {of: "@criteria", sep: ；}
                when: "@phases"
              - type: list
                id: "@listId"
                from: "@items"
                row:
                  layout: record
                  key: "@id"
                  tone:
                    of: "@selected"
                    map:
                      "true": selected
                      "false":
                        of: "@state"
                        map:
                          open: ""
                          suggested: ""
                          approved: ""
                          dispatched: ""
                          done: past
                          _: "@state"
                      _: "@selected"
                  lead:
                    dot:
                      of: "@state"
                      map:
                        open: idle
                        suggested: warn
                        approved: warn
                        dispatched: info
                        done: ok
                        _: "@state"
                    tip:
                      of: "@state"
                      map:
                        open: t:hub.state.label.open
                        suggested: t:hub.state.label.suggested
                        approved: t:memoryOwners.stateNote.approved
                        dispatched: t:wsLive.live
                        done: t:common.status.completed
                        _: "@state"
                  title: "@t"
                  cols:
                    - v:
                        text:
                          of: "@pri"
                          map: {p0: P0, p1: P1, p2: P2, p3: P3, _: "@pri"}
                        variant: badge
                        tone:
                          of: "@pri"
                          map: {p0: danger, p1: warn, p2: "", p3: "", _: "@pri"}
                      w: icon
                      tip:
                        t: hub.item.priTip
                        args:
                          - of: "@pri"
                            map: {p0: P0, p1: P1, p2: P2, p3: P3, _: "@pri"}
                    - v: {who: "@lease", form: avatar, when: "@lease"}
                      w: icon
                      tip:
                        t: hub.item.leaseTip
                        args:
                          - "@leaseName"
                          - of: "@hasLeaseExpiryMinutes"
                            map:
                              "true":
                                t: workbench.leaseExpiry.true
                                args: ["@leaseExpiryMinutes", "@leaseExpiry"]
                              "false": "@leaseExpiry"
                              _: "@hasLeaseExpiryMinutes"
                      when: "@lease"
                  act: fold
                  args: {path: ws.hbItem, v: "@id"}
                optional: true
              - type: list
                id: hub-done
                from: "@doneItems"
                row:
                  layout: record
                  title:
                    - {text: "@id", mono: true}
                    - {text: "@name"}
                  cols:
                    - v: "@n"
                      w: num
                      tip:
                        t: hub.summary.nTip
                        args: ["@n"]
                optional: true
              - type: toolbar
                when: "@sel"
                items:
                  - type: seg
                    value: "@sel.view"
                    options:
                      - {v: sug, label: t:hub.detail.label}
                      - {v: sop, label: SOP}
                      - {v: threads, label: t:hub.detail.threadStatus}
                    act: set
                    args: {path: ws.hbView}
              - type: text
                parts:
                  - {text: "@sel.sum"}
                when: "@sel.sum"
              - type: kv
                when:
                  of: "@sel.view"
                  map: {sug: true, _: false}
                from:
                  - k: t:common.state
                    v:
                      of: "@sel.state"
                      map:
                        open:
                          of: "@sel.state"
                          map:
                            open: t:hub.state.label.open
                            suggested: t:hub.state.label.suggested
                            approved: t:memoryOwners.stateNote.approved
                            dispatched: t:wsLive.live
                            done: t:common.status.completed
                            _: "@sel.state"
                        suggested:
                          t: workbench.hubState.suggested
                          args:
                            - of: "@sel.state"
                              map:
                                open: t:hub.state.label.open
                                suggested: t:hub.state.label.suggested
                                approved: t:memoryOwners.stateNote.approved
                                dispatched: t:wsLive.live
                                done: t:common.status.completed
                                _: "@sel.state"
                        approved:
                          of: "@sel.state"
                          map:
                            open: t:hub.state.label.open
                            suggested: t:hub.state.label.suggested
                            approved: t:memoryOwners.stateNote.approved
                            dispatched: t:wsLive.live
                            done: t:common.status.completed
                            _: "@sel.state"
                        dispatched:
                          of: "@sel.state"
                          map:
                            open: t:hub.state.label.open
                            suggested: t:hub.state.label.suggested
                            approved: t:memoryOwners.stateNote.approved
                            dispatched: t:wsLive.live
                            done: t:common.status.completed
                            _: "@sel.state"
                        done:
                          of: "@sel.state"
                          map:
                            open: t:hub.state.label.open
                            suggested: t:hub.state.label.suggested
                            approved: t:memoryOwners.stateNote.approved
                            dispatched: t:wsLive.live
                            done: t:common.status.completed
                            _: "@sel.state"
                        _: "@sel.state"
                  - k: t:common.create
                    v:
                      of: "@sel.createdBy"
                      map: {user: t:common.you, system: "@sel.createdBy", _: "@sel.creatorName"}
                  - k: t:hub.detail.suggestedMember
                    v:
                      t: workbench.memberName
                      args: ["@sel.suggestion.catName", "@sel.suggestion.catHandle"]
                    when: "@sel.suggestion"
                  - {k: t:hub.detail.reason, v: "@sel.suggestion.why", when: "@sel.suggestion"}
                  - {k: t:wsSessions.plan, v: "@sel.suggestion.plan", when: "@sel.suggestion"}
                  - k: t:hub.detail.stage
                    v:
                      of: "@sel.suggestion.phase"
                      map:
                        coding: t:wsItems.notifications.phase
                        research: t:hub.detail.phase.research
                        brainstorm: t:hub.detail.phase.brainstorm
                        _: "@sel.suggestion.phase"
                    when: "@sel.suggestion"
                  - k: t:hub.detail.decision
                    v:
                      t: workbench.hubDecision
                      args:
                        - of: "@sel.suggestion.status"
                          map:
                            approved: t:memoryOwners.stateNote.approved
                            rejected: t:memoryOwners.stateNote.rejected
                            _: "@sel.suggestion.status"
                        - of: "@sel.suggestion.by"
                          map: {user: t:common.you, _: "@sel.suggestion.by"}
                        - of: "@sel.suggestion.timestamp"
                          map:
                            "true": {of: "@sel.suggestion.at", fmt: ago}
                            _: "@sel.suggestion.at"
                        - of: "@sel.suggestion.hasNote"
                          map:
                            "true":
                              t: workbench.noteSuffix.true
                              args: ["@sel.suggestion.note"]
                            "false": ""
                            _: "@sel.suggestion.hasNote"
                    when: "@sel.suggestion.decided"
                  - k: t:hub.detail.assignedTo
                    v:
                      of: "@sel.hasThread"
                      map:
                        "true": "@sel.threadTitle"
                        "false": t:hub.detail.missingThread
                        _: "@sel.hasThread"
                    act:
                      of: "@sel.hasThread"
                      map: {"true": goThread, _: ""}
                    args: {id: "@sel.thread"}
                    warn:
                      of: "@sel.hasThread"
                      map: {"true": false, _: true}
                    when: "@sel.dispatched"
                  - k: t:hub.detail.claim
                    v:
                      of: "@sel.hasLease"
                      map:
                        "true":
                          t: workbench.hubLease.true
                          args:
                            - "@sel.leaseData.name"
                            - of: "@sel.leaseData.hasMinutes"
                              map:
                                "true":
                                  t: workbench.leaseExpiry.true
                                  args: ["@sel.leaseData.expMinutes", "@sel.leaseData.exp"]
                                "false": "@sel.leaseData.exp"
                                _: "@sel.leaseData.hasMinutes"
                            - of: "@sel.leaseData.beatTimestamp"
                              map:
                                "true": {of: "@sel.leaseData.beat", fmt: ago}
                                _: "@sel.leaseData.beat"
                        "false":
                          t: skillPreview.none
                          args:
                            - "@sel.leaseData.name"
                            - of: "@sel.leaseData.hasMinutes"
                              map:
                                "true":
                                  t: workbench.leaseExpiry.true
                                  args: ["@sel.leaseData.expMinutes", "@sel.leaseData.exp"]
                                "false": "@sel.leaseData.exp"
                                _: "@sel.leaseData.hasMinutes"
                            - of: "@sel.leaseData.beatTimestamp"
                              map:
                                "true": {of: "@sel.leaseData.beat", fmt: ago}
                                _: "@sel.leaseData.beat"
                        _: "@sel.hasLease"
                    when: "@sel.dispatched"
              - type: toolbar
                when:
                  of: "@sel.view"
                  map: {sug: true, _: false}
                items:
                  - type: button
                    label: t:hub.suggestClaim
                    act: hbSuggest
                    args: {f: "@sel.f", k: "@sel.k"}
                    when: "@sel.canSuggest"
                  - type: button
                    primary: true
                    label: t:hub.approveDispatch
                    act: hbApprove
                    args: {f: "@sel.f", k: "@sel.k"}
                    when: "@sel.canApprove"
                  - type: button
                    label: t:common.reject
                    act: hbReject
                    args: {f: "@sel.f", k: "@sel.k"}
                    when: "@sel.canApprove"
                  - type: button
                    primary: true
                    label: t:hub.retryDispatch
                    act: hbApprove
                    args: {f: "@sel.f", k: "@sel.k"}
                    when: "@sel.canRetry"
                  - type: button
                    iconOnly: true
                    icon: clock
                    label: t:hub.renewLease
                    act: setStatus
                    args: {entity: hbItem, id: "@sel.id", field: lease, v: beat}
                    when: "@sel.hasLease"
                  - type: button
                    iconOnly: true
                    icon: release
                    label: t:hub.releaseLease
                    act: setStatus
                    args: {entity: hbItem, id: "@sel.id", field: lease, v: release}
                    when: "@sel.hasLease"
                  - type: button
                    icon: key
                    label: t:hub.takeLease
                    act: dialog
                    args: {kind: hbSelfClaim, f: "@sel.f", k: "@sel.k"}
                    when: "@sel.canSelfClaim"
                  - type: button
                    iconOnly: true
                    icon: more
                    label: t:common.moreActions
                    args: {k: "@sel.id"}
                    items:
                      - label: t:hub.reclaimLease
                        act: hbReclaim
                        args: {id: "@sel.k"}
                    when: "@sel.canReclaim"
              - type: each
                from:
                  - {}
                when: "@sel.sop"
                item:
                  steps:
                    - i: 0
                      on:
                        of: "@sel.sop.stage"
                        map: {"0": true, _: false}
                      done: {of: "@sel.sop.stage", gte: 1}
                    - i: 1
                      on:
                        of: "@sel.sop.stage"
                        map: {"1": true, _: false}
                      done: {of: "@sel.sop.stage", gte: 2}
                    - i: 2
                      on:
                        of: "@sel.sop.stage"
                        map: {"2": true, _: false}
                      done: {of: "@sel.sop.stage", gte: 3}
                    - i: 3
                      on:
                        of: "@sel.sop.stage"
                        map: {"3": true, _: false}
                      done: {of: "@sel.sop.stage", gte: 4}
                    - i: 4
                      on:
                        of: "@sel.sop.stage"
                        map: {"4": true, _: false}
                      done: {of: "@sel.sop.stage", gte: 5}
                    - i: 5
                      on:
                        of: "@sel.sop.stage"
                        map: {"5": true, _: false}
                      done: {of: "@sel.sop.stage", gte: 6}
                    - i: 6
                      on:
                        of: "@sel.sop.stage"
                        map: {"6": true, _: false}
                      done: {of: "@sel.sop.stage", gte: 7}
                blocks:
                  - type: steps
                    variant: progress
                    from: "@steps"
                    item:
                      label:
                        t: workbench.sopStage
                        args: ["@i"]
              - type: kv
                when: "@sel.sop"
                from:
                  - k: t:hub.detail.baton
                    v:
                      t: workbench.baton
                      args: ["@sel.sop.batonName", "@sel.sop.batonHandle", "@sel.sop.skill"]
                  - {k: t:hub.detail.focus, v: "@sel.sop.focus"}
              - type: text
                sep: ""
                from: "@sel.sop.checks"
                parts:
                  - dot:
                      of: "@state"
                      map:
                        verified: ok
                        unknown: warn
                        unverified: idle
                        failed: idle
                        _: "@state"
                    tip: "@state"
                  - {text: "@label"}
                tip: "@state"
                when: "@sel.sop"
              - type: text
                parts:
                  - text:
                      t: hub.detail.updated
                      args: ["@sel.sop.at", "@sel.sop.by"]
                when: "@sel.sop"
              - type: empty
                text: t:hub.noSop
                when:
                  - of: "@sel.view"
                    map: {sop: true, _: false}
                  - "!@sel.sop"
              - type: list
                id: "@sel.threadsId"
                from: "@sel.threads"
                item:
                  who: {of: "@who", item: "@id"}
                  whoTip:
                    t: hub.participants
                    args:
                      - of: "@who"
                        item:
                          t: workbench.identity
                          args: ["@name", "@handle"]
                        sep: 、
                  timeTip: t:hub.lastActive
                  act: goThread
                  args: {id: "@id"}
                row: thread.row
                when:
                  - "@sel"
                  - of: "@sel.view"
                    map: {sug: false, sop: false, _: true}
                empty: t:hub.noLinkedThreads
          when:
            of: $.view
            map: {list: true, _: false}
    - type: toolbar
      when: $.deps
      items:
        - type: seg
          value: $.deps.scope
          options:
            - {v: connected, label: t:hub.dependencies.label}
            - {v: active, label: t:hub.dependencies.active}
            - {v: all, label: t:common.all}
          act: set
          args: {path: ws.depScope}
        - type: text
          text:
            t: hub.dependencies.summary
            args: [$.deps.nodes, $.deps.edges]
          variant: meta
        - {type: grow}
        - type: button
          iconOnly: true
          icon: zoomOut
          label: t:hub.zoomOut
          act: set
          args: {path: ws.zoomBy, v: "-1"}
        - type: button
          iconOnly: true
          icon: zoomIn
          label: t:hub.zoomIn
          act: set
          args: {path: ws.zoomBy, v: "1"}
        - type: button
          label: t:hub.resetZoom
          act: set
          args: {path: ws.zoomBy, v: "0"}
    - type: component
      use: graph
      props:
        nodes: $.deps.graph.nodes
        edges: $.deps.graph.edges
        zoom: $.deps.graph.zoom
        offset: $.deps.graph.offset
        label: t:hub.graph.label
        empty: t:hub.graph.empty
        pan: {act: wsPan}
        item:
          shape: card
          prefix: "@id"
          text: "@name"
          limit: 7
          tip:
            t: workbench.graphTip
            args: ["@id", "@name"]
          tone:
            of: "@state"
            map: {suggested: warn, dispatched: info, done: ok, open: idle}
          on: "@selected"
          dim: "@done"
          act: fold
          args: {path: ws.node, v: "@id"}
        edge:
          from: "@from"
          to: "@to"
          dash:
            of: "@kind"
            map: {from: "", block: 6 4, rel: 2 4}
        legend:
          items:
            - {tone: warn, label: t:hub.state.label.suggested}
            - {tone: info, label: t:wsLive.live}
            - {tone: ok, label: t:common.status.completed}
            - {tone: idle, label: t:hub.state.label.open}
          tail: t:hub.graph.tail
      when: $.deps
    - type: section
      title:
        of: [0, 1, 2]
        item:
          of: "@"
          map: {"0": $.deps.node.id, "1": " ", "2": $.deps.node.name}
        sep: ""
      when: $.deps.node
      actions:
        - type: button
          iconOnly: true
          icon: close
          label: t:common.close
          act: close
          args: {path: ws.node}
      blocks:
        - type: settings
          rows:
            - label: t:common.state
              value:
                of: $.deps.node.status
                map:
                  open: t:hub.state.label.open
                  suggested: t:hub.state.label.suggested
                  approved: t:memoryOwners.stateNote.approved
                  dispatched: t:wsLive.live
                  done: t:common.status.completed
                  _: $.deps.node.status
            - label: t:hub.evolvedFrom
              control:
                type: text
                variant: value
                parts:
                  - parts: $.deps.node.from
                    sep: 、
                    each: {text: "@"}
                    when: $.deps.node.hasFrom
                  - {text: t:common.none, when: "!$.deps.node.hasFrom"}
            - label: t:hub.blocked
              control:
                type: text
                variant: value
                parts:
                  - parts: $.deps.node.block
                    sep: 、
                    each: {text: "@"}
                    when: $.deps.node.hasBlock
                  - {text: t:common.none, when: "!$.deps.node.hasBlock"}
            - label: t:hub.related
              control:
                type: text
                variant: value
                parts:
                  - parts: $.deps.node.rel
                    sep: 、
                    each: {text: "@"}
                    when: $.deps.node.hasRel
                  - {text: t:common.none, when: "!$.deps.node.hasRel"}
            - label: t:hub.openFeature
              link: true
              act: featOpen
              args: {k: $.deps.node.id}
    - type: head
      variant: detail
      when: $.ext
      desc:
        - {text: $.ext.path, mono: true}
        - {text: · Backlog}
        - {text: $.ext.backlog, mono: true}
      actions:
        - type: button
          label: t:hub.importBacklog
          act: wsExtImport
          args: {n: $.ext.name}
    - {type: notice, text: $.ext.result, when: $.ext.result}
    - type: toolbar
      when: $.ext
      items:
        - type: select
          id: ws-ext-sec
          options:
            - {v: intent, label: t:hub.external.requirementTracking}
            - {v: health, label: t:hub.external.governanceHealth}
            - {v: features, label: t:workbench.hubView.list}
            - {v: dispatch, label: t:hub.external.dispatchProgress}
            - {v: risk, label: t:hub.external.riskAlerts}
            - {v: clarify, label: t:hub.external.clarifications}
            - {v: slice, label: t:hub.external.slicePlan}
            - {v: reflux, label: t:hub.external.feedback}
          value: $.ext.cur
          change: wsExtSec
          label: t:hub.sections
    - type: notice
      tone: warn
      text: t:hub.external.notice
      when: $.ext.intent
      action:
        type: button
        label: t:hub.editAudit
        act: dialog
        args: {kind: frame}
    - type: settings
      when: $.ext.health
      rows:
        - label: t:hub.external.documentCoverage
          value:
            of: $.ext.hasCoverage
            map:
              "true":
                of: [0, 1]
                item:
                  of: "@"
                  map: {"0": $.ext.docCoverage, "1": "%"}
                sep: ""
              "false": —
              _: $.ext.hasCoverage
        - label: t:hub.external.expiredRequirements
          value:
            t: wsTeam.list.evDesc
            args: [$.ext.staleReqs]
        - label: t:threadRow.unassigned
          value:
            t: wsTeam.list.evDesc
            args: [$.ext.untriaged]
    - type: list
      id: hub-ext
      from: $.ext.rows
      order:
        of: $.ext.canSlice
        map: {"true": hubSliceOrder, "false": "", _: $.ext.canSlice}
      row:
        layout: two
        key: "@id"
        title:
          - {text: "@title", when: "@title"}
          - text:
              t: workspaceOwners.risk
              args: ["@risk"]
            when: "@risk"
        sub:
          - {text: "@sub", when: "@sub"}
          - parts:
              - parts: ["@description", " · ", "@verifiableOutcome"]
                sep: ""
            when: "@canEditSlice"
          - parts:
              - parts: ["@insight", " · ", "@evidence"]
                sep: ""
            when: "@canDeleteReflux"
          - text: "@sourceDetail"
            when: ["@canTriage", "!@triage"]
          - text:
              t: hub.external.triage
              args:
                - "@triage.clarity"
                - "@triage.groundedness"
                - "@triage.necessity"
                - "@triage.coupling"
                - "@triage.sizeBand"
            when: "@triage"
        act: "@act"
        args: "@args"
        cols:
          - control:
              - type: status
                tone: warn
                text: t:hub.external.blocked
                when: "@blocked"
              - type: status
                tone: warn
                text:
                  of: "@severity"
                  map:
                    critical: t:workspaceOwners.severity.critical
                    high: t:wsCommunity.priority.high
                    medium: t:workspaceOwners.severity.medium
                    _: "@severity"
                when: "@severity"
              - type: status
                tone:
                  of: "@questionState"
                  map: {answered: "", open: "", escalated: warn, _: "@questionState"}
                text:
                  of: "@questionState"
                  map:
                    answered: t:chat.answer.answered
                    open: t:workspaceOwners.open
                    escalated: t:workspaceOwners.escalated
                    _: "@questionState"
                when: "@questionState"
              - type: status
                text:
                  of: "@sliceState"
                  map:
                    planned: t:schedule.todo
                    in_progress: t:schedule.doing
                    delivered: t:workspaceOwners.delivered
                    validated: t:wsEval.continuation.verified_outcome
                    _: "@sliceState"
                when: "@sliceState"
              - type: status
                text:
                  of: "@category"
                  map:
                    methodology: t:workspaceOwners.methodology
                    risk_pattern: t:workspaceOwners.risk_pattern
                    resolution_strategy: t:workspaceOwners.resolution_strategy
                    _: "@category"
                when: "@category"
              - {type: text, text: "@muted", when: "@muted"}
              - type: button
                label: t:workspaceOwners.triage
                act: wsTriage
                args: {projectId: "@projectId", cardId: "@cardId"}
                when: "@canTriage"
              - type: button
                label: t:workspaceOwners.answer
                act: clarification
                args: {kind: clarification, projectId: "@projectId", id: "@id"}
                when: "@canAnswer"
              - type: button
                label: t:common.edit
                act: slice
                args: {kind: slice, projectId: "@projectId", id: "@id"}
                when: "@canEditSlice"
          - control:
              type: more
              items:
                - label: t:workspaceOwners.detectRisks
                  act: wsRiskDetect
                  args: {projectId: "@projectId", cardId: "@cardId"}
              k: "@cardId"
              label: t:common.moreActions
            when: "@canTriage"
          - control:
              type: more
              items:
                - label: t:common.delete
                  act: wsRefluxDelete
                  tone: danger
                  args: {projectId: "@projectId", id: "@id"}
              k: "@id"
            when: "@canDeleteReflux"
      empty: t:hub.external.empty
      when: $.ext.hasRows
    - type: toolbar
      when: $.ext
      items:
        - type: button
          iconOnly: true
          icon: plus
          label: t:workspaceOwners.newSlice
          act: slice
          args: {kind: slice, projectId: $.ext.projectId}
          when: $.ext.canSlice
        - type: button
          iconOnly: true
          icon: plus
          label: t:hub.newIntent
          act: dialog
          args: {kind: intent, projectId: $.ext.projectId}
          when: $.ext.canIntent
        - type: button
          iconOnly: true
          icon: plus
          label: t:hub.recordLesson
          act: reflux
          args: {kind: reflux, projectId: $.ext.projectId}
          when: $.ext.canReflux
  WC_PICKER:
    type: picker
    icon: folder
    label: {of: $.wt.root, fmt: basename}
    tip:
      t: wsGit.worktree.tip
      args: [$.wt.root, $.wt.branch, $.wt.head]
    items:
      - {scope: t:wsGit.worktrees}
      - from: $.wt.worktrees
        item:
          label:
            t: wsGit.worktree.option
            args:
              - {of: "@root", fmt: basename}
              - "@branch"
          act: set
          args: {path: wc.wt, v: "@id"}
          cur: "@current"
  CHANGE_EXPAND:
    - type: component
      use: diff
      props:
        hunks: "@diff.hunks"
        mode: "@diff.mode"
        empty:
          of: "@st"
          map:
            ??: t:workbench.diffEmpty.??
            M: t:workbench.diffEmpty.M
            A: t:workbench.diffEmpty.M
            D: t:workbench.diffEmpty.M
            _: "@st"
  SYSTEM_DESKTOP_SECTIONS:
    general:
      type: section
      id: sys-general
      key: general
      title: t:system.general
      help: t:system.generalHelp
      open: $.help.general
      rows:
        - label: t:system.language
          ctls:
            - type: select
              id: sys-lang
              options:
                - {v: zh-Hans, label: t:system.langZhHans}
                - {v: en, label: English}
              value: $.v.lang
              label: t:system.language
              change: sysPick
              args: {k: lang}
        - label: t:system.recordDefault
          ctls:
            - type: select
              id: sys-record
              options:
                - [collapsed, t:common.collapse]
                - [expanded, t:common.expand]
              value: $.v.record
              label: t:system.recordDefault
              change: sysPick
              args: {k: record}
        - blocks:
            - type: box
              load: $.processTalk.load
              error: t:frame.loadError
              retry: {act: processTalkRead}
              blocks:
                - type: settings
                  rows:
                    - label: t:system.process.label
                      ctls:
                        - type: select
                          id: sys-process-talk
                          options:
                            - [whole, t:wsSignals.body]
                            - [record, t:wsSessions.record]
                          value: $.processTalk.mode
                          label: t:system.process.label
                          change: processTalk
        - label: t:system.sendWhileBusy
          ctls:
            - type: select
              id: sys-send
              options:
                - [current, t:system.steer]
                - [next, t:system.queueNext]
              value: $.v.send
              label: t:system.sendWhileBusy
              change: sysPick
              args: {k: send}
    notify:
      type: section
      id: sys-notify
      key: notify
      title: t:system.notify
      help: t:system.notifyHelp
      open: $.help.notify
      rows:
        - label: t:system.browserPush
          ctls:
            - type: switch
              value: $.push.subscribed
              act: pushToggle
              label: t:system.browserPush
              when: "!$.push.unavailable"
            - type: status
              text:
                of: $.push.permission
                map:
                  granted: t:system.pushConfiguration.permission.granted
                  denied: t:common.status.permissionDenied
                  default: t:system.pushConfiguration.permission.default
                  unsupported: t:settingsUi.member.hooks.unsupported
                  _: $.push.permission
              tone:
                of: $.push.permission
                map:
                  granted: ok
                  denied: warn
                  default: warn
                  unsupported: warn
                  _: $.push.permission
              when: $.push.unavailable
        - blocks:
            - type: settings
              from: $.notifyTypes
              row:
                label:
                  of: "@id"
                  map:
                    cat: t:system.catMessages
                    perm: t:system.permRequests
                    mention:
                      t: system.mentions
                      args: []
                    cron: t:settingsUi.contribution.kind.scheduler
                    signal: t:system.signalUpdates
                    _: "@id"
                control:
                  type: switch
                  value: "@value"
                  act: toggle
                  args:
                    path: s.notify.{k}
                    k: "@id"
                  label:
                    of: "@id"
                    map:
                      cat: t:system.catMessages
                      perm: t:system.permRequests
                      mention:
                        t: system.mentions
                        args: []
                      cron: t:settingsUi.contribution.kind.scheduler
                      signal: t:system.signalUpdates
                      _: "@id"
        - label: t:system.pushDiag
          ctls:
            - type: button
              label: t:system.view
              act: dialog
              args: {kind: push}
    network:
      type: section
      id: sys-network
      key: network
      title: t:system.network
      help: t:system.networkHelp
      open: $.help.network
      from: $.groups.network
      row: {$frag: SYSTEM_CONFIG_ROW}
    storage:
      type: section
      id: sys-storage
      key: storage
      title: t:system.data
      help: t:system.dataHelp
      open: $.help.storage
      from: $.groups.storage
      row: {$frag: SYSTEM_CONFIG_ROW}
      actions:
        - type: button
          label: t:system.exportMore
          act: logsExport
          args: {scope: full}
          tip: t:system.fullLog
    ttl:
      type: section
      id: sys-ttl
      key: ttl
      title: t:system.retention
      help: t:system.retentionHelp
      open: $.help.ttl
      from: $.groups.lifecycle
      row: {$frag: SYSTEM_CONFIG_ROW}
    log:
      type: section
      id: sys-log
      key: log
      title: t:system.runLogs
      help: t:system.timeoutHelp
      open: $.help.log
      from: $.groups.runtime
      row: {$frag: SYSTEM_CONFIG_ROW}
    safety:
      type: section
      id: sys-safety
      key: safety
      title: t:system.security
      help: t:system.securityHelp
      open: $.help.safety
      from: $.groups.security
      row: {$frag: SYSTEM_CONFIG_ROW}
    env:
      type: section
      id: sys-env
      key: env
      title: t:env.envVars
      help: t:system.envHelp
      open: $.help.env
      rows:
        - label: t:system.editableVars
          ctls:
            - type: text
              variant: value
              text:
                t: env.system.count
                args: [$.envCount]
            - type: button
              label: t:system.editMore
              act: open
              args: {page: env}
    update:
      type: section
      id: sys-update
      key: update
      title: t:system.desktopUpdate
      help: t:system.desktopOnly
      open: $.help.update
      rows:
        - label: t:system.autoUpdate
          ctls:
            - type: switch
              value: $.desktopAuto
              act: toggle
              args: {path: s.desktopUpdate.settings.autoCheck}
              label: t:system.autoUpdate
        - label: t:films.current
          ctls:
            - {type: text, variant: value, text: $.app.version}
            - type: button
              label: t:system.checkUpdate
              act: desktopUpdate
              args: {op: check}
        - label: t:runtime.updateVersion
          ctls:
            - {type: text, variant: value, text: $.update.version}
            - type: status
              tone: warn
              text: t:runtime.updateFailed
              when: $.update.failed
            - type: button
              primary: true
              label: t:common.download
              act: desktopUpdate
              args: {op: download}
              when: $.update.canDownload
            - type: button
              primary: true
              label: t:common.install
              act: desktopUpdate
              args: {op: install}
              when: $.update.canInstall
      blocks:
        - type: each
          from:
            - {}
          item:
            label: t:runtime.downloadProgress
            max: 100
            items:
              - from: $.update.progress
                item:
                  label:
                    t: workbench.percent
                    args: ["@percent"]
                  value: "@value"
          when: $.update.sections.progress
          blocks:
            - {type: component, use: bars, props: "@"}
      when: $.app.desktop
  SYSTEM_CONFIG_ROW:
    label: "@label"
    help:
      - {text: "@name", mono: true}
      - {br: true}
      - {text: "@description"}
      - {br: true}
      - text:
          t: system.config.defaultValue
          args: ["@defaultValue"]
    ctls:
      - type: text
        variant: value
        mono: true
        text: {$frag: SYSTEM_CONFIG_VALUE}
        when: "!@booleanSemantics"
      - type: status
        text:
          of: "@enabled"
          map:
            "true": t:system.pushConfiguration.service.true
            _: t:common.status.disabled
        when: "@booleanSemantics"
      - {type: status, text: t:settingsUi.mcp.tag.readonly, when: "@readonly"}
      - type: status
        tone: warn
        text: t:common.effectRestart
        when: "@restartRequired"
      - type: button
        iconOnly: true
        icon: reveal
        label: t:control.reveal
        act: reveal
        args:
          path:
            of: "@name"
            map:
              CAT_CAFE_DATA_DIR: $.env.dataDir
              UPLOAD_DIR: $.env.uploadDir
              TRANSCRIPT_DATA_DIR: $.env.transcriptDir
        when:
          - "@currentValue"
          - of: "@name"
            map:
              CAT_CAFE_DATA_DIR: true
              UPLOAD_DIR: true
              TRANSCRIPT_DATA_DIR: true
              _: false
  SYSTEM_CONFIG_VALUE:
    of: "@settingsGroup"
    map:
      lifecycle:
        of: "@currentValue.length"
        gte: 1
        map:
          "true":
            t: format.duration.seconds
            args:
              - {of: "@currentValue", fmt: num}
          _: "@defaultValue"
      runtime:
        of: "@name"
        map:
          CLI_TIMEOUT_MS:
            of: "@currentValue.length"
            gte: 1
            map:
              "true":
                t: system.config.milliseconds
                args:
                  - {of: "@currentValue", fmt: num}
              _: "@defaultValue"
          _: "@value"
      network:
        of: "@name"
        map: {FRONTEND_URL: $.env.frontendUrl, _: "@value"}
      storage:
        of: "@name"
        map: {TRANSCRIPT_DATA_DIR: $.env.transcriptDir, _: "@value"}
      _: "@value"
