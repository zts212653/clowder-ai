      title: t:system.data
      help: t:system.dataHelp
      open: $.help.storage
      from: $.groups.storage
      row: {$frag: SYSTEM_CONFIG_ROW}
      actions:
        - type: button
          label: t:system.exportMore
          act: logsExport
          args: {scope: full}
          tip: t:system.fullLog
    ttl:
      type: section
      id: sys-ttl
      key: ttl
      title: t:system.retention
      help: t:system.retentionHelp
      open: $.help.ttl
      from: $.groups.lifecycle
      row: {$frag: SYSTEM_CONFIG_ROW}
    log:
      type: section
      id: sys-log
      key: log
      title: t:system.runLogs
      help: t:system.timeoutHelp
      open: $.help.log
      from: $.groups.runtime
      row: {$frag: SYSTEM_CONFIG_ROW}
    safety:
      type: section
      id: sys-safety
      key: safety
      title: t:system.security
      help: t:system.securityHelp
      open: $.help.safety
      from: $.groups.security
      row: {$frag: SYSTEM_CONFIG_ROW}
    env:
      type: section
      id: sys-env
      key: env
      title: t:env.envVars
      help: t:system.envHelp
      open: $.help.env
      rows:
        - label: t:system.editableVars
          ctls:
            - type: text
              variant: value
              text:
                t: env.system.count
                args: [$.envCount]
            - type: button
              label: t:system.editMore
              act: open
              args: {page: env}
    update:
      type: section
      id: sys-update
      key: update
      title: t:system.desktopUpdate
      help: t:system.desktopOnly
      open: $.help.update
      rows:
        - label: t:system.autoUpdate
          ctls:
            - type: switch
              value: $.desktopAuto
              act: toggle
              args: {path: s.desktopUpdate.settings.autoCheck}
              label: t:system.autoUpdate
        - label: t:films.current
          ctls:
            - {type: text, variant: value, text: $.app.version}
            - type: button
              label: t:system.checkUpdate
              act: desktopUpdate
              args: {op: check}
        - label: t:runtime.updateVersion
          ctls:
            - {type: text, variant: value, text: $.update.version}
            - type: status
              tone: warn
              text: t:runtime.updateFailed
              when: $.update.failed
            - type: button
              primary: true
              label: t:common.download
              act: desktopUpdate
              args: {op: download}
              when: $.update.canDownload
            - type: button
              primary: true
              label: t:common.install
              act: desktopUpdate
              args: {op: install}
              when: $.update.canInstall
      blocks:
        - type: each
          from:
            - {}
          item:
            label: t:runtime.downloadProgress
            max: 100
            items:
              - from: $.update.progress
                item:
                  label:
                    t: workbench.percent
                    args: ["@percent"]
                  value: "@value"
          when: $.update.sections.progress
          blocks:
            - {type: component, use: bars, props: "@"}
  ADD_ACCOUNT_ITEMS:
    - {scope: t:accounts.create.group}
    - label: t:accounts.create.label
      act: accOpen
      args: {kind: acc, v: oauth}
    - label: t:accounts.create.addClaudeToken
      act: tokenOpen
      args: {kind: token}
    - label: t:accounts.create.enterApiKey
      act: accOpen
      args: {kind: acc, v: key}
    - {scope: t:accounts.create.localLoginHelp}
  CODEX_ACCOUNT_ITEMS:
    - {scope: t:accounts.codex.group}
    - from: $.accountUse
      item:
        label:
          t: settingsUi.account.switchLabel
          args: ["@using", "@name", "@count"]
        act: accSwitch
        args: {k: "@id"}
        why:
          of: "@using"
          map:
            "true":
              t: accounts.switch.toast
              args: ["@name"]
            "false": ""
            _: "@using"
  PROFILE_BODY:
    - type: box
      variant: expand
      when: "@hasBody"
      blocks:
        - type: text
          variant: para
          when: "@body.p"
          parts:
            - {text: "@body.p.ver", variant: meta}
            - {br: true}
            - {text: "@body.p.one", strong: true}
            - {br: true}
            - {lit: t:profiles.summary}
            - {text: "@body.p.l0"}
        - type: disclosure
          when: "@body.p"
          key: "@body.sigKey"
          title: t:wsTeam.routeSignals
          blocks:
            - type: text
              variant: para
              parts:
                - {lit: t:profiles.goodAt}
                - {parts: "@body.good", sep: " · "}
                - {br: true}
                - {lit: t:profiles.avoid}
                - {parts: "@body.bad", sep: " · ", tone: warn}
        - type: box
          blocks:
            - type: each
              from: "@body.obs"
              blocks:
                - type: text
                  variant: para
                  parts:
                    - {text: "@t"}
                    - {lit: " "}
                    - {text: "@at", variant: meta, when: "!@recent"}
                    - text:
                        t: settings.notifications.unshift
                        args: ["@author"]
                      variant: meta
                      when: "@recent"
        - type: box
          load: "@body.evLoad"
          blocks:
            - type: each
              from: "@body.ev"
              blocks:
                - type: text
                  variant: para
                  parts:
                    - {text: "@t", strong: true}
                    - {lit: " "}
                    - {text: "@meta", variant: meta}
                    - {br: true}
                    - {text: "@text"}
  MCP_FORM:
    type: form
    id: mcp
    blocks:
      - type: notice
        tone: danger
        strong:
          of: $.form.err
          map:
            previewRequired: t:capabilities.mcp.previewBeforeAdd
            saveFailed: t:capabilities.mcp.saveFailed
            _: $.form.err
        text: ""
        when: $.form.err
      - type: section
        title: t:ext.connection
        blocks:
          - type: settings
            rows:
              - kind: field
                label: t:common.name
                id: m-name
                req: {$frag: MCP_NEW}
                help:
                  - text:
                      of: {$frag: MCP_NEW}
                      map:
                        "true": ""
                        "false": t:settingsUi.mcp.nameHelp.false
                        _: {$frag: MCP_NEW}
                control:
                  type: input
                  id: m-name
                  value: $.form.d.name
                  placeholder: t:mcpForm.fields.serviceName
                  input: mcpDirty
                  args: {draft: name}
                  mono: true
                  ro: {$frag: MCP_EXISTING}
              - kind: field
                label: t:mcpForm.fields.transport
                control:
                  - type: seg
                    value: $.form.d.t
                    act: set
                    args: {path: s.mcpDraft.t}
                    options:
                      - {v: stdio, label: STDIO}
                      - {v: http, label: t:settingsUi.mcp.transport.http}
                    when: {$frag: MCP_NEW}
                  - type: text
                    variant: value
                    text:
                      t: settingsUi.mcp.transport
                      args: [$.form.d.t]
                    when: {$frag: MCP_EXISTING}
              - kind: field
                label: t:mcpForm.fields.parser
                when: $.form.resolver
                control: {type: text, variant: value, text: $.form.resolver, mono: true}
              - kind: field
                label: URL
                id: m-url
                req: {$frag: MCP_NEW}
                when:
                  of: $.form.d.t
                  map: {http: true, _: false}
                control:
                  type: input
                  id: m-url
                  value: $.form.d.url
                  placeholder:
                    of: {$frag: MCP_EDIT}
                    map:
                      "true": t:settingsUi.mcp.urlPh.true
                      "false": https://mcp.example.com/mcp
                      _: {$frag: MCP_EDIT}
                  input: mcpDirty
                  args: {draft: url}
                  mono: true
                  ro: $.form.ro
              - kind: field
                label: t:mcpForm.fields.headers
                when:
                  - of: $.form.d.t
                    map: {http: true, _: false}
                  - "!$.form.ro"
                control:
                  type: kvlist
                  key: headers
                  input: mcpDirty
                  eye: toggle
                  del: listOp
                  path: s.mcpDraft.{l}
                  add: t:mcpForm.fields.kv
                  rows:
                    - from: $.form.headers
                      item:
                        k: "@k"
                        v: "@v"
                        show: "@show"
                        ph:
                          of: "@saved"
                          map: {"true": t:settingsUi.mcp.valuePh.true, "false": t:kv.value, _: "@saved"}
              - kind: field
                label: t:market.detail.launchCommand
                id: m-cmd
                req:
                  of: $.form.key
                  map:
                    __new:
                      of: $.form.resolver.length
                      gte: 1
                      map: {"true": false, _: true}
                    _: false
                when:
                  of: $.form.d.t
                  map: {http: false, _: true}
                control:
                  type: input
                  id: m-cmd
                  value: $.form.d.cmd
                  placeholder:
                    of: {$frag: MCP_EDIT}
                    map:
                      "true": t:settingsUi.mcp.commandPh.true
                      "false": t:wsLive.activity.command
                      _: {$frag: MCP_EDIT}
                  input: mcpDirty
                  args: {draft: cmd}
                  mono: true
                  ro: $.form.ro
              - kind: field
                label: t:mcpForm.fields.arguments
                when:
                  - of: $.form.d.t
                    map: {http: false, _: true}
                  - $.form.ro
                control:
                  - type: text
                    variant: value
                    parts:
                      - parts: $.form.args
                        sep: " "
                        each: {text: "@v"}
                    mono: true
                    when: [$.form.ro, $.form.args]
                  - type: text
                    variant: meta
                    text: t:common.none
                    when: [$.form.ro, "!$.form.args"]
              - kind: field
                label: t:mcpForm.fields.arguments
                when:
                  - of: $.form.d.t
                    map: {http: false, _: true}
                  - "!$.form.ro"
                control:
                  type: kvlist
                  key: args
                  single: true
                  input: mcpDirty
                  del: listOp
                  path: s.mcpDraft.{l}
                  add: t:mcpForm.fields.add
                  rows:
                    - from: $.form.args
                      item:
                        v: "@v"
                        ph:
                          of: {$frag: MCP_EDIT}
                          map:
                            "true": t:settingsUi.mcp.argsPh.true
                            "false": t:mcpForm.fields.arguments
                            _: {$frag: MCP_EDIT}
              - kind: field
                label: t:env.envVars
                when:
                  of: $.form.d.t
                  map: {http: false, _: true}
                help:
                  - text:
                      of:
                        of: $.form.ro
                        map:
                          "true": managed
                          _:
                            of: $.form.key
                            map: {__new: new, _: edit}
                      map:
                        managed: t:settingsUi.mcp.envHelp.managed
                        edit: t:settingsUi.mcp.envHelp.edit
                        new: ""
                        _:
                          of: $.form.ro
                          map:
                            "true": managed
                            _:
                              of: $.form.key
                              map: {__new: new, _: edit}
                control:
                  type: kvlist
                  key: env
                  ro: $.form.ro
                  input: mcpDirty
                  eye: toggle
                  del: listOp
                  path: s.mcpDraft.{l}
                  add: t:mcpForm.fields.addEnvironmentVariable
                  rows:
                    - from: $.form.env
                      item:
                        k: "@k"
                        v: "@v"
                        show: "@show"
                        ph:
                          of: "@saved"
                          map: {"true": t:settingsUi.mcp.valuePh.true, "false": t:kv.value, _: "@saved"}
              - kind: field
                label: t:common.note
                when: {$frag: MCP_EXISTING}
                control:
                  - {type: text, variant: value, text: $.form.desc, when: $.form.desc}
                  - {type: text, variant: meta, text: t:list.noDesc, when: "!$.form.desc"}
      - type: section
        title:
          of:
            of: $.form.tools.state
            map: {ok: true, _: false}
          map:
            "true":
              t: settingsUi.mcp.toolsTitle.true
              args: [$.form.tools.total]
            "false":
              t: frame.tools
              args: [$.form.tools.total]
            _:
              of: $.form.tools.state
              map: {ok: true, _: false}
        keep: true
        actions:
          - type: status
            tone: warn
            text: $.form.tools.errorText
            when:
              - of: $.form.tools.state
                map: {error: true, _: false}
              - $.form.tools.errorText
          - type: status
            tone: warn
            text:
              t: settingsUi.mcp.probeError
              args: [$.form.tools.errorCode]
            when:
              - of: $.form.tools.state
                map: {error: true, _: false}
              - "!$.form.tools.errorText"
          - type: status
            tone: warn
            text: t:mcpForm.fields.connectionTimeout
            when:
              of: $.form.tools.state
              map: {timeout: true, _: false}
          - type: status
            tone: ok
            text: t:common.status.connected
            when:
              of: $.form.tools.state
              map: {ok: true, _: false}
          - type: button
            label:
              t: settingsUi.mcp.probeLabel
              args:
                - of: $.form.tools.state
                  map: {probing: true, _: false}
            act: mcpProbe
            disabled:
              of: $.form.tools.state
              map: {probing: true, _: false}
        blocks:
          - type: list
            id: mcp-tools
            from: $.form.tools.rows
            row:
              layout: two
              title: {text: "@name", mono: true}
              sub: "@desc"
            rows: 6
            searchable: true
            empty:
              of:
                of: $.form.tools.state
                map:
                  idle:
                    of: $.form.key
                    map: {__new: new, _: idle}
                  _: $.form.tools.state
              map:
                probing: t:settingsUi.mcp.empty.probing
                new: t:settingsUi.mcp.empty.new
                idle: t:settingsUi.mcp.empty.ok
                ok: t:settingsUi.mcp.empty.ok
                error: t:settingsUi.mcp.empty.ok
                timeout: t:settingsUi.mcp.empty.ok
                _:
                  of: $.form.tools.state
                  map:
                    idle:
                      of: $.form.key
                      map: {__new: new, _: idle}
                    _: $.form.tools.state
      - type: section
        id: mcp-preview
        title: t:mcpForm.whatChanges
        when:
          - {$frag: MCP_NEW}
          - $.form.preview
        blocks:
          - type: settings
            rows:
              - label: t:mcpForm.identifier
                ctls:
                  - {type: text, variant: value, text: $.form.d.name, mono: true}
              - label: t:mcpForm.writesCli
                help:
                  - text: ~/.claude/mcp.json · ~/.codex/config.toml · ~/.gemini/settings.json · ~/.kimi/mcp.json
                    mono: true
              - label: t:mcpForm.afterAdd
                ctls:
                  - {type: text, variant: meta, text: t:mcpForm.autoProbe}
                  - {type: status, tone: warn, text: t:mcpForm.runsAsYou}
      - type: toolbar
        when: {$frag: MCP_NEW}
        items:
          - type: button
            label: t:common.cancel
            act: open
            args: {page: mcp}
          - {type: button, label: t:wsOps.previewChanges, act: mcpPreview}
          - type: button
            primary: true
            label: t:mcpForm.confirmAdd
            submit: true
            disabled:
              of: $.form.preview
              map: {"true": false, _: true}
      - type: toolbar
        variant: savebar
        id: savebar
        when: {$frag: MCP_EDIT}
        hidden: "!$.form.dirty"
        items:
          - type: text
            text:
              t: settingsUi.mcp.save
              args: [$.form.scope]
          - {type: grow}
          - {type: button, primary: true, label: t:common.save, submit: true}
  MCP_NEW:
    of: $.form.key
    map: {__new: true, _: false}
  MCP_EXISTING:
    of: $.form.key
    map: {__new: false, _: true}
  MCP_EDIT:
    of: $.form.ro
    map:
      "true": false
      _: {$frag: MCP_EXISTING}
  MEMBER_FORM:
    type: each
    from:
      - {}
    item:
      identity: {$frag: MEMBER_DRAFT_IDENTITY}
    blocks:
      - type: box
        variant: columns
        blocks:
          - {type: toc, note: "2", when: $.form.isNew}
          - {type: toc, note: "7", when: $.form.existing}
          - type: form
            id: member
            htmlId: mform
            note: "1"
            blocks:
              - type: ordered
                order: [identity, model, ext, handles, voice, context, advanced]
                blocks: {$frag: MEMBER_SECTIONS}
                when: $.form.isNew
              - type: ordered
                order:
                  - model
                  - runtime
                  - ext
                  - handles
                  - identity
                  - voice
                  - context
                  - advanced
                  - routing
                blocks: {$frag: MEMBER_SECTIONS}
                when: $.form.existing
              - type: toolbar
                variant: savebar
                id: savebar
                hidden:
                  - "!$.form.isNew"
                  - "!$.form.save.pendingWrite"
                  - "!$.form.save.error"
                  - of: $.form.save.n
                    map: {"0": true, _: false}
                items:
                  - type: text
                    text:
                      t: memberForm.fields.unsavedChanges
                      args: [$.form.save.n]
                    when: $.form.existing
                  - type: text
                    parts:
                      - text:
                          t: settingsUi.member.missingLead
                          args: [$.form.save.missingCount]
                      - parts: $.form.save.missing
                        sep: 、
                        each:
                          text:
                            of: "@k"
                            map:
                              name: t:memberForm.fields.nickname
                              role: t:memberForm.fields.roleDescription
                              acc: t:memberForm.fields.account
                              model: t:runtime.model
                              provider: t:memberForm.fields.providerName
                              acpCmd: t:market.detail.launchCommand
                              acpArgs: t:memberForm.fields.launchArguments
                              breed: t:common.name
                              aliases:
                                t: memberForm.handle
                                args: []
                              _: "@k"
                    when: [$.form.isNew, $.form.save.missing]
                  - {type: grow}
                  - type: back
                    label: t:common.cancel
                    act: open
                    args: {page: members}
                    when: $.form.isNew
                  - type: button
                    primary: true
                    label:
                      of: $.form.save.state
                      map:
                        saving: t:memberForm.save.saving
                        checking: t:memberForm.save.checking
                        _:
                          of: $.form.save.pendingWrite.catId.length
                          gte: 1
                          map: {"true": t:memberForm.save.continue, _: t:common.add}
                    disabled:
                      of: $.form.save.state
                      map: {idle: false, _: true}
                    submit: true
                    when: $.form.isNew
                  - type: button
                    primary: true
                    label:
                      of: $.form.save.state
                      map:
                        saving: t:memberForm.save.saving
                        checking: t:memberForm.save.checking
                        _:
                          of: $.form.save.pendingWrite.catId.length
                          gte: 1
                          map: {"true": t:memberForm.save.continue, _: t:common.save}
                    disabled:
                      of: $.form.save.state
                      map: {idle: false, _: true}
                    submit: true
                    when: $.form.existing
                  - type: component
                    use: fieldError
                    when: $.form.save.error
                    props:
                      id: member-save
                      text:
                        of: $.form.save.error
                        map:
                          recovered_draft: t:memberForm.save.recoveredDraft
                          member_changed: t:memberForm.save.changed
                          member_id_changed: t:memberForm.save.idChanged
                          member_missing: t:memberForm.save.missing
                          member_write_unconfirmed: t:memberForm.save.unconfirmed
                          member_write_unavailable: t:memberForm.save.unavailable
                          configuration_revision_conflict: t:memberForm.save.changed
                          _: $.form.save.error
  MEMBER_DRAFT_IDENTITY:
    name:
      of: $.form.d.name
      map: {"": $.form.d.breed, _: $.form.d.name}
    tint: $.form.d.tint
    color: $.form.d.color
    fixedColor: $.form.d.fixedColor
  MEMBER_SECTIONS:
    model:
      type: section
      id: ms-model
      title: t:memberForm.modelAccess
      keep: true
      blocks:
        - type: notice
          strong: t:memberForm.fields.strong
          text: t:memberForm.fields.text
          when: $.form.cloud
        - type: button
          label: t:memberForm.runtime.restoreIdentity
          act: memberCloudRestore
          when:
            of: $.form.identityProtection.state
            map: {drifted: true, _: false}
        - type: component
          use: fieldError
          props: {text: $.form.save.error}
          when: [$.form.cloud, $.form.save.error]
        - type: notice
          text: t:memberForm.fields.noAccounts
          when: ["!$.form.cloud", $.form.noAccount]
          action:
            type: button
            label: t:memberForm.fields.newOrLoginAccount
            items: {$frag: ADD_ACCOUNT_ITEMS}
        - type: settings
          rows:
            - label: t:members.carriers
              control: {type: text, variant: value, text: t:memberForm.fields.value}
            - label: t:memberForm.fields.modelIdentity
              control: {type: text, variant: value, text: $.form.d.model, mono: true}
            - label: t:memberForm.fields.returnTool
              control: {type: text, variant: value, text: t:memberForm.fields.remoteMcpEnabled}
            - label: t:ext.connection
              control:
                type: button
                label: t:memberForm.fields.manageInPlugin
                act: open
                args: {page: extItem-chatgptPro}
          when: $.form.cloud
        - type: settings
          rows:
            - kind: field
              label: t:memberForm.fields.client
              id: f-client
              control:
                type: select
                id: f-client
                value: $.form.d.client
                change: md
                args: {k: client}
                invalid: $.form.invalid.client
                options:
                  - from: $.form.clients
                    item:
                      v: "@value"
                      label:
                        of: "@type"
                        map:
                          name: "@name"
                          plugin:
                            t: settingsUi.member.clientName.plugin
                            args: ["@name", "@pluginName"]
                          legacy:
                            t: settingsUi.member.clientName.legacy
                            args: ["@name", "@pluginName"]
                          cloud:
                            t: memberForm.fields.value
                            args: ["@name", "@pluginName"]
                          _: "@type"
                      why:
                        of: "@why"
                        map:
                          absent:
                            t: settingsUi.member.clientWhy.absent
                            args: ["@pluginName"]
                          off:
                            t: settingsUi.member.clientWhy.off
                            args: ["@pluginName"]
                          "": ""
                          legacy: ""
                          _: "@why"
              foot:
                - text: t:memberForm.access.text
                  tone: danger
                  when: $.form.invalid.client
              req: true
              help: t:memberForm.fields.help
            - kind: field
              label: t:members.carriers
              id: f-via
              control:
                type: select
                id: f-via
                value: $.form.d.via
                change: md
                args: {k: via}
                invalid: $.form.invalid.via
                options:
                  - from: $.form.via
                    item:
                      v: "@value"
                      label:
                        of: "@name"
                        map: {builtin: t:settingsUi.mcp.tag.builtin, _: "@name"}
                      why:
                        of: "@why"
                        map:
                          absent:
                            t: settingsUi.member.clientWhy.absent
                            args: ["@pluginName"]
                          off:
                            t: settingsUi.member.clientWhy.off
                            args: ["@pluginName"]
                          "": ""
                          legacy: ""
                          _: "@why"
              foot:
                - {text: t:memberForm.access.text, tone: danger, when: $.form.invalid.via}
                - {text: t:memberForm.fields.acpExperimental, tone: warn, when: $.form.acp}
              req: true
              when: {of: $.form.via.length, gte: 2}
            - kind: field
              label: t:memberForm.fields.account
              id: f-acc
              control:
                type: select
                id: f-acc
                value: $.form.d.acc
                change: md
                args: {k: acc}
                invalid: $.form.invalid.acc
                options:
                  - v: ""
                    label:
                      t: memberForm.fields.clientOwn
                      args: [$.form.clientName]
                  - from: $.form.accounts
