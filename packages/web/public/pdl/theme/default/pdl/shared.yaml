                  args:
                    - t: chat.rawTitle
                      args:
                        - "@rich.title"
                        - of: "@rich.rk"
                          map:
                            checklist:
                              t: chat.richDefaultTitle.checklist
                              args: ["@rich.checked", "@rich.count"]
                            html_widget:
                              t: chat.richDefaultTitle.html_widget
                              args: ["@rich.checked", "@rich.count"]
                            card: ""
                            interactive: ""
                            _: "@rich.rk"
                    - "@rich.title"
                    - "@rich.filePath"
                _: "@rich.rk"
            when: "@rich.widget"
          - type: choices
            when:
              - "@rich.pick"
              - "!@rich.pick.done"
              - of: "@rich.pick.interactiveType"
                map: {multi-select: false, _: true}
            group: "@rich.pick.group"
            from: "@rich.pick.opts"
            value: "@rich.pick.value"
            act: richPick
            args: {mid: "@rich.pick.mid", b: "@rich.pick.b"}
          - type: choices
            variant: multi
            when:
              - "@rich.pick"
              - "!@rich.pick.done"
              - of: "@rich.pick.interactiveType"
                map: {multi-select: true, _: false}
            from: "@rich.pick.opts"
            act: richPick
            args: {mid: "@rich.pick.mid", b: "@rich.pick.b"}
          - type: toolbar
            when: "@rich.pick.custom"
            items:
              - type: input
                id: "@rich.pick.custom.id"
                placeholder: "@rich.pick.custom.ph"
          - type: toolbar
            when: "@rich.pick"
