    runtime:
      type: section
      id: ms-runtime
      title: t:wsSessions.runtime
      keep: true
      blocks:
        - type: settings
          rows:
            - label: t:runtime.hooks.label
              help:
                - parts: $.form.runtime.hooks.targets
                  sep: |+
                    
                  when: "!$.form.runtime.hooks.error"
                  each:
                    parts:
                      - {text: "@name"}
                      - {text: " · "}
                      - {text: "@reason"}
              ctls:
                - type: status
                  tone:
                    of: $.form.runtime.hooks.status
                    map:
                      configured: ok
                      missing: warn
                      stale: warn
                      unsupported: warn
                      error: danger
                      _: $.form.runtime.hooks.status
                  text:
                    of: $.form.runtime.hooks.status
                    map:
                      configured: t:threadSettings.synced
                      missing: t:runtime.hooks.missing
                      stale: t:runtime.hooks.stale
                      unsupported: t:settingsUi.member.hooks.unsupported
                      error: t:common.status.error
                      _: $.form.runtime.hooks.status
                  when: "!$.form.runtime.hooks.error"
                - type: status
                  tone: danger
                  text: $.form.runtime.hooks.error
                  when: $.form.runtime.hooks.error
                - type: button
                  label: t:wsCommunity.sync
                  act: memberHooksSync
                  when: $.form.runtime.hooks.canSync
            - label: t:ext.connection
              help: $.form.runtime.connection.tip
              when: $.form.runtime.canTest
              ctls:
                - type: status
                  tone:
                    of: $.form.runtime.connection.status
                    map:
                      skipped: warn
                      ok: ok
                      error: danger
                      _: $.form.runtime.connection.status
                  text:
                    of: $.form.runtime.connection.status
                    map:
                      skipped: t:workbench.govern.skipped
                      ok: t:common.status.connected
                      error: t:runtime.connectionFailed
                      _: $.form.runtime.connection.status
                  when: $.form.runtime.connection
                - {type: button, label: t:ext.testConn, act: memberConnection}
      when: $.form.runtime
