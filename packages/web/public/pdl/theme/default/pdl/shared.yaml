                            - of: "@rich.rk"
                              map:
                                checklist:
                                  t: chat.richDefaultTitle.checklist
                                  args: ["@rich.checked", "@rich.count"]
                                html_widget:
                                  t: chat.richDefaultTitle.html_widget
                                  args: ["@rich.checked", "@rich.count"]
                                card: ""
                                interactive: ""
                                _: "@rich.rk"
                        - "@rich.title"
                        - "@rich.filePath"
                    _: "@rich.rk"
                act: cafePick
                args: {mid: "@rich.sel.mid", b: "@rich.sel.b"}
                when: "@rich.sel"
          - type: content
            html: {of: "@rich.markdown", fmt: markdown}
            when: "@rich.markdown"
          - {type: kv, from: "@rich.kv", when: "@rich.kv"}
          - {type: steps, variant: checks, from: "@rich.checks", when: "@rich.checks"}
          - {type: component, use: diff, props: "@rich.diff", when: "@rich.diff"}
          - {type: component, use: media, props: "@rich.audio", when: "@rich.audio"}
          - type: toolbar
            when: "@rich.file"
            items:
              - type: text
                parts:
                  - {glyph: file}
              - type: text
                parts:
                  - {text: "@rich.file.name", strong: true}
                  - {br: true}
                  - text:
                      t: chatRich.selection.fileSub
                      args:
                        - {of: "@rich.file.size", fmt: bytes}
                    variant: meta
                    when: "@rich.file.size"
              - {type: grow}
              - type: button
                label: t:chatRich.openWork
                act: workOpen
                args: {i: "@rich.file.work"}
                when: "@rich.file.work"
              - type: button
                iconOnly: true
                icon: download
                label: t:common.download
                act: download
                args: {source: "@rich.file.source", name: "@rich.file.name"}
                when: "@rich.file.source"
          - type: frame
            html: "@rich.widget.html"
            title:
              of:
                of: "@rich.rk"
                map:
                  card: 0
                  checklist: 0
                  html_widget: 0
                  interactive: 0
                  audio: 1
                  diff: 2
                  file: 3
                  _: -1
              map:
                "0":
                  t: chat.rawTitle
                  args:
                    - "@rich.title"
                    - of: "@rich.rk"
                      map:
                        checklist:
                          t: chat.richDefaultTitle.checklist
                          args: ["@rich.checked", "@rich.count"]
                        html_widget:
                          t: chat.richDefaultTitle.html_widget
                          args: ["@rich.checked", "@rich.count"]
                        card: ""
                        interactive: ""
                        _: "@rich.rk"
