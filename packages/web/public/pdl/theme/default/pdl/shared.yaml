                        - t: chat.rawTitle
                          args:
                            - "@rich.title"
                            - of: "@rich.rk"
                              map:
                                checklist:
                                  t: chat.richDefaultTitle.checklist
                                  args: ["@rich.checked", "@rich.count"]
                                html_widget:
                                  t: chat.richDefaultTitle.html_widget
                                  args: ["@rich.checked", "@rich.count"]
                                card: ""
                                interactive: ""
                                _: "@rich.rk"
                        - "@rich.title"
                        - "@rich.filePath"
                    "2":
                      t: chat.richTitle.diff
                      args:
                        - t: chat.rawTitle
                          args:
                            - "@rich.title"
                            - of: "@rich.rk"
                              map:
                                checklist:
                                  t: chat.richDefaultTitle.checklist
                                  args: ["@rich.checked", "@rich.count"]
                                html_widget:
                                  t: chat.richDefaultTitle.html_widget
                                  args: ["@rich.checked", "@rich.count"]
                                card: ""
                                interactive: ""
                                _: "@rich.rk"
                        - "@rich.title"
                        - "@rich.filePath"
