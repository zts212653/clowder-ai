              - type: button
                primary: true
                label: t:chatRich.confirmPick
                act: richSubmit
                args:
                  mid: "@rich.pick.mid"
                  b: "@rich.pick.b"
                  pickedPattern: t:chatRich.selection.picked
                  customPattern: "{0}：{1}"
                  titlePattern: "{0}（{1}）"
                when: "@rich.pick.submit"
                disabled: "@rich.pick.cant"
  CHAT_META:
    when: "@meta"
    note: "@notes.meta"
    parts:
      - control:
          type: button
          variant: meta
          act: cafeExecOpen
          args: {i: "@i"}
          expanded: "@meta.open"
          parts:
            - roll: "@meta.roll"
              a: "@meta.roll.a"
              b:
                t: chatMessage.runtimeSlot.b
                args: ["@meta.roll.tools", "@meta.roll.subs"]
              when: "@meta.roll"
              after:
                icon: right
                size: xs
                variant: twisty
                when:
                  of: "@meta.kind"
                  map: {typing: "@meta.roll", _: true}
            - {text: t:chatMessage.runtimeSlot.now, when: "@meta.stopping"}
            - text:
                t: composer.actions.silentMinutes
                args: ["@meta.minutes"]
              tone: warn
              when: "@meta.quiet"
            - {text: "@meta.activity", when: "@meta.activity"}
            - parts:
                - {text: t:chatMessage.runtimeSlot.hint, variant: meta}
                - {lit: " "}
                - {text: "@meta.tipText"}
              sep: ""
              when: "@meta.tip"
            - parts:
                - text:
                    t: chatMessage.process.sum
                    args: ["@meta.toolCount"]
                - text:
                    t: chatMessage.process.text
                    args: ["@meta.errors"]
                  tone:
                    of: "@meta.errors"
                    gte: 1
                    map: {"true": warn, _: ""}
                - text:
                    t: chatMessage.process.subagentCountSuffix
                    args: ["@meta.subagents"]
                - {lit: " · ", when: "@meta.processCount"}
                - text:
                    t: chatMessage.process.processCount
                    args: ["@meta.processCount"]
                  when: "@meta.processCount"
              sep: ""
              when:
                of: "@meta.kind"
                map: {typing: false, _: true}
            - icon:
                of:
                  of: "@meta.kind"
                  map: {typing: "@meta.roll", _: true}
                map: {"true": right, _: ""}
              size: xs
              variant: twisty
              when: "!@meta.roll"
      - text: {of: "@meta.secs", fmt: duration}
        num: true
        when:
          of: "@meta.secs"
          map: {"0": true, _: "@meta.secs"}
      - {text: "@meta.model", when: "@meta.model"}
    end:
      - control:
          type: button
          variant: meta
          act: recallOpen
          args: {i: "@i"}
          parts:
            - text:
                t: wsRecall.summary.count
                args: ["@meta.recall"]
      - control:
          type: button
          variant: meta
          act: traceOpen
          args: {i: "@i"}
          parts:
            - {icon: trace, size: s}
            - {text: t:wsTrace.timeline}
  CHAT_WATCHER:
    type: box
    when: "@watcher"
    blocks:
      - {type: label, text: t:chatMessage.watcher.title}
      - type: list
        id: watcher-suggestions
        from: "@suggestions"
        optional: true
        row:
          layout: record
          key: "@id"
          title:
            - text: "@label"
              when:
                of: "@state"
                map: {open: true, _: false}
            - {text: "@receipt.text", when: "@receipt"}
            - text:
                of: "@state"
                map:
                  dismissed: t:chatMessage.watcher.dismissed
                  undone: t:chatMessage.watcher.undone
                  _: ""
          lead: {who: "@catId", size: s}
          acts:
            - label: "@label"
              icon: check
              act: watcherNudge
              args: {threadId: "@threadId", id: "@id", decision: apply}
              when:
                of: "@state"
                map: {open: true, _: false}
            - label: t:chatMessage.watcher.dismiss
              icon: close
              act: watcherNudge
              args: {threadId: "@threadId", id: "@id", decision: dismiss}
              when:
                of: "@state"
                map: {open: true, _: false}
            - label:
                of: "@undo"
                map: {resume: t:common.restore, _: t:common.undo}
              icon: undo
              act: watcherNudge
              args: {threadId: "@threadId", id: "@id", decision: undo}
              when:
                of: "@state"
                map: {applied: "@undo", dismissed: true, _: false}
  CHAT_EXEC:
    type: box
    variant: log
    when: "@exec"
    open: "@meta.open"
    follow: "@exec.live"
    blocks:
      - type: list
        id: "@exec.id"
        expand: many
        groups: "@exec.groups"
        group:
          title:
            of: "@kind"
            map:
              thinking: t:chat.executionGroup.thinking
              subagents: t:chat.executionGroup.subagents
              tools: t:chat.executionGroup.tools
              process: t:wsSessions.record
              _: "@kind"
        row:
          layout: two
          key: "@key"
          lead:
            glyph:
              of: "@kind"
              map: {tool: wrench, commentary: chat, subagent: cat, thinking: spark}
            when: "@kind"
          title:
            - text:
                of: "@kind"
                map:
                  commentary: {of: "@title", fmt: plainLine}
                  _: "@title"
              mono:
                of: "@kind"
                map: {tool: true, _: false}
              tone:
                of: "@status"
                map: {error: warn, _: ""}
          inline:
            - control: {type: status, tone: info, text: t:common.status.running}
              when: ["@subagent", "@running"]
            - control: {type: status, tone: "@stateTone", text: "@stateText"}
              when: ["@subagent", "!@running"]
          sub:
            - {parts: "@sub", when: "!@subagent"}
            - text:
                t: chatMessage.execution.sub
                args:
                  - of: "@running"
                    map:
                      "true":
                        t: chat.executionProgress.true
                        args: ["@progress"]
                      "false": "@progress"
                      _: "@running"
              when: "@subagent"
          cols:
            - v: "@dur"
              w: time
              tone:
                of: "@status"
                map: {error: warn, _: ""}
              when: "@dur"
          expand:
            - type: label
              text: t:chatMessage.execution.detailLabel
              when: ["@subagent", "!@running"]
            - type: content
              html:
                of: "@kind"
                map:
                  commentary: {of: "@detail", fmt: markdownRest}
                  _: {of: "@detail", fmt: escaped}
              raw: true
              when:
                - "@detail"
                - "!@running"
                - of: "@kind"
                  map:
                    commentary: {of: "@detail", fmt: markdownRest}
                    _: true
            - type: each
              from: "@details"
              blocks:
                - type: box
                  key: "@key"
                  blocks:
                    - type: content
                      html: {of: "@text", fmt: escaped}
                      raw: true
                      when: "@text"
                    - {type: view, id: chat.tool.result, data: "@tool", when: "@tool"}
  CHAT_SUPP:
    type: box
    key: supp
    when: "@supp"
    blocks:
      - type: text
        parts:
          - text:
              t: chatMessage.supplement.title
              args: ["@supp.count"]
            variant: meta
          - {text: t:chatMessage.supplement.status, variant: meta, when: "@supp.read"}
      - type: fold
        shape: bottom
        key: "@supp.key"
        height: s
        blocks:
          - type: list
            inline: true
            from: "@supp.items"
            row:
              layout: record
              key: "@key"
              lead:
                - {who: "@who", form: dot}
              title:
                - text:
                    of: "@fromMessage"
                    map:
                      "true": {of: "@who", fmt: identity}
                      _: "@name"
                  strong: true
                - {lit: ：}
                - text:
                    of: "@fromMessage"
                    map:
                      "true":
                        of: "@text"
                        slice: [0, 80]
                      _: "@text"
                  variant: meta
              cols:
                - v:
                    - icon: check
                      size: xs
                      when:
                        of: "@state"
                        map: {unknown: false, _: true}
                    - text:
                        of: "@state"
                        map:
                          read: t:delivery.read
                          delivered: t:delivery.delivered
                          received: t:delivery.received
                          unknown: t:delivery.unknown
                          _: "@state"
                    - text:
                        of: "@timestamp"
                        map:
                          "true": {of: "@time", fmt: hm}
                          _: "@time"
                      when:
                        - "@time"
                        - of: "@state"
                          map: {delivered: false, _: true}
                  w: state
              acts:
                - label: t:reply.jump
                  icon: jump
                  act: msgJump
                  args: {mid: "@mid"}
  CHAT_ACTS:
    slot: chat.message.actions
    ctx: "@actsCtx"
    items:
      - label: t:chatMessage.menu.label
        act: copy
        args: {v: "@mid"}
      - label: t:placement.relatedDisposition
        act: msgDisposition
        args: {mid: "@mid"}
      - label: t:chatMessage.menu.viewExecution
        act: traceOpen
        args: {i: "@i"}
        when: "@isCat"
      - label: t:chatMessage.menu.revealWhisper
        act: setStatus
        args: {entity: msg, id: "@i", field: revealed, v: "true", cast: bool}
        when: "@canReveal"
      - label: t:chatMessage.menu.branchHere
        act: modal
        args: {v: branch, i: "@i"}
      - label: t:composerPop.forwardMore
        act: modal
        args: {v: forward, id: msg}
      - label: t:chatMessage.menu.deleteMenu
        act: setStatus
        args: {entity: msgDel, id: "@i", v: "true", cast: bool}
        tone: danger
  CHAT_CONTEXT_CHIP:
    kind:
      of: "@kind"
      map:
        project-screening: t:films.review
        _:
          of: "@kind"
          map:
            work: t:common.works
            quote: t:chat.contextKind.quote
            review: t:chat.contextKind.review
            document: t:chat.contextKind.quote
            selection: t:chat.contextKind.quote
            _: "@kind"
    label:
      of: "@kind"
      map:
        project-screening:
          t: mediaReview.screeningContext
          args:
            - "@title"
            - {of: "@time", fmt: clock}
        _:
          of:
            of: "@kind"
            map: {work: true, _: false}
          map:
            "true":
              t: chat.workContext
              args: ["@title", "@version"]
            "false":
              of:
                of: "@kind"
                map: {selection: true, _: false}
              map:
                "true":
                  of: "@fromWork"
                  map:
                    "true":
                      t: chat.selectionLabel.true
                      args:
                        - "@source"
                        - of: "@snippet.length"
                          gte: 0
                          map:
                            "true": "@snippet"
                            _:
                              of: "@text"
                              slice: [0, 12]
                    "false":
                      t: chat.selectionLabel.false
                      args:
                        - "@source"
                        - of: "@snippet.length"
                          gte: 0
                          map:
                            "true": "@snippet"
                            _:
                              of: "@text"
                              slice: [0, 12]
                    _: "@fromWork"
                "false":
                  of:
                    of: "@kind"
                    map: {quote: true, _: false}
                  map:
                    "true":
                      of: "@text"
                      slice: [0, 24]
                    "false": "@label"
                    _:
                      of: "@kind"
                      map: {quote: true, _: false}
                _:
                  of: "@kind"
                  map: {selection: true, _: false}
            _:
              of: "@kind"
              map: {work: true, _: false}
  CARD_TITLE:
    type: text
    variant: title
    text:
      t: chat.cardTitle
      args:
        - of: "@kind"
          map: {cbauth: cbauth, cloudRecovery: cloudRecovery, _: "@card.titleType"}
        - "@card.title"
    help: "@card.help"
    label:
      text:
        t: chat.cardLabel
        args:
          - of: "@kind"
            map: {workref: workref, _: "@card.labelType"}
          - "@card.label"
          - "@card.rev"
      pos: after
  CARD_FIELDS:
    type: kv
    from: "@card.fields"
    item:
      k:
        t: chatCards.field
        args: ["@field", "@k"]
      v:
        t: chat.fieldValue
        args:
          - "@field"
          - t: chat.answer
            args:
              - "@answer"
              - of: "@field"
                map:
                  time: {of: "@v", fmt: hm}
                  _: {of: "@v", sep: " / "}
          - t: cbauth.reasons
            args: ["@v"]
          - t: chat.memberName
            args: ["@name", "@handle"]
    when: ["@card.fields", "!@card.result", "!@card.editing", "!@card.conflict"]
  CARD_FOLD:
    type: fold
    shape: bottom
    key: "@card.firstKey"
    height: s
    when: ["@card.first", "!@card.result", "!@card.editing", "!@card.conflict"]
    blocks:
      - type: label
        text:
          t: chat.proposalFirst
          args: ["@card.firstTitle"]
      - type: content
        html: {of: "@card.first", fmt: markdown}
  CARD_OWNER_REFRESH:
    type: button
    iconOnly: true
    icon: refresh
    label: t:common.refresh
    act: proposalOwnerRefresh
    args: {mid: "@mid"}
    when: "@card.ownerKind"
  CARD_STATUS:
    type: status
    tone: warn
    text:
      of: {$frag: CARD_NOTICE_KIND}
      map:
        memory:
          of: "@card.noticeState"
          map:
            unavailable: t:memoryOwners.stateNote.unavailable
            pending_approval: t:memoryOwners.stateNote.pending
            not_now: t:memoryOwners.stateNote.not_now
            partially_materialized: t:memoryOwners.stateNote.partially_materialized
            materialized: t:memoryOwners.stateNote.materialized
            withdrawn: t:memoryOwners.stateNote.withdrawn
            active: t:memoryOwners.state.active
            current: t:memoryOwners.state.current
            retired: t:memoryOwners.stateNote.retired
            pending: t:memoryOwners.stateNote.pending
            approving: t:memoryOwners.stateNote.approving
            approved: t:memoryOwners.stateNote.approved
            rejected: t:memoryOwners.stateNote.rejected
            applied: t:memoryOwners.stateNote.applied
            replayed: t:memoryOwners.stateNote.replayed
            _: "@card.noticeState"
        message: "@card.noticeText"
        approval:
          t: chat.cardNotice.approval
          args:
            - "@card.noticeText"
            - of: "@card.noticeState"
              map:
                unavailable: t:memoryOwners.stateNote.unavailable
                pending_approval: t:memoryOwners.stateNote.pending
                not_now: t:memoryOwners.stateNote.not_now
                partially_materialized: t:memoryOwners.stateNote.partially_materialized
                materialized: t:memoryOwners.stateNote.materialized
                withdrawn: t:memoryOwners.stateNote.withdrawn
                active: t:memoryOwners.state.active
                current: t:memoryOwners.state.current
                retired: t:memoryOwners.stateNote.retired
                pending: t:memoryOwners.stateNote.pending
                approving: t:memoryOwners.stateNote.approving
                approved: t:memoryOwners.stateNote.approved
                rejected: t:memoryOwners.stateNote.rejected
                applied: t:memoryOwners.stateNote.applied
                replayed: t:memoryOwners.stateNote.replayed
                _: "@card.noticeState"
        unavailable:
          t: runtime.sourceUnavailable
          args:
            - "@card.noticeText"
            - of: "@card.noticeState"
              map:
                unavailable: t:memoryOwners.stateNote.unavailable
                pending_approval: t:memoryOwners.stateNote.pending
                not_now: t:memoryOwners.stateNote.not_now
                partially_materialized: t:memoryOwners.stateNote.partially_materialized
                materialized: t:memoryOwners.stateNote.materialized
                withdrawn: t:memoryOwners.stateNote.withdrawn
                active: t:memoryOwners.state.active
                current: t:memoryOwners.state.current
                retired: t:memoryOwners.stateNote.retired
                pending: t:memoryOwners.stateNote.pending
                approving: t:memoryOwners.stateNote.approving
                approved: t:memoryOwners.stateNote.approved
                rejected: t:memoryOwners.stateNote.rejected
                applied: t:memoryOwners.stateNote.applied
                replayed: t:memoryOwners.stateNote.replayed
                _: "@card.noticeState"
        _: {$frag: CARD_NOTICE_KIND}
    when: {$frag: CARD_NOTICE_KIND}
  CARD_NOTICE_KIND:
    of: "@card.ownerKind"
    map:
      frustration:
        of: "@card.noticeText.length"
        gte: 1
        map: {"true": message, _: ""}
      custody:
        of: "@card.noticeText.length"
        gte: 1
        map:
          "true": message
          _:
            of: "@card.offer.offerId.length"
            gte: 1
            map: {"true": "", _: unavailable}
      _:
        of: "@kind"
        map:
          memprop: approval
          _:
            of: "@card.memoryOwner.length"
            gte: 1
            map:
              "true":
                of: "@card.noticeState"
                map:
                  pending:
                    of: "@card.noticeText.length"
                    gte: 1
                    map: {"true": message, _: ""}
                  _: memory
              _:
                of: "@card.noticeText.length"
                gte: 1
                map: {"true": message, _: ""}
  CHAT_PARTS:
    exec:
      node: {$frag: CHAT_EXEC}
      field: exec
    supp:
      node: {$frag: CHAT_SUPP}
      field: supp
    rich:
      node: {$frag: CHAT_RICH}
      field: rich
      in: embeds
  CHAT_CARD_KINDS:
    cloudRecovery: card.alert
    cbauth: card.alert
    ask: card.ask
    proposal: card.proposal
    memprop: card.proposal
    brief: card.brief
    summary: card.summary
    evidence: card.brief
    workref: card.work
    letter: chat.node/cat
    wake: chat.node/cat
