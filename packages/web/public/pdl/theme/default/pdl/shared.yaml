                                  args: ["@rich.checked", "@rich.count"]
                                html_widget:
                                  t: chat.richDefaultTitle.html_widget
                                  args: ["@rich.checked", "@rich.count"]
                                card: ""
                                interactive: ""
                                _: "@rich.rk"
                        - "@rich.title"
                        - "@rich.filePath"
                    _: "@rich.rk"
                when: "!@rich.sel"
              - {type: grow}
              - type: check
                value: "@rich.sel.on"
                label:
                  of:
                    of: "@rich.rk"
                    map:
                      card: 0
                      checklist: 0
                      html_widget: 0
                      interactive: 0
                      audio: 1
                      diff: 2
                      file: 3
                      _: -1
                  map:
                    "0":
                      t: chat.rawTitle
                      args:
                        - "@rich.title"
                        - of: "@rich.rk"
                          map:
                            checklist:
                              t: chat.richDefaultTitle.checklist
                              args: ["@rich.checked", "@rich.count"]
                            html_widget:
                              t: chat.richDefaultTitle.html_widget
                              args: ["@rich.checked", "@rich.count"]
                            card: ""
                            interactive: ""
                            _: "@rich.rk"
                    "1":
                      t: chat.richTitle.audio
