              args: [$.many, $.count]
            "false":
              of: $.many
              map:
                "true":
                  t: workbench.fsDelete.true
                  args: [$.children]
                "false": ""
                _: $.many
            _: $.workspace
    ok: t:common.delete
    danger: true
  dlg.tmClose:
    title: t:wsTerminal.close.title
    text: t:wsTerminal.close.text
    ok: t:common.close
    danger: true
  dlg.task:
