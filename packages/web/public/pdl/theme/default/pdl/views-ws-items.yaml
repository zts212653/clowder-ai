  dlg.intent:
    vm: taskForm
    title: t:hub.newIntent
    ok: t:common.create
    okAct: intentSave
    okArgs: {projectId: $.projectId}
    fields:
      - id: intent-actor
        label: t:workspaceOwners.actor
        value: $.values.actor
        area: true
        req: true
      - id: intent-contextTrigger
        label: t:workspaceOwners.contextTrigger
        value: $.values.contextTrigger
        area: true
        req: true
      - id: intent-goal
        label: t:wsEvolution.detail.goal
        value: $.values.goal
        area: true
        req: true
      - id: intent-objectState
        label: t:workspaceOwners.objectState
        value: $.values.objectState
        area: true
        req: true
      - id: intent-successSignal
