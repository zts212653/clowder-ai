      - id: triage-clarity
        label: t:workspaceOwners.clarity
        value: $.values.clarity
        type: number
        min: 1
        maxv: 3
        req: true
      - id: triage-groundedness
        label: t:evolutionFlow.reason
        value: $.values.groundedness
        type: number
        min: 1
        maxv: 3
        req: true
      - id: triage-necessity
        label: t:workspaceOwners.necessity
        value: $.values.necessity
        type: number
        min: 1
        maxv: 3
        req: true
      - id: triage-coupling
        label: t:workspaceOwners.coupling
        value: $.values.coupling
        type: number
        min: 1
        maxv: 3
        req: true
      - id: triage-sizeBand
        label: t:workspaceOwners.sizeBand
        options: [S, M, L, XL]
        value:
          of: $.hasValues
          map: {"true": $.values.sizeBand, "false": S, _: $.hasValues}
  dlg.reflux:
    title: t:hub.recordLesson
    fields:
      - id: reflux-category
        label: t:workspaceOwners.category
        options:
          - {v: methodology, label: t:workspaceOwners.methodology}
          - {v: risk_pattern, label: t:workspaceOwners.risk_pattern}
          - {v: resolution_strategy, label: t:workspaceOwners.resolution_strategy}
        value: methodology
      - {id: reflux-title, label: t:hub.create.placeholder, req: true}
      - id: reflux-insight
        label: t:workspaceOwners.insight
        area: true
        req: true
      - {id: reflux-evidence, label: t:wsCommunity.evidence, area: true, req: true}
    ok: t:common.save
  dlg.clarification:
    title: t:workspaceOwners.clarification
    fields:
      - id: clarification-op
        radios:
          - {v: answer, title: t:workspaceOwners.answer}
          - {v: escalate, title: t:workspaceOwners.escalate}
      - {id: clarification-answer, label: t:workspaceOwners.answer, area: true}
    ok: t:common.save
  dlg.slice:
    title:
      of: $.editing
      map:
        "true": t:workspaceOwners.editSlice
        "false": t:workspaceOwners.newSlice
        _: $.editing
    fields:
      - {id: slice-name, label: t:common.name, value: $.values.name, req: true}
      - id: slice-description
        label: t:hub.importProject.description
        value: $.values.description
        area: true
        req: true
      - id: slice-actor
        label: t:workspaceOwners.actor
        value: $.values.actor
        area: true
        req: true
      - id: slice-workflow
        label: t:workspaceOwners.workflow
        value: $.values.workflow
        area: true
        req: true
      - id: slice-verifiableOutcome
        label: t:workspaceOwners.verifiableOutcome
        value: $.values.verifiableOutcome
        area: true
        req: true
      - id: slice-cardIds
        label: t:workspaceOwners.cardIds
        value: {of: $.values.cardIds, sep: ", "}
      - id: slice-sliceType
        label: t:workspaceOwners.sliceType
        options:
          - {v: learning, label: t:workspaceOwners.learning}
          - {v: value, label: t:workspaceOwners.value}
          - {v: hardening, label: t:workspaceOwners.hardening}
        value: $.values.sliceType
        disabled: $.editing
      - id: slice-status
        label: t:common.state
        options:
          - {v: planned, label: t:schedule.todo}
          - {v: in_progress, label: t:schedule.doing}
          - {v: delivered, label: t:workspaceOwners.delivered}
          - {v: validated, label: t:wsEval.continuation.verified_outcome}
        value: $.values.status
    ok: t:common.save
  dlg.wsImportBacklog:
    title: t:hub.importBacklogDialog.title
    text: t:hub.importBacklogDialog.text
    ok: t:common.import
  dlg.wsImportProject:
    title: t:films.import
    fields:
      - id: dlg-n
        label: t:hub.importProject.placeholder
        placeholder: t:hub.importProject.placeholder
        req: true
      - id: dlg-p
        label: t:hub.importProject.projectPath
        mono: true
        placeholder: /home/user/projects/studio-flow
        req: true
      - id: dlg-b
        label: t:hub.importProject.backlogPath
        mono: true
        value: docs/ROADMAP.md
      - id: dlg-d
        label: t:hub.importProject.description
        placeholder: t:hub.importProject.descriptionPlaceholder
    ok: t:common.import
  dlg.wsEvoNew:
    title: t:wsEvolution.create.title
    fields:
      - {id: dlg-in, label: t:wsEvolution.create.label}
    ok: t:wsEvolution.create.ok
  dlg.wsSigBatchTag:
    title:
      t: wsSignals.batchTag.title
      args: [$.count]
    fields:
      - {id: dlg-in, label: t:wsSignals.batchTag.label, req: true}
    ok: t:wsSignals.batchTag.ok
  dlg.filmReopen:
    title: t:films.reopen
    fields:
      - {id: film-reason, label: t:chatCards.field.reason, req: true}
    ok: t:common.confirm
  dlg.filmRegister:
    vm: filmRegisterForm
    okAct: filmRegisterSave
    title: t:films.register
    fields:
      - id: film-worktree
        label: t:wsGit.worktrees
        options: $.worktrees
        value: $.values.worktree
      - id: film-title
        label: t:films.filmTitle
        value:
          of: $.hasValues
          map: {"true": $.values.title, "false": t:films.output, _: $.hasValues}
        req: true
      - id: film-path
        value: $.values.path
        label: t:films.path
        placeholder: media/output.mp4
        req: true
      - id: film-mapping
        label: t:films.mapping
        file: {accept: "application/json,.json", change: filmMapping}
    ok: t:films.register
  dlg.wsSigBatchDel:
    title:
      t: wsSignals.batchDelete.title
      args: [$.count]
    text: t:wsSignals.batchDelete.text
    ok: t:common.delete
    danger: true
  dlg.wsSigDel:
    title: t:wsSignals.delete.title
    text:
      - {text: $.title}
  menu.wsMore:
    vm: wsMore
    items:
      - label:
          of: $.focus
          map: {"true": t:frame.exitFocus, _: t:workbench.tabs.menu.focus}
        help:
          of: $.focus
          map: {"true": "", _: t:workbench.tabs.menu.focusHelp}
        act: toggle
        args: {path: ws.focus}
        when: "!$.home"
      - label: t:workbench.tabs.menu.splitHorizontal
        act: tab
        args: {op: split, r: panel}
        cur: $.split
        when:
          of: $.tabCount
          map: {"1": $.split, _: true}
      - label: t:workbench.tabs.menu.closeOthers
        act: tab
        args: {op: closeOthers, r: panel}
        when: $.closable
      - label: t:workbench.tabs.menu.closeUnpinned
        act: tab
        args: {op: closeUnpinned, r: panel}
        when: $.unpinned
      - label: t:entryLayout.shell.collapseWorkbench
        act: close
        args: {path: s.panel}
  dlg.wcRename: {title: t:common.rename}
  dlg.nativeReviewTarget:
    title: t:wsChanges.review
    fields:
      - id: native-review-cat
        label: t:workbench.nativeReviewTarget.label
        options:
          - from: $.choices
            item:
              v: "@catId"
              label: {of: "@catId", fmt: identity}
    ok: t:common.confirm
  work.prChanges:
    blocks:
      - type: toolbar
        items:
          - type: text
            parts:
              - {text: $.target.repoFullName}
              - {text: $.target.prNumber, mono: true}
          - type: button
            icon: refresh
            label: t:common.refresh
            act: prChangesRead
            args: {target: $.target}
      - type: box
        load: $.load
        loading: t:works.pr.loading
        error: t:works.pr.error
        retry:
          act: prChangesRead
          args: {target: $.target}
        blocks:
          - type: kv
            from:
              - {k: t:works.pr.base, v: $.data.comparison.baseSha}
              - {k: t:works.pr.head, v: $.data.comparison.headSha}
              - {k: t:works.pr.session, v: $.target.threadId}
          - type: notice
            tone: warn
            text: t:works.pr.partial
            when:
              of: $.data.completeness
              map: {partial: true, _: false}
          - type: list
            id: pr-change-files
            from: $.files
            item:
              name: {of: "@path", fmt: basename}
              parent: {of: "@path", fmt: dirname}
              hasParent: true
              expand:
                lit: {$frag: CHANGE_EXPAND}
            row: file.row
            empty: t:wsGit.clean
  dlg.workCover:
    vm: workCover
    loading: t:works.load.loading
    error: t:works.cover.readError
    retry:
      act: workCoverOpen
      args: {id: $.id}
    title: t:works.cover.title
    ok: t:common.done
    blocks:
      - type: box
        load:
          of: $.error.length
          gte: 1
          map: {"true": error, _: ""}
        error:
          t: works.cover.failed
          args:
            - of: $.errorStatus
              map:
                "400": t:works.cover.reason.unreadable
                "401": t:works.cover.reason.forbidden
                "403": t:works.cover.reason.forbidden
                "404": t:works.cover.reason.unreadable
                "409": t:works.cover.reason.conflict
                _: t:works.cover.reason.other
        retry:
          act:
            of: $.operation.operationId.length
            gte: 1
            map: {"true": workCoverSave, _: workCoverOpen}
          args: {id: $.id}
        blocks: []
      - type: kv
        from:
          - k: t:common.source
            v:
              t: works.cover.source
              args: [$.cover.image.origin.kind]
            when: $.cover.image
      - type: list
        id: work-cover-candidates
        from: $.candidates
        row: file.row
        item:
          path: "@key"
          name: "@name"
          sub:
            t: works.cover.source
            args: ["@source"]
          icon: image
          act: workCoverSave
          args: {key: "@key"}
        empty: t:works.cover.empty
        when: "!$.operation"
      - type: toolbar
        when: "!$.operation"
        items:
          - {type: button, label: t:works.cover.upload, act: workCoverUpload}
          - type: button
            label: t:works.cover.frame
            act: workCoverSave
            args: {mode: frame}
          - type: button
            label: t:common.undo
            act: workCoverSave
            args: {mode: restore}
            when: {of: $.previousCoverRevision, gte: 0}
rows:
  works.item:
    layout: two
    key: "@id"
    lead:
      icon: "@type"
      size: m
      tip:
        t: common.artType
        args: ["@type"]
      variant: meta
    title: "@name"
    inline:
      - dot: warn
        tip:
          t: works.item.staleTip
          args: ["@revision.own", "@revision.cur"]
        when: "@stale"
    sub:
      text: "@threadTitle"
      when:
        - of: "@scope"
          map: {global: true, _: false}
        - of: "@group"
          map: {thread: false, _: true}
    cols:
      - v: {who: "@cat", form: avatar}
        w: icon
        tip:
          t: workbench.identity
          args: ["@catName", "@catHandle"]
      - v:
          text: {of: "@at", fmt: stamp}
        w: time
    acts: {slot: ws.works.work, ctx: "@"}
    act: workOpen
    args: "@args"
  file.row:
    layout: two
    key: "@path"
    lead:
      - text:
          of: "@st"
          map: {M: M, A: A, D: D, R: R, ??: U, _: "@st"}
        tip:
          of: "@st"
          map:
            M: t:films.opinionState.modified
            A: t:wsChanges.fileState.label.A
            D: t:wsChanges.fileState.label.D
            R: t:wsChanges.fileState.label.R
            ??: t:wsCode.git.group.untracked
            _: "@st"
        variant: badge
        tone:
          of: "@st"
          map: {M: warn, A: ok, D: danger, R: info, ??: "", _: "@st"}
        when: "@st"
      - icon:
          of: "@kind"
          map:
            file: file
            directory: folder
            hit: search
            _:
              of: "@dir"
              map: {"true": folder, _: "@icon"}
        size: s
        when:
          of: "@kind"
          map:
            file: true
            directory: true
            hit: true
            _:
              of: "@dir"
              map: {"true": true, _: "@icon"}
    title: "@name"
    sub:
      - {parts: "@sub", when: "@sub"}
      - {text: "@parent", mono: true, when: "@hasParent"}
      - {text: "@text", mono: true, when: "@contentHit"}
    cols:
      - v:
          text:
            t: wsCode.files.line
            args: ["@line"]
        w: num
        tip:
          t: wsCode.files.lineTip
          args: ["@line"]
        when: "@line"
      - v:
          parts:
            - parts: [+, "@add"]
              sep: ""
        w: num
        tone: ok
        when: "@add"
      - v:
          parts:
            - parts: [−, "@del"]
              sep: ""
        w: num
        tone: danger
        when: "@del"
      - v:
          - {icon: right, size: s}
        w: icon
        when: "@chev"
    acts: {slot: "@slot", ctx: "@actsCtx"}
    act: "@act"
    args: "@args"
    expand: "@expand"
    cur: "@cur"
