views:
  ws.unavailable:
    empty: t:frame.toolTodo
    blocks: []
  file.body:
    vm: filePage
    error: t:frame.loadError
    blocks:
      - type: box
        key: work-content
        blocks:
          - type: box
            when: $.documentReview
            load: $.documentReview.load
            error: t:frame.loadError
            retry:
              act: refresh
              args: {k: $.documentReview.retryKey}
            blocks:
              - type: toolbar
                items:
                  - type: button
                    label: t:frame.speak
                    act: documentListen
                    args: {op: start, work: $.documentReview.work}
                    when: $.documentReview.listen.canStart
                  - type: button
                    label: t:player.pause
                    act: documentListen
                    args: {op: pause, work: $.documentReview.work}
                    when: $.documentReview.listen.canPause
                  - type: button
                    label: t:player.play
                    act: documentListen
                    args: {op: resume, work: $.documentReview.work}
                    when: $.documentReview.listen.canResume
              - type: list
                from: $.documentReview.quotes
                row: review.quote
                optional: true
              - type: each
                from: $.documentReview.annotations
                blocks:
                  - {type: text, text: "@title"}
                  - {type: status, text: t:films.sourceChanged, when: "@sourceChanged"}
                  - {type: list, from: "@replies", row: record.row, optional: true}
                  - type: toolbar
                    items:
                      - type: button
                        label: t:wsCommunity.resolved
                        act: setStatus
                        args: {entity: workspaceAnnotation, id: "@id", v: resolved}
                        when: ["@canSetState", "!@resolved"]
                      - type: button
                        label: t:films.reopen
                        act: setStatus
                        args: {entity: workspaceAnnotation, id: "@id", v: open}
                        when: ["@canSetState", "@resolved"]
                      - type: input
                        id: "@replyId"
                        label: t:workbench.liveActionWhat.false
                        go: workTextReply
                        args: {id: "@id", work: $.documentReview.work}
                        goLabel: t:common.send
                        icon: check
                        when: "@canReply"
          - type: head
            variant: detail
            title:
              - control:
                  type: copy
                  value: $.path
                  label: t:composerPop.copyPath
                  mono: true
                  tail: true
          - type: toolbar
            items:
              - type: seg
                value:
                  of: $.mode
                  map: {src: src, _: render}
                options:
                  - {v: render, label: t:work.view.rendered}
                  - {v: src, label: t:work.view.source}
                act: set
                args: {path: ws.fileMode}
                when: [$.markdown, "!$.editing"]
              - {type: grow}
              - type: button
                label: t:common.edit
                act: fileEdit
                args: {worktreeId: $.worktreeId, path: $.filePath}
                when: [$.canEdit, "!$.editing"]
              - type: button
                label: t:common.save
                primary: true
                act: fileSave
                args: {id: $.path, baseSha256: $.edit.baseSha256}
                when: $.editing
              - type: button
                label: t:common.cancel
                act: fileCancel
                args: {id: $.path}
                when: $.editing
              - type: button
                iconOnly: true
                icon: download
                label: t:common.download
                act: download
                args: {source: $.actions.source, name: $.actions.name}
                when: $.actions.canDownload
              - type: button
                label: t:workbench.file.openLocal
                act: fileAction
                args: {op: open, worktreeId: $.worktreeId, path: $.filePath}
                when: $.actions.canOpen
              - type: more
                items:
                  - label: t:entryLayout.rowSlot.quoteInChat
                    act: insert
                    args: {into: chat-input, text: $.quote}
                  - label: t:workbench.file.openProject
                    act: wsTool
                    args: {k: files}
                  - label: t:control.reveal
                    act: fileAction
                    args: {op: reveal, worktreeId: $.worktreeId, path: $.filePath}
                    when: $.actions.canReveal
          - type: pre
            text:
              of: $.hasBody
              map:
                "true": $.body
                "false":
                  t: workbench.fileBody.false
                  args: [$.body]
                _: $.hasBody
            annotations: $.annotations
            when:
              - "!$.editing"
              - "!$.binary"
              - of: $.markdown
                map:
                  "true":
                    of: $.mode
                    map: {src: true, _: false}
                  _: true
          - type: each
            from:
              - {}
            when: $.media
            item:
              media:
                id: $.media.id
                kind: $.media.kind
                src: $.media.src
                label: {of: $.media.path, fmt: basename}
                marks: []
            blocks:
              - {type: component, use: media, props: "@media"}
          - type: empty
            icon: file
            text: t:workbench.file.noPreview
            when: [$.binary, "!$.media"]
          - {$frag: FILE_INFO}
          - type: notice
            tone: warn
            text: $.edit.conflict
            when: $.edit.conflict
            action:
              - type: button
                label: t:memory.reread
                act: fileConflict
                args: {id: $.path, op: reload}
              - type: button
                label: t:workspaceOwners.overwrite
                act: fileConflict
                args: {id: $.path, op: overwrite}
          - type: form
            id: file
            when: $.editing
            blocks:
              - type: input
                id: $.edit.inputId
                rows: 24
                mono: true
                value: $.edit.content
                input: fileDraft
                args: {id: $.path}
                label: $.name
          - type: markdown
            text:
              of: $.hasBody
              map:
                "true": $.body
                "false":
                  t: workbench.fileBody.false
                  args: [$.body]
                _: $.hasBody
            annotations: $.annotations
            when:
              - "!$.editing"
              - $.markdown
              - of: $.mode
                map: {src: false, _: true}
  ws.tasks:
    loading: t:wsTasks.load.loading
    error: t:wsTasks.load.error
    empty: t:wsTasks.load.empty
    vm: tasks
    blocks:
      - type: toolbar
        items:
          - type: seg
            variant: tabs
            value: $.filter
            options:
              - {v: all, label: t:common.all, count: $.counts.all}
              - {v: doing, label: t:schedule.doing, count: $.counts.doing}
              - v: blocked
                label: t:wsTasks.state.blocked
                count: $.counts.blocked
                warn: $.counts.blocked
              - {v: todo, label: t:inbox.title, count: $.counts.todo}
              - {v: done, label: t:common.status.completed, count: $.counts.done}
            act: set
            args: {path: ws.tkF}
          - {type: grow}
          - type: button
            iconOnly: true
            icon: plus
            label: t:wsTasks.newTask
            act: dialog
            args: {kind: task}
      - type: list
        id: tasks
        from: $.items
        row:
          layout: line
          key: "@id"
          tone:
            of: "@status"
            map: {done: past, todo: "", doing: "", blocked: "", _: "@status"}
          lead:
            control:
              type: button
              variant: cycle
              state: "@status"
              act: setStatus
              args: {entity: task, id: "@id"}
              tip:
                t: wsTasks.item.tip
                args:
                  - of: "@status"
                    map:
                      doing: t:schedule.doing
                      blocked: t:wsTasks.state.blocked
                      done: t:common.status.completed
                      todo: t:wsTasks.state.todo
                      all: ""
                      _: "@status"
                  - of: "@nextStatus"
                    map:
                      doing: t:schedule.doing
                      blocked: t:wsTasks.state.blocked
                      done: t:common.status.completed
                      todo: t:wsTasks.state.todo
                      all: ""
                      _: "@nextStatus"
              label:
                t: wsTasks.item.label
                args:
                  - of: "@status"
                    map:
                      doing: t:schedule.doing
                      blocked: t:wsTasks.state.blocked
                      done: t:common.status.completed
                      todo: t:wsTasks.state.todo
                      all: ""
                      _: "@status"
                  - of: "@nextStatus"
                    map:
                      doing: t:schedule.doing
                      blocked: t:wsTasks.state.blocked
                      done: t:common.status.completed
                      todo: t:wsTasks.state.todo
                      all: ""
                      _: "@nextStatus"
          title: "@title"
          inline:
            - icon:
                of: "@kind"
                map: {pr_tracking: pr, issue_tracking: issue, work: "", _: "@kind"}
              size: s
              tip:
                of: "@kind"
                map:
                  pr_tracking:
                    t: wsTasks.kind.tip.pr_tracking
                    args:
                      - of: "@hasKindSubject"
                        map:
                          "true":
                            t: wsTasks.item.kindSubject.true
                            args: ["@kindSubject"]
                          "false": ""
                          _: "@hasKindSubject"
                  issue_tracking:
                    t: wsTasks.kind.tip.issue_tracking
                    args:
                      - of: "@hasKindSubject"
                        map:
                          "true":
                            t: wsTasks.item.kindSubject.true
                            args: ["@kindSubject"]
                          "false": ""
                          _: "@hasKindSubject"
                  work: ""
                  _: "@kind"
              variant: meta
              when:
                of: "@kind"
                map: {pr_tracking: pr, issue_tracking: issue, work: "", _: "@kind"}
          cols:
            - v:
                - {who: "@owner", form: avatar, when: "@owner"}
                - {text: —, when: "!@owner"}
              w: icon
              tip:
                t: wsTasks.item.owner
                args: ["@hasOwner", "@ownerName", "@ownerHandle"]
            - v:
                text:
                  of: "@updatedTimestamp"
                  map:
                    "true": {of: "@updatedAt", fmt: ago}
                    _: "@updatedAt"
              w: time
              tip:
                t: wsTasks.item.updatedTip
                args:
                  - of: "@updatedTimestamp"
                    map:
                      "true": {of: "@updatedAt", fmt: ago}
                      _: "@updatedAt"
          acts: {slot: ws.tasks.task, ctx: "@actsCtx"}
          expand:
            - type: text
              parts:
                - {text: "@why"}
              when: "@why"
            - type: text
              parts:
                - text:
                    t: wsTasks.item.created
                    args:
                      - of: "@createdBy"
                        map: {user: t:common.you, system: "@createdBy", _: "@creatorName"}
                      - of: "@createdTimestamp"
                        map:
                          "true": {of: "@createdAt", fmt: ago}
                          _: "@createdAt"
                - {text: ·, when: "@feature"}
                - {text: "@feature", mono: true, when: "@feature"}
                - {text: ·, when: "@subject"}
                - {text: "@subject", mono: true, when: "@subject"}
                - {text: ·, when: "@source"}
                - control:
                    type: button
                    link: true
                    label: t:wsTasks.item.sourceMessage
                    act: sourceOpen
                    args: {t: "@thread"}
                  when: "@source"
        empty:
          of: $.hasTasks
          map:
            "true":
              t: wsTasks.list.emptyState.true
              args:
                - of: $.filter
                  map:
                    doing: t:schedule.doing
                    blocked: t:wsTasks.state.blocked
                    done: t:common.status.completed
                    todo: t:wsTasks.state.todo
                    all: ""
                    _: $.filter
            "false":
              t: wsTasks.load.empty
              args:
                - of: $.filter
                  map:
                    doing: t:schedule.doing
                    blocked: t:wsTasks.state.blocked
                    done: t:common.status.completed
                    todo: t:wsTasks.state.todo
                    all: ""
                    _: $.filter
            _: $.hasTasks
  ws.works:
    loading: t:works.load.loading
    error: t:works.load.error
    stale: t:works.load.stale
    retry:
      act:
        of: $.load
        map: {error: worksRestart, _: viewRetry}
      args: {v: ws.works, k: works-t}
    empty: t:wsItems.worksEmpty
    vm: works
    blocks:
      - type: toolbar
        items:
          - type: seg
            value: $.scope
            options:
              - {v: thread, label: t:works.scope.label}
              - {v: global, label: t:works.scope.allThreads}
            act: wsView
            args: {k: works-t}
            when: true
          - type: search
            id: wk-q
            placeholder: t:works.searchPlaceholder
            value: $.q
            input: wkQ
          - type: seg
            value: $.layout
            options:
              - {v: list, label: t:common.viewMode.list}
              - {v: cards, label: t:common.viewMode.cards}
            act: set
            args: {path: ws.wk.view}
      - type: toolbar
        items:
          - type: seg
            variant: tabs
            from: $.chips
            item:
              label:
                of: "@v"
                map:
                  all: t:common.all
                  image: t:common.artType.image
                  file: t:common.artType.file
                  codepr: t:works.filter.codepr
                  audio: t:common.artType.audio
                  video: t:common.artType.video
                  widget: t:chat.workType.true
                  _: "@v"
            act: set
            args: {path: ws.wk.f}
          - type: grow
            when:
              of: $.scope
              map: {global: true, _: false}
          - type: select
            id: wk-group
            options:
              - {v: none, label: t:works.grouping.text}
              - {v: time, label: t:common.time}
              - {v: thread, label: t:common.threads}
              - {v: cat, label: t:common.cat}
            value: $.groupVal
            change: wkGroup
            label: t:works.groupBy
            when:
              of: $.scope
              map: {global: true, _: false}
          - type: select
            id: wk-cat
            options:
              - {v: "", label: t:works.scope.catOpts}
              - from: $.catOpts
                item:
                  v: "@v"
                  label:
                    t: workbench.identity
                    args: ["@name", "@handle"]
            value: $.catVal
            change: wkCat
            label: t:works.author
            when:
              of: $.scope
              map: {global: true, _: false}
      - type: box
        when:
          of: $.scope
          map:
            global:
              of: $.groupVal
              map:
                none: true
                _:
                  of: $.items.length
                  gte: 1
                  map: {"true": false, _: true}
            _: true
        blocks:
          - type: list
            id: works
            from: $.items
            row: works.item
            empty:
              of: $.hasMore
              map: {"true": t:works.paging.partial, _: t:works.noMatch}
            next:
              key: works-panel
              act: worksMore
              when: [$.hasMore, "!$.stale", "!$.moreError"]
              busy: $.loadingMore
            when:
              of: $.layout
              map: {cards: false, _: true}
          - type: component
            use: cards
            props:
              from: $.items
              item: {$frag: WORK_CARD}
              empty:
                of: $.hasMore
                map: {"true": t:works.paging.partial, _: t:works.noMatch}
              next:
                key: works-panel
                act: worksMore
                when: [$.hasMore, "!$.stale", "!$.moreError"]
                busy: $.loadingMore
            when:
              of: $.layout
              map: {cards: true, _: false}
      - type: each
        from: $.groups
        when: {$frag: WORKS_GROUPED}
        blocks:
          - type: label
            text:
              of: "@group"
              map:
                thread: "@name"
                cat:
                  t: workbench.identity
                  args: ["@catName", "@catHandle"]
                time:
                  of: "@day"
                  map:
                    today: t:format.today
                    yesterday: t:binding.dayBucket.yesterday
                    week: t:binding.dayBucket.week
                    earlier: t:workspaceOwners.earlierEvents
                    _: "@day"
                _: "@group"
            count: "@count"
          - type: list
            id: "@id"
            from: "@items"
            row: works.item
            next:
              of: "@last"
              map:
                "true":
                  key: works-panel
                  act: worksMore
                  when: [$.hasMore, "!$.stale", "!$.moreError"]
                  busy: $.loadingMore
                _: null
            when:
              of: $.layout
              map: {cards: false, _: true}
          - type: component
            use: cards
            props:
              from: "@items"
              item: {$frag: WORK_CARD}
              empty:
                of: $.hasMore
                map: {"true": t:works.paging.partial, _: t:works.noMatch}
              next:
                of: "@last"
                map:
                  "true":
                    key: works-panel
                    act: worksMore
                    when: [$.hasMore, "!$.stale", "!$.moreError"]
                    busy: $.loadingMore
                  _: null
            when:
              of: $.layout
              map: {cards: true, _: false}
      - type: text
        variant: meta
        text: t:works.paging.loading
        when: $.loadingMore
      - type: notice
        tone: warn
        text: t:works.paging.stale
        when: $.stale
        action: {type: button, label: t:memory.reread, act: worksRestart}
      - type: notice
        tone: danger
        text: t:works.load.error
        when: [$.moreError, $.items]
        action:
          type: button
          label: t:common.retry
          act:
            of: $.hasMore
            map: {"true": worksMore, _: worksRestart}
