          map: {"true": $.values.priority, "false": P2, _: $.hasValues}
      - id: dlg-g
        value: $.values.tags
        label: t:common.tags
        placeholder: t:common.tags
    ok: t:common.create
  dlg.frame:
    title: t:hub.requirement.title
    fields:
      - {id: dlg-q0, label: t:hub.requirement.audience}
      - {id: dlg-q1, label: t:hub.requirement.problem}
      - {id: dlg-q2, label: t:hub.requirement.currentApproach}
      - {id: dlg-q3, label: t:hub.requirement.urgency}
      - {id: dlg-q4, label: t:hub.requirement.successCriteria}
      - {id: dlg-q5, label: t:hub.requirement.exclusions}
