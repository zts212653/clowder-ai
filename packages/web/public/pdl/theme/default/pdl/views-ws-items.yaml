  ws.board:
    loading: t:hub.load.loading
    error: t:hub.load.error
    empty: t:hub.load.empty
    vm: hubPanel
    blocks: {$frag: HUB_BLOCKS}
  ws.files:
    vm: files
    blocks:
      - type: toolbar
        items:
          - {$frag: WC_PICKER}
          - {type: grow}
          - type: button
            iconOnly: true
            icon: plus
            label: t:wsFiles.newUpload
            items:
              - label: t:wsFiles.create.fields.title.file
                act: dialog
                args: {kind: wcCreate, k: file}
              - label: t:composerPop.newFolder
                act: dialog
                args: {kind: wcCreate, k: dir}
              - {label: t:wsFiles.create.uploadFile, act: wcUpload}
          - type: button
            iconOnly: true
            icon: refresh
            label: t:common.refresh
            act: refresh
            args: {k: files}
      - type: toolbar
        items:
          - type: search
            id: wc-q
            placeholder: t:wsFiles.searchPlaceholder
            value: $.q
            input: wcQ
          - type: seg
            value: $.mode
            options:
              - {v: all, label: t:common.all}
              - {v: name, label: t:wsCode.files.filename}
              - {v: content, label: t:skill.content}
            act: set
            args: {path: wc.qMode}
      - type: list
        id: wcFind
        from: $.found
        item:
          name: {of: "@path", fmt: basename}
          parent: {of: "@path", fmt: dirname}
          hasParent:
            of: "@kind"
            map: {file: true, _: false}
          slot: ws.files.file
          actsCtx: "@"
          act: wsFile
          args: {p: "@path"}
        row: file.row
        empty: t:wsFiles.noMatch
        when: $.searching
      - type: tree
        id: wcFiles
        nodes: $.tree
        item:
          name: {of: "@path", fmt: basename}
          slot: ws.files.file
          actsCtx: {path: "@targetPath", quote: "@quote", dir: "@dir"}
        row: file.row
        fileAct: wsFile
        fileArgs: {p: "@path"}
        when: "!$.searching"
  ws.git:
    vm: git
    blocks:
      - type: toolbar
        when: $.prChanges
        items:
          - {type: button, label: t:common.close, act: prChangesClose}
      - {type: view, id: work.prChanges, data: $.prChanges, when: $.prChanges}
      - type: box
        when: "!$.prChanges"
        blocks:
          - type: toolbar
            items:
              - {$frag: WC_PICKER}
              - {type: grow}
              - type: button
                iconOnly: true
                icon: refresh
                label: t:common.refresh
                act: refresh
                args: {k: git}
          - type: toolbar
            items:
              - type: text
                variant: meta
                parts:
                  - {icon: branch, size: s}
                  - {text: $.branch}
                tip:
                  t: wsCode.git.branchTip
                  args: [$.branch]
              - type: text
                variant: meta
                parts:
                  - of: $.drift.available
                    map:
                      "true":
                        parts: [↑, $.drift.ahead, " ↓", $.drift.behind]
                        sep: ""
                      "false": "?"
                      _: $.drift.available
                tip:
                  t: wsCode.git.driftHint
                  args:
                    - $.drift.available
                    - $.drift.ahead
                    - $.drift.behind
                    - $.drift.runtimeHead
                    - $.drift.mainHead
              - type: text
                variant: meta
                parts:
                  - {icon: lock, size: xs}
                tip: t:wsGit.readOnlyHelp
              - {type: grow}
              - type: seg
                value: $.view
                options:
                  - {v: status, label: t:wsCode.git.label, count: $.count}
                  - {v: commits, label: t:wsChanges.commit, count: $.commitCount}
                  - {v: health, label: t:wsCode.git.health}
                act: set
                args: {path: wc.gitView}
          - type: toolbar
            when:
              of: $.view
              map: {status: true, _: false}
            items:
              - {type: grow}
              - type: button
                icon: review
                label: t:wsChanges.review
                act: toggle
                args: {path: wc.reviewOpen}
                pressed: $.reviewOpen
              - type: button
                iconOnly: true
                icon: rows2
                label: t:wsChanges.unified
                act: set
                args: {path: wc.diffMode, v: unified}
                pressed:
                  of: $.diffMode
                  map: {unified: true, _: false}
              - type: button
                iconOnly: true
                icon: split2
                label: t:wsChanges.split
                act: set
                args: {path: wc.diffMode, v: split}
                pressed:
                  of: $.diffMode
                  map: {split: true, _: false}
          - type: box
            variant: card
            when: $.reviewOpen
            blocks:
              - type: settings
                rows:
                  - label: t:wsChanges.reviewTarget
                    control:
                      type: select
                      id: wc-rv-target
                      options:
                        - {v: uncommitted, label: t:wsCode.changes.targets}
                        - {v: base, label: t:wsCode.changes.baseBranch}
                        - {v: sha, label: t:wsCode.changes.specificCommit}
                        - {v: ask, label: t:wsCode.changes.customDescription}
                      value: $.review.target
                      change: wcReviewTarget
                      label: t:wsChanges.reviewTarget
                  - label: t:wsChanges.runMode
                    control:
                      type: select
                      id: wc-rv-mode
                      options:
                        - {v: session, label: t:wsCode.changes.modes}
                        - {v: thread, label: t:wsCode.changes.separateCodexThread}
                      value: $.review.mode
                      change: wcReviewMode
                      label: t:wsChanges.runMode
                  - label: t:wsChanges.baseBranch
                    when:
                      of: $.review.target
                      map: {base: true, _: false}
                    control:
                      type: input
                      id: wc-rv-base
                      value: $.review.baseVal
                      placeholder: origin/main
                      mono: true
                      input: wcReviewIn
                  - label: t:wsChanges.commit
                    when:
                      of: $.review.target
                      map: {sha: true, _: false}
                    control:
                      type: input
                      id: wc-rv-sha
                      value: $.review.shaVal
                      placeholder: t:wsChanges.commitSha
                      mono: true
                      input: wcReviewIn
                  - label: t:common.note
                    when:
                      of: $.review.target
                      map: {ask: true, _: false}
                    control:
                      type: input
                      id: wc-rv-ask
                      value: $.review.askVal
                      placeholder: t:wsChanges.notePlaceholder
                      input: wcReviewIn
              - type: toolbar
                items:
                  - type: button
                    primary: true
                    label: t:wsChanges.startReview
                    act: wcReviewStart
              - {type: label, text: t:wsChanges.recentResults}
              - type: list
                id: wcReviews
                from: $.reviews
                row:
                  layout: two
                  key: "@id"
                  lead:
                    dot:
                      of: "@state"
                      map: {running: info, done: ok, failed: danger, _: "@state"}
                    tip:
                      of: "@state"
                      map:
                        running: t:wsCode.changes.state.running
                        done: t:common.status.completed
                        failed: t:wsCode.changes.state.failed
                        _: "@state"
                  title:
                    - text:
                        of: "@target"
                        map:
                          uncommitted: t:wsCode.changes.targets
                          base: t:wsCode.changes.baseBranch
                          sha: t:wsCode.changes.specificCommit
                          ask: t:wsCode.changes.customDescription
                          _: "@target"
                    - parts:
                        - parts: [" · ", "@targetValue"]
                          sep: ""
                      when: "@targetValue"
                    - text:
                        of: "@mode"
                        map:
                          session: t:wsCode.changes.modes
                          thread: t:wsCode.changes.separateCodexThread
                          _: "@mode"
                      variant: meta
                  sub:
                    - {text: "@summary", when: "@summary"}
                    - {text: t:wsCode.changes.sub, when: "!@summary"}
                  cols:
                    - v:
                        text:
                          of: "@timestamp"
                          map:
                            "true": {of: "@at", fmt: ago}
                            _: "@at"
                      w: time
                empty: t:wsChanges.noReviews
          - type: each
            from: $.groups
            when:
              of: $.view
              map: {status: true, _: false}
            blocks:
              - type: label
                text:
                  of: "@label"
                  map:
                    staged: t:wsCode.git.group.staged
                    modified: t:films.opinionState.modified
                    untracked: t:wsCode.git.group.untracked
                    _: "@label"
                count: "@count"
              - type: list
                id:
                  t: wsCode.git.listId
                  args: ["@label"]
                from: "@items"
                item:
                  name: {of: "@path", fmt: basename}
                  parent: {of: "@path", fmt: dirname}
                  hasParent: true
                  slot: ws.changes.file
                  actsCtx: "@"
                  expand:
                    lit: {$frag: CHANGE_EXPAND}
                row: file.row
          - type: list
            id: wcGitClean
            from: []
            row: file.row
            empty: t:wsGit.clean
            when:
              - of: $.view
                map: {status: true, _: false}
              - of: $.count
                map: {"0": true, _: false}
          - type: list
            id: wcCommits
            from: $.commits
            row:
              layout: line
              key: "@short"
              lead: {who: "@author", form: avatar}
              title: "@subject"
              acts: {slot: ws.git.commit, ctx: "@actsCtx"}
              cols:
                - v:
                    text:
                      of: "@short"
                      slice: [0, 7]
                    mono: true
                  w: id
                  tip:
                    t: workbench.commitTip
                    args: ["@authorName", "@authorHandle", "@short"]
                - {v: "@date", w: time}
              expand:
                - type: list
                  inline: true
                  from: "@files"
                  item:
                    name: {of: "@path", fmt: basename}
                    parent: {of: "@path", fmt: dirname}
                    hasParent: true
                  row: file.row
            when:
              of: $.view
              map: {commits: true, _: false}
          - type: label
            text: t:wsGit.behindMain
            count: $.behind.length
            when:
              of: $.view
              map: {health: true, _: false}
          - type: list
            id: wcBehind
            from: $.behind
            row:
              layout: line
              lead: {icon: branch, size: s}
              title: "@title"
              cols:
                - v: {text: "@id", mono: true}
                  w: id
            when:
              of: $.view
              map: {health: true, _: false}
          - type: label
            text: t:wsGit.mergedBranches
            count: $.stale.length
            when:
              of: $.view
              map: {health: true, _: false}
          - type: list
            id: wcStale
            from: $.stale
            row:
              layout: line
              lead: {who: "@author", form: avatar}
              title: {text: "@branch", mono: true}
              cols:
                - {v: "@date", w: time}
            when:
              of: $.view
              map: {health: true, _: false}
          - type: label
            text: t:wsGit.worktrees
            count: $.wts.length
            when:
              of: $.view
              map: {health: true, _: false}
          - type: list
            id: wcWts
            from: $.wts
            item:
              sub: {of: "@path", fmt: basename}
            row:
              layout: two
              lead: {icon: folder, size: s}
              title: {text: "@branch", mono: true}
              inline:
                - {dot: warn, tip: t:wsGit.orphan, when: "@orphan"}
              sub: "@sub"
              cols:
                - v: {text: "@head", mono: true}
                  w: id
                - v:
                    text:
                      of: "@orphan"
                      map: {"true": t:wsCode.git.worktreeState.true, "false": t:theme.inUse, _: "@orphan"}
                  w: time
                  tone:
                    of: "@orphan"
                    map: {"true": warn, "false": "", _: "@orphan"}
            when:
              of: $.view
              map: {health: true, _: false}
  ws.terminal:
    loading: t:wsTerminal.load.loading
    error: t:wsTerminal.load.error
    empty: t:wsTerminal.load.empty
    vm: terminal
    blocks:
      - type: toolbar
        items:
          - {$frag: WC_PICKER}
          - {type: grow}
          - type: button
            iconOnly: true
            icon: refresh
            label: t:home.reconnect
            act: tmReconnect
            disabled: $.cantReconnect
            when: $.mine
          - type: button
            iconOnly: true
            icon: power
            label: t:wsTerminal.closeTerminal
            act: remove
            args: {entity: term, id: mine}
            disabled: $.cantClose
            danger: true
            when: $.mine
          - type: text
            variant: meta
            parts:
              - {icon: lock, size: s}
            tip:
              t: wsCode.terminal.roTip
              args: [$.owner]
            when: $.ro
      - type: tabs
        label: t:wsTrace.event.kindLabel.terminal
        from: $.panes
        act: set
        args: {path: wc.pane, v: "@k"}
        selected: "@on"
        tip:
          t: wsCode.terminal.paneTip
          args:
            - "@mine"
            - "@name"
            - "@handle"
            - of: "@state"
              map:
                connected: t:common.status.connected
                connecting: t:wsCode.terminal.state.connecting
                disconnected: t:wsCode.terminal.state.disconnected
                done: t:common.status.completed
                crashed: t:wsCode.terminal.state.crashed
                running: t:common.status.running
                _: "@state"
            - "@k"
        parts:
          - dot:
              of: "@state"
              map:
                connected: ok
                connecting: warn
                disconnected: danger
                running: ok
                done: idle
                crashed: danger
                _: "@state"
            when: "@mine"
          - {text: t:wsTerminal.mine, when: "@mine"}
          - {who: "@cat", form: avatar, when: "@cat"}
          - {text: "@name", when: "@cat"}
          - text:
              of: "@k"
              slice: [4, 8]
            variant: meta
            mono: true
            when: "@cat"
      - {type: component, use: terminal, props: $.screen}
  ws.preview:
    loading: t:wsPreview.load.loading
    error: t:wsPreview.load.error
    empty: t:wsPreview.load.empty
    vm: preview
    blocks:
      - type: box
        variant: viewport
        fill: true
        blocks:
          - type: tabs
            from: $.tabs
            act: set
            args: {path: pv.active, v: "@k"}
            selected: "@on"
            tip:
              of: "@port"
              gte: 1
              map:
                "true": {of: "@", fmt: endpoint}
                _: ""
            parts:
              - {text: "@title", when: "@title"}
              - text:
                  of: "@framework"
                  map:
                    storybook: t:wsPreview.storybook
                    _: {of: "@", fmt: server}
                when: ["!@title", "@port"]
              - text: t:wsCode.preview.title
                when: ["!@title", "!@port"]
            close:
              type: button
              iconOnly: true
              size: xs
              icon: close
              label: t:wsPreview.closeTab
              act: remove
              args: {entity: pvTab, id: "@k"}
            after:
              - type: button
                iconOnly: true
                icon: plus
                label: t:wsPreview.newTab
                act: add
                args: {entity: pvTab}
          - type: toolbar
            form: pvGo
            items:
              - type: button
                iconOnly: true
                icon: left
                label: t:wsPreview.back
                act: pvNav
                args: {v: back}
              - type: button
                iconOnly: true
                icon: right
                label: t:wsPreview.forward
                act: pvNav
                args: {v: fwd}
              - type: button
                iconOnly: true
                icon: refresh
                label: t:common.refresh
                act: pvNav
                args: {v: reload}
              - type: input
                id: pv-url
                value:
                  of: $.page
                  map:
                    "true":
                      of: [0, 1, 2]
                      item:
                        of: "@"
                        map:
                          "0": "localhost:"
                          "1": $.port
                          "2":
                            of: $.path
                            map: {/: "", _: $.path}
                      sep: ""
                    _: ""
                placeholder: localhost:5173
                label: t:wsPreview.address
                lead:
                  - dot:
                      of: $.connection
                      map: {unreachable: danger, hmr: ok, disconnected: warn, _: $.connection}
                    tip:
                      t: wsCode.preview.connectionTip
                      args: [$.connection, $.port]
                    when: $.connection
              - type: button
                iconOnly: true
                icon: camera
                label: t:wsPreview.screenshot
                act: pvShot
                disabled: $.noShot
              - type: button
                iconOnly: true
                icon: console
                label: t:wsPreview.console
                act: toggle
                args: {path: pv.consoleOpen}
                pressed: $.consoleOpen
          - type: notice
            tone: warn
            when: $.warn
            text: t:wsPreview.navigate.text
            action:
              type: button
              iconOnly: true
              icon: close
              label: t:common.gotIt
              act: close
              args: {path: pv.warn}
          - type: box
            fill: true
            blocks:
              - type: list
                id: preview-discovered
                label: t:wsPreview.discovered
                from: $.discovered
                when: "!$.page"
                empty: t:wsPreview.addressHint
                row:
                  layout: line
                  key: "@port"
                  title:
                    of: "@framework"
                    map:
                      "": {of: "@", fmt: server}
                      _: "@framework"
                  inline:
                    - text: {of: "@", fmt: server}
                      variant: meta
                  cols:
                    - control:
                        type: status
                        text:
                          of: "@reachable"
                          map:
                            "true": t:common.status.connected
                            "false": t:common.status.disconnected
                            _: "@reachable"
                        tone:
                          of: "@reachable"
                          map: {"true": ok, "false": warn, _: "@reachable"}
                  act: pvDiscovered
                  args: {port: "@port"}
              - type: empty
                icon: alert
                text:
                  t: wsCode.preview.down
                  args: [$.port]
                when: $.down
                action: {type: button, link: true, label: t:common.retry, act: pvRetry}
              - type: frame
                key: preview
                src: $.src
                title:
                  of: [0, 1, 2]
                  item:
                    of: "@"
                    map:
                      "0": "localhost:"
                      "1": $.port
                      "2":
                        of: $.path
                        map: {/: "", _: $.path}
                  sep: ""
                on: {message: pvFrameMessage}
                when: $.src
          - type: box
            when: $.consoleOpen
            blocks:
              - type: toolbar
                items:
                  - {type: text, text: t:wsPreview.console}
                  - type: seg
                    value: $.filter
                    options:
                      - {v: all, label: t:common.all, count: $.counts.all}
                      - {v: warn, label: t:log.level.warn, count: $.counts.warn}
                      - v: error
                        label: t:log.level.error
                        count: $.counts.error
                        warn: $.counts.error
                    act: set
                    args: {path: pv.filter}
                  - {type: grow}
                  - type: button
                    iconOnly: true
                    icon: delete
                    label: t:wsPreview.clear
                    act: remove
                    args: {entity: pvLog, all: "1"}
                    disabled: $.noClear
              - type: each
                from:
                  - {}
                item:
                  entries:
                    - from: $.log.entries
                      item:
                        level: "@level"
                        text: {of: "@args", fmt: console}
                        at: "@at"
                  total: $.log.total
                blocks:
                  - {type: component, use: log, props: "@"}
  ws.replay:
    loading: t:wsReplay.load.loading
    error: t:wsReplay.load.error
    vm: theater
    empty: t:wsReplay.empty
    blocks:
      - {type: view, id: replay.body}
  dlg.wcCreate:
    okAct: wcCreateSave
    okArgs: {k: $.k}
    title:
      of: $.k
      map:
        dir: t:composerPop.newFolder
        file: t:wsFiles.create.fields.title.file
        _: $.k
    fields:
