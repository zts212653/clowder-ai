          - from: $.members
            item:
              v:
                t: workbench.identity
                args: ["@name", "@handle"]
              label:
                t: workbench.identity
                args: ["@name", "@handle"]
        value: t:hub.suggestion.value
      - {id: dlg-why, label: t:hub.detail.reason, req: true}
      - {id: dlg-plan, label: t:wsSessions.plan, req: true}
