    recv: "@recv"
    quote: {$frag: CHAT_QUOTE}
    card: true
    acts: {$frag: CHAT_ACTS}
    body:
      - type: box
        variant: card
        blocks:
          - {$frag: CARD_TITLE}
          - {type: label, text: t:chatCards.conclusions, when: "@card.conclusions"}
          - type: text
            variant: list
            from: "@card.conclusions"
            when: "@card.conclusions"
          - {type: label, text: t:chatCards.openQuestions, when: "@card.openQuestions"}
