                      - k: t:chatCards.schedule.before
                        v: {of: "@before", fmt: jsonValue}
                      - k: t:chatCards.schedule.after
                        v: {of: "@after", fmt: jsonValue}
          - type: status
            text:
              of: "@card.effect"
              map: {"true": t:chatCards.schedule.applied, _: t:chatCards.schedule.effectUnknown}
            tone:
              of: "@card.effect"
              map: {"true": ok, _: warn}
            when:
              of: "@card.schedule.status"
              map: {approved: true, _: false}
          - type: notice
            tone: danger
            text: "@card.scheduleError"
            when: "@card.scheduleError"
          - type: toolbar
            when: ["@card.schedule", "!@card.result"]
            items:
              - type: status
                text: t:chatCards.schedule.applying
                when:
                  of: "@card.schedule.status"
                  map: {applying: true, _: false}
              - type: button
                primary: true
                label:
                  t: chatCards.schedule.approve
                  args: ["@card.schedule.mutation.kind"]
                act: scheduleDecide
                args: {mid: "@mid", decision: approve}
                when: "@card.canApproveSchedule"
              - type: button
                label: t:common.reject
                act: scheduleDecide
                args: {mid: "@mid", decision: reject}
                when:
                  of: "@card.schedule.status"
                  map: {pending: true, _: false}
          - type: kv
            from: "@card.conflict.comparison"
            item:
              k:
                of: "@field"
                map:
                  attempt: t:chatCards.field.attempt
                  nextRetry: t:chatCards.field.nextRetry
                  target: t:chatCards.field.target
                  conversation: t:chatCards.field.conversation
                  issueId: draftId
                  repo: t:chatCards.field.repo
                  reason: t:chatCards.field.reason
                  cat: t:common.cat
                  time: t:common.time
                  fallback: t:chatCards.field.fallback
                  incoming: t:chatCards.field.incoming
                  candidate: t:chatCards.field.candidate
                  _: "@field"
              v:
                parts:
                  - {text: "@canonicalName"}
                  - text: {of: "@aliases", sep: " / "}
                  - {text: "@stance"}
                sep: " · "
            when: "@card.conflict"
          - {type: status, text: t:common.loading, when: "@card.conflict.busy"}
          - type: notice
            tone: warn
            text: "@card.conflict.error"
            when: "@card.conflict.error"
          - type: choices
            group: "@card.conflict.group"
            from: "@card.conflict.options"
            item:
              label:
                t: chatCards.entity.actions
                args: ["@v"]
            value: "@card.conflict.selected"
            act: entityAction
            args: {mid: "@mid"}
            when: ["@card.conflict", "!@card.conflict.busy"]
          - type: settings
            from: "@card.conflict.replacements"
            when: ["@card.conflict.replacements", "!@card.conflict.busy"]
            row:
              label: "@label"
              control:
                type: input
                id: "@id"
                value: "@value"
                label: "@label"
                input: cafeField
                go: entityName
                goLabel: t:common.confirm
                args: {mid: "@mid"}
          - type: settings
            when: "@card.editing"
            from: "@card.editRows"
            row:
              label:
                of: "@first"
                map:
                  "true":
                    t: chat.proposalFirst
                    args: ["@label"]
                  "false": "@label"
                  _: "@label"
              ctls:
                - type: input
                  id: "@id"
                  value: "@value"
                  input: cafeField
                  label:
                    of: "@first"
                    map:
                      "true":
                        t: chat.proposalFirst
                        args: ["@label"]
                      "false": "@label"
                      _: "@label"
                  when: "!@first"
                - type: input
                  id: "@id"
                  value: "@value"
                  rows: 4
                  input: cafeField
                  label:
                    of: "@first"
                    map:
                      "true":
                        t: chat.proposalFirst
                        args: ["@label"]
                      "false": "@label"
                      _: "@label"
                  when: "@first"
          - type: toolbar
            when: "@card.asking"
            items:
              - type: input
                id: "@card.askId"
                value: ""
                go: cardAsk
                args: {mid: "@mid"}
                icon: send
                goLabel: t:chatCards.proposal.askSend
                placeholder: t:chatCards.proposal.askPh
                label: t:chatCards.proposal.requestChange
                input: cafeField
          - type: toolbar
            when: "!@card.result"
            items:
              - {$frag: CARD_STATUS}
              - {type: grow}
              - type: each
                from: "@card.decisions"
                control:
                  type: stack
                  items:
                    - type: button
                      label:
                        of: "@v"
                        map:
                          confirm: t:placement.frustrationConfirm
                          false-positive: t:placement.falsePositive
                          skip: t:chatCards.skip
                          accept: t:common.accept
                          refuse: t:common.reject
                          _: "@v"
                      act: proposalOwnerDecide
                      args:
                        mid: "@mid"
                        op: "@v"
                        offerId: "@offerId"
                        sourceMessageRevision: "@sourceMessageRevision"
                      when:
                        of: "@v"
                        map: {confirm: false, _: true}
                    - type: input
                      add: true
                      id: "@id"
                      label:
                        of: "@v"
                        map:
                          confirm: t:placement.frustrationConfirm
                          false-positive: t:placement.falsePositive
                          skip: t:chatCards.skip
                          accept: t:common.accept
                          refuse: t:common.reject
                          _: "@v"
                      placeholder: t:hub.importProject.description
                      go: proposalOwnerDecide
                      args: {mid: "@mid", op: "@v"}
                      goLabel:
                        of: "@v"
                        map:
                          confirm: t:placement.frustrationConfirm
                          false-positive: t:placement.falsePositive
                          skip: t:chatCards.skip
                          accept: t:common.accept
                          refuse: t:common.reject
                          _: "@v"
                      when:
                        of: "@v"
                        map: {confirm: true, _: false}
              - {$frag: CARD_OWNER_REFRESH}
              - type: button
                label: t:common.reject
                act: cardDecide
                args: {mid: "@mid", v: no}
                when: ["@card.rejectable", "!@card.conflict.busy"]
              - type: button
                label: t:chatCards.proposal.requestChange
                act: cardAskToggle
                args: {mid: "@mid"}
                pressed: "@card.asking"
                when: "@card.canRequestChange"
              - type: button
                label: t:chatCards.edit
                act: cardDecide
                args: {mid: "@mid", v: edit}
                when: ["@card.canEditInPlace", "!@card.editing"]
              - type: button
                label: t:common.cancel
                act: cardDecide
                args: {mid: "@mid", v: editCancel}
                when: "@card.editing"
              - type: button
                primary: true
                label:
                  of: "@card.okLabel"
                  map: {"": t:common.approve, _: "@card.okLabel"}
                act: cardDecide
                args: {mid: "@mid", v: ok}
                when: "@card.canApprove"
  chat.node/brief:
    frame: msg
    who: "@who"
    from: "@from"
    source: "@source"
    time: {of: "@time", fmt: stamp}
    receivedAt: {of: "@receivedAt", fmt: stamp}
    recv: "@recv"
    quote: {$frag: CHAT_QUOTE}
    card: true
    acts: {$frag: CHAT_ACTS}
    body:
      - type: box
        variant: card
        note: "@card.note"
        blocks:
          - {$frag: CARD_TITLE}
          - type: fold
            shape:
              of: "@card.fold.length"
              gte: 1
              map: {"true": "@card.fold", _: middle}
            key: "@mid"
            blocks:
              - {type: content, html: "@card.html", raw: true}
              - {$frag: CARD_FIELDS}
  chat.node/summary:
    frame: msg
    who: "@who"
    from: "@from"
