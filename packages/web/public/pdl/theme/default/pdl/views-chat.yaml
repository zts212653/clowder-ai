        faint: "@card.newer"
        load: "@card.load"
        error: t:runtime.readError
        retry: {act: refresh}
        blocks:
          - {$frag: CARD_TITLE}
          - {$frag: CARD_FIELDS}
          - {$frag: CARD_FOLD}
          - type: result
            status:
              of: "@kind"
              map:
                ask:
                  of: "@card.result.reason"
                  map:
                    answered: approved
                    user_rejected: rejected
                    expired: expired
                    withdrawn: withdrawn
                    _:
                      of: "@card.result.status"
                      map: {declined: rejected, _: closed}
                _: "@card.result.status"
            label:
              of:
                of: "@kind"
                map: {ask: true, _: false}
              map:
                "true":
                  of:
                    of: "@card.result.reason"
                    map: {answered: true, _: false}
                  map:
                    "true":
                      of: {of: "@card.result.selected.length", gte: 1}
                      map:
                        "true":
                          t: chatCards.ask.selected
                          args:
                            - {of: "@card.result.selected", sep: " / "}
                        "false": t:chat.answer.answered
                        _: {of: "@card.result.selected.length", gte: 1}
                    "false":
                      of:
                        of: "@card.result.reason"
                        map:
                          expired: expired
                          withdrawn: withdrawn
                          superseded: superseded
                          defaulted: defaulted
                          user_rejected: user_rejected
                          user_cancelled: user_cancelled
                          confirmation_unavailable: confirmation_unavailable
                          host_restarted: host_restarted
                          transport_lost: transport_lost
                          provider_cancelled: provider_cancelled
                          surface_publication_failed: surface_publication_failed
                          closed: closed
                          _: closed
                      map:
                        expired: t:wsEval.ledger.verdict.true
                        withdrawn: t:memoryOwners.stateNote.withdrawn
                        superseded: t:chatCards.ask.ended.superseded
                        defaulted: t:chatCards.ask.ended.defaulted
                        user_rejected: t:memoryOwners.stateNote.rejected
                        user_cancelled: t:common.status.cancelled
                        confirmation_unavailable: t:chatCards.ask.ended.confirmation_unavailable
                        host_restarted: t:chatCards.ask.ended.host_restarted
                        transport_lost: t:chatCards.ask.ended.transport_lost
                        provider_cancelled: t:chatCards.ask.ended.provider_cancelled
                        surface_publication_failed: t:chatCards.ask.ended.surface_publication_failed
                        closed: t:wsCommunity.closed
                        _:
                          of: "@card.result.reason"
                          map:
                            expired: expired
                            withdrawn: withdrawn
                            superseded: superseded
                            defaulted: defaulted
                            user_rejected: user_rejected
                            user_cancelled: user_cancelled
                            confirmation_unavailable: confirmation_unavailable
                            host_restarted: host_restarted
                            transport_lost: transport_lost
                            provider_cancelled: provider_cancelled
                            surface_publication_failed: surface_publication_failed
                            closed: closed
                            _: closed
                    _:
                      of: "@card.result.reason"
                      map: {answered: true, _: false}
                "false":
                  t: chat.rawTitle
                  args:
                    - "@card.result.label"
                    - of: "@card.result.reason"
                      map:
                        superseded: t:chat.resultState.superseded
                        unknown: t:chat.resultState.unknown
                        resolved: t:wsCommunity.resolved
                        ok: t:chat.resultState.ok
                        no: t:memoryOwners.stateNote.rejected
                        not_now: t:chat.resultState.not_now
                        partially_materialized: t:chat.resultState.partially_materialized
                        materialized: t:chat.resultState.materialized
                        withdrawn: t:memoryOwners.stateNote.withdrawn
                        approved: t:memoryOwners.stateNote.approved
                        rejected: t:memoryOwners.stateNote.rejected
                        confirmed: t:chat.resultState.confirmed
                        skipped: t:chatCards.skip
                        false_positive: t:placement.falsePositive
                        accepted: t:chat.resultState.accepted
                        declined: t:chat.resultState.declined
                        dismissed: t:chatCards.skip
                        _: "@card.result.reason"
                _:
                  of: "@kind"
                  map: {ask: true, _: false}
            key: "@card.result.key"
            when: "@card.result"
            blocks:
              - type: kv
                from: "@card.result.fields"
                item:
                  k:
                    t: chatCards.field
                    args: ["@field", "@k"]
                  v:
                    t: chat.fieldValue
                    args:
                      - "@field"
                      - t: chat.answer
                        args:
                          - "@answer"
                          - of: "@field"
                            map:
                              time: {of: "@v", fmt: hm}
                              _: {of: "@v", sep: " / "}
                      - t: cbauth.reasons
                        args: ["@v"]
                      - t: chat.memberName
                        args: ["@name", "@handle"]
                when:
                  - "@card.result.fields"
                  - "!@card.result.result"
                  - "!@card.result.editing"
                  - "!@card.result.conflict"
              - type: fold
                shape: bottom
                key: "@card.result.firstKey"
                height: s
                when:
                  - "@card.result.first"
                  - "!@card.result.result"
                  - "!@card.result.editing"
                  - "!@card.result.conflict"
                blocks:
                  - type: label
                    text:
                      t: chat.proposalFirst
                      args: ["@card.result.firstTitle"]
                  - type: content
                    html: {of: "@card.result.first", fmt: markdown}
            actions:
              - {$frag: CARD_OWNER_REFRESH}
              - type: button
                label: t:common.open
                act: threadOpen
                args: {id: "@card.openId"}
                when: "@card.open"
              - type: button
                iconOnly: true
                icon: down
                label: t:chatCards.proposal.toNewer
                act: msgJump
                args: {mid: "@card.newer"}
                when: "@card.newer"
          - type: each
            from: "@card.changes"
            blocks:
              - type: section
                title:
                  of: "@description"
                  map: {undefined: "@key", _: "@description"}
                blocks:
