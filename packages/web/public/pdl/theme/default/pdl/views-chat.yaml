            when: $.media
            blocks:
              - type: box
                load: $.history.load
                error: t:frame.loadError
                retry:
                  act: refresh
                  args: {k: review-history}
                blocks:
                  - type: list
                    from: $.history.items
                    row: review.history
                    optional: true
                    next:
                      key: review-history
                      act: refresh
                      args: {k: review-history-more}
                      when: $.history.hasMore
          - {type: view, id: content.modification, when: $.modification}
  content.modification:
    vm: contentModification
    blocks:
      - type: box
        when: $.modification
        load: $.modification.load
        error: t:frame.loadError
        retry: {act: contentModificationRead}
        blocks:
          - type: settings
            when: $.modification.canSubmit
            rows:
              - kind: field
                label: t:wsTasks.create.assignee
                when: $.modification.canChoose
                control:
                  type: select
                  id: modify-target
                  options:
                    - {v: "", label: t:pcf.choose, when: $.modification.choicesReady}
                    - from: $.modification.targetOptions
                      item: {v: "@v", label: "@label"}
                  value: $.modification.targetId
                  act: set
                  args: {path: cs.contentModification.targetId}
              - kind: field
                label: t:common.threads
                when: $.modification.canChoose
                control:
                  type: select
                  id: modify-thread
                  options:
                    - {v: "", label: t:pcf.choose, when: $.modification.choicesReady}
                    - from: $.modification.threadOptions
                      item: {v: "@v", label: "@label"}
                  value: $.modification.threadId
                  act: set
                  args: {path: cs.contentModification.threadId}
              - kind: field
                label: t:chatCards.edit
                when: $.modification.canImageEdit
                control:
                  type: select
                  id: modify-image-kind
                  options:
                    - ["", t:common.none]
                    - [erase-region, t:common.remove]
                    - [aspect-ratio, t:reviewDetail.ratio]
                  value: $.modification.imageEdit.kind
                  act: set
                  args: {path: cs.contentModification.imageEdit.kind}
              - kind: field
                label: t:reviewDetail.ratio
                when: $.modification.canImageEdit
                control:
                  type: select
                  id: modify-image-ratio
                  options:
                    - [1:1, 1:1]
                    - [16:9, 16:9]
                    - [9:16, 9:16]
                    - [4:3, 4:3]
                    - [3:4, 3:4]
                  value: $.modification.imageEdit.ratio
                  act: set
                  args: {path: cs.contentModification.imageEdit.ratio}
          - type: toolbar
            when: $.modification.canSubmit
            items:
              - type: input
                id: modify-prompt
                label: t:chatCards.proposal.askPh
                value: $.modification.prompt
                input: contentModifyPrompt
                go: contentModify
                goLabel: t:common.send
                icon: check
          - type: status
            text:
              of: $.modification.state
              map:
                cancelled: t:common.status.cancelled
                issue: t:pcf.failed
                failed: t:chat.modificationState.failed
                interrupted: t:chat.modificationState.interrupted
                unknown: t:chat.modificationState.unknown
                withdrawn_running: t:chat.modificationState.withdrawn_running
                _: $.modification.state
            when: $.modification.state
          - type: toolbar
            when: $.modification.requestId
            items:
              - type: button
                iconOnly: true
                icon: refresh
                label: t:common.refresh
                act: contentModificationRead
                args: {requestId: $.modification.requestId}
              - type: button
                label: t:common.cancel
                act: contentModificationCancel
                when: $.modification.canCancel
          - type: list
            from: $.modification.results
            row: review.result
            optional: true
  asset.canon:
    vm: assetCanon
    error: t:frame.loadError
    retry: {act: assetCanonRead}
    blocks:
      - type: box
        load: $.load
        error: t:frame.loadError
        retry: {act: assetCanonRead}
        blocks:
          - type: list
            from: $.items
            row: record.row
            optional: true
            next: {key: asset-canon, act: assetCanonMore, when: $.hasMore}
          - type: section
            title: $.detail.title
            when: $.detail
            blocks:
              - type: list
                from: $.detail.history
                row: record.row
                optional: true
                next:
                  key: asset-canon-history
                  act: assetCanonMore
                  args: {history: true}
                  when: $.detail.moreHistory
              - type: box
                when: $.detail.canWrite
                blocks:
                  - type: toolbar
                    items:
                      - type: input
                        id: canon-reason
                        label: t:chatCards.field.reason
                        value: $.detail.reasonDraft
                        input: assetCanonReason
                  - type: each
                    from: $.detail.bindings
                    blocks:
                      - type: toolbar
                        items:
                          - type: select
                            id: "@id"
                            label: "@label"
                            options:
                              - {v: "", label: t:pcf.choose}
                              - {v: clear, label: t:common.remove}
                              - from: "@enum"
                                item: {v: "@", label: "@"}
                            value: "@selected"
                            act: set
                            args:
                              path: ws.canon.bindingChoices.{id}
                              id: "@id"
                  - type: toolbar
                    items:
                      - type: choices
                        from:
                          - {v: canonical, label: t:reviewDetail.canonical}
                          - {v: experimental, label: t:reviewDetail.experimental}
                          - {v: failed, label: reviewDetail.failed}
                        value: $.detail.status
                        act: setStatus
                        args: {entity: canonAsset, id: $.detail.indexedVersionRef}
                  - type: toolbar
                    items:
                      - type: select
                        id: canon-replacement
                        label: t:films.assets
                        options:
                          - {v: "", label: t:pcf.choose}
                          - from: $.detail.replacement.options
                            item: {v: "@v", label: "@label"}
                        value: $.detail.replacement.target
                        act: set
                        args: {path: ws.canon.target}
                      - {type: button, label: t:common.confirm, act: assetCanonReplace}
                  - type: box
                    when: $.detail.update
                    blocks:
                      - {type: text, text: $.detail.update.reason}
                      - type: toolbar
                        items:
                          - type: button
                            label: t:reviewDetail.keep
                            act: assetCanonUpdate
                            args: {decision: keep_this_version}
                          - type: button
                            label: t:reviewDetail.nextVersion
                            act: assetCanonUpdate
                            args:
                              decision: next
                              prompt:
                                t: reviewDetail.useNext
                                args: [$.detail.title, $.detail.update.reason]
                            when: $.detail.update.canRequest
          - {type: view, id: content.modification, when: $.modification}
  dlg.pageAction:
    vm: pageAction
    title: t:voiceReview.pageAction.title
    blocks:
      - type: box
        load: $.load
        error: t:frame.loadError
        retry:
          act: pageAction
          args: {op: refresh}
        blocks:
          - type: status
            text:
              of: $.state
              map:
                ready: t:workbench.pageActionState.ready
                inspecting: t:workbench.pageActionState.inspecting
                awaiting_consent: t:workbench.pageActionState.awaiting_consent
                unavailable: t:members.routing.unavailable
                executing: t:wsLive.live
                settled: t:workbench.evoState.terminal
                _: $.state
          - type: settings
            rows:
              - label: t:voiceReview.pageAction.title
                when: $.canSelect
                ctls:
                  - type: select
                    id: page-action-page
                    options:
                      - {v: "", label: t:common.select}
                      - from: $.pages
                        item:
                          v: "@v"
                          label:
                            t: workbench.pageName
                            args: ["@title", "@url"]
                    value: $.pageId
                    change: pageActionPick
          - type: kv
            from: $.rows
            item:
              k:
                of: "@field"
                map:
                  request: t:evolutionFlow.request
                  page: t:workbench.pageActionField.page
                  field: t:workbench.pageActionField.field
                  operation: t:workbench.pageActionField.operation
                  scope: t:mcp.scope
                  expires: t:workbench.pageActionField.expires
                  value: t:kv.value
                  result: t:workbench.pageActionField.result
                  _: "@field"
              v:
                of: "@field"
                map:
                  request:
                    of: "@field"
                    map:
                      expires: {of: "@value", fmt: hm}
                      _: "@value"
                  page:
                    of: "@field"
                    map:
                      expires: {of: "@value", fmt: hm}
                      _: "@value"
                  field:
                    of: "@field"
                    map:
                      expires: {of: "@value", fmt: hm}
                      _: "@value"
                  operation:
                    of: "@field"
                    map:
                      expires: {of: "@value", fmt: hm}
                      _: "@value"
                  scope:
                    of: "@field"
                    map:
                      expires: {of: "@value", fmt: hm}
                      _: "@value"
                  expires:
                    of: "@field"
                    map:
                      expires: {of: "@value", fmt: hm}
                      _: "@value"
                  value:
                    of: "@field"
                    map:
                      expires: {of: "@value", fmt: hm}
                      _: "@value"
                  result:
                    of: "@value"
                    map:
                      applied: t:workbench.pageActionResult.applied
                      restored: t:chat.threadNote.true
                      no_effect: t:workbench.pageActionResult.no_effect
                      cancelled: t:memoryOwners.stateNote.withdrawn
                      denied: t:workbench.pageActionResult.denied
                      unknown: t:wsTrace.event.result.
                      _: "@value"
                  _: "@field"
          - type: toolbar
            items:
              - type: button
                iconOnly: true
                icon: refresh
                label: t:common.refresh
                act: pageAction
                args: {op: refresh}
              - type: button
                label: t:voiceReview.pageAction.inspect
                act: pageAction
                args: {op: inspect}
                when: $.canInspect
              - type: button
                primary: true
                label: t:common.confirm
                act: pageAction
                args: {op: confirm, previewId: $.previewId}
                when: $.canConfirm
              - type: button
                label: t:wsTeam.signal.withdraw
                act: pageAction
                args: {op: revoke, previewId: $.previewId}
                when: $.canRevoke
  dlg.queueTargets:
    vm: queueTargets
    title: t:queue.targets.title
    blocks:
      - type: box
        load: $.load
        error: t:frame.loadError
        retry: {act: queueTargetsRead}
        blocks:
          - type: toolbar
            items:
              - type: select
                variant: member
                multi: true
                id: queue-target-members
                options: $.pool
                value: $.selected
                act: pick
                args: {path: cs.queueTargets.selected}
                label: t:queue.targets.title
          - type: list
            id: queue-target-strategies
            from: $.targets
            row:
              layout: line
              key: "@id"
              title: {who: "@id"}
              cols:
                - control:
                    type: seg
                    value: "@strategy"
                    act: set
                    args:
                      path: cs.queueTargets.strategies.{id}
                      id: "@id"
                    options:
                      - {v: guide_reply, label: t:queue.send.steerReply}
                      - {v: interrupt_reply, label: t:queue.send.interruptAndSend}
          - type: list
            id: queue-target-dispatched
            from: $.dispatched
            optional: true
            row:
              layout: line
              key: "@id"
              title: {who: "@id"}
              inline:
                - {text: t:delivery.delivered, variant: meta}
          - type: toolbar
            items:
              - type: button
                label: t:common.cancel
                act: close
                args: {popup: dialog}
              - type: button
                primary: true
                label: t:common.confirm
                act: queueTargetsSave
                when: $.canSave
  dlg.messageRetry:
    title: t:chatMessage.retry.title
    text:
      t: chatMessage.retry.text
      args: [$.name]
    ok: t:common.retry
  dlg.tagDelete:
    title:
      t: tagManager.delete.title
      args: [$.name]
    text: t:tagManager.delete.text
    ok: t:classify.deleteTag
  dlg.memoryWiden:
    title: t:memoryOwners.candidate.title
    text:
      t: memoryOwners.widen
      args: [$.source, $.target]
    ok: t:memoryOwners.candidate.ok
    danger: false
  dlg.memoryRebuild:
    title:
      t: memoryOwners.rebuild.title
      args:
        - t: chat.rebuildTarget
          args: [$.all, $.name]
    text:
      t: memoryOwners.rebuild.text
      args: [$.minutes]
    ok: t:memoryOwners.rebuild.ok
    danger: true
  dlg.queueSend:
    title: t:queue.send.title
