    text: t:memoryOwners.forgetDialog.consequences
    fields:
      - {id: dlg-ck, check: t:memoryOwners.forgetDialog.check}
    ok:
      of: $.person
      map:
        "true": t:memoryOwners.forget
        "false": t:chat.forgetTitle.false
        _: $.person
    danger: true
  dlg.projectClone:
