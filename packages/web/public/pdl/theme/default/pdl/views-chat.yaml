              - type: button
                label: t:common.open
                act: threadOpen
                args: {id: "@card.openId"}
                when: "@card.open"
              - type: button
                iconOnly: true
                icon: down
                label: t:chatCards.proposal.toNewer
                act: msgJump
                args: {mid: "@card.newer"}
                when: "@card.newer"
          - type: each
            from: "@card.recoveries"
            blocks:
              - type: box
                load: "@load"
                error: t:runtime.readError
                retry: {act: cloudRecoveryRead, args: "@args"}
                blocks:
                  - type: kv
                    from:
                      - {k: t:chatCards.field.target, who: "@args.targetCatId"}
