  card.proposal:
    frame: msg
    who: "@who"
    from: "@from"
    source: "@source"
    time: {of: "@time", fmt: stamp}
    receivedAt: {of: "@receivedAt", fmt: stamp}
    recv: "@recv"
    quote: {$frag: CHAT_QUOTE}
    card: true
    delivery: {$frag: CHAT_DELIVERY}
    acts: {$frag: CHAT_ACTS}
    body:
      - type: box
        variant: card
        faint: "@card.newer"
        load: "@card.load"
        error: t:runtime.readError
        retry: {act: refresh}
        blocks:
          - {$frag: CARD_TITLE}
          - {$frag: CARD_FIELDS}
          - {$frag: CARD_FOLD}
          - type: result
            status:
              of: "@kind"
              map:
                ask:
                  of: "@card.result.reason"
                  map:
                    answered: approved
                    user_rejected: rejected
                    expired: expired
                    withdrawn: withdrawn
                    _:
                      of: "@card.result.status"
                      map: {declined: rejected, _: closed}
                _: "@card.result.status"
            label:
              of:
                of: "@kind"
                map: {ask: true, _: false}
              map:
                "true":
                  of:
                    of: "@card.result.reason"
                    map: {answered: true, _: false}
                  map:
                    "true":
                      of: {of: "@card.result.selected.length", gte: 1}
                      map:
                        "true":
                          t: chatCards.ask.selected
                          args:
                            - {of: "@card.result.selected", sep: " / "}
                        "false": t:chat.answer.answered
                        _: {of: "@card.result.selected.length", gte: 1}
                    "false":
                      of:
                        of: "@card.result.reason"
                        map:
                          expired: expired
                          withdrawn: withdrawn
                          superseded: superseded
                          defaulted: defaulted
                          user_rejected: user_rejected
                          user_cancelled: user_cancelled
                          confirmation_unavailable: confirmation_unavailable
                          host_restarted: host_restarted
                          transport_lost: transport_lost
                          provider_cancelled: provider_cancelled
                          surface_publication_failed: surface_publication_failed
                          closed: closed
                          _: closed
                      map:
                        expired: t:wsEval.ledger.verdict.true
                        withdrawn: t:memoryOwners.stateNote.withdrawn
                        superseded: t:chatCards.ask.ended.superseded
                        defaulted: t:chatCards.ask.ended.defaulted
                        user_rejected: t:memoryOwners.stateNote.rejected
                        user_cancelled: t:common.status.cancelled
                        confirmation_unavailable: t:chatCards.ask.ended.confirmation_unavailable
                        host_restarted: t:chatCards.ask.ended.host_restarted
                        transport_lost: t:chatCards.ask.ended.transport_lost
                        provider_cancelled: t:chatCards.ask.ended.provider_cancelled
                        surface_publication_failed: t:chatCards.ask.ended.surface_publication_failed
                        closed: t:wsCommunity.closed
                        _:
                          of: "@card.result.reason"
                          map:
                            expired: expired
                            withdrawn: withdrawn
                            superseded: superseded
                            defaulted: defaulted
                            user_rejected: user_rejected
                            user_cancelled: user_cancelled
                            confirmation_unavailable: confirmation_unavailable
                            host_restarted: host_restarted
                            transport_lost: transport_lost
                            provider_cancelled: provider_cancelled
                            surface_publication_failed: surface_publication_failed
                            closed: closed
                            _: closed
                    _:
                      of: "@card.result.reason"
                      map: {answered: true, _: false}
                "false":
                  t: chat.rawTitle
                  args:
                    - "@card.result.label"
                    - of: "@card.result.reason"
                      map:
                        superseded: t:chat.resultState.superseded
                        unknown: t:chat.resultState.unknown
                        resolved: t:wsCommunity.resolved
                        ok: t:chat.resultState.ok
                        no: t:memoryOwners.stateNote.rejected
                        not_now: t:chat.resultState.not_now
                        partially_materialized: t:chat.resultState.partially_materialized
                        materialized: t:chat.resultState.materialized
                        withdrawn: t:memoryOwners.stateNote.withdrawn
                        approved: t:memoryOwners.stateNote.approved
                        rejected: t:memoryOwners.stateNote.rejected
                        confirmed: t:chat.resultState.confirmed
                        skipped: t:chatCards.skip
                        false_positive: t:placement.falsePositive
                        accepted: t:chat.resultState.accepted
                        declined: t:chat.resultState.declined
                        dismissed: t:chatCards.skip
                        _: "@card.result.reason"
                _:
                  of: "@kind"
                  map: {ask: true, _: false}
            key: "@card.result.key"
            when: "@card.result"
            blocks:
              - type: kv
                from: "@card.result.fields"
                item:
                  k:
                    t: chatCards.field
                    args: ["@field", "@k"]
                  v:
                    t: chat.fieldValue
                    args:
                      - "@field"
                      - t: chat.answer
                        args:
                          - "@answer"
                          - of: "@field"
                            map:
                              time: {of: "@v", fmt: hm}
                              _: {of: "@v", sep: " / "}
                      - t: cbauth.reasons
                        args: ["@v"]
                      - t: chat.memberName
                        args: ["@name", "@handle"]
                when:
                  - "@card.result.fields"
                  - "!@card.result.result"
                  - "!@card.result.editing"
                  - "!@card.result.conflict"
              - type: fold
                shape: bottom
                key: "@card.result.firstKey"
                height: s
                when:
                  - "@card.result.first"
                  - "!@card.result.result"
                  - "!@card.result.editing"
                  - "!@card.result.conflict"
                blocks:
                  - type: label
                    text:
                      t: chat.proposalFirst
                      args: ["@card.result.firstTitle"]
                  - type: content
                    html: {of: "@card.result.first", fmt: markdown}
            actions:
              - {$frag: CARD_OWNER_REFRESH}
              - type: button
                label: t:common.open
                act: threadOpen
                args: {id: "@card.openId"}
                when: "@card.open"
              - type: button
                iconOnly: true
                icon: down
                label: t:chatCards.proposal.toNewer
                act: msgJump
                args: {mid: "@card.newer"}
                when: "@card.newer"
          - type: each
            from: "@card.changes"
            blocks:
              - type: section
                title:
                  of: "@description"
                  map: {undefined: "@key", _: "@description"}
                blocks:
                  - type: kv
                    from:
                      - k: t:chatCards.schedule.before
                        v: {of: "@before", fmt: jsonValue}
                      - k: t:chatCards.schedule.after
                        v: {of: "@after", fmt: jsonValue}
          - type: status
            text:
              of: "@card.effect"
              map: {"true": t:chatCards.schedule.applied, _: t:chatCards.schedule.effectUnknown}
            tone:
              of: "@card.effect"
              map: {"true": ok, _: warn}
            when:
              of: "@card.schedule.status"
              map: {approved: true, _: false}
          - type: notice
            tone: danger
            text: "@card.scheduleError"
            when: "@card.scheduleError"
          - type: toolbar
            when: ["@card.schedule", "!@card.result"]
            items:
              - type: status
                text: t:chatCards.schedule.applying
                when:
                  of: "@card.schedule.status"
                  map: {applying: true, _: false}
              - type: button
                primary: true
                label:
                  t: chatCards.schedule.approve
                  args: ["@card.schedule.mutation.kind"]
                act: scheduleDecide
                args: {mid: "@mid", decision: approve}
                when: "@card.canApproveSchedule"
              - type: button
                label: t:common.reject
                act: scheduleDecide
                args: {mid: "@mid", decision: reject}
                when:
                  of: "@card.schedule.status"
                  map: {pending: true, _: false}
          - type: kv
            from: "@card.conflict.comparison"
            item:
              k:
                of: "@field"
                map:
                  attempt: t:chatCards.field.attempt
                  nextRetry: t:chatCards.field.nextRetry
                  target: t:chatCards.field.target
                  conversation: t:chatCards.field.conversation
                  issueId: draftId
                  repo: t:chatCards.field.repo
                  reason: t:chatCards.field.reason
                  cat: t:common.cat
                  time: t:common.time
                  fallback: t:chatCards.field.fallback
                  incoming: t:chatCards.field.incoming
                  candidate: t:chatCards.field.candidate
                  _: "@field"
              v:
                parts:
                  - {text: "@canonicalName"}
                  - text: {of: "@aliases", sep: " / "}
                  - {text: "@stance"}
                sep: " · "
            when: "@card.conflict"
          - {type: status, text: t:common.loading, when: "@card.conflict.busy"}
          - type: notice
            tone: warn
            text: "@card.conflict.error"
            when: "@card.conflict.error"
          - type: choices
            group: "@card.conflict.group"
            from: "@card.conflict.options"
            item:
              label:
                t: chatCards.entity.actions
                args: ["@v"]
            value: "@card.conflict.selected"
            act: entityAction
            args: {mid: "@mid"}
            when: ["@card.conflict", "!@card.conflict.busy"]
          - type: settings
            from: "@card.conflict.replacements"
            when: ["@card.conflict.replacements", "!@card.conflict.busy"]
            row:
              label: "@label"
              control:
                type: input
                id: "@id"
                value: "@value"
                label: "@label"
                input: cafeField
                go: entityName
                goLabel: t:common.confirm
                args: {mid: "@mid"}
          - type: settings
            when: "@card.editing"
            from: "@card.editRows"
            row:
              label:
                of: "@first"
                map:
                  "true":
                    t: chat.proposalFirst
                    args: ["@label"]
                  "false": "@label"
                  _: "@label"
              ctls:
                - type: input
                  id: "@id"
                  value: "@value"
                  input: cafeField
                  label:
                    of: "@first"
                    map:
                      "true":
                        t: chat.proposalFirst
                        args: ["@label"]
                      "false": "@label"
                      _: "@label"
                  when: "!@first"
                - type: input
                  id: "@id"
                  value: "@value"
                  rows: 4
                  input: cafeField
                  label:
                    of: "@first"
                    map:
                      "true":
                        t: chat.proposalFirst
                        args: ["@label"]
                      "false": "@label"
                      _: "@label"
                  when: "@first"
          - type: toolbar
            when: "@card.asking"
            items:
              - type: input
                id: "@card.askId"
                value: ""
                go: cardAsk
                args: {mid: "@mid"}
                icon: send
                goLabel: t:chatCards.proposal.askSend
                placeholder: t:chatCards.proposal.askPh
                label: t:chatCards.proposal.requestChange
                input: cafeField
          - type: toolbar
            when: "!@card.result"
            items:
              - {$frag: CARD_STATUS}
              - {type: grow}
              - type: each
                from: "@card.decisions"
                control:
                  type: stack
                  items:
                    - type: button
                      label:
                        of: "@v"
                        map:
                          confirm: t:placement.frustrationConfirm
                          false-positive: t:placement.falsePositive
                          skip: t:chatCards.skip
                          accept: t:common.accept
                          refuse: t:common.reject
                          _: "@v"
                      act: proposalOwnerDecide
                      args:
                        mid: "@mid"
                        op: "@v"
                        offerId: "@offerId"
                        sourceMessageRevision: "@sourceMessageRevision"
                      when:
                        of: "@v"
                        map: {confirm: false, _: true}
                    - type: input
                      add: true
                      id: "@id"
                      label:
                        of: "@v"
                        map:
                          confirm: t:placement.frustrationConfirm
                          false-positive: t:placement.falsePositive
                          skip: t:chatCards.skip
                          accept: t:common.accept
                          refuse: t:common.reject
                          _: "@v"
                      placeholder: t:hub.importProject.description
                      go: proposalOwnerDecide
                      args: {mid: "@mid", op: "@v"}
                      goLabel:
                        of: "@v"
                        map:
                          confirm: t:placement.frustrationConfirm
                          false-positive: t:placement.falsePositive
                          skip: t:chatCards.skip
                          accept: t:common.accept
                          refuse: t:common.reject
                          _: "@v"
                      when:
                        of: "@v"
                        map: {confirm: true, _: false}
              - {$frag: CARD_OWNER_REFRESH}
              - type: button
                label: t:common.reject
                act: cardDecide
                args: {mid: "@mid", v: no}
                when: ["@card.rejectable", "!@card.conflict.busy"]
              - type: button
                label: t:chatCards.proposal.requestChange
                act: cardAskToggle
                args: {mid: "@mid"}
                pressed: "@card.asking"
                when: "@card.canRequestChange"
              - type: button
                label: t:chatCards.edit
                act: cardDecide
                args: {mid: "@mid", v: edit}
                when: ["@card.canEditInPlace", "!@card.editing"]
              - type: button
                label: t:common.cancel
                act: cardDecide
                args: {mid: "@mid", v: editCancel}
                when: "@card.editing"
              - type: button
                primary: true
                label:
                  of: "@card.okLabel"
                  map: {"": t:common.approve, _: "@card.okLabel"}
                act: cardDecide
                args: {mid: "@mid", v: ok}
                when: "@card.canApprove"
  card.ask:
    frame: msg
    who: "@who"
    from: "@from"
    source: "@source"
    time: {of: "@time", fmt: stamp}
    receivedAt: {of: "@receivedAt", fmt: stamp}
    recv: "@recv"
    quote: {$frag: CHAT_QUOTE}
    card: true
    acts: {$frag: CHAT_ACTS}
    body:
      - type: box
        variant: card
        load: "@card.load"
        error: t:runtime.readError
        retry:
          act: refresh
          args: {k: runtime-interactions}
        blocks:
          - {$frag: CARD_TITLE}
          - {type: text, text: "@card.description", when: "@card.description"}
          - type: fold
            shape: bottom
            key: "@mid"
            height: s
            blocks:
              - type: each
                from: "@card.qs"
                blocks:
                  - type: label
                    text: ""
                    when: "@canSkip"
                    action:
                      type: button
                      label: t:chatCards.skip
                      act: toggle
                      args:
                        path: cs.f.skip-{k}
                        k: "@skipKey"
                      pressed: "@skipped"
                      stay: true
                  - type: text
                    variant: para
                    parts:
                      - {chip: "@header", when: "@header"}
                      - {lit: " ", when: "@header"}
                      - {text: "@question"}
                    when: "!@skipped"
                  - type: choices
                    group: "@group"
                    from: "@opts"
                    when: ["!@skipped", "@opts", "!@multiSelect"]
                  - type: choices
                    variant: multi
                    from: "@opts"
                    act: toggle
                    args:
                      path: cs.f.m-{k}.{v}
                      k: "@pickKey"
                    when: ["!@skipped", "@opts", "@multiSelect"]
                  - type: toolbar
                    when:
                      - "!@skipped"
                      - of: "@isOther"
                        map:
                          "true": true
                          _:
                            of: "@secret"
                            map:
                              "true": true
                              _:
                                of: "@opts.length"
                                map: {"0": true, _: false}
                    items:
                      - type: input
                        id: "@freeId"
                        placeholder:
                          of: "@secret"
                          map:
                            "true":
                              t: chat.freePlaceholder.true
                              args:
                                - t: chat.freePlain
                                  args:
                                    - {of: "@opts.length", gte: 1}
                            "false":
                              t: chat.freePlain
                              args:
                                - {of: "@opts.length", gte: 1}
                            _: "@secret"
                        secret: "@secret"
            when: "@card.qs"
          - type: settings
            from: "@card.fields"
            when: "@card.fields"
            row:
              label: "@label"
              help: "@help"
              ctls:
                - type: switch
                  label: "@label"
                  value:
                    of: "@value"
                    map: {"true": true, _: false}
                  act: set
                  args:
                    path: cs.runtime.drafts.{id}.values.{key}
                    id: "@interactionId"
                    key: "@key"
                    v:
                      of: "@value"
                      map: {"true": "false", _: "true"}
                    cast: bool
                  when:
                    of: "@type"
                    map: {boolean: true, _: false}
                - type: select
                  id: "@id"
                  options:
                    - {v: "", label: t:pcf.choose}
                    - from: "@enum"
                      item: {v: "@", label: "@"}
                  value: "@value"
                  change: runtimeSet
                  args:
                    path: cs.runtime.drafts.{id}.values.{key}
                    id: "@interactionId"
                    key: "@key"
                  when:
                    - "@enum"
                    - of: "@type"
                      map: {boolean: false, _: true}
                - type: input
                  id: "@id"
                  value: "@value"
                  label: "@label"
                  num:
                    of: "@type"
                    map: {number: true, integer: true, _: false}
                  input: runtimeValue
                  args: {id: "@interactionId", key: "@key"}
                  when:
                    - "!@enum"
                    - of: "@type"
                      map: {boolean: false, _: true}
          - type: choices
            group: "@card.group"
            from: "@card.choices"
            value: "@card.selected"
            act: runtimePick
            args: {id: "@card.id"}
            when:
              - "@card.choices"
              - of: "@card.interactiveType"
                map: {multi-select: false, _: true}
          - type: choices
            variant: multi
            from: "@card.choices"
            act: runtimePick
            args: {id: "@card.id"}
            when:
              - "@card.choices"
              - of: "@card.interactiveType"
                map: {multi-select: true, _: false}
          - type: input
            id: "@card.customId"
            value: "@card.customInput"
            label: t:runtime.customInput
            input: runtimeCustom
            args: {id: "@card.id"}
            when: "@card.canCustom"
          - type: result
            status:
              of: "@kind"
              map:
                ask:
                  of: "@card.result.reason"
                  map:
                    answered: approved
                    user_rejected: rejected
                    expired: expired
                    withdrawn: withdrawn
                    _:
                      of: "@card.result.status"
                      map: {declined: rejected, _: closed}
                _: "@card.result.status"
            label:
              of:
                of: "@kind"
                map: {ask: true, _: false}
              map:
                "true":
                  of:
                    of: "@card.result.reason"
                    map: {answered: true, _: false}
                  map:
                    "true":
                      of: {of: "@card.result.selected.length", gte: 1}
                      map:
                        "true":
                          t: chatCards.ask.selected
                          args:
                            - {of: "@card.result.selected", sep: " / "}
                        "false": t:chat.answer.answered
                        _: {of: "@card.result.selected.length", gte: 1}
                    "false":
                      of:
                        of: "@card.result.reason"
                        map:
                          expired: expired
                          withdrawn: withdrawn
                          superseded: superseded
                          defaulted: defaulted
                          user_rejected: user_rejected
                          user_cancelled: user_cancelled
                          confirmation_unavailable: confirmation_unavailable
                          host_restarted: host_restarted
                          transport_lost: transport_lost
                          provider_cancelled: provider_cancelled
                          surface_publication_failed: surface_publication_failed
                          closed: closed
                          _: closed
                      map:
                        expired: t:wsEval.ledger.verdict.true
                        withdrawn: t:memoryOwners.stateNote.withdrawn
                        superseded: t:chatCards.ask.ended.superseded
                        defaulted: t:chatCards.ask.ended.defaulted
                        user_rejected: t:memoryOwners.stateNote.rejected
                        user_cancelled: t:common.status.cancelled
                        confirmation_unavailable: t:chatCards.ask.ended.confirmation_unavailable
                        host_restarted: t:chatCards.ask.ended.host_restarted
                        transport_lost: t:chatCards.ask.ended.transport_lost
                        provider_cancelled: t:chatCards.ask.ended.provider_cancelled
                        surface_publication_failed: t:chatCards.ask.ended.surface_publication_failed
                        closed: t:wsCommunity.closed
                        _:
                          of: "@card.result.reason"
                          map:
                            expired: expired
                            withdrawn: withdrawn
                            superseded: superseded
                            defaulted: defaulted
                            user_rejected: user_rejected
                            user_cancelled: user_cancelled
                            confirmation_unavailable: confirmation_unavailable
                            host_restarted: host_restarted
                            transport_lost: transport_lost
                            provider_cancelled: provider_cancelled
                            surface_publication_failed: surface_publication_failed
                            closed: closed
                            _: closed
                    _:
                      of: "@card.result.reason"
                      map: {answered: true, _: false}
                "false":
                  t: chat.rawTitle
                  args:
                    - "@card.result.label"
                    - of: "@card.result.reason"
                      map:
                        superseded: t:chat.resultState.superseded
                        unknown: t:chat.resultState.unknown
                        resolved: t:wsCommunity.resolved
                        ok: t:chat.resultState.ok
                        no: t:memoryOwners.stateNote.rejected
                        not_now: t:chat.resultState.not_now
                        partially_materialized: t:chat.resultState.partially_materialized
                        materialized: t:chat.resultState.materialized
                        withdrawn: t:memoryOwners.stateNote.withdrawn
                        approved: t:memoryOwners.stateNote.approved
                        rejected: t:memoryOwners.stateNote.rejected
                        confirmed: t:chat.resultState.confirmed
                        skipped: t:chatCards.skip
                        false_positive: t:placement.falsePositive
                        accepted: t:chat.resultState.accepted
                        declined: t:chat.resultState.declined
                        dismissed: t:chatCards.skip
                        _: "@card.result.reason"
                _:
                  of: "@kind"
                  map: {ask: true, _: false}
            key: "@card.result.key"
            when: "@card.result"
            blocks:
              - type: kv
                from: "@card.result.fields"
                item:
                  k:
                    t: chatCards.field
                    args: ["@field", "@k"]
                  v:
                    t: chat.fieldValue
                    args:
                      - "@field"
                      - t: chat.answer
                        args:
                          - "@answer"
                          - of: "@field"
                            map:
                              time: {of: "@v", fmt: hm}
                              _: {of: "@v", sep: " / "}
                      - t: cbauth.reasons
                        args: ["@v"]
                      - t: chat.memberName
                        args: ["@name", "@handle"]
                when:
                  - "@card.result.fields"
                  - "!@card.result.result"
                  - "!@card.result.editing"
                  - "!@card.result.conflict"
            actions:
              - {$frag: CARD_OWNER_REFRESH}
              - type: button
                label: t:common.open
                act: threadOpen
                args: {id: "@card.openId"}
                when: "@card.open"
              - type: button
                iconOnly: true
                icon: down
                label: t:chatCards.proposal.toNewer
                act: msgJump
                args: {mid: "@card.newer"}
                when: "@card.newer"
          - type: toolbar
            when: "!@card.result"
            items:
              - type: button
                label: t:runtime.openAuthorization
                act: openUrl
                args: {url: "@card.url"}
                when: "@card.url"
              - type: button
                label: t:runtime.answerInChat
                act: runtimeConversationInsert
                args: {id: "@card.id"}
                when: "@card.allowText"
              - {type: grow}
              - type: button
                label: t:common.reject
                act: runtimeRespond
                args: {id: "@card.id", reject: true}
                when: "@card.canReject"
              - type: each
                from: "@card.decisions"
                control:
                  type: button
                  label: "@label"
                  primary: false
                  act: runtimeRespond
                  args: {id: "@id", decisionId: "@v"}
                  when:
                    of: "@outcome"
                    map: {accept: false, _: true}
              - type: each
                from: "@card.decisions"
                control:
                  type: button
                  label: "@label"
                  primary: true
                  act: runtimeRespond
                  args: {id: "@id", decisionId: "@v"}
                  when:
                    of: "@outcome"
                    map: {accept: true, _: false}
              - type: button
                primary: true
                label: t:inbox.submitAnswer
                act: cafeAskSubmit
                args: {mid: "@mid", p: ask}
                when: "@card.qs"
              - type: button
                primary: true
                label: t:inbox.submitAnswer
                act: runtimeRespond
                args: {id: "@card.id"}
                when: "@card.choices"
  card.brief:
    frame: msg
    who: "@who"
    from: "@from"
