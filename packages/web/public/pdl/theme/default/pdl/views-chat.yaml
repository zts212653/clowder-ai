              - label: t:work.view.copyLink
                act: copy
                args: {v: $.openPath}
      - {type: view, id: work.body}
  work.body:
    vm: work
    blocks:
      - type: box
        key: work-content
        note: "2"
        load: $.bodyLoad
        loading: t:work.restoring
        blocks:
          - type: box
            when: $.documentReview
            load: $.documentReview.load
            error: t:frame.loadError
            retry:
              act: refresh
              args: {k: $.documentReview.retryKey}
            blocks:
              - type: toolbar
                items:
                  - type: button
                    label: t:frame.speak
                    act: documentListen
                    args: {op: start, work: $.documentReview.work}
                    when: $.documentReview.listen.canStart
                  - type: button
                    label: t:player.pause
                    act: documentListen
                    args: {op: pause, work: $.documentReview.work}
                    when: $.documentReview.listen.canPause
                  - type: button
                    label: t:player.play
                    act: documentListen
                    args: {op: resume, work: $.documentReview.work}
                    when: $.documentReview.listen.canResume
              - type: list
                from: $.documentReview.quotes
                row: review.quote
                optional: true
              - type: each
                from: $.documentReview.annotations
                blocks:
                  - {type: text, text: "@title"}
                  - {type: status, text: t:films.sourceChanged, when: "@sourceChanged"}
                  - {type: list, from: "@replies", row: record.row, optional: true}
                  - type: toolbar
                    items:
                      - type: button
                        label: t:wsCommunity.resolved
                        act: setStatus
                        args: {entity: workspaceAnnotation, id: "@id", v: resolved}
                        when: ["@canSetState", "!@resolved"]
                      - type: button
                        label: t:films.reopen
                        act: setStatus
                        args: {entity: workspaceAnnotation, id: "@id", v: open}
                        when: ["@canSetState", "@resolved"]
                      - type: input
                        id: "@replyId"
                        label: t:workbench.liveActionWhat.false
                        go: workTextReply
                        args: {id: "@id", work: $.documentReview.work}
                        goLabel: t:common.send
                        icon: check
                        when: "@canReply"
          - type: toolbar
            when: $.canonReference
            items:
              - type: button
                label: t:reviewDetail.canon
                act: assetCanonRead
                args: {reference: $.canonReference}
          - {type: view, id: asset.canon, when: $.canon}
          - type: toolbar
            when: $.text
            items:
              - {type: text, variant: meta, text: $.text.path}
              - {type: text, variant: meta, text: t:settingsUi.mcp.tag.readonly}
              - type: seg
                value: $.text.mode
                options:
                  - {v: render, label: t:work.view.rendered}
                  - {v: src, label: t:work.view.source}
                act: set
                args: {path: cs.ws.mode}
              - type: button
                iconOnly: true
                icon: copy
                label: t:work.copyContent
                act: copy
                args: {v: $.text.md}
          - type: pre
            text: $.text.md
            annotations: $.text.annotations
            when:
              of: $.text.mode
              map: {src: true, _: false}
          - type: markdown
            text: $.text.md
            annotations: $.text.annotations
            when:
              - $.text
              - of: $.text.mode
                map: {src: false, _: true}
          - type: toolbar
            when: $.canReview
            items:
              - type: button
                label: t:chat.contextKind.review
                act: workReview
                args: {id: $.id}
          - type: view
            id: media.content
            data: $.media
            when: [$.media, "!$.review"]
          - type: frame
            icon: globe
            title: $.title
            note: t:work.view.previewExample
            when:
              of: $.kind
              map:
                text: false
                image: false
                video: false
                audio: false
                pr: false
                bin: false
                nosrc: false
                widget: false
                _: true
          - {type: view, id: media.review, when: $.review}
          - type: frame
            html: $.widget.html
            title: $.title
            when: $.widget
            load: $.widget.load
            error: t:work.widgetFailed
            empty: t:work.widgetGone
            retry:
              act: cafeWidgetRetry
              args: {k: $.widget.key}
          - {type: view, id: work.prChanges, data: $.pr.changes, when: $.pr}
          - type: toolbar
            when: $.coverReference
            items:
              - type: button
                label: t:works.cover.title
                act: workCoverOpen
                args: {id: $.id}
          - type: settings
            when: $.pr
            rows:
              - {label: PR, value: $.pr.ref, mono: true}
              - {label: t:common.state, value: OPEN · Draft}
              - {label: HEAD, value: bf43d4ec55, mono: true}
          - type: toolbar
            when: $.pr
            items:
              - type: button
                label: t:works.pr.changes
                act: workPrChanges
                args: {id: $.id}
              - type: button
                icon: openExternal
                label: t:work.openGithub
                act: openUrl
                args: {url: $.pr.url}
          - {$frag: FILE_INFO}
          - type: notice
            when: $.bin
            text: t:work.noPreview
            action:
              - type: button
                label: t:work.openNewTab
                act: openUrl
                args: {url: $.bin.source}
              - type: button
                label: t:common.download
                act: download
                args: {source: $.bin.source, name: $.title}
          - type: notice
            tone: warn
            when:
              of: $.kind
              map: {nosrc: true, _: false}
            text: t:work.noSource
            action:
              type: button
              label: t:work.openInChat
              act: cafeWorkSrc
              args: {i: $.i}
  media.content:
    bare: true
    blocks:
      - type: component
        use: media
        props:
          data: "@"
          pick:
            - act: workReviewPick
              when: ["@review", "@canPick"]
            - act: workSelect
              args: {id: "@id"}
              when: ["!@review", "@canPick"]
          edit:
            - {act: reviewMarkupEdit, when: "@canWrite"}
          mark:
            - act: workReviewEdit
              args: {id: "@annotationId"}
              when: "@canEdit"
  media.preview:
    bare: true
    vm: mediaPreview
    blocks:
      - type: dialog
        pop: media
        layout: viewport
        focus: true
        title: $.title
        actions:
          - type: button
            iconOnly: true
            icon: left
            label: t:mediaReview.lightbox.previousImage
            when: $.many
            act: set
            args: {path: cs.lb.i, add: -1}
          - type: button
            iconOnly: true
            icon: right
            label: t:mediaReview.lightbox.nextImage
            when: $.many
            act: set
            args: {path: cs.lb.i, add: 1}
          - type: button
            iconOnly: true
            icon: jump
            label: t:work.openInChat
            act: cafeWorkSrc
            args: {i: $.i}
            when:
              of: $.target.kind
              map: {work: true, _: false}
          - type: button
            iconOnly: true
            icon: folder
            label: t:workbench.file.openProject
            act: workOpenFile
            args: $.file
            when: $.file
          - type: button
            danger: true
            label: t:common.delete
            act: remove
            args: {entity: path, id: $.file.path, worktreeId: $.file.worktreeId}
            when: $.file
          - type: button
            iconOnly: true
            icon: download
            label: t:common.download
            act: workDownload
            args: {id: $.id}
            when:
              of: $.target.kind
              map: {work: true, _: false}
        blocks:
          - type: text
            variant: meta
            text:
              t: mediaReview.lightbox.sub
              args:
                - $.author
                - $.version
                - {of: $.at, fmt: at}
                - of: $.many
                  map:
                    "true":
                      of: [0, 1, 2, 3]
                      item:
                        of: "@"
                        map: {"0": " · ", "1": $.index, "2": " / ", "3": $.total}
                      sep: ""
                    "false": ""
                    _: $.many
            when:
              of: $.target.kind
              map: {work: true, _: false}
          - type: view
            id: work.body
            when:
              of: $.target.kind
              map: {work: true, _: false}
          - {type: component, use: media, props: $.media, when: $.media}
          - type: toolbar
            when: $.selection
            items:
              - type: input
                id: media-selection-words
                label: t:common.note
                value: $.words
                input: mediaSelectionWords
                go: mediaSelectionSave
                goLabel: t:cafeRows.bringToChat
                icon: check
  media.compare:
    blocks:
      - type: each
        from:
          - {}
        item:
          id: $.id
          kind: $.kind
          src: $.src
          width: $.width
          height: $.height
          controls:
            of: $.reference
            map: {"true": false, _: true}
          sync:
            of: $.kind
            map:
              video:
                group: $.sync.group
                source:
                  of: $.reference
                  map: {"true": false, _: true}
                spans: $.sync.spans
              _: null
        blocks:
          - {type: component, use: media, props: "@"}
  media.review:
    vm: mediaReview
    error: t:frame.loadError
    retry:
      act: refresh
      args: {k: review}
    blocks:
      - type: box
        load: $.load
        error: t:frame.loadError
        retry:
          act: refresh
          args: {k: review}
        blocks:
          - type: section
            title: t:mediaReview.choose
            when: $.choosing
            blocks:
              - type: list
                from: $.contexts
