  card.alert:
    frame: msg
    who: "@who"
    from: "@from"
    source: "@source"
    time: {of: "@time", fmt: stamp}
    receivedAt: {of: "@receivedAt", fmt: stamp}
    recv: "@recv"
    quote: {$frag: CHAT_QUOTE}
    card: true
    acts: {$frag: CHAT_ACTS}
    body:
      - type: box
        variant: card
        tone:
