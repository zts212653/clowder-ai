views:
  chat.stream:
    vm: chatStream
    blocks:
      - {type: stream, from: $.items}
  chat.ticks:
    vm: chatTicks
    blocks:
      - type: ticks
        from: $.ticks
        item:
          tone:
            of: "@kind"
            map:
              user: u
              cat: c
              ask: c
              proposal: c
              letter: c
              brief: c
              summary: c
              _: s
          label:
            t: chat.tickLabel
            args:
              - "@name"
              - {of: "@time", fmt: hm}
          tip:
            of: "@hasCommand"
            map:
              "true":
                prefix:
                  t: chat.tickTip
                  args:
                    - "@name"
                    - of: "@hasTime"
                      map:
                        "true":
                          t: chat.tickTime.true
                          args:
                            - {of: "@time", fmt: hm}
                        "false": ""
                        _: "@hasTime"
                    - of: "@wait"
                      map: {"true": t:chat.tickWait.true, "false": "", _: "@wait"}
                    - of: "@err"
                      map: {"true": t:chat.tickError.true, "false": "", _: "@err"}
                    - ""
                markdown: {$frag: CHAT_SYS_MARKDOWN}
                max: 60
              _:
                t: chat.tickTip
                args:
                  - "@name"
                  - of: "@hasTime"
                    map:
                      "true":
                        t: chat.tickTime.true
                        args:
                          - {of: "@time", fmt: hm}
                      "false": ""
                      _: "@hasTime"
                  - of: "@wait"
                    map: {"true": t:chat.tickWait.true, "false": "", _: "@wait"}
                  - of: "@err"
                    map: {"true": t:chat.tickError.true, "false": "", _: "@err"}
                  - of: "@excerpt"
                    slice: [0, 60]
        older:
          of: $.older
          map: {done: false, _: true}
        when: $.ticks
  chat.composer:
    vm: chatComposer
    blocks:
      - type: box
        variant: composer
        when: "!$.multi"
        note:
          of: $.home
          map: {"true": "3", _: "7"}
        key: composer
        kind: container
        essential: true
        focus: $.spot
        blocks:
          - type: lanes
            key: composer.lanes
            kind: container
            lanes:
              - share: 2
                name: run
                scroll: true
                attach: straddle
                items:
                  - type: capsules
                    from:
                      - from: $.runners
                        item:
                          who: "@who"
                          cur: "@cur"
                          tip:
                            t: chat.runnerTip
                            args:
                              - "@command"
                              - t: chat.memberName
                                args: ["@name", "@handle"]
                          state:
                            - {text: t:composer.actions.state, when: "@error"}
                            - text:
                                t: composer.actions.silentMinutes
                                args:
                                  - {of: "@seconds", fmt: floorMinutes}
                              when: ["!@error", "@quiet"]
                            - text:
                                of: "@kind"
                                map:
                                  reply:
                                    t: chat.execWhat.reply
                                    args:
                                      - of: "@kind"
                                        map:
                                          command:
                                            t: wsLive.status.state
                                            args:
                                              - true
                                              - t: wsLive.activity
                                                args: ["@what"]
                                          _: "@what"
                                  command:
                                    of: "@kind"
                                    map:
                                      command:
                                        t: wsLive.status.state
                                        args:
                                          - true
                                          - t: wsLive.activity
                                            args: ["@what"]
                                      _: "@what"
                                  _: "@kind"
                              when: ["!@error", "!@quiet"]
                          seconds: "@seconds"
                          clockWhen:
                            of: "@quiet"
                            map:
                              "true": false
                              _:
                                of: "@error"
                                map: {"true": false, _: true}
                          ticking: "@ticking"
                          open:
                            - act: execOpen
                              args: {k: "@exec"}
                              when: "@command"
                            - act: msgJump
                              args: {mid: "@mid"}
                          actions:
                            - label:
                                t: composer.actions.label
                                args: ["@name"]
                              icon: at
                              act: set
                              args: {path: cs.target, v: "@who"}
                            - label:
                                t: composer.actions.stopNamed
                                args: ["@name"]
                              icon: stop
                              act: cafeRunStop
                              args: {id: "@who", kind: "@kind"}
                    label: t:composer.running
              - share: 3
                name: notice
                align: center
                attach: above
                items:
                  - type: stack
                    items:
                      - type: jump
                        when: $.top
                        icon: latest
                        label: t:composer.jump
                        tip: t:composer.jumpTip
                        act: streamLatest
                        hideWhileTyping: true
                      - type: notices
                        items: {slot: chat.composer.notice, from: $.notices}
                        when: $.top
                        hideWhileTyping: true
                      - type: notice
                        tone: warn
                        when: $.input.draft.lost
                        text: t:composer.attachLost
                        action:
                          - {type: button, label: t:composer.retryRecover, act: cafeAttRetry}
                          - type: button
                            label: t:composer.removeLost
                            act: remove
                            args: {entity: attLost, id: x}
              - share: 2
                name: queue
                align: end
                attach: straddle
                items:
                  - type: component
                    use: queue
                    props:
                      key: $.queue.key
                      items: $.queue.items
                      label: t:chat.deliveryState.pending
                      order: cafeQueueOrder
                      targets:
                        - {who: "@id", form: avatar, size: sm}
                        - text:
                            t: queue.delivery.state
                            args:
                              - {$frag: QUEUE_TARGET_STATE}
                          when:
                            of: "@failure.acceptance"
                            map: {unknown: true, not_accepted: true, _: "@dispatch"}
                      actions:
                        - label: t:queue.item.label
                          icon: send
                          act: cafeQueueSend
                          args: {i: "@index"}
                          when: "@queued"
                        - label: t:queue.item.recallAndEdit
                          icon: pen
                          act: cafeQueue
                          args: {v: edit, i: "@index"}
                          when: "@queued"
                        - label: t:common.delete
                          icon: delete
                          act: cafeQueue
                          args: {v: drop, i: "@index"}
                          when: "@queued"
                        - type: more
                          label: t:common.moreActions
                          items:
                            - label: t:queue.targets.title
                              act: queueTargets
                              args: {entryId: "@key"}
                          when: ["@queued", "@key"]
                    when: $.queue
          - type: toolbar
            when: $.input.rec
            items:
              - type: text
                parts:
                  - {dot: live}
                  - {lit: "REC "}
                  - text: {of: $.input.rec.secs, fmt: clock}
                    num: true
              - type: text
                parts:
                  - {text: t:composer.input.text, variant: meta, when: $.input.rec.busy}
                  - text: $.input.rec.text
                    variant: meta
                    when: ["!$.input.rec.busy", $.input.rec.text]
                  - text: t:composer.input.listening
                    variant: meta
                    when: ["!$.input.rec.busy", "!$.input.rec.text"]
              - {type: grow}
          - type: box
            when: $.input.draft.any
            blocks:
              - type: toolbar
                when: $.input.draft.whisper
                items:
                  - type: text
                    parts:
                      - {icon: whisper, size: xs, text: t:composer.whisperTo, variant: meta}
                  - type: each
                    from: $.input.draft.whisper.to
                    control:
                      type: chip
                      label:
                        t: chat.memberName
                        args: ["@name", "@handle"]
                      x:
                        act: pick
                        args: {path: cs.whisperTo, id: "@id"}
                        label:
                          t: chip.remove
                          args: ["@name"]
                  - type: text
                    parts:
                      - {text: t:composer.pickOneCat, tone: warn}
                    when: $.input.draft.whisper.none
                  - type: chip
                    label: t:common.select
                    act: popOpen
                    args: {pop: plus, page: whisper, up: "1"}
              - type: toolbar
                when: $.input.draft.att
                items:
                  - type: each
                    from: $.input.draft.att
                    control:
                      type: chip
                      thumb:
                        of: "@kind"
                        map: {image: "@source", _: ""}
                      act:
                        of: "@kind"
                        map:
                          image:
                            of: "@source.length"
                            gte: 1
                            map: {"true": draftAttachment, _: ""}
                          _: ""
                      args: "@preview"
                      icon:
                        of: "@kind"
                        map:
                          image: image
                          file: file
                          code: code
                          pr: pr
                          audio: audio
                          video: video
                          widget: widget
                          _: file
                      label:
                        of: "@clipboard"
                        map: {"true": t:chat.pastedImageName, "false": "@name", _: "@clipboard"}
                      faint:
                        t: chat.attachment
                        args:
                          - "@state"
                          - of: "@clipboard"
                            map:
                              "true":
                                t: format.kb
                                args: ["@kb"]
                              "false": "@size"
                              _: "@clipboard"
                      tone:
                        of: "@state"
                        map: {lost: cafe-att lost, _: cafe-att}
                      x:
                        act: listOp
                        args: {path: cs.att, op: del, i: "@index"}
                        label:
                          t: chip.remove
                          args:
                            - of: "@clipboard"
                              map: {"true": t:chat.pastedImageName, "false": "@name", _: "@clipboard"}
              - type: toolbar
                when: $.input.draft.chips
                items:
                  - type: each
                    from: $.input.draft.ctx
                    control:
                      type: chip
                      kind:
                        of: "@kind"
                        map:
                          project-screening: t:films.review
                          _:
                            of: "@kind"
                            map:
                              work: t:common.works
                              quote: t:chat.contextKind.quote
                              review: t:chat.contextKind.review
                              document: t:chat.contextKind.quote
                              selection: t:chat.contextKind.quote
                              _: "@kind"
                      label:
                        of: "@kind"
                        map:
                          project-screening:
                            t: mediaReview.screeningContext
                            args:
                              - "@title"
                              - {of: "@time", fmt: clock}
                          _:
                            of:
                              of: "@kind"
                              map: {work: true, _: false}
                            map:
                              "true":
                                t: chat.workContext
                                args: ["@title", "@version"]
                              "false":
                                of:
                                  of: "@kind"
                                  map: {selection: true, _: false}
                                map:
                                  "true":
                                    of: "@fromWork"
                                    map:
                                      "true":
                                        t: chat.selectionLabel.true
                                        args:
                                          - "@source"
                                          - of: "@snippet.length"
                                            gte: 0
                                            map:
                                              "true": "@snippet"
                                              _:
                                                of: "@text"
                                                slice: [0, 12]
                                      "false":
                                        t: chat.selectionLabel.false
                                        args:
                                          - "@source"
                                          - of: "@snippet.length"
                                            gte: 0
                                            map:
                                              "true": "@snippet"
                                              _:
                                                of: "@text"
                                                slice: [0, 12]
                                      _: "@fromWork"
                                  "false":
                                    of:
                                      of: "@kind"
                                      map: {quote: true, _: false}
                                    map:
                                      "true":
                                        of: "@text"
                                        slice: [0, 24]
                                      "false": "@label"
                                      _:
                                        of: "@kind"
                                        map: {quote: true, _: false}
                                  _:
                                    of: "@kind"
                                    map: {selection: true, _: false}
                              _:
                                of: "@kind"
                                map: {work: true, _: false}
                      ellip: true
                      act:
                        of: "@quote"
                        map: {"true": popOpen, _: ""}
                      args: {pop: ref, i: "@index", up: "1"}
                      tip:
                        of: "@quote"
                        map: {"true": t:chat.quoteTip.true, "false": "", _: "@quote"}
                      x:
                        act: listOp
                        args: {path: cs.ctx, op: del, i: "@index"}
                        label: t:common.remove
              - type: each
                from:
                  - {}
                when: $.input.draft.reply
                item:
                  reply:
                    mid: $.input.draft.reply.mid
                    from: $.input.draft.reply.from
                    text:
                      of: $.input.draft.reply.text
                      slice: [0, 80]
                blocks:
                  - type: toolbar
                    items:
                      - {type: reply, ref: "@reply"}
                      - {type: grow}
                      - type: button
                        iconOnly: true
                        icon: close
                        label: t:composer.cancelQuote
                        act: close
                        args: {path: cs.reply}
          - type: toolbar
            when: $.input.home
            items:
              - type: input
                variant: title
                id: home-title
                label: t:threadRow.name
                placeholder: t:threadRow.name
                value: $.input.title
                input: cafeHomeTitle
                disabled: $.input.locked
          - type: toolbar
            items:
              - type: input
                rows: true
                grow: true
                complete: $.input.history
                id: $.input.id
                label: t:common.messages
                placeholder:
                  t: chat.inputPlaceholder
                  args: [$.input.whisper]
                value: $.input.value
                input: cafeCompose
                disabled: $.input.locked
                args:
                  home:
                    of: $.input.home
                    map: {"true": "1", _: ""}
                  mentionPrefix:
                    t: composerPop.mention.key
                    args: [""]
                  emptyMemory: t:chat.commands.emptyMemory.
                on:
                  of: $.input.home
                  map:
                    "true": {enter: send, paste: cafePaste}
                    _: {enter: send, paste: cafePaste, ctrlR: cafeHistOpen}
          - type: toolbar
            note:
              of: $.home
              map: {"true": "", _: "15"}
            key: composer.bar
            kind: actions
            ordered: true
            items:
              - type: button
                iconOnly: true
                label: t:composer.addContent
                icon: plus
                act: popOpen
                args: {pop: plus, up: "1"}
                disabled: $.locked
                key: bar.plus
                move: composer.bar
              - type: picker
                key: bar.pin
                span: l
                when: $.home
                check: $.homePin
                prefix: t:composer.afterCreate
                label: t:composer.pin
                act: toggle
                args: {path: cs.homePin}
                disabled: $.locked
              - type: picker
                key: bar.proj
                move: composer.bar
                span: l
                icon: folder
                label:
                  of: $.proj.name
                  map:
                    "":
                      of: $.proj.home
                      map:
                        "true": t:chat.projectEmpty.true
                        "false": t:chat.projectPath.
                        _: $.proj.home
                    _: $.proj.name
                tip:
                  t: composer.actions.projectTip
                  args:
                    - t: chat.projectPath
                      args:
                        - of: $.home
                          map: {"true": $.proj.path, _: $.proj.name}
                act: popOpen
                args:
                  pop:
                    of: $.home
                    map: {"true": projPick, _: projView}
                  up: "1"
                disabled: $.locked
              - type: button
                key: bar.git
                when: $.preflight.git
                parts:
                  - control: {type: status, tone: warn, text: t:chat.projectGit.true}
                    when: $.preflight.git.available
                  - control: {type: status, tone: danger, text: t:chat.projectGit.false}
                    when: "!$.preflight.git.available"
                items:
                  - label: t:workspaceOwners.projectSetup.initialize
                    act: cafeProjectPrepare
                    args: {path: $.preflight.path, op: init}
                  - label: t:workspaceOwners.projectSetup.clone
                    act: cafeProjectClone
                    args: {path: $.preflight.path}
                args: {k: $.preflight.path}
                disabled: $.preflight.git.off
              - type: button
                key: bar.index
                when: $.preflight.index
                parts:
                  - {text: t:memory.index}
                  - control:
                      type: status
                      tone:
                        of: $.preflight.index.state
                        map: {failed: danger, building: info, _: warn}
                      text:
                        of: $.preflight.index.state
                        map:
                          missing: t:chat.projectIndex.missing
                          stale: t:runtime.hooks.stale
                          building: t:chat.projectIndex.building
                          failed: t:chat.projectIndex.failed
                          _: $.preflight.index.state
                items:
                  - label: t:workspaceOwners.projectSetup.prepare
                    act: cafeProjectPrepare
                    args: {path: $.preflight.path, op: start}
                  - label: t:workspaceOwners.projectSetup.later
                    act: cafeProjectPrepare
                    args: {path: $.preflight.path, op: later}
                args: {k: $.preflight.path}
                disabled: $.preflight.index.busy
              - {type: grow}
              - type: picker
                key: bar.target
                move: composer.bar
                span: l
                prefix: t:composer.sendTo
                who: $.target.who
                parts:
                  - {text: $.target.name}
                  - {text: $.target.handle, variant: meta}
                tip:
                  t: chat.routeReason
                  args:
                    - $.target.route.reason
                    - $.target.route.name
                    - $.target.route.handle
                    - t: chat.routeNames
                      args:
                        - {of: $.target.route.names, sep: 、}
                auto: $.target.auto
                autoTip: $.target.autoTip
                act: popOpen
                args: {pop: target, up: "1"}
                disabled: $.locked
              - type: slot
                key: bar.tools
                span: m
                slot: chat.composer.tools
                ctx: $.toolsCtx
              - type: send
                key: bar.send
                locked: true
                essential: true
                stop: $.send.stop
                stopping: $.send.stopping
                disabled: $.send.disabled
                tip:
                  of: $.send.reason
                  map:
                    readonly: t:runtime.updateRequired
                    lost: t:chat.sendReason.lost
                    uploading: t:chat.sendReason.uploading
                    whisper: t:composer.pickOneCat
                    unavailable: chat.send.toast4
                    send: t:common.send
                    _: $.send.reason
                args: {home: $.send.home, emptyMemory: t:chat.commands.emptyMemory.}
      - type: box
        variant: composer
        key: multi
        when: $.multi
        blocks:
          - type: toolbar
            items:
              - type: text
                parts:
                  - text:
                      t: composer.actions.picked
                      args: [$.picked]
                    strong: true
              - {type: grow}
              - {type: text, variant: meta, text: t:composer.exportAs}
              - type: button
                label: t:common.artType.file
                act: cafeMultiExport
                args: {v: t:common.artType.file}
                disabled:
                  of: $.picked
                  gte: 1
                  map: {"true": false, _: true}
              - type: button
                label: t:composer.text
                act: cafeMultiExport
                args: {v: t:composer.text}
                disabled:
                  of: $.picked
                  gte: 1
                  map: {"true": false, _: true}
              - type: button
                label: t:composer.longImage
                act: cafeMultiExport
                args: {v: t:composer.longImage}
                disabled:
                  of: $.picked
                  gte: 1
                  map: {"true": false, _: true}
              - type: button
                label: t:composer.forward
                act: modal
                args: {v: forward, id: multi}
                disabled:
                  of: $.picked
                  gte: 1
                  map: {"true": false, _: true}
              - type: button
                label: t:common.cancel
                act: set
                args: {path: cs.multi, v: "false", cast: bool}
  chat.pop:
    vm: chatPop
    drill:
      - when: $.from
        act: popBack
        label:
          of: {$frag: CHAT_POP_BACK_HEADER}
          map:
            voice: t:voice.title
            delivery: t:delivery.label
            people: t:composerPop.heading.people
            find: t:chatHeader.findMessages
            target: t:composerPop.heading.target
            projPick: t:composerPop.heading.projPick
            browse: t:composerPop.heading.browse
            mention: t:composerPop.heading.mention
            ctx: t:chatWelcome.quoteContext
            slash: t:wsLive.activity.command
            path: t:composerPop.pathPlaceholder
            ref: t:composerPop.heading.ref
            plus.main: t:composer.addContent
            plus.mode: t:composerPop.heading.sendMode
            plus.prefer: t:composerPop.heading.defaultRecipients
            plus.whisper: t:composerPop.heading.whisperTarget
            plus.game: t:workbench.commands.games
            plus.gameMode: t:composerPop.heading.participationMode
            projPick.browse: t:composerPop.heading.browse
            _: {$frag: CHAT_POP_BACK_HEADER}
    blocks:
      - type: pop
        page: $.page
        pos:
          - {when: $.typed, up: true, span: 5}
          - when:
              of: $.kind
              map: {textsel: true, _: false}
            up: true
            fit: true
          - when:
              of: $.kind
              map: {ctx: true, _: false}
            up: true
            span: 5
          - when:
              of: $.kind
              map: {find: true, _: false}
            up: $.up
            span: 6
          - when:
              of: $.kind
              map: {projPick: true, _: false}
            up: $.up
            span: 6
          - {up: $.up, span: 5}
        blocks:
          - type: head
            variant: detail
            title:
              text:
                of: {$frag: CHAT_POP_HEADER}
                map:
                  voice:
                    t: voice.title
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  delivery:
                    t: delivery.label
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  people:
                    t: composerPop.heading.people
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  find:
                    t: chatHeader.findMessages
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  target:
                    t: composerPop.heading.target
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  projPick:
                    t: composerPop.heading.projPick
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  browse:
                    t: composerPop.heading.browse
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  mention:
                    t: composerPop.heading.mention
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  ctx:
                    t: chatWelcome.quoteContext
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  slash:
                    t: wsLive.activity.command
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  path:
                    t: composerPop.pathPlaceholder
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  ref:
                    t: composerPop.heading.ref
                    args:
                      - of: $.selectionSource
                        map:
                          "true":
                            t: chat.selectionSource.true
                            args: [$.source]
                          "false": $.source
                          _: $.selectionSource
                  plus.main: t:composer.addContent
                  plus.mode: t:composerPop.heading.sendMode
                  plus.prefer: t:composerPop.heading.defaultRecipients
                  plus.whisper: t:composerPop.heading.whisperTarget
                  plus.game: t:workbench.commands.games
                  plus.gameMode: t:composerPop.heading.participationMode
                  projPick.browse: t:composerPop.heading.browse
                  _: {$frag: CHAT_POP_HEADER}
            close: chat.pop
            when:
              of: $.kind
              map: {ctx: false, _: true}
            actions:
              - type: button
                iconOnly: true
                icon: refresh
                label: t:common.refresh
                act: cafeDeliveryRead
                when: $.delivery
          - type: head
            variant: detail
            title:
              text:
                of: $.mode
                map:
                  thread: t:composerPop.context.heading.thread
                  file: t:composerPop.context.heading.file
                  "": t:chatWelcome.quoteContext
                  both: t:chatWelcome.quoteContext
                  _: $.mode
            close: chat.pop
            when:
              of: $.kind
              map: {ctx: true, _: false}
          - type: box
            when: $.delivery
            load: $.delivery.load
            error: t:frame.loadError
            retry: {act: cafeDeliveryRead}
            blocks:
              - type: list
                id: delivery-targets
                from: $.delivery.items
                partial:
                  of: $.delivery.partial
                  map: {"true": t:runtime.readError, "false": "", _: $.delivery.partial}
                row:
                  layout: line
                  key: "@who"
                  title: {who: "@who", form: title}
                  inline:
                    - control:
                        type: status
                        text:
                          of: "@state"
                          map:
                            pending: t:chat.deliveryState.pending
                            delivered: t:delivery.delivered
                            read: t:delivery.read
                            busy: t:memoryOwners.stateNote.approving
                            succeeded: t:common.status.completed
                            running: t:memoryOwners.stateNote.approving
                            failed: t:chat.deliveryState.failed
                            unavailable: t:delivery.recovery.unavailable
                            unknown: t:wsTrace.event.result.
                            _: "@state"
                        tone:
                          of: "@transportError"
                          map:
                            "true": danger
                            "false":
                              of: "@state"
                              map:
                                failed: danger
                                succeeded: ok
                                read: ok
                                unavailable: warn
                                unknown: warn
                                _: info
                            _: "@transportError"
                    - {text: t:delivery.recovery.repeated, variant: meta, when: "@repeated"}
                  help: "@help"
                  cols:
                    - control:
                        - type: button
                          label: t:common.retry
                          act: cafeDeliveryRecover
                          args:
                            threadId: "@threadId"
                            sourceMessageId: "@sourceMessageId"
                            targetCatId: "@who"
                            op: retry
                          when: "@canRetry"
                          stay: true
                        - type: button
                          label: t:delivery.recovery.repeat
                          tip: t:queue.delivery.repeatWarning
                          act: cafeDeliveryRecover
                          args:
                            threadId: "@threadId"
                            sourceMessageId: "@sourceMessageId"
                            targetCatId: "@who"
                            op: repeat
                          when: "@canRepeat"
                          stay: true
                        - type: button
                          iconOnly: true
                          icon: jump
                          label: t:delivery.recovery.jump
                          act: msgJump
                          args: {t: "@threadId", mid: "@reply"}
                          disabled: "@noReply"
                          tip:
                            of: "@noReply"
                            map: {"true": t:delivery.recovery.noReply, "false": "", _: "@noReply"}
          - type: box
            when: $.voice
            load: $.voice.load
            error: t:frame.loadError
            retry:
              act: refresh
              args: {k: voice}
            blocks:
              - type: toolbar
                items:
                  - type: button
                    label: t:entryLayout.actions.title
                    act: cafeMic
                    args: {op: dictate}
                  - type: button
                    parts:
                      - {text: t:voiceReview.startSession}
                      - control:
                          type: status
                          tone:
                            of: $.voice.service.state
                            map:
                              error: danger
                              none: warn
                              stopped: warn
                              installing: warn
                              _: $.voice.service.state
                          text:
                            of: [0, 1]
                            item:
                              of: "@"
                              map:
                                "0": $.voice.service.name
                                "1":
                                  of: $.voice.service.state
                                  map:
                                    none: t:common.status.notInstalled
                                    stopped: t:common.status.disabled
                                    error: t:voice.options.tip
                                    installing: t:ext.installing
                                    _: $.voice.service.state
                            sep: ""
                    act: open
                    args: {page: voice}
                    when:
                      of: $.voice.service.state
                      map: {running: false, _: true}
                  - type: button
                    label: t:voiceReview.startSession
                    act: voiceSession
                    args: {op: start}
                    when: $.voice.canStart
                  - type: button
                    label: t:common.stop
                    act: voiceSession
                    args: {op: stop}
                    when: $.voice.active
                  - type: button
                    label: t:player.pause
                    act: voicePlayback
                    args: {op: pause}
                    when: $.voice.playback.canPause
                  - type: button
                    label: t:player.play
                    act: voicePlayback
                    args: {op: resume}
                    when: $.voice.playback.canResume
                  - type: button
                    label: t:chatCards.skip
                    act: voicePlayback
                    args: {op: skip}
                    when: $.voice.playback.canSkip
              - type: status
                text: t:voiceReview.interrupted
                when: $.voice.interrupted
              - type: toolbar
                items:
                  - type: switch
                    value: $.voice.allowHomeReads
                    act: set
                    args: {path: cs.voice.allowHomeReads}
                    label: t:voiceReview.allowHomeReads
                    when: $.voice.canCall
                  - type: button
                    label: t:voiceReview.call
                    act: liveCall
                    args: {op: prepare}
                    when: $.voice.canCall
                  - type: button
                    label: t:voiceReview.hangup
                    act: liveCall
                    args: {op: stop}
                    when: $.voice.canStop
                  - type: button
                    label: t:voiceReview.shareScreen
                    act: liveShare
                    args: {op: select}
                    when: $.voice.canShare
                  - type: button
                    label: t:common.stop
                    act: liveShare
                    args: {op: stop}
                    when: $.voice.share
                  - type: each
                    from:
                      - {}
                    when: $.voice.call
                    control:
                      type: more
                      items:
                        - label: t:voiceReview.pageAction.title
                          act: pageActionOpen
                          args: {kind: pageAction}
              - type: status
                text:
                  t: voiceReview.callState
                  args: [$.voice.state]
                when: $.voice.pendingCall
              - {type: text, text: $.voice.share.sourceLabel, when: $.voice.share}
              - type: toolbar
                when: $.voice.call
                items:
                  - type: input
                    id: live-text
                    placeholder: t:chat.inputPlaceholder.false
                    go: liveCallText
                    goLabel: t:common.send
                    icon: check
          - type: toolbar
            form: cafeFind
            when: $.find
            items:
              - type: search
                id: find-q
                placeholder: t:composerPop.searchMessages
                value: $.find.q
                input: cafeFindQ
          - type: toolbar
            when: $.find
            items:
              - type: seg
                act: set
                args: {path: cs.find.scope}
                value: $.find.scope
                options:
                  - {v: thread, label: t:common.currentThread}
                  - {v: all, label: t:composerPop.options.allThreads}
                stay: true
              - {type: grow}
              - type: seg
                act: set
                args: {path: cs.find.sort}
                value: $.find.sort
                options:
                  - {v: time, label: t:chat.searchSort.time}
                  - {v: rel, label: t:chat.searchSort.relevance}
                stay: true
          - type: toolbar
            when:
              - of: $.kind
                map: {plus: true, _: false}
              - of: $.subpage
                map: {mode: true, _: false}
            items:
              - type: seg
                act: set
                args: {path: cs.sendScope}
                value: $.sendScope
                options:
                  - {v: thread, label: t:composerPop.options.currentThread}
                  - {v: global, label: t:composerPop.options.globalDefault}
                stay: true
          - type: toolbar
            when: $.browse
            items:
              - type: search
                form: cafePathGo
                id: pp-path
                placeholder: t:composerPop.pathPlaceholder
                value: $.browse.root
                input: cafePathComplete
          - type: opts
            from: $.browse.completions
            item:
              title: "@name"
              sub: "@path"
              act: cafePathPick
              args: {path: "@path"}
              stay: true
            when: $.browse
          - type: each
            from:
              - {}
            when:
              - of: $.kind
                map: {projPick: true, _: false}
              - "!$.browse"
            item:
              nodes:
                "":
                  - name: t:composerPop.options.browseOrEnterPath
                    path: "#browse"
                    icon: folder
                    chev: true
                    act: popPage
                    args: {v: browse}
                  - name: t:chat.projectEmpty.true
                    path: ""
                    icon: home
                    sub:
                      - {text: t:composerPop.options.unboundDirectory}
                    cur: $.noHomeProject
                    act: set
                    args: {path: cs.homeProj, v: "", cast: "null"}
                  - from: $.projects
                    item:
                      name: "@name"
                      path: "@path"
                      icon: folder
                      sub:
                        - {text: "@path", mono: true}
                      cur: "@selected"
                      act: set
                      args: {path: cs.homeProj, v: "@id"}
            blocks:
              - type: tree
                id: ppProj
                flat: true
                nodes: "@nodes"
                row: file.row
                select: {act: "@act", args: "@args"}
          - type: tree
            id: ppTree
            nodes: $.browse.nodes
            item:
              cur: "@selected"
              slot: pick.folder
              actsCtx: {path: "@path", src: "@source"}
            row: file.row
            select:
              act: set
              args: {path: cs.ppPick, v: "@path", p: "@path"}
            when: $.browse
            stay: true
          - type: search
            id: ctx-q
            placeholder:
              t: composerPop.context.placeholder
              args: [$.mode]
            value: $.ctxSearch.q
            input: cafeLive
            when: $.ctxSearch
          - {type: pre, text: t:composerPop.options.path, when: $.noProject}
          - {type: pre, text: $.quote, when: $.quote}
          - type: each
            from:
              - {}
            item:
              sendModes:
                - mode: queue
                  selected:
                    of: $.sendMode
                    map: {queue: true, _: false}
                - mode: steer
                  selected:
                    of: $.sendMode
                    map: {steer: true, _: false}
              results:
                - from: $.results
                  item:
                    data: "@"
                    snippet:
                      - of: {of: "@hitAt", gte: 17}
                        map:
                          "true":
                            t: chat.excerptPrefix.true
                            args:
                              - of: "@pre"
                                slice: [-16]
                          "false":
                            of: "@pre"
                            slice: [-16]
                          _: {of: "@hitAt", gte: 17}
                      - {hl: "@hit"}
                      - of: "@post"
                        slice: [0, 40]
            blocks:
              - type: opts
                from:
                  - lead: {glyph: users}
                    title: t:composerPop.options.groupChat
                    sub: t:composerPop.options.sub
                    cur: $.groupSelected
                    act: set
                    args: {path: cs.viewCat, v: "", cast: "null"}
                    when:
                      of: $.kind
                      map: {people: true, _: false}
                  - from: $.members
                    item:
                      lead: {who: "@id"}
                      title: "@name"
                      handle: "@handle"
                      sub:
                        of: "@state"
                        map:
                          reply:
                            t: chat.peopleState.reply
                            args:
                              - of: "@state"
                                map:
                                  reply:
                                    of: "@what"
                                    slice: [0, 14]
                                  command:
                                    t: wsLive.status.state
                                    args:
                                      - true
                                      - t: wsLive.activity
                                        args: ["@what"]
                                  _: "@what"
                          command:
                            of: "@state"
                            map:
                              reply:
                                of: "@what"
                                slice: [0, 14]
                              command:
                                t: wsLive.status.state
                                args:
                                  - true
                                  - t: wsLive.activity
                                    args: ["@what"]
                              _: "@what"
                          presence:
                            of: "@state"
                            map:
                              reply:
                                of: "@what"
                                slice: [0, 14]
                              command:
                                t: wsLive.status.state
                                args:
                                  - true
                                  - t: wsLive.activity
                                    args: ["@what"]
                              _: "@what"
                          idle:
                            t: chat.peopleState.idle
                            args:
                              - of: "@state"
                                map:
                                  reply:
                                    of: "@what"
                                    slice: [0, 14]
                                  command:
                                    t: wsLive.status.state
                                    args:
                                      - true
                                      - t: wsLive.activity
                                        args: ["@what"]
                                  _: "@what"
                          _: "@state"
                      subTone:
                        of: "@executing"
                        map: {"true": run, "false": "@presenceTone", _: "@executing"}
                      cur: "@selected"
                      act: set
                      args: {path: cs.viewCat, v: "@id"}
                      when:
                        of: $.kind
                        map: {people: true, _: false}
                  - sep: 1
                    when:
                      - $.daemon
                      - of: $.kind
                        map: {people: true, _: false}
                  - lead: {icon: pulse}
                    title:
                      t: composerPop.options.backgroundRunning
                      args: [$.daemon]
                    sub: t:composerPop.options.viewOperations
                    act: wsTool
                    args: {k: ops, view: daemon}
                    when:
                      - $.daemon
                      - of: $.kind
                        map: {people: true, _: false}
                  - sec:
                      t: composerPop.options.sec
                      args: [$.find.count]
                    when: [$.find.done, $.find]
                  - from: "@results"
                    item:
                      title: "@snippet"
                      sub:
                        of: "@data.allThreads"
                        map:
                          "true":
                            t: chat.findMessageMeta.true
                            args:
                              - "@data.name"
                              - {of: "@data.time", fmt: hm}
                              - "@data.threadTitle"
                          "false":
                            t: chat.findMessageMeta.false
                            args:
                              - "@data.name"
                              - {of: "@data.time", fmt: hm}
                              - "@data.threadTitle"
                          _: "@data.allThreads"
                      act: findOpen
                      args: {i: "@data.index"}
                      when: $.find
                  - note:
                      t: composerPop.options.noSearchMatch
                      args: [$.find.q]
                    when:
                      - [$.find.done, "!$.results"]
                      - $.find
                  - from: "@sendModes"
                    item:
                      title:
                        of: "@mode"
                        map:
                          queue: t:composer.sendMode.queue
                          steer: t:queue.send.steerReply
                          _: "@mode"
                      sub:
                        t: composer.sendModeHelp
                        args: ["@mode"]
                      cur: "@selected"
                      act: set
                      args: {path: cs.sendMode, v: "@mode"}
                      when:
                        - of: $.kind
                          map: {plus: true, _: false}
                        - of: $.subpage
                          map: {mode: true, _: false}
                  - title: t:system.systemDefault
                    cur: $.systemSelected
                    act: pick
                    args: {path: cs.prefer, none: "1"}
                    stay: true
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {prefer: true, _: false}
                  - from: $.members
                    item:
                      lead: {who: "@id"}
                      title: {of: "@id", fmt: identityHandle}
                      cur: "@selected"
                      act: pick
                      args: {path: cs.prefer, id: "@id"}
                      stay: true
                      when:
                        - of: $.kind
                          map: {plus: true, _: false}
                        - of: $.subpage
                          map: {prefer: true, _: false}
                  - from: $.members
                    item:
                      lead: {who: "@id"}
                      title: {of: "@id", fmt: identityHandle}
                      cur: "@selected"
                      act: pick
                      args: {path: cs.whisperTo, id: "@id"}
                      stay: true
                      disabled: "@busy"
                      why:
                        of: "@busy"
                        map: {"true": t:chat.whisperWhy.true, "false": "", _: "@busy"}
                      when:
                        - of: $.kind
                          map: {plus: true, _: false}
                        - of: $.subpage
                          map: {whisper: true, _: false}
                  - lead: {icon: game, big: true}
                    title: t:composerPop.options.werewolf
                    sub: t:composerPop.options.werewolfDescription
                    chev: true
                    act: popPage
                    args: {v: gameMode}
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {game: true, _: false}
                  - title: t:gameLobby.mode.player
                    act: modal
                    args: {v: lobby, id: player}
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {gameMode: true, _: false}
                  - title: t:composerPop.options.spectatorMode
                    act: modal
                    args: {v: lobby, id: t:composerPop.options.spectatorMode}
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {gameMode: true, _: false}
                  - title: t:composerPop.options.deductionMode
                    act: modal
                    args: {v: lobby, id: t:composerPop.options.deductionMode}
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {gameMode: true, _: false}
                  - title: t:composerPop.options.playerVoiceMode
                    act: modal
                    args: {v: lobby, id: t:composerPop.options.playerVoiceMode}
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {gameMode: true, _: false}
                  - title: t:composerPop.options.spectatorVoiceMode
                    act: modal
                    args: {v: lobby, id: t:composerPop.options.spectatorVoiceMode}
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {gameMode: true, _: false}
                  - lead: {icon: file, big: true}
                    title:
                      t: composerPop.options.uploadAttachment
                      args:
                        - of: $.attachmentFull
                          map: {"true": t:chat.attachmentFull.true, "false": "", _: $.attachmentFull}
                    act: cafeAttach
                    disabled: $.attachmentFull
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {main: true, _: false}
                  - lead: {icon: whisper, big: true}
                    title: t:chat.inputPlaceholder.true
                    act: cafeWhisper
                    args: {v: toggle}
                    cur: $.whisperOn
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {main: true, _: false}
                  - lead: {icon: link, big: true}
                    title: t:chatWelcome.quoteContext
                    act: ctxPop
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {main: true, _: false}
                  - sep: 1
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {main: true, _: false}
                  - lead: {icon: cat, big: true}
                    title: t:composerPop.heading.defaultRecipients
                    value:
                      of: {of: $.preferNames, sep: 、}
                      map:
                        "": t:system.systemDefault
                        _: {of: $.preferNames, sep: 、}
                    chev: true
                    act: popPage
                    args: {v: prefer}
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {main: true, _: false}
                  - lead: {icon: reply, big: true}
                    title: t:composerPop.heading.sendMode
                    value:
                      of: $.sendMode
                      map:
                        queue: t:composer.sendMode.queue
                        steer: t:queue.send.steerReply
                        _: $.sendMode
                    chev: true
                    act: popPage
                    args: {v: mode}
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {main: true, _: false}
                  - sep: 1
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {main: true, _: false}
                  - lead: {icon: game, big: true}
                    title: t:workbench.commands.games
                    chev: true
                    act: popPage
                    args: {v: game}
                    when:
                      - of: $.kind
                        map: {plus: true, _: false}
                      - of: $.subpage
                        map: {main: true, _: false}
                  - from: $.members
                    item:
                      lead: {who: "@id"}
                      title: {of: "@id", fmt: identityHandle}
                      cur: "@selected"
                      act: set
                      args: {path: cs.target, v: "@id"}
                      when:
                        of: $.kind
                        map: {target: true, _: false}
                  - from: $.mentions
                    item:
                      lead:
                        - {who: "@who", when: "@who"}
                        - {glyph: users}
                      title:
                        of: "@kind"
                        map:
                          member: "@name"
                          thread: "@name"
                          all: "@name"
                          breed:
                            t: chat.mentionTitle.breed
                            args: ["@name", "@breed"]
                          _: "@kind"
                      handle: "@handle"
                      tag: "@carrier"
                      sub:
                        of: "@kind"
                        map:
                          thread:
                            t: chat.mentionSub.thread
                            args: ["@count", "@breed", "@model"]
                          all:
                            t: chat.mentionSub.all
                            args: ["@count", "@breed", "@model"]
                          breed:
                            t: chat.mentionSub.breed
                            args: ["@count", "@breed", "@model"]
                          member: {of: "@meta", sep: " · "}
                          _: "@kind"
                      sel: "@selected"
                      act: cafeTypedPick
                      args:
                        i: "@index"
                        text:
                          of: "@kind"
                          map:
                            member: "@ins"
                            thread: "@ins"
                            all: "@ins"
                            breed:
                              t: chat.mentionTitle.breed
                              args: ["@ins", "@breed"]
                            _: "@kind"
                      when:
                        of: $.kind
                        map: {mention: true, _: false}
                  - from: $.contexts
                    item:
                      - sec:
                          of:
                            of: "@section"
                            map:
                              FILE:
                                of: $.query.length
                                gte: 1
                                map:
                                  "true": FILE
                                  _:
                                    of: $.contextFilter.length
                                    gte: 1
                                    map: {"true": FILE, _: currentFiles}
                              _: "@section"
                          map:
                            THREAD: t:common.threads
                            FILE: t:chat.contextSection.FILE
                            work: t:common.works
                            currentFiles: t:composerPop.options.openFiles
                            _:
                              of: "@section"
                              map:
                                FILE:
                                  of: $.query.length
                                  gte: 1
                                  map:
                                    "true": FILE
                                    _:
                                      of: $.contextFilter.length
                                      gte: 1
                                      map: {"true": FILE, _: currentFiles}
                                _: "@section"
                        when:
                          - "@section"
                          - of: $.kind
                            map: {ctx: true, _: false}
                      - lead:
                          - icon: chat
                            when:
                              of: "@kind"
                              map: {THREAD: true, _: false}
                          - {icon: file}
                        title:
                          of: "@kind"
                          map:
                            FILE: {of: "@title", fmt: basename}
                            _: "@title"
                        sub:
                          of: "@kind"
                          map:
                            THREAD:
                              of: "@kind"
                              map:
                                THREAD:
                                  t: chat.threadRef
                                  args: ["@sub"]
                                _: "@sub"
                            FILE:
                              of: "@kind"
                              map:
                                THREAD:
                                  t: chat.threadRef
                                  args: ["@sub"]
                                _: "@sub"
                            work:
                              t: chat.cardLabel.workref
                              args:
                                - of: "@kind"
                                  map:
                                    THREAD:
                                      t: chat.threadRef
                                      args: ["@sub"]
                                    _: "@sub"
                                - "@version"
                            _: "@kind"
                        subMono: "@sub"
                        sel: "@selected"
                        act: cafeTypedPick
                        args: {i: "@index"}
                        when:
                          of: $.kind
                          map: {ctx: true, _: false}
                  - from: $.commands
                    item:
                      - sec:
                          of:
                            of: "@section"
                            map:
                              FILE:
                                of: $.query.length
                                gte: 1
                                map:
                                  "true": FILE
                                  _:
                                    of: $.contextFilter.length
                                    gte: 1
                                    map: {"true": FILE, _: currentFiles}
                              _: "@section"
                          map:
                            general: t:system.general
                            memory: t:common.memory
                            knowledge: t:workbench.commands.knowledgeLibrary
                            signals: t:chat.commands.group.signals
                            tasks: t:system.tasks
                            vote: t:workbench.commands.vote
                            game: t:workbench.commands.games
                            quote: t:composerPop.quote
                            _:
                              of: "@section"
                              map:
                                FILE:
                                  of: $.query.length
                                  gte: 1
                                  map:
                                    "true": FILE
                                    _:
                                      of: $.contextFilter.length
                                      gte: 1
                                      map: {"true": FILE, _: currentFiles}
                                _: "@section"
                        when:
                          - "@section"
                          - of: $.kind
                            map: {slash: true, _: false}
                      - title: "@command"
                        mono: true
                        sub:
                          of: "@command"
                          map:
                            /help: t:chat.commands.description./help
                            /config: t:chat.commands.description./config
                            /config set: t:chat.commands.description./config set
                            /remember: t:chat.commands.description./remember
                            /recall: t:chat.commands.description./recall
                            /approve: t:chat.commands.description./approve
                            /archive: t:chat.commands.description./archive
                            /evidence: t:chat.commands.description./evidence
                            /reflect: t:chat.commands.description./reflect
                            /tasks extract: t:chat.commands.description./tasks extract
                            /vote: t:chat.commands.description./vote
                            /game werewolf: t:workbench.commands.startWerewolf
                            /signals: inbox · search · sources · stats
                            /thread: t:chat.commands.description./thread
                            /file: t:chat.commands.description./file
                            _: "@command"
                        sel: "@selected"
                        act: cafeTypedPick
                        args: {i: "@index"}
                        when:
                          of: $.kind
                          map: {slash: true, _: false}
                  - from: $.paths
                    item:
                      lead: {icon: folder}
                      title: "@path"
                      mono: true
                      sel: "@selected"
                      act: cafeTypedPick
                      args: {i: "@index"}
                      when:
                        of: $.kind
                        map: {path: true, _: false}
                  - note:
                      t: composerPop.options.annotation
                      args: [$.comment]
                    when:
                      - $.comment
                      - of: $.kind
                        map: {ref: true, _: false}
                empty:
                  of: $.kind
                  map:
                    people: ""
                    find: ""
                    plus: ""
                    target: ""
                    ref: ""
                    projPick: ""
                    projView: ""
                    textsel: ""
                    voice: ""
                    delivery: ""
                    mention: t:chat.popEmpty.mention
                    ctx: t:chat.popEmpty.ctx
                    slash: t:chat.popEmpty.slash
                    path: t:chat.popEmpty.path
                    plus.main: t:composer.addContent
                    plus.mode: t:composerPop.heading.sendMode
                    plus.prefer: t:composerPop.heading.defaultRecipients
                    plus.whisper: t:composerPop.heading.whisperTarget
                    plus.game: t:workbench.commands.games
                    plus.gameMode: t:composerPop.heading.participationMode
                    projPick.browse: t:composerPop.heading.browse
                    _: $.kind
          - type: toolbar
            when: $.whisper
            items:
              - type: button
                label: t:composerPop.closeWhisper
                act: cafeWhisper
                args: {v: off}
              - type: button
                label: t:common.done
                act: close
                args: {path: cs.pop}
          - type: toolbar
            when: $.pathCopy
            items:
              - type: copy
                value: $.pathCopy
                label: t:composerPop.copyPath
                tip: t:composerPop.pathReadonly
                mono: true
          - type: toolbar
            when: $.browse
            items:
              - type: button
                primary: true
                label: t:composerPop.useFolder
                act: cafeUseFolder
                disabled: $.browse.noPick
                tip:
                  of: $.browse.restriction
                  map:
                    runtime_read_only: t:composerPop.restriction.runtime_read_only
                    configuration_unknown: t:composerPop.restriction.configuration_unknown
                    _: ""
          - type: toolbar
            when: $.ref
            items:
              - type: button
                label: t:common.remove
                act: listOp
                args: {path: cs.ctx, op: del, i: $.ref.i}
          - type: toolbar
            when: $.sel
            items:
              - type: button
                icon: plus
                label: t:composerPop.addToChat
                act: cafeSel
                args: {v: ctx}
              - type: button
                icon: reply
                label: t:composerPop.quote
                act: cafeSel
                args: {v: quote}
                when: "!$.sel.work"
              - type: button
                icon: pen
                label: t:work.annotate
                act: cafeSel
                args: {v: anno}
                when: $.sel.canAnnotate
              - type: button
                icon: forward
                label: t:composerPop.forwardMore
                act: cafeSel
                args: {v: fwd}
                when: $.sel.canForward
              - type: button
                label: t:chatMessage.deleteAnno
                act: listOp
                args:
                  path: cs.annos.{mid}
                  op: del
                  mid: $.sel.mid
                  i: "0"
                when: $.sel.anno
  nav.threads:
    vm: navThreads
    loading: t:common.loading
    blocks:
      - type: empty
        text: t:chat.sidebar.tag.empty
        when: $.empty
        action:
          type: button
          label: t:nav.clearTagFilter
          act: fold
          args: {path: cs.tag, cast: "null", v: $.tag}
      - type: threads
        from: $.sections
        item:
          key: "@key"
          rows: "@rows"
          collapsed:
            of: "@head.kind"
            map:
              proj:
                of: "@override"
                map:
                  "true": false
                  "false": true
                  _:
                    of: "@idle"
                    map: {"true": true, _: false}
              _: "@collapsed"
          empty:
            of: "@head.kind"
            map:
              proj:
                of: "@head.unassigned"
                map: {"true": "", _: project}
              _:
                of: $.group
                map: {pinned: pinned, favorites: favorites, _: ""}
          head:
            kind: "@head.kind"
            id: "@head.id"
            name: "@head.name"
            path: "@head.path"
            tip: "@head.path"
            n: "@head.n"
            unassigned: "@head.unassigned"
            warn: "@head.warn"
            fixed: "@head.fixed"
            peek: "@head.peek"
            sort: "@head.sort"
            open:
              of: "@head.kind"
              map:
                proj: {$frag: THREAD_PROJECT_OPEN}
                _: "@head.open"
            add:
              of: "@head.kind"
              map:
                proj:
                  of: "@head.unassigned"
                  map: {"true": false, _: true}
                _: false
            note:
              of: $.route
              map:
                chat:
                  of: $.group
                  map:
                    recent:
                      of: "@key"
                      map: {pinned: "10", _: ""}
                    _: ""
                _: ""
          other:
            of: "@key"
            map:
              other:
                open: "@other.open"
                n: "@other.n"
                sections:
                  - from: "@other.sections"
                    item: {$frag: THREAD_SECTION_ITEM}
              _: "@other"
        note:
          of: $.route
          map:
            chat:
              of: $.group
              map: {project: "11", _: ""}
            _: ""
        when: $.sections
        groups:
          pinned: {collapsed: false, limit: l}
          recent: {collapsed: false, limit: l}
          proj: {collapsed: false, limit: l}
          grp: {collapsed: false, limit: l}
          system: {collapsed: false, limit: l}
          favorites: {collapsed: false, limit: l}
        heads:
          sec:
            icon:
              pinned: pin
              recent: clock
              system: system
              favorites: star
              "*": list
          group:
            icon: folder
            act: setStatus
            args: {entity: group, field: open, id: "@id"}
            more:
              type: more
              label: t:threadRow.groupMore
              items:
                - label: t:chat.group.menu.label
                  act: modal
                  args: {v: org, gid: "@id"}
                - label: t:chat.group.menu.showPendingWhenCollapsed
                  act: setStatus
                  args: {entity: group, id: "@id", field: peek}
                  cur: "@peek"
                - label: t:chat.group.menu.renameMenu
                  act: rename
                  args: {entity: group, id: "@id"}
                - {scope: t:chat.group.menu.group}
                - label: t:hub.lastActive
                  act: setStatus
                  args: {entity: group, id: "@id", field: sort, v: recent}
                  cur:
                    of: "@sort"
                    map: {recent: true, _: false}
                - label: t:chat.group.menu.manualOrder
                  act: setStatus
                  args: {entity: group, id: "@id", field: sort, v: manual}
                  cur:
                    of: "@sort"
                    map: {manual: true, _: false}
                - label: t:chat.group.menu.runningFirst
                  act: setStatus
                  args: {entity: group, id: "@id", field: sort, v: running}
                  cur:
                    of: "@sort"
                    map: {running: true, _: false}
          proj:
            icon: box
            act: set
            args:
              path: cs.projOpen.{id}
              id: "@id"
              cast: bool
              v:
                of: "@open"
                map: {"true": false, _: true}
            more:
              type: more
              label: t:threadRow.projectMore
              items:
                - label:
                    of: "@fixed"
                    map: {"true": t:frame.unpin, "false": t:chat.projectPin.false, _: "@fixed"}
                  act: setStatus
                  args: {entity: proj, id: "@id", field: pinned}
                - label: t:chat.project.menu.openFinder
                  act: reveal
                  args: {path: "@path"}
                - label: t:chat.project.menu.renameLocally
                  act: rename
                  args: {entity: proj, id: "@id"}
                - label: t:chat.project.menu.archiveProjectThreads
                  act: remove
                  args: {entity: proj, id: "@id"}
                  tone: danger
            add:
              label:
                t: chat.sidebar.project.label
                args: ["@name"]
              act: homeOpen
              args: {id: "@id"}
        other:
          act: toggle
          args: {path: cs.otherOpen}
        rename:
          time: {of: "@time", fmt: ago}
          acts:
            - type: button
              iconOnly: true
              icon: delete
              label: t:chat.thread.menu.moveToTrash
              act: remove
              args: {entity: thread, id: "@id"}
          note:
            of: "@restored"
            map:
              "true":
                t: chat.threadNote.true
                args: ["@note"]
              "false": "@note"
              _: "@restored"
          more:
            type: more
            variant: row
            k: "@id"
            label:
              t: threadRow.more
              args: ["@title"]
            items:
              - label: t:chat.thread.menu.settings
                act: modal
                args: {v: tset, id: "@id"}
              - label: t:wsSessions.copyThreadId
                act: copy
                args: {v: "@id"}
              - label: t:chat.thread.menu.organize
                act: modal
                args: {v: org, id: "@id"}
              - label:
                  of: "@pinned"
                  map: {"true": t:chat.thread.pinLabel.true, "false": t:composer.pin, _: "@pinned"}
                act: setStatus
                args: {entity: pin, id: "@id"}
              - label:
                  of: "@fav"
                  map: {"true": t:workbench.star.true, "false": t:wsSignals.starred, _: "@fav"}
                act: setStatus
                args: {entity: thread, id: "@id", field: fav}
              - label: t:common.rename
                act: rename
                args: {entity: thread, id: "@id"}
              - label: t:chat.thread.menu.removeFromGroup
                act: remove
                args: {entity: grouped, id: "@id"}
                when: "@grouped"
              - label: t:chat.thread.menu.exportPng
                act: cafeExport
                args: {id: "@id", v: png}
              - label: t:chat.thread.menu.downloadMarkdown
                act: cafeExport
                args: {id: "@id", v: md}
              - label: t:chat.thread.menu.downloadText
                act: cafeExport
                args: {id: "@id", v: txt}
              - label: t:theater.label
                act: theater
                args: {id: "@id"}
              - slot: chat.thread.more
                args: {id: "@id"}
              - label: t:chat.thread.menu.moveToTrash
                act: remove
                args: {entity: thread, id: "@id"}
                tone: danger
          form: cafeRowRename
          path: s.renaming
          blur: renameCommit
  page.chat:
    vm: chatPage
    backLabel: true
    blocks:
      - type: chatpage
        key: main.chat
        kind: container
        head:
          - {type: view, id: chat.header}
          - type: notice
            tone: warn
            text: t:runtime.updateRequired
            when: $.connection.updateRequired
            action:
              type: button
              label: t:runtime.reload
              act: runtimeReload
              when: $.connection.canReload
        bar:
          - type: toolbar
            variant: float
            when: $.find
            items:
              - type: text
                parts:
                  - {icon: search, size: xs}
              - type: text
                text:
                  t: chatPage.actions.label
                  args: [$.find.q, $.find.index, $.find.count]
              - {type: grow}
              - type: button
                iconOnly: true
                icon: prev
                label: t:chatPage.prevHit
                act: findStep
                args: {v: "-1"}
              - type: button
                iconOnly: true
                icon: next
                label: t:chatPage.nextHit
                act: findStep
                args: {v: "1"}
              - {type: button, iconOnly: true, icon: back, label: t:chatPage.backToPrev, act: findBack}
              - type: button
                iconOnly: true
                icon: close
                label: t:common.close
                act: close
                args: {path: cs.findNav}
        top:
          - type: notice
            tone: warn
            strong: t:chatPage.envDrift
            text: $.hook.summary
            items:
              of: $.hook.open
              map:
                "true": $.hook.items
                _: []
            when: [$.hook.items, "!$.hook.fixed"]
            action:
              - type: button
                label: t:wsOps.previewChanges
                act: toggle
                args: {path: cs.hookOpen}
                pressed: $.hook.open
              - type: button
                label: t:chatPage.syncAll
                act: set
                args: {path: cs.hookFixed, v: "true", cast: bool}
          - type: toolbar
            variant: marker
            when: $.imported
            items:
              - type: text
                parts:
                  - {icon: link, size: xs}
                  - text:
                      t: chatPage.actions.imported
                      args:
                        - $.imported.tool
                        - t: chat.emptyValue
                          args: [$.imported.ago]
                        - of: $.imported.hasWho
                          map:
                            "true":
                              of: [0, 1, 2]
                              item:
                                of: "@"
                                map: {"0": $.imported.name, "1": " ", "2": $.imported.handle}
                              sep: ""
                            _: ""
          - type: toolbar
            variant: marker
            when: $.messages.length
            items:
              - type: text
                text:
                  t: chat.older
                  args: [$.older]
                when:
                  of: $.older
                  map: {idle: false, _: true}
              - type: button
                link: true
                label: t:chatPage.loadEarlier
                act: streamOlder
                when:
                  of: $.older
                  map: {idle: true, _: false}
          - type: notice
            text:
              t: chatPage.actions.viewCat
              args: [$.viewCat.name, $.viewCat.handle]
            when: $.viewCat
            action:
              - type: button
                label: t:chatPage.backToGroup
                act: set
                args: {path: cs.viewCat, cast: "null", v: ""}
        body:
          - type: view
            id: chat.stream
            when: $.messages.length
            key: stream
            kind: content
            essential: true
          - type: view
            id: chat.welcome
            when:
              of: $.messages.length
              gte: 0
              map:
                "true":
                  of: $.messages.length
                  map: {"0": true, _: false}
                _: $.lobby
          - type: empty
            text: chat.chatPage.none
            when:
              of: $.messages.length
              gte: 0
              map:
                "true": false
                _:
                  of: $.lobby
                  map: {"true": false, _: true}
        side:
          - {type: view, id: chat.ticks}
          - {type: app, name: stripe, region: panel, key: stripe}
          - {type: app, name: handle, region: panel, key: handle}
        dock:
          - type: notice
            when: $.vote
            text:
              t: chatPage.actions.vote
              args: [$.vote.question, $.vote.count]
            action:
              - {type: button, label: t:chatPage.endVote, act: cafeVoteEnd}
          - {type: view, id: chat.composer}
  chat.welcome:
    vm: chatWelcome
    blocks:
      - type: box
        variant: hero
        blocks:
          - {type: head, variant: hero, title: t:chatWelcome.title}
          - type: tiles
            from:
              - icon: pen
                title: t:chatWelcome.describe
                act: fieldFocus
                args: {id: chat-input}
              - icon: at
                title: t:chatWelcome.mentionCat
                act: insert
                args: {into: chat-input, text: "@", mode: replace}
              - {icon: link, title: t:chatWelcome.quoteContext, act: ctxPop}
  chat.modal:
    vm: chatModal
    bare: true
    blocks:
      - type: dialog
        pop: chat.modal
        title: $.title
        help: $.help
        wide: $.wide
        form: $.form
        error:
          of: $.error
          map:
            partial: t:inbox.error.partial
            conflict: t:mediaReview.conflict
            _: $.error
        blocks:
          - {type: view, id: $.view, data: $.data}
        footer:
          - type: button
            label: t:common.cancel
            act: close
            args: {popup: chat.modal}
            when: [$.submission, "!$.scanLabel"]
          - type: button
            label: $.scanLabel
            act: set
            args: {path: cs.modal.scan, v: true, cast: bool}
            when: $.scanLabel
          - type: button
            label: $.submission.label
            primary: true
            submit: true
            args:
              branchTitle: t:chat.notifications.submission.title
              branchNote: t:chat.notifications.submission.note
              importTitle: t:chat.notifications.submission.importedThreadTitle
              importNote: t:chat.notifications.submission.sessionAttached
            disabled: $.submission.disabled
            when: $.submission
  modal.feature:
    title: t:threadSettings.feature
    help: t:threadSettings.featureDialog.desc
    submitLabel: t:common.save
    blocks:
      - type: settings
        rows:
          - kind: field
            label: Feature
            id: ft-sel
            control:
              type: select
              change: cafeSel
              id: ft-sel
              options:
                - {v: "", label: t:threadSettings.dialog.text}
                - from: $.opts
                  item:
                    v: "@v"
                    label:
                      t: chat.featureName
                      args: ["@v", "@name"]
              value: $.cur
  modal.forward:
    title:
      t: chat.forward
      args: [$.source, $.n]
    submitLabel: t:composer.forward
    blocks:
      - type: list
        id: cafeFwd
        from: $.threads
        item:
          selectable: true
          act: set
          args: {path: cs.modal.to, v: "@id"}
        row: thread.row
  modal.branch:
    title: t:chat.thread.branch.title
    help: t:chat.thread.branch.desc
    submitLabel: t:chat.thread.branch.foot
    blocks:
      - type: toolbar
        items:
          - type: input
            id: br-text
            rows: 5
            input: cafeField
            value:
              of: $.edited
              map:
                "true": $.value
                _:
                  of: $.quote
                  slice: [0, 200]
            placeholder: ""
  modal.anno:
    title: t:work.annotate
    help:
      of: [0, 1, 2]
      item:
        of: "@"
        map:
          "0": “
          "1":
            of: $.quote
            slice: [0, 80]
          "2": ”
      sep: ""
    submitLabel: t:mediaReview.annotation.foot
    blocks:
      - type: toolbar
        items:
          - type: input
            id: an-text
            rows: $.rows
            input: cafeField
            value: $.value
            placeholder: t:mediaReview.annotation.placeholder
  modal.hist:
    title: t:historyPicker.dialog.title
    blocks:
      - type: toolbar
        items:
          - type: search
            id: hs-q
            placeholder: t:historyPicker.placeholder
            value: $.q
            input: cafeLive
      - type: list
        id: cafeHist
        from: $.items
        row:
          layout: line
          title: "@t"
          act: histPick
          args: {v: "@t"}
        empty: t:historyPicker.empty
  modal.lobby:
    title:
      t: gameLobby.dialog.title
      args:
        - of: $.mode
          map:
            player: t:gameLobby.mode.player
            standard: t:gameLobby.mode.player
            _: $.mode
    wide: true
    submitLabel:
      t: gameLobby.dialog.foot
      args: [$.n]
    blocks:
      - type: settings
        rows:
          - kind: field
            label: t:gameLobby.board
            control:
              type: seg
              from:
                - {v: 6}
                - {v: 7}
                - {v: 8}
                - {v: 9}
                - {v: 10}
                - {v: 12}
              value: $.board
              item:
                label:
                  t: gameLobby.dialog.board
                  args: ["@v"]
              act: set
              args: {path: cs.modal.board}
          - kind: field
            label: t:gameLobby.players
            control:
              type: select
              variant: member
              multi: true
              id: lobby-cats
              options: $.pool
              value: $.cats
              act: pick
              args: {path: cs.modal.cats}
              label: t:gameLobby.players
          - kind: field
            label: t:gameLobby.voiceMode
            control:
              type: switch
              value: $.voice
              act: set
              args:
                path: cs.modal.voice
                v:
                  of: $.voice
                  map: {"true": false, _: true}
                cast: bool
              label: t:gameLobby.voiceMode
  modal.lib:
    title: t:memory.newLibrary
    wide: true
    submitLabel: t:common.create
    scanLabel:
      of: $.created
      map: {"true": "", "false": t:chat.scanLabel.false, _: $.created}
    blocks:
      - type: settings
        rows:
          - kind: field
            label: t:common.type
            id: lib-type
            control:
              type: select
              change: cafeSel
              id: lib-type
              options:
                - {v: project, label: t:threadSettings.project}
                - {v: world, label: t:workspaceOwners.world}
                - {v: domain, label: t:workspaceOwners.domain}
                - {v: research, label: t:workspaceOwners.research}
                - {v: global, label: t:frame.rail}
              value: $.type
          - kind: field
            label: t:common.name
            id: lib-name
            control: {type: input, id: lib-name, placeholder: t:common.identifier, mono: true}
          - kind: field
            label: t:newLibrary.displayName
            id: lib-disp
            control: {type: input, id: lib-disp, placeholder: t:common.name}
          - kind: field
            label: t:newLibrary.rootPath
            id: lib-root
            control: {type: input, id: lib-root, placeholder: ~/workspace/…, mono: true}
          - kind: field
            label: t:newLibrary.visibility
            id: lib-vis
            control:
              type: select
              change: cafeSel
              id: lib-vis
              options:
                - {v: private, label: t:newLibrary.private}
                - {v: internal, label: t:newLibrary.internal}
                - {v: public, label: t:newLibrary.public}
              value: $.vis
      - type: stats
        from:
          - {v: $.scan.totalFiles, l: t:workspaceOwners.totalFiles}
          - {v: $.scan.markdownFiles, l: t:workspaceOwners.markdownFiles}
          - {v: $.scan.secretFindings, l: t:workspaceOwners.secretFindings}
        when: $.scan
      - type: notice
        tone: warn
        text: $.scan.secretFindings
        strong: t:workspaceOwners.secretFindings
        when: {of: $.scan.secretFindings, gte: 1}
      - type: status
        tone:
          of:
            of: $.scan.safe
            map: {"true": safe, _: unsafe}
          map: {safe: ok, _: warn}
        text:
          of:
            of: $.scan.safe
            map: {"true": safe, _: unsafe}
          map:
            safe: t:workspaceOwners.safe
            unsafe: t:workspaceOwners.unsafe
            _:
              of: $.scan.safe
              map: {"true": safe, _: unsafe}
        when: $.scan
      - type: status
        text:
          t: chat.indexStatus
          args: [$.indexStatus]
        when: $.indexStatus
  replay.body:
    vm: theater
    readonly: true
    blocks:
      - type: box
        fill: true
        blocks:
          - type: toolbar
            items:
              - type: select
                id: rp-source
                label: t:workspaceOwners.source
                options:
                  - from: $.rp.sources
                    item:
                      v: "@v"
                      label:
                        of: "@kind"
                        map:
                          thread:
                            t: common.currentThread
                            args: ["@id", "@name"]
                          feature:
                            t: workbench.replaySource.feature
                            args: ["@id", "@name"]
                          _: "@kind"
                value: $.rp.source
                change: rpSource
              - type: input
                add: true
                id: story-annotation
                label: t:mediaReview.annotations
                go: rpAnnotate
                args: {storyId: $.rp.annotation.storyId, at: $.rp.annotation.at}
                goLabel: t:common.save
                when: $.rp.annotation
          - type: box
            variant: scroll
            follow: true
            blocks:
              - {$frag: REPLAY_STREAM}
              - type: list
                from: $.rp.annotation.items
                optional: true
                row:
                  layout: two
                  title: "@title"
                  sub:
                    text: {of: "@at", fmt: hm}
              - type: notice
                tone: warn
                text: $.rp.annotation.error
                when: $.rp.annotation.error
              - {type: empty, text: t:theater.empty, when: $.empty}
          - type: component
            use: player
            props:
              data: $.player
              seek: rpSeek
              play:
                type: button
                iconOnly: true
                icon:
                  of: $.player.playing
                  map: {"true": pause, "false": play, _: $.player.playing}
                label:
                  of: $.player.playing
                  map:
                    "true":
                      t: wsReplay.controls.playLabel.true
                      args:
                        - t: wsReplay.controls.stoppedLabel
                          args: [$.player.ended]
                    "false":
                      t: wsReplay.controls.stoppedLabel
                      args: [$.player.ended]
                    _: $.player.playing
                act: rpPlay
              speed:
                type: select
                id: rp-speed
                label: t:wsReplay.controls.label
                value: $.player.speed
                options:
                  - ["1", 1×]
                  - ["10", 10×]
                  - ["50", 50×]
                  - ["100", 100×]
                  - [max, t:wsReplay.speed.text]
                change: rpSpeed
              toggles:
                - type: button
                  iconOnly: true
                  icon: skipIdle
                  label: t:wsReplay.controls.skipIdle
                  pressed: $.player.skip
                  tip: t:wsReplay.controls.tip
                  act: toggle
                  args: {path: s.rp.skip}
                - type: button
                  iconOnly: true
                  icon:
                    of: $.player.faithful
                    map: {"true": file, "false": film, _: $.player.faithful}
                  label:
                    of: $.player.faithful
                    map:
                      "true": t:wsReplay.controls.modeTip.true
                      "false": t:wsReplay.controls.modeTip.false
                      _: $.player.faithful
                  pressed: $.player.faithful
                  tip:
                    t: wsReplay.controls.modeTip
                    args: [$.player.faithful]
                  act: toggle
                  args: {path: s.rp.mode, values: cinematic|faithful}
              more:
                type: more
                label: t:wsReplay.controls.navigateEvents
                items:
                  - label: t:wsReplay.menu.label
                    act: set
                    args: {path: s.rp.at, add: -1}
                  - label: t:wsReplay.menu.nextEvent
                    act: set
                    args: {path: s.rp.at, add: 1}
                  - from: $.player.chapters
                    item:
                      label:
                        t: wsReplay.menu.chapter
                        args:
                          - {of: "@time", fmt: clockH}
                          - t: wsReplay.chapter
                            args: ["@kind"]
                      act: set
                      args: {path: s.rp.at, v: "@i", cast: num}
            when: $.player
  theater:
    bare: true
    vm: theater
    readonly: true
    blocks:
      - type: dialog
        pop: theater
        title: $.title
        layout: fill
        blocks:
          - {type: view, id: replay.body}
  modal.tags:
    title: t:tagManager.dialog.title
    help: t:tagManager.dialog.desc
    blocks:
      - type: tags
        from: $.tags
        item:
          tint:
            of: "@tint.length"
            gte: 1
            map:
              "true": "@tint"
              _:
                of: "@id"
                map: {game: 3, track: 4, _: 1}
        remove:
          act: remove
          args: {entity: tag}
          label: t:classify.deleteTag
        empty: t:tagManager.empty
        add:
          id: tag-new
          act: add
          args: {entity: tag}
          tint:
            id: tag-tint
            value: $.tint
            default: --tint-2
            input: cafeField
            label: t:control.color
  modal.ibIgnore:
    title: t:inbox.historyMenu.ignoreTimeSpan
    submitLabel: t:common.confirm
    blocks:
      - type: each
        from:
          - {}
        when: $.ready
        item:
          fields:
            - k: t:inbox.title
              v:
                t: placement.previewCount
                args: [$.count]
            - k:
                t: inbox.historyMenu.label
                args: [$.ignoredCount]
              v:
                t: placement.excludedCount
                args: [$.ignoredCount]
        blocks:
          - {type: kv, from: "@fields"}
  modal.classify:
    title: t:classify.dialog.title
    wide: true
    help:
      t: classify.dialog.desc
      args: [$.un]
    blocks:
      - type: toolbar
        items:
          - type: button
            label: t:classify.suggest
            act: clSuggest
            when:
              of: $.phase
              map: {idle: true, _: false}
          - type: button
            primary: true
            label: t:classify.acceptAll
            act: clAccept
            args: {all: true}
            when:
              of: $.phase
              map: {review: true, _: false}
          - type: button
            label: t:common.cancel
            act: clDismiss
            when:
              of: $.phase
              map: {review: true, _: false}
          - {type: grow}
          - type: search
            id: cl-q
            placeholder: t:classify.searchPlaceholder
            value: $.q
            input: cafeLive
      - type: box
        load: $.load
        error: $.error
        retry: {act: clSuggest}
        blocks:
          - type: status
            tone: ok
            text: t:common.done
            when:
              of: $.phase
              map: {done: true, _: false}
          - type: label
            text: t:classify.review
            when:
              of: $.phase
              map: {review: true, _: false}
          - type: tags
            when:
              of: $.phase
              map: {idle: true, _: false}
            from: $.tags
            item:
              tint:
                of: "@tint.length"
                gte: 1
                map:
                  "true": "@tint"
                  _:
                    of: "@id"
                    map: {game: 3, track: 4, _: 1}
            remove:
              act: remove
              args: {entity: tag}
              label: t:classify.deleteTag
            add:
              id: tag-new
              act: add
              args: {entity: tag}
              tint:
                id: tag-tint
                value: $.tint
                default: --tint-2
                input: cafeField
                label: t:control.color
          - type: list
            when:
              of: $.phase
              map: {idle: true, _: false}
            id: cafeCl
            from: $.threads
            item: {time: "", act: "", classify: true}
            row: thread.row
            empty: t:classify.noMatch
          - type: list
            when:
              - of: $.phase
                map: {idle: false, _: true}
              - of: $.phase
                map: {generating: false, _: true}
            id: cl-review
            from: $.suggestions
            row:
              key: "@id"
              layout: line
              title: "@title"
              cols:
                - w: ctl
                  control:
                    type: each
                    from: "@labels"
                    control:
                      type: stack
                      items:
                        - {type: chip, label: "@label"}
                        - {type: text, variant: meta, text: t:hub.add, when: "@isNew"}
                - w: ctl
                  control:
                    type: button
                    label: t:common.accept
                    act: clAccept
                    args: {ids: "@ids"}
                    when: "!@accepted"
                - {w: state, v: t:common.done, when: "@accepted"}
            empty: t:classify.noMatch
  modal.org:
    title: t:organize.dialog.title
    wide: true
    submitLabel:
      t: organize.submitLabel
      args:
        - of: $.to
          map: {new: true, _: false}
        - $.n
    blocks:
      - type: toolbar
        items:
          - {type: text, text: t:organize.organizeInto}
          - type: select
            change: cafeSel
            id: org-to
            options: $.opts
            item:
              remove:
                act: cafeOrgNew
                args: {op: drop, id: "@v"}
                label:
                  of: "@pending"
                  map: {"true": t:common.delete, "false": t:chat.removeGroup.false, _: "@pending"}
            value: $.to
            label: t:organize.organizeInto
            when: $.opts
          - type: input
            add: true
            label: t:organize.newGroup
            id: org-name
            placeholder: t:organize.groupName
            max: 120
            go: cafeOrgNew
            args: {op: set}
            goLabel: t:common.confirm
      - type: toolbar
        items:
          - type: search
            id: org-q
            placeholder: t:organize.searchPlaceholder
            value: $.q
            input: cafeLive
          - {type: grow}
          - type: button
            label: t:organize.pickUngrouped
            act: pick
            args: {path: cs.modal.sel, all: $.free}
          - type: button
            label: t:organize.clearSelection
            act: pick
            args: {path: cs.modal.sel, none: "1"}
      - type: list
        id: cafeOrg
        from: $.threads
        item:
          time: ""
          selectable: true
          act: pick
          args: {path: cs.modal.sel, id: "@id"}
        row: thread.row
      - type: text
        variant: meta
        text: t:organize.pickTwo
        when:
          - of: $.to
            map: {new: true, _: false}
          - of: $.n
            gte: 2
            map: {"true": false, _: true}
  modal.tset:
    title: t:threadSettings.dialog.title
    wide: true
    help: $.name
    blocks:
      - type: settings
        rows:
          - kind: field
            label: t:common.name
            id: ts-name
            control:
              type: input
              id: ts-name
              value: $.name
              max: 200
              go: rename
              args: {entity: thread, id: $.id}
              icon: check
              goLabel: t:common.save
          - kind: field
            label: t:threadSettings.project
            control:
              type: text
              variant: value
              parts:
                - {text: $.path, when: $.path, mono: true}
                - {text: t:threadSettings.dialog.path, when: "!$.path", mono: true}
          - kind: field
            label: t:composer.pin
            control:
              type: switch
              value: $.pinned
              act: setStatus
              args: {entity: pin, id: $.id}
              label: t:threadSettings.pinThread
          - kind: field
            label: t:threadSettings.feature
            id: ts-feat
            control:
              type: select
              change: cafeSel
              id: ts-feat
              options:
                - {v: "", label: t:threadSettings.dialog.text}
                - from: $.feats
                  item:
                    v: "@v"
                    label:
                      t: chat.featureName
                      args: ["@v", "@name"]
              value: $.feat
          - kind: field
            label: t:wsSignals.threadId
            control:
              type: copy
              value: $.disp.id
              label: t:wsSessions.copyThreadId
              mono: true
          - kind: field
            label: t:wsSessions.record
            control:
              type: seg
              value: $.disp.record
              act: set
              args:
                path: cs.disp.{t}.record
                t: $.id
              options:
                - {v: follow, label: t:members.defaults}
                - {v: open, label: t:common.expand}
                - {v: fold, label: t:common.collapse}
          - kind: field
            label: t:wsSessions.showThinking
            control:
              type: switch
              value: $.disp.thinking
              act: toggle
              args:
                path: cs.disp.{t}.{k}
                t: $.id
                k: thinking
              label: t:wsSessions.showThinking
          - kind: field
            label: t:wsSessions.showWhisper
            control:
              type: switch
              value: $.disp.whisper
              act: toggle
              args:
                path: cs.disp.{t}.{k}
                t: $.id
                k: whisper
              label: t:wsSessions.showWhisper
      - type: box
        blocks:
          - type: disclosure
            act: fold
            args: {path: cs.modal.open, v: goal}
            key: goal
            open:
              of: $.open
              map: {goal: true, _: false}
            title: t:threadSettings.goal
            sub: $.goalSub
            blocks:
              - type: toolbar
                when: {of: $.targets.length, gte: 2}
                items:
                  - type: select
                    variant: member
                    id: ts-goal-cat
                    options: $.targets
                    value: $.goalCatId
                    label: t:chatCards.field.target
                    change: cafeSel
              - type: toolbar
                items:
                  - type: input
                    rows: true
                    id: ts-goal
                    input: cafeField
                    value: $.goal
                    placeholder: t:threadSettings.goalPlaceholder
              - type: toolbar
                items:
                  - type: button
                    label: t:threadSettings.restoreSaved
                    act: cafeTsGoal
                    args: {v: reset}
                  - type: button
                    label: t:threadSettings.saveAndSync
                    act: cafeTsGoal
                    args: {v: save, catId: $.goalCatId}
                  - type: status
                    tone: ok
                    text: t:threadSettings.synced
                    when: $.goalSynced
          - type: disclosure
            act: fold
            args: {path: cs.modal.open, v: runtime}
            key: runtime
            open:
              of: $.open
              map: {runtime: true, _: false}
            title:
              t: threadSettings.runtimeTitle
              args: [$.runtimeLabel]
            blocks:
              - type: settings
                rows:
                  - label: t:threadSettings.liveAbility
                    control: {type: status, text: $.runtime.ability, tone: $.runtime.abilityTone}
                  - label: t:threadSettings.permission
                    control:
                      type: status
                      text: $.runtime.permission
                      tone: $.runtime.permissionTone
                  - {label: t:threadSettings.account, value: $.runtime.account}
                  - {label: t:threadSettings.quotaSource, value: $.runtime.quota}
          - type: disclosure
            act: fold
            args: {path: cs.modal.open, v: cat}
            key: cat
            open:
              of: $.open
              map: {cat: true, _: false}
            title: t:threadSettings.defaultCat
            blocks:
              - type: toolbar
                items:
                  - type: select
                    variant: member
                    id: ts-cat
                    options: $.cats
                    value: $.cat
                    none: t:system.systemDefault
                    change: cafeSel
                    label: t:threadSettings.defaultCat
          - type: disclosure
            act: fold
            args: {path: cs.modal.open, v: think}
            key: think
            open:
              of: $.open
              map: {think: true, _: false}
            title: t:threadSettings.thinking
            blocks:
              - type: settings
                from: $.think
                row:
                  label:
                    t: chat.memberLabel
                    args: ["@name", "@catId"]
                  control:
                    type: select
                    change: cafeTsThink
                    id: "@id"
                    options:
                      - {v: "", label: t:threadSettings.followDefault}
                      - from: "@options"
                        item: {v: "@v", label: "@v"}
                    value: "@value"
                    args: {catId: "@catId"}
          - type: disclosure
            act: fold
            args: {path: cs.modal.open, v: speed}
            key: speed
            open:
              of: $.open
              map: {speed: true, _: false}
            title: t:threadSettings.speed
            blocks:
              - type: settings
                from: $.speed
                row:
                  label:
                    t: chat.memberLabel
                    args: ["@name", "@catId"]
                  control:
                    type: select
                    change: cafeTsSpeed
                    id: "@id"
                    options:
                      - {v: "", label: t:threadSettings.followDefault}
                      - from: "@options"
                        item: {v: "@v", label: "@v"}
                    value: "@value"
                    args: {catId: "@catId"}
          - type: disclosure
            act: fold
            args: {path: cs.modal.open, v: strategy}
            key: strategy
            open:
              of: $.open
              map: {strategy: true, _: false}
            title: t:placement.strategy
            blocks:
              - type: settings
                from: $.strategy
                row:
                  label: "@label"
                  control:
                    type: select
                    id: "@catId"
                    options:
                      - {v: "", label: t:members.defaults}
                      - {v: resume, label: t:placement.resume}
                      - {v: reborn, label: t:placement.reborn}
                    value: "@value"
                    change: cafeTsStrategy
                    args: {catId: "@catId"}
                    label: "@label"
          - type: disclosure
            act: fold
            args: {path: cs.modal.open, v: tags}
            key: tags
            open:
              of: $.open
              map: {tags: true, _: false}
            title: t:common.tags
            sub:
              of: {of: $.tagSub, sep: 、}
              map:
                "": t:threadSettings.noTags
                _: {of: $.tagSub, sep: 、}
            blocks:
              - type: tags
                from: $.tags
                item:
                  tint:
                    of: "@tint.length"
                    gte: 1
                    map:
                      "true": "@tint"
                      _:
                        of: "@id"
                        map: {game: 3, track: 4, _: 1}
                pick:
                  act: pick
                  args: {path: cs.modal.sel}
                remove:
                  act: remove
                  args: {entity: tag}
                  label: t:classify.deleteTag
                empty: t:threadSettings.noTags
                add:
                  id: tag-new
                  act: add
                  args: {entity: tag}
                  tint:
                    id: tag-tint
                    value: $.tint
                    default: --tint-2
                    input: cafeField
                    label: t:control.color
              - type: toolbar
                items:
                  - type: button
                    label: t:common.clear
                    act: pick
                    args: {path: cs.modal.sel, none: "1"}
                  - type: button
                    label: t:common.cancel
                    act: cafeTsTags
                    args: {v: reset}
                  - type: button
                    label: t:threadSettings.saveTags
                    act: cafeTsTags
                    args: {v: save}
      - {type: view, id: watcher.thread}
  modal.import:
    title: t:importSession.notifications.title
    wide: true
    submitLabel: t:importSession.notifications.foot
    blocks:
      - type: settings
        rows:
          - kind: field
            label: t:importSession.sessionFrom
            id: im-tool
            control:
              type: select
              change: cafeSel
              id: im-tool
              options: $.tools
              value: $.tool
          - kind: field
            label: t:importSession.assignTo
            id: im-cat
            control:
              - type: select
                variant: member
                id: im-cat
                options: $.cats
                value: $.cat
                change: cafeSel
                label: t:importSession.assignTo
                when: $.cats
              - type: text
                variant: meta
                text: t:importSession.noMembersForTool
                when: "!$.cats"
            foot:
              - control:
                  type: button
                  link: true
                  label: t:importSession.addCat
                  act: open
                  args: {page: memberNew}
      - type: label
        text: t:importSession.recentSessions
        action:
          type: button
          iconOnly: true
          icon: refresh
          label: t:importSession.refreshList
          act: cafeImRefresh
      - type: box
        variant: group
        load: $.sessLoad
        error: t:importSession.sessionsError
        empty: t:importSession.sessionsEmpty
        retry: {act: cafeImRefresh}
        blocks:
          - type: each
            from: $.sessions
            item:
              boundRow:
                - first: "@first"
                  bound: "@boundThread.id"
                  boundTitle: "@boundThread.title"
                  when: "@alreadyBound"
              pick:
                - v: "@id"
                  label: "@first"
                  sub: ["@proj", "@ago"]
                  when: "!@alreadyBound"
              cur: $.selected
            blocks:
              - type: list
                inline: true
                from: "@boundRow"
                row:
                  layout: two
                  title: "@first"
                  sub:
                    - text:
                        t: importSession.notifications.boundSub
                        args: ["@boundTitle"]
                      when: "@boundTitle"
                    - {text: t:importSession.notifications.bound, when: "!@boundTitle"}
                    - control:
                        type: button
                        link: true
                        label: t:common.open
                        act: threadOpen
                        args: {id: "@bound"}
                        when: "@bound"
                  tone: off
              - type: choices
                from: "@pick"
                item:
                  sub: {of: "@sub", sep: " · "}
                value: "@cur"
                act: set
                args: {path: cs.modal.sel}
      - type: text
        parts: [t:importSession.recent20]
        help: t:importSession.noTurnCount
      - type: toolbar
        items:
          - type: input
            id: im-id
            placeholder: t:importSession.pastePlaceholder
            mono: true
            input: cafeField
            value: $.manualId
            go: cafeImVerify
            icon: check
            goLabel: t:importSession.verify
      - type: notice
        when: $.verify.ok
        text:
          t: importSession.notifications.verifyOk
          args:
            - t: chat.verifyWho
              args:
                - of: $.firstCat.id.length
                  gte: 1
                  map:
                    "true":
                      of: [0, 1, 2]
                      item:
                        of: "@"
                        map: {"0": $.firstCat.name, "1": " ", "2": $.firstCat.handle}
                      sep: ""
                    _: ""
            - $.verify.proj
            - $.verify.ago
      - type: notice
        tone: warn
        when: [$.verify, "!$.verify.ok", $.verify.reason]
        text:
          t: chat.verifyFailure
          args: [$.verify.reason, $.verifyTool]
      - type: notice
        tone: danger
        when: $.err
        text:
          of: $.err
          map: {importFailed: t:chat.notifications.submission.importFailed, _: $.err}
      - type: settings
        rows:
          - kind: field
            label: t:threadRow.name
            id: im-title
            control: {type: input, id: im-title, max: 200}
      - type: toolbar
        items:
          - type: check
            value: $.pin
            label: t:importSession.pinAfter
            act: set
            args:
              path: cs.modal.pin
              v:
                of: $.pin
                map: {"true": false, _: true}
              cast: bool
  page.work:
    page: true
    vm: work
    blocks:
      - type: head
        title: $.title
        note: "1"
        meta:
          - text:
              t: work.view.meta
              args:
                - of: $.meta.page
                  map:
                    "true":
                      t: chat.workType.true
                      args:
                        - t: common.artType
                          args: [$.meta.type]
                    "false":
                      t: common.artType
                      args: [$.meta.type]
                    _: $.meta.page
                - $.meta.author
                - $.meta.version
                - {of: $.meta.at, fmt: at}
                - of: $.meta.hasThread
                  map:
                    "true":
                      t: chat.workFrom.true
                      args: [$.meta.threadTitle]
                    "false": ""
                    _: $.meta.hasThread
        actions:
          - type: button
            label: t:work.openInChat
            act: cafeWorkSrc
            args: {i: $.i}
          - type: more
            items:
              - label: t:common.download
                act: download
                args: {source: $.source, name: $.title}
              - label: t:work.openNewTab
                act: openUrl
