          - type: toolbar
            when: "!@card.result"
            items:
              - type: button
                label: t:runtime.openAuthorization
                act: openUrl
                args: {url: "@card.url"}
                when: "@card.url"
              - type: button
                label: t:runtime.answerInChat
                act: runtimeConversationInsert
                args: {id: "@card.id"}
                when: "@card.allowText"
              - {type: grow}
              - type: button
                label: t:common.reject
                act: runtimeRespond
                args: {id: "@card.id", reject: true}
                when: "@card.canReject"
              - type: each
                from: "@card.decisions"
                control:
                  type: button
                  label: "@label"
                  primary: false
                  act: runtimeRespond
                  args: {id: "@id", decisionId: "@v"}
                  when:
                    of: "@outcome"
                    map: {accept: false, _: true}
              - type: each
                from: "@card.decisions"
                control:
                  type: button
                  label: "@label"
                  primary: true
                  act: runtimeRespond
                  args: {id: "@id", decisionId: "@v"}
                  when:
                    of: "@outcome"
                    map: {accept: true, _: false}
              - type: button
                primary: true
                label: t:inbox.submitAnswer
                act: cafeAskSubmit
                args: {mid: "@mid", p: ask}
                when: "@card.qs"
              - type: button
                primary: true
                label: t:inbox.submitAnswer
