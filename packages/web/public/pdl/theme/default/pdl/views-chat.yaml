      - parts:
          - “
          - {of: $.text, max: 40}
          - "” → "
          - {of: $.names, sep: 、}
        sep: ""
    fields:
      - id: steer
        radios:
          - v: steer
            title: t:queue.send.steerReply
            sub:
              t: queue.send.sub
              args:
                - {of: $.names, sep: 、}
          - v: cut
            title: t:queue.send.interruptAndSend
            sub: t:queue.send.interruptHelp
    ok: t:queue.send.ok
  dlg.memoryForget:
    title:
      of: $.person
