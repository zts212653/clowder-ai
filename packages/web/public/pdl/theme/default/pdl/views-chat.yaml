  chat.node/letter:
    frame: msg
    who: "@who"
    from: "@from"
    source: "@source"
    time: {of: "@time", fmt: stamp}
    receivedAt: {of: "@receivedAt", fmt: stamp}
    recv: "@recv"
    quote: {$frag: CHAT_QUOTE}
    delivery: {$frag: CHAT_DELIVERY}
    jump: "@jump"
    body:
      - type: content
        html: "@html"
        fold:
          of: "@relayed"
          map:
            "true": {shape: bottom, key: "@mid"}
            _:
              of: "@bodyLength"
              gte: 240
              map:
                "true": {shape: middle, key: "@mid"}
                _: null
        note: "@notes.body"
      - type: each
        from: "@embeds"
        blocks:
          - type: box
            when: "@bundle"
            blocks:
              - type: toolbar
                items:
                  - type: chip
                    label: t:placement.messageBundle
                    icon: quote
                    pressed: "@bundle.open"
                    act: messageBundleOpen
                    args: {id: "@bundle.id"}
              - type: box
                when: "@bundle.open"
                load: "@bundle.load"
                error: t:frame.loadError
                retry:
                  act: messageBundleOpen
                  args: {id: "@bundle.id", reload: true}
                blocks:
                  - type: each
                    from: "@bundle.items"
                    item:
                      unavailable:
                        of: "@status"
                        map: {tombstone: true, _: false}
                      title: "@messageId"
                      sourceChanged:
                        of: "@reason"
                        map: {source_changed: true, _: false}
                      name: {of: "@from", fmt: identity}
                      time: "@timestamp"
                      text: "@readableContent"
                    blocks:
                      - {type: label, text: "@title", when: "@unavailable"}
                      - type: label
                        text:
                          t: chat.bundleTitle
                          args:
                            - "@name"
                            - {of: "@time", fmt: hm}
                        when: "!@unavailable"
                      - type: notice
                        tone: warn
                        text:
                          of: "@sourceChanged"
                          map: {"true": t:mediaReview.conflict, "false": t:work.noSource, _: "@sourceChanged"}
                        when: "@unavailable"
                      - {type: markdown, text: "@text", when: "!@unavailable"}
                      - {type: text, variant: meta, text: "@comment", when: "@comment"}
          - type: toolbar
            variant: marker
            when: "@deleted"
            items:
              - {type: text, text: t:chatMessage.deleted}
              - type: button
                link: true
                label: t:common.restore
                act: setStatus
                args: {entity: msgDel, v: "false", cast: bool, id: "@i"}
          - type: each
            from: "@annos"
            blocks:
              - type: toolbar
                variant: embed
                items:
                  - type: text
                    parts:
                      - {icon: pen, size: s}
                  - type: text
                    parts:
                      - parts:
                          - “
                          - of: "@quote"
                            slice: [0, 40]
                          - ”：
                          - "@note"
                        sep: ""
                  - {type: grow}
                  - type: button
                    link: true
                    label: t:chatMessage.deleteAnno
                    act: listOp
                    args:
                      path: cs.annos.{mid}
                      op: del
                      mid: "@mid"
                      i: "@k"
          - type: typed
            slot: chat.rich
            of: "@rich.type"
            data: "@rich"
            when: "@rich"
            blocks:
              - {$frag: CHAT_RICH}
    pre:
      - type: each
        from: "@annos"
        blocks:
          - type: box
            when: "@bundle"
            blocks:
              - type: toolbar
                items:
                  - type: chip
                    label: t:placement.messageBundle
                    icon: quote
                    pressed: "@bundle.open"
                    act: messageBundleOpen
                    args: {id: "@bundle.id"}
              - type: box
                when: "@bundle.open"
                load: "@bundle.load"
                error: t:frame.loadError
                retry:
                  act: messageBundleOpen
                  args: {id: "@bundle.id", reload: true}
                blocks:
                  - type: each
                    from: "@bundle.items"
                    item:
                      unavailable:
                        of: "@status"
                        map: {tombstone: true, _: false}
                      title: "@messageId"
                      sourceChanged:
                        of: "@reason"
                        map: {source_changed: true, _: false}
                      name: {of: "@from", fmt: identity}
                      time: "@timestamp"
                      text: "@readableContent"
                    blocks:
                      - {type: label, text: "@title", when: "@unavailable"}
                      - type: label
                        text:
                          t: chat.bundleTitle
                          args:
                            - "@name"
                            - {of: "@time", fmt: hm}
                        when: "!@unavailable"
                      - type: notice
                        tone: warn
                        text:
                          of: "@sourceChanged"
                          map: {"true": t:mediaReview.conflict, "false": t:work.noSource, _: "@sourceChanged"}
                        when: "@unavailable"
                      - {type: markdown, text: "@text", when: "!@unavailable"}
                      - {type: text, variant: meta, text: "@comment", when: "@comment"}
          - type: toolbar
            variant: marker
            when: "@deleted"
            items:
              - {type: text, text: t:chatMessage.deleted}
              - type: button
                link: true
                label: t:common.restore
                act: setStatus
                args: {entity: msgDel, v: "false", cast: bool, id: "@i"}
          - type: each
            from: "@annos"
            blocks:
              - type: toolbar
                variant: embed
                items:
                  - type: text
                    parts:
                      - {icon: pen, size: s}
                  - type: text
                    parts:
                      - parts:
                          - “
                          - of: "@quote"
                            slice: [0, 40]
                          - ”：
                          - "@note"
                        sep: ""
                  - {type: grow}
                  - type: button
                    link: true
                    label: t:chatMessage.deleteAnno
                    act: listOp
                    args:
                      path: cs.annos.{mid}
                      op: del
                      mid: "@mid"
                      i: "@k"
          - type: typed
            slot: chat.rich
            of: "@rich.type"
            data: "@rich"
            when: "@rich"
            blocks:
              - {$frag: CHAT_RICH}
    meta: {$frag: CHAT_META}
    below:
      - {$frag: CHAT_WATCHER}
      - {$frag: CHAT_EXEC}
      - {$frag: CHAT_SUPP}
    acts: {$frag: CHAT_ACTS}
