                    goLabel: t:common.save
                    icon: check
          - type: each
            from: $.responses
            blocks:
              - {type: text, text: "@title"}
              - {type: text, text: "@explanation"}
              - type: toolbar
                items:
                  - type: button
                    label: t:common.source
                    act: workReviewLocate
                    args: "@source"
                    when: "@source"
                  - type: button
                    label: t:common.view
                    act: workReviewLocate
                    args: "@result"
                    when: "@result"
                  - type: button
                    label: t:common.accept
                    pressed: "@accepted"
                    act: reviewJudge
                    args: {annotationId: "@annotationId", outcome: accepted}
                    when: "@canJudge"
                  - type: button
                    label: t:films.reopen
                    pressed: "@reopened"
                    act: reviewJudge
                    args: {annotationId: "@annotationId", outcome: reopened}
                    when: "@canJudge"
          - type: disclosure
