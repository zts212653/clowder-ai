  dlg.memoryEdit:
    title:
      of:
        of: $.recordKind
        map: {opening: true, _: false}
      map:
        "true": t:memoryOwners.openingMode
        "false": t:common.edit
        _:
          of: $.recordKind
          map: {opening: true, _: false}
    ok: t:common.save
    fields:
      - id: mem-edit-predicate
        label: t:memoryOwners.predicate
        value: $.values.predicate
        area: true
        max: 160
        req: true
        when:
          of: $.recordKind
          map: {fact: true, _: false}
      - id: mem-edit-value
        label: t:memoryOwners.value
        value: $.values.value
        area: true
        max: 4000
        req: true
        when:
          of: $.recordKind
          map: {fact: true, _: false}
      - id: mem-edit-value
        label: t:memoryOwners.statement
        value: $.values.value
        area: true
        max: 800
        req: true
        when:
          of: $.recordKind
          map: {assessment: true, _: false}
      - id: mem-edit-stance
        label: t:memoryOwners.stance
        value: $.values.stance
        options:
          - {v: endorsed, label: t:memoryOwners.endorsed}
          - {v: rejected, label: t:memoryOwners.rejected}
          - {v: uncertain, label: t:memoryOwners.uncertain}
        when:
          of: $.recordKind
          map: {assessment: true, _: false}
      - id: mem-edit-headline
        label: t:memoryOwners.headline
        value: $.values.headline
        area: true
        max: 240
        req: true
        when:
          of: $.recordKind
          map: {person: true, _: false}
      - id: mem-edit-topic
        label: t:memoryOwners.topic
        value: $.values.topic
        area: true
        max: 400
        req: true
        when:
          of: $.recordKind
          map: {person: true, _: false}
      - id: mem-edit-notes
        label: t:memoryOwners.uncertain
        value: {of: $.values.notes, sep: "\n"}
        area: true
        max: 964
        when:
          of: $.recordKind
          map: {person: true, _: false}
      - id: mem-edit-asOf
        label: t:memoryOwners.field.asOf
