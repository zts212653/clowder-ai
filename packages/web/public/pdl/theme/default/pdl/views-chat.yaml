        value: $.values.asOf
        req: true
        when:
          of: $.recordKind
          map: {opening: true, _: false}
      - from: $.excerpts
        item:
          id: "@id"
          label:
            of:
              of: "@kind"
              map:
                relationship: true
                _:
                  of: "@model.length"
                  gte: 1
                  map: {"true": false, _: true}
            map:
              "true":
                t: chat.openingLabel.true
                args: ["@model"]
              "false":
                t: chat.openingLabel.false
                args: ["@model"]
              _:
                of: "@kind"
                map:
                  relationship: true
                  _:
                    of: "@model.length"
                    gte: 1
                    map: {"true": false, _: true}
          value: "@value"
          area: true
          max: 600
          req: true
      - id: mem-edit-content
        label: t:wsSignals.body
        value: $.values.content
        area: true
        max: 20000
        req: true
        when:
          of: $.recordKind
          map: {profile: true, _: false}
      - id: mem-edit-summary
        label: t:wsSignals.body
        value: $.values.summary
        area: true
        max: 1000000
        req: true
        when:
          of: $.recordKind
          map: {event: true, _: false}
      - id: mem-edit-name
        label: t:common.name
        value: $.values.name
        area: true
        max: 200
        req: true
        when:
          of: $.recordKind
          map: {entity: true, _: false}
      - id: mem-edit-aliases
        label: t:memoryOwners.aliases
        value: {of: $.values.aliases, sep: "\n"}
        area: true
        max: 4020
        req: false
        when:
          of: $.recordKind
          map: {entity: true, _: false}
      - id: mem-edit-stance
        label: t:memoryOwners.stance
        value: $.values.stance
        options: [endorsed, rejected, critique_target, deliverable_only, unknown]
        when:
          of: $.recordKind
          map: {entity: true, _: false}
      - id: mem-edit-takeaway
        label: t:memoryOwners.takeaway
        value: $.values.takeaway
        area: true
        max: 500
        req: false
        when:
          of: $.recordKind
          map: {taste: true, _: false}
      - id: mem-edit-scene
        label: t:memoryOwners.scene
        value: $.values.scene
        area: true
        max: 8000
        req: true
        when:
          of: $.recordKind
          map: {taste: true, _: false}
      - from: $.quotes
        item:
          id: "@id"
          label: t:memoryOwners.quotes
          value: "@value"
          area: true
          max: 2000
          req: true
  dlg.trashPurge:
