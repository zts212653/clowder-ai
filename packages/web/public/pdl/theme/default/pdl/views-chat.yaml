                  - {type: text, variant: para, text: "@body"}
                  - type: toolbar
                    items:
                      - type: button
                        label: t:common.edit
                        act: workReviewEdit
                        args: {id: "@id"}
                        when: "@canEdit"
                      - type: button
                        label: t:wsCommunity.resolved
                        act: setStatus
                        args: {entity: reviewAnnotation, id: "@id", v: resolved}
                        when: ["@canSetState", "!@resolved"]
                      - type: button
                        label: t:films.reopen
                        act: setStatus
                        args: {entity: reviewAnnotation, id: "@id", v: open}
                        when: ["@canSetState", "@resolved"]
                      - type: button
                        label: t:films.locate
                        act: workReviewReanchor
                        args: {id: "@id"}
                        when: "@canReanchor"
                      - type: button
                        link: true
                        label: t:mediaReview.locate
                        act: mediaSeek
                        args: {id: "@mediaId", at: "@at"}
