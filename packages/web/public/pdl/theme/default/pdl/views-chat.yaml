    ok: t:wsPreview.clear
  nav.cafe.shell:
    vm: cafeNavShell
    bare: true
    blocks:
      - type: component
        use: navShell
        props:
          label: t:chat.sidebar.label
          title: t:chat.sidebar.title
          hidden: $.hidden
          scrollId: cafe-nav-scroll
          slot: nav.cafe
          actions:
            - type: button
              iconOnly: true
              icon: search
              label: t:common.search
              act: searchOpen
            - type: more
              variant: row
              label: t:chat.sidebar.moreActions
              items:
                - label:
                    t: chat.sidebar.menu.label
                    args: [$.unclassified]
                  act: cafeAutoClassify
                  why:
                    of: $.classifying
                    map: {"true": t:common.loading, "false": "", _: $.classifying}
                  when: $.unclassified
                - label: t:chat.sidebar.menu.classifyManually
                  act: modal
                  args: {v: classify}
                  when: $.unclassified
                - label:
                    t: chat.sidebar.menu.markAllRead
                    args: [$.unread]
                  act: cafeReadAll
                  when: $.unread
                - label: t:chat.sidebar.menu.collapseSidebar
                  act: toggle
                  args: {path: cs.navHidden}
          bar:
            key: nav.cafe.bar
            note:
              of: $.route
              map: {chat: 11, _: ""}
            items:
              - key: group
                move: nav.cafe.bar
                control:
                  type: component
                  use: dropBtn
                  props:
                    label:
                      t: chat.sidebar.groupFilter
                      args:
                        - of: $.group
                          map:
                            pinned: t:threadRow.section.pinned
                            recent: t:threadRow.section.recent
                            project: t:threadSettings.project
                            system: t:threadRow.section.system
                            favorites: t:threadRow.section.favorites
                            _: $.group
                    tip: t:chat.sidebar.tip
                    items:
                      - {scope: t:chat.sidebar.grouping.group}
                      - label:
                          of: [0, 1, 2]
                          item:
                            of: "@"
                            map: {"0": t:threadRow.section.pinned, "1": "  ", "2": $.counts.pinned}
                          sep: ""
                        act: set
                        args: {path: cs.group, v: pinned}
                        cur:
                          of: $.group
                          map: {pinned: true, _: false}
                      - label:
                          of: [0, 1, 2]
                          item:
                            of: "@"
                            map: {"0": t:threadRow.section.recent, "1": "  ", "2": $.counts.recent}
                          sep: ""
                        act: set
                        args: {path: cs.group, v: recent}
                        cur:
                          of: $.group
                          map: {recent: true, _: false}
                      - label:
                          of: [0, 1, 2]
                          item:
                            of: "@"
                            map: {"0": t:threadSettings.project, "1": "  ", "2": $.counts.project}
                          sep: ""
                        act: set
                        args: {path: cs.group, v: project}
                        cur:
                          of: $.group
                          map: {project: true, _: false}
                      - label:
                          of: [0, 1, 2]
                          item:
                            of: "@"
                            map: {"0": t:threadRow.section.system, "1": "  ", "2": $.counts.system}
                          sep: ""
                        act: set
                        args: {path: cs.group, v: system}
                        cur:
                          of: $.group
                          map: {system: true, _: false}
                      - label:
                          of: [0, 1, 2]
                          item:
                            of: "@"
                            map: {"0": t:threadRow.section.favorites, "1": "  ", "2": $.counts.favorites}
                          sep: ""
                        act: set
                        args: {path: cs.group, v: favorites}
                        cur:
                          of: $.group
                          map: {favorites: true, _: false}
              - key: tag
                move: nav.cafe.bar
                control:
                  type: component
                  use: dropBtn
                  props:
                    label:
                      of: $.hasTag
                      map:
                        "true":
                          t: chat.sidebar.tagFilter
                          args:
                            - of: $.tagName
                              map: {__none: t:threadRow.unassigned, _: $.tagName}
                        "false": t:common.tags
                        _: $.hasTag
                    pressed: $.tag
                    items:
                      - label: t:composerPop.options.allThreads
                        act: set
                        args: {path: cs.tag, v: "", cast: "null"}
                        cur: $.noTag
                      - label:
                          t: chat.sidebar.tags.unclassifiedCount
                          args: [$.untagged]
                        act: fold
                        args: {path: cs.tag, v: __none}
                        cur: $.untaggedOn
                      - from: $.tags
                        item:
                          label:
                            t: chat.tagCount
                            args: ["@name", "@n"]
                          act: fold
                          args: {path: cs.tag, v: "@id"}
                          cur: "@on"
                      - label: t:chat.sidebar.tags.manageTags
                        act: modal
                        args: {v: tags}
              - key: tagClear
                when: $.tag
                control:
                  type: button
                  iconOnly: true
                  icon: close
                  label: t:nav.clearTagFilter
                  act: set
                  args: {path: cs.tag, v: "", cast: "null"}
              - key: projOpen
                anchor: end
                when: $.byProject
                control:
                  type: button
                  iconOnly: true
                  icon: down
                  label: t:chat.sidebar.expandProjects
                  act: set
                  args: {path: cs.projAll, v: "1"}
              - key: projClose
                anchor: end
                when: $.byProject
                control:
                  type: button
                  iconOnly: true
                  icon: right
                  label: t:chat.sidebar.collapseProjects
                  act: set
                  args: {path: cs.projAll, v: "0"}
              - key: locate
                move: nav.cafe.bar
                anchor: end
                control:
                  type: button
                  iconOnly: true
                  icon: locate
                  label: t:chat.sidebar.locateThread
                  act: locate
          body:
            - {type: view, id: nav.threads}
          foot:
            key: cafe.nav.trash
            to: trash
            icon: delete
            label: t:trash.title
            trail:
              of: $.trash
              map: {"0": "", _: $.trash}
  chat.tool.result:
    bare: true
    blocks:
      - type: component
        use: claim
        props:
          slot: chat.tool.result
          data:
            result: "@result"
            tool:
              of: "@part"
              map:
                result: {of: "@", fmt: toolCall}
                _: ""
          fallback: result
  dlg.cafeProjRename: {title: t:chat.project.rename.title}
  dlg.cafeGroupRename: {title: t:chat.group.rename.title}
  menu.recallSources:
    items:
      - from: "@sources"
        item:
          label: "@name"
          act: recallSource
          args: {anchor: $.anchor, collection: "@collection"}
  chat.rich.cards:
    bare: true
    blocks:
      - type: each
        from: $.items
        item:
          media:
            id: "@id"
            kind: image
            src: "@src"
            label: "@alt"
            marks: []
            open:
              of: "@work.length"
              gte: 1
              map:
                "true":
                  act: workOpen
                  args: {i: "@work"}
                _: null
        blocks:
          - {type: component, use: media, props: "@media"}
  dlg.queueRecallAppend:
    title: t:chat.queueRecallAppend.title
    text: t:chat.queueRecallAppend.text
    ok: t:common.confirm
  watcher.thread:
    vm: watcherThread
    blocks:
      - type: section
        title: t:chatMessage.watcher.title
        blocks:
          - type: settings
            rows:
              - label: t:chatMessage.watcher.thread
                control:
                  type: switch
                  label: t:chatMessage.watcher.thread
                  value: $.selected
                  act: watcherThreadSet
                  args:
                    threadId: $.threadId
                    field: enabled
                    value:
                      of: $.selected
                      map: {"true": false, _: true}
              - label: t:member.title
                control: {type: text, text: $.memberName}
              - label: t:chatMessage.watcher.paused
                when: $.pausedUntil
                ctls:
                  - type: text
                    text: {of: $.pausedUntil, fmt: hm}
                  - type: button
                    label: t:common.restore
                    act: watcherThreadSet
                    args: {threadId: $.threadId, field: pausedUntil, value: null}
          - type: notice
            tone: warn
            text: t:chatMessage.watcher.globalOff
            when: "!$.config.enabled"
          - type: box
            load:
              of: $.error.length
              gte: 1
              map: {"true": error, _: ""}
            error: $.error
            retry:
              act: set
              args: {path: cs.watcherError, v: ""}
            blocks: []
  nav.settings.shell:
    bare: true
    blocks:
      - type: component
        use: navShell
        props:
          label: t:entryLayout.slot.settingsMenu
          title: t:ext.settings
          slot: nav.settings
nodes:
  chat.node/cat:
    frame: msg
    who: "@who"
    from: "@from"
    source: "@source"
    time: {of: "@time", fmt: stamp}
    receivedAt: {of: "@receivedAt", fmt: stamp}
    recv: "@recv"
    quote: {$frag: CHAT_QUOTE}
    delivery: {$frag: CHAT_DELIVERY}
    jump: "@jump"
    body:
      - type: content
        html: "@html"
        fold:
          of: "@relayed"
          map:
            "true": {shape: bottom, key: "@mid"}
            _:
              of: "@bodyLength"
              gte: 240
              map:
                "true": {shape: middle, key: "@mid"}
                _: null
        note: "@notes.body"
      - type: each
        from: "@embeds"
        blocks:
          - type: box
            when: "@bundle"
            blocks:
              - type: toolbar
                items:
                  - type: chip
                    label: t:placement.messageBundle
                    icon: quote
                    pressed: "@bundle.open"
                    act: messageBundleOpen
                    args: {id: "@bundle.id"}
              - type: box
                when: "@bundle.open"
                load: "@bundle.load"
                error: t:frame.loadError
                retry:
                  act: messageBundleOpen
                  args: {id: "@bundle.id", reload: true}
                blocks:
                  - type: each
                    from: "@bundle.items"
                    item:
                      unavailable:
                        of: "@status"
                        map: {tombstone: true, _: false}
                      title: "@messageId"
                      sourceChanged:
                        of: "@reason"
                        map: {source_changed: true, _: false}
                      name: {of: "@from", fmt: identity}
                      time: "@timestamp"
                      text: "@readableContent"
                    blocks:
                      - {type: label, text: "@title", when: "@unavailable"}
                      - type: label
                        text:
                          t: chat.bundleTitle
                          args:
                            - "@name"
                            - {of: "@time", fmt: hm}
                        when: "!@unavailable"
                      - type: notice
                        tone: warn
                        text:
                          of: "@sourceChanged"
                          map: {"true": t:mediaReview.conflict, "false": t:work.noSource, _: "@sourceChanged"}
                        when: "@unavailable"
                      - {type: markdown, text: "@text", when: "!@unavailable"}
                      - {type: text, variant: meta, text: "@comment", when: "@comment"}
          - type: toolbar
            variant: marker
            when: "@deleted"
            items:
              - {type: text, text: t:chatMessage.deleted}
              - type: button
                link: true
                label: t:common.restore
                act: setStatus
                args: {entity: msgDel, v: "false", cast: bool, id: "@i"}
          - type: each
            from: "@annos"
            blocks:
              - type: toolbar
                variant: embed
                items:
                  - type: text
                    parts:
                      - {icon: pen, size: s}
                  - type: text
                    parts:
                      - parts:
                          - “
                          - of: "@quote"
                            slice: [0, 40]
                          - ”：
                          - "@note"
                        sep: ""
                  - {type: grow}
                  - type: button
                    link: true
                    label: t:chatMessage.deleteAnno
                    act: listOp
                    args:
                      path: cs.annos.{mid}
                      op: del
                      mid: "@mid"
                      i: "@k"
          - type: typed
            slot: chat.rich
            of: "@rich.type"
            data: "@rich"
            when: "@rich"
            blocks:
              - {$frag: CHAT_RICH}
    pre:
      - type: each
        from: "@annos"
        blocks:
          - type: box
            when: "@bundle"
            blocks:
              - type: toolbar
                items:
                  - type: chip
                    label: t:placement.messageBundle
                    icon: quote
                    pressed: "@bundle.open"
                    act: messageBundleOpen
                    args: {id: "@bundle.id"}
              - type: box
                when: "@bundle.open"
                load: "@bundle.load"
                error: t:frame.loadError
                retry:
                  act: messageBundleOpen
                  args: {id: "@bundle.id", reload: true}
                blocks:
                  - type: each
                    from: "@bundle.items"
                    item:
                      unavailable:
                        of: "@status"
                        map: {tombstone: true, _: false}
                      title: "@messageId"
                      sourceChanged:
                        of: "@reason"
                        map: {source_changed: true, _: false}
                      name: {of: "@from", fmt: identity}
                      time: "@timestamp"
                      text: "@readableContent"
                    blocks:
                      - {type: label, text: "@title", when: "@unavailable"}
                      - type: label
                        text:
                          t: chat.bundleTitle
                          args:
                            - "@name"
                            - {of: "@time", fmt: hm}
                        when: "!@unavailable"
                      - type: notice
                        tone: warn
                        text:
                          of: "@sourceChanged"
                          map: {"true": t:mediaReview.conflict, "false": t:work.noSource, _: "@sourceChanged"}
                        when: "@unavailable"
                      - {type: markdown, text: "@text", when: "!@unavailable"}
                      - {type: text, variant: meta, text: "@comment", when: "@comment"}
          - type: toolbar
            variant: marker
            when: "@deleted"
            items:
              - {type: text, text: t:chatMessage.deleted}
              - type: button
                link: true
                label: t:common.restore
