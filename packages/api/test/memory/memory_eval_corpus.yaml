# F102 Memory Eval Corpus
# Tests: Recall@5 on real project queries
# AC-B7: 15 cases including historical Hindsight failure patterns
#
# Note: Index uses kind-priority (feature > decision > plan > lesson).
# When multiple docs share the same anchor via feature_ids, the feature
# spec wins. Queries here target feature spec titles/summaries.

metric_birth_certificate:
  utility_claim: "Default lexical evidence search retrieves the canonical project truth for discriminative real-world queries."
  estimator: "Expected-anchor Recall@5 over lexical cases; precision and semantic-only cases are evaluated separately."
  validity_bounds: "Recalibrate when canonical titles or aliases change, or when corpus growth makes a query ambiguous enough that its expected anchor is no longer uniquely justified."
  consumer: "pnpm gate blocks merges on a lexical retrieval regression below the threshold."
  calibration_plan: "On failure, inspect the actual Top-5 and independently confirm user intent before changing either the corpus or ranking implementation."
  repeatability_contract: "Acceptance metric on one frozen repo tree with an in-memory lexical index and embeddings disabled; deterministic single-run result required."

queries:
  # --- Recall cases: exact anchor lookup (bypass FTS) ---
  - id: R-01
    query: "F042"
    expected_anchors: [F042]
    note: "Exact anchor lookup must resolve"

  - id: R-02
    query: "F102"
    expected_anchors: [F102]
    note: "Current feature self-reference"

  - id: R-03
    query: "F073"
    expected_anchors: [F073]
    note: "SOP auto guardian anchor"

  - id: R-04
    query: "F075"
    expected_anchors: [F075]
    note: "Leaderboard anchor"

  # --- Recall cases: FTS title/summary search ---
  - id: R-05
    query: "memory adapter"
    expected_anchors: [F102]
    note: "Discriminative title query for the F102 memory adapter"

  - id: R-06
    query: "gateway"
    expected_anchors: [F088]
    note: "FTS match on title for Feishu gateway plan"

  - id: R-07
    query: "leaderboard"
    expected_anchors: [F075]
    note: "FTS match on title"

  - id: R-08
    query: "self evolution"
    expected_anchors: [F100]
    note: "FTS match on title"

  - id: R-09
    query: "signal study"
    expected_anchors: [F091]
    note: "FTS match on plan title"

  - id: R-10
    query: "IEvidenceStore"
    expected_anchors: [F102]
    note: "FTS match on F102 feature spec title (contains IEvidenceStore)"

  # --- Precision cases: must not return noise ---
  - id: P-01
    query: "F042"
    must_not_contain_paths: ["archive/", "mailbox/"]
    note: "Must not return archived or mailbox copies"

  - id: P-02
    query: "leaderboard"
    must_not_contain_paths: ["archive/"]
    note: "Should not return archived copies"

  # --- Hindsight failure patterns (our index should do better) ---
  - id: HF-01
    query: "adapter IEvidenceStore"
    expected_anchors: [F102]
    note: "Hindsight couldn't find our own spec — both terms in F102 title"

  - id: HF-02
    query: "signal study"
    expected_anchors: [F091]
    note: "Hindsight returned old discussion threads instead of the spec"

  - id: HF-03
    query: "auto guardian SOP"
    expected_anchors: [F073]
    note: "F073 feature spec title: SOP Auto-Guardian"

  # --- Phase C: semantic cases (lexical might miss, embedding should catch) ---
  - id: S-01
    query: "记忆组件怎么存储"
    expected_anchors: [F102]
    search_mode: semantic
    note: "Chinese query for memory storage — needs semantic match"

  - id: S-02
    query: "how does the cat communication work"
    expected_anchors: [F088]
    search_mode: semantic
    note: "English paraphrase — FTS might miss, embedding should catch"
