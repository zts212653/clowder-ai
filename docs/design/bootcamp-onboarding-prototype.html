<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>训练营引导路径原型</title>
  <style>
    :root{--ink:#2b211b;--muted:#786b62;--line:#e8ddd4;--paper:#fffdf9;--cream:#f7efe7;--accent:#b45d30;--accent-soft:#f9dfc8;--ok:#26734b;--ok-soft:#e7f5ec;--warn:#966420;--warn-soft:#fff2c8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#efe8df;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;min-height:100vh;max-width:1440px;margin:auto;background:var(--paper);box-shadow:0 12px 40px #47342422}.side{padding:24px 18px;background:#f7f0e8;border-right:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);font-size:25px}.brand strong{display:block;font-size:18px}.brand small{color:var(--muted)}.side h3{margin:20px 0 8px;font-size:12px;color:var(--muted);letter-spacing:.08em}.phase-nav{display:grid;gap:6px}.phase-nav button{border:0;text-align:left;padding:9px 10px;border-radius:9px;background:transparent;color:var(--muted)}.phase-nav button.active{background:#ead9c6;color:var(--ink);font-weight:700}.phase-nav button.done{color:var(--ok)}.main{display:flex;flex-direction:column;min-width:0}.top{padding:24px 30px 14px;border-bottom:1px solid var(--line)}.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}h1{margin:0;font-size:22px}.top p{margin:4px 0 0;color:var(--muted)}.status{padding:7px 11px;border-radius:999px;background:var(--ok-soft);color:var(--ok);white-space:nowrap;font-size:12px}.progress{height:8px;border-radius:99px;overflow:hidden;background:#eee5dc;margin-top:18px}.progress>span{display:block;height:100%;background:var(--accent);transition:width .25s}.content{flex:1;overflow:auto;padding:26px 30px}.stage-card{border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff;box-shadow:0 3px 12px #55361b0c}.stage-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{color:var(--accent);font-weight:700;font-size:12px}h2{margin:3px 0 5px;font-size:20px}.goal{margin:0;color:var(--muted)}.guide{margin-top:18px;border-left:4px solid var(--accent);padding:12px 15px;background:#fff7ef;border-radius:0 10px 10px 0}.guide strong{display:block;margin-bottom:3px}.chat{margin-top:18px;display:grid;gap:10px}.msg{padding:12px 15px;border-radius:14px;max-width:88%;white-space:pre-wrap}.msg.cat{background:#eee4fa;justify-self:start}.msg.user{background:#f6c9b7;justify-self:end}.msg.system{background:#f4eee7;color:var(--muted);font-size:12px;justify-self:stretch}.action{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.action label{display:block;font-weight:700;margin-bottom:6px}.action textarea,.action input{width:100%;border:1px solid #d9cabe;border-radius:10px;padding:11px 12px;background:#fffdfb}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.primary,.secondary{border-radius:9px;padding:9px 14px;border:1px solid transparent}.primary{background:var(--accent);color:white}.secondary{background:#fff;color:var(--ink);border-color:#d9cabe}button:disabled{opacity:.45;cursor:not-allowed}.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.check{padding:10px 12px;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;gap:8px}.check.ok{background:var(--ok-soft);border-color:#b8dfc6}.right{padding:24px 18px;border-left:1px solid var(--line);background:#fffaf5}.right h3{margin:0 0 14px}.history{display:grid;gap:9px}.history-item{display:flex;gap:9px;align-items:flex-start;color:var(--muted)}.history-item.done{color:var(--ok)}.dot{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;background:#eee5dc;font-size:11px}.done .dot{background:#cdebd7}.callout{margin-top:24px;padding:13px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:12px}.footer{padding:13px 30px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}@media(max-width:1000px){.shell{grid-template-columns:200px minmax(0,1fr)}.right{display:none}}@media(max-width:680px){.shell{display:block}.side{display:none}.content,.top{padding-left:18px;padding-right:18px}.check-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell"><aside class="side"><div class="brand"><div class="logo">🐾</div><div><strong>Clowder AI</strong><small>训练营路径原型</small></div></div><h3>引导阶段</h3><nav id="phaseNav" class="phase-nav"></nav><div class="callout">这是可交互原型。所有回复、环境检测和阶段状态都由本地模拟，不会启动 CLI、CMD 或修改项目数据。</div></aside><main class="main"><header class="top"><div class="top-row"><div><h1>领养第一只猫，完成第一次协作</h1><p>每一步都有明确目标、完成条件和下一步。阶段不会因为消息“发出”就提前完成。</p></div><div id="status" class="status">等待你的操作</div></div><div class="progress"><span id="progressBar"></span></div></header><section id="content" class="content"></section><footer class="footer">原型验收重点：无遮挡提示 · 不弹出 CMD · 回复完成后才推进 · 任务背景和预期结果清楚 · 每一步可恢复</footer></main><aside class="right"><h3>已完成阶段</h3><div id="history" class="history"></div><div class="callout">历史始终可见。当前阶段的行动提示固定在内容区，不覆盖聊天记录，也不会挡住输入框。</div></aside></div>
  <script>
    const phases=[
      {title:'自我介绍',goal:'认识你的主猫，并发送第一条真实消息。',guide:'发送“你好”后，等待布偶猫完整回复。只有回复完成，阶段才算完成。',action:'sendHello'},
      {title:'环境检测',goal:'确认运行所需工具是否可用，并把结果解释给你。',guide:'检测会在当前聊天内显示 Node.js、pnpm、Git、Claude CLI 和 MCP；不会弹出窗口。',action:'checkEnv'},
      {title:'配置帮助',goal:'如果有缺失项，按具体命令修复；如果全部正常，自动跳过。',guide:'你会看到缺失项、原因和可复制的修复动作。修复完成后点击重新检测。',action:'config'},
      {title:'选择任务',goal:'选一个有清晰背景、目标和验收结果的小项目。',guide:'例如：做一个欢迎页。背景是“新用户第一次打开项目”；目标是“看到标题、三条能力介绍和一个开始按钮”；验收是“按钮可点击并显示下一步”。',action:'task'},
      {title:'确认需求',goal:'把你的想法整理成双方确认的需求。',guide:'猫会复述目标、范围和完成标准；你确认后才进入设计。',action:'advance'},
      {title:'设计方案',goal:'查看方案并选择要实现的方向。',guide:'方案会说明页面结构、交互、状态和验收方式。你可以修改后再继续。',action:'advance'},
      {title:'开发交付',goal:'实现一个可运行的小成果，并展示结果。',guide:'开发过程中会告诉你当前动作、预计结果和等待原因；不会把“正在运行”显示成“已完成”。',action:'advance'},
      {title:'添加队友',goal:'邀请审查猫检查成果。',guide:'添加队友是独立步骤，聊天输入不会被遮挡；完成后再开始协作。',action:'advance'},
      {title:'多猫协作',goal:'查看审查意见并让主猫处理问题。',guide:'每条意见都有处理状态。全部处理后才进入完成确认。',action:'advance'},
      {title:'确认完成',goal:'确认项目结果符合此前约定。',guide:'这里会列出目标、已完成动作和可复现结果。',action:'advance'},
      {title:'回顾',goal:'总结这次协作中学到的路径。',guide:'回顾只记录实际发生的动作，不跳过历史，也不覆盖聊天。',action:'advance'},
      {title:'毕业',goal:'引导完成。你可以开始自己的项目。',guide:'训练营状态已完成。之后的聊天不再被训练营提示打断。',action:'done'}
    ];
    const state={index:0,messages:[],envChecked:false,task:'',pending:false}; const $=id=>document.getElementById(id);
    function nav(){ $('phaseNav').innerHTML=phases.map((p,i)=>`<button class="${i===state.index?'active ':''}${i<state.index?'done':''}" onclick="jump(${i})">${i<state.index?'✓ ':''}${i+1}. ${p.title}</button>`).join(''); }
    function history(){ $('history').innerHTML=phases.map((p,i)=>`<div class="history-item ${i<state.index?'done':''}"><span class="dot">${i<state.index?'✓':i+1}</span><span><strong>${p.title}</strong><br><small>${i<state.index?'已完成':i===state.index?'进行中':'待开始'}</small></span></div>`).join(''); }
    function chat(){return state.messages.length?`<div class="chat">${state.messages.map(m=>`<div class="msg ${m.who}">${m.text}</div>`).join('')}</div>`:'';}
    function action(){const p=phases[state.index];if(p.action==='sendHello')return`<div class="action"><label>第一条消息</label><button class="primary" onclick="sendHello()" ${state.pending?'disabled':''}>${state.pending?'等待布偶猫回复…':'发送“你好”'}</button></div>`;if(p.action==='checkEnv')return`<div class="action"><label>环境检测</label>${state.envChecked?`<div class="check-grid"><div class="check ok">Node.js <b>✓ 可用</b></div><div class="check ok">pnpm <b>✓ 可用</b></div><div class="check ok">Git <b>✓ 可用</b></div><div class="check ok">Claude CLI <b>✓ 可用</b></div><div class="check ok">MCP 服务 <b>✓ 可用</b></div></div><button class="primary" onclick="next()">进入下一步：配置帮助</button>`:`<button class="primary" onclick="checkEnv()">开始检测</button>`}</div>`;if(p.action==='config')return`<div class="action"><label>配置结果</label><p>所有核心工具已就绪，配置帮助自动跳过。你可以直接选择任务。</p><button class="primary" onclick="next()">继续选择任务</button></div>`;if(p.action==='task')return`<div class="action"><label for="task">你想做什么？</label><textarea id="task" rows="3" placeholder="例：做一个欢迎页，给新用户介绍项目并提供开始按钮。">${state.task}</textarea><button class="primary" onclick="submitTask()">确认这个任务</button></div>`;if(p.action==='done')return`<div class="action"><button class="primary" onclick="reset()">重新演示一遍</button></div>`;return`<div class="action"><button class="primary" onclick="next()">${state.index===10?'完成回顾':'确认并进入下一阶段'}</button></div>`;}
    function render(){const p=phases[state.index];$('progressBar').style.width=((state.index+1)/phases.length*100)+'%';$('status').textContent=state.pending?'正在等待回复…':state.index===11?'引导已完成':'第 '+(state.index+1)+'/'+phases.length+' 阶段';$('content').innerHTML=`<div class="stage-card"><div class="stage-head"><div><div class="eyebrow">阶段 ${state.index+1} / ${phases.length}</div><h2>${p.title}</h2><p class="goal">${p.goal}</p></div></div><div class="guide"><strong>现在要做什么</strong>${p.guide}</div>${chat()}${action()}</div>`;nav();history();}
    function sendHello(){if(state.pending)return;state.pending=true;state.messages.push({who:'user',text:'你好'});render();setTimeout(()=>{state.messages.push({who:'cat',text:'你好，我是布偶猫。接下来我会先确认环境，再和你一起选一个有明确结果的小项目。回复已完成，我们进入环境检测。'});state.pending=false;next();},900);}
    function checkEnv(){state.envChecked=true;state.messages.push({who:'system',text:'环境检测结果已显示在当前阶段：核心工具全部可用；可选工具未安装不会阻塞流程。'});render();}
    function submitTask(){const v=$('task').value.trim();if(!v){$('task').focus();return;}state.task=v;state.messages.push({who:'user',text:v});next();}
    function next(){if(state.pending)return;if(state.index<11){state.index++;if(state.index===4)state.messages.push({who:'cat',text:'收到。我会先复述需求，再给出设计方案和完成标准。'});render();}}
    function jump(i){if(i<=state.index){state.index=i;state.pending=false;render();}}
    function reset(){state.index=0;state.messages=[];state.envChecked=false;state.task='';state.pending=false;render();} render();
  </script>
</body>
</html>
