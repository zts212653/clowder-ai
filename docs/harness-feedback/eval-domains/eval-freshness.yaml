# Provider resolves one owner-scoped half-open window from four server-owned sources:
# legacy closure compatibility, TTL-0 Queue custody, TTL-0 FreshnessSupplement, and
# the retention-bounded attention/provider event index. Publication fails closed until
# every source proves complete coverage, including a 60-second settled tail on the
# event index. API restart/rollback advances the coverage start and any in-process
# append failure records a blocking gap; process-cumulative OTel counters are never a
# weekly denominator. All eight AC-E9 fixtures remain mandatory on every publication.
enabled: true
