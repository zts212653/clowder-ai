---
domainId: eval:freshness
displayName: Freshness Gate Eval
descriptionForHuman: 猫工作时是否及时看见新消息，以及 queued read/handled 是否真的减少重复唤醒
metricGlossary:
  freshness.queued_seen:
    label: queued 正文已读
    means: 选定窗口内 TTL-0 Queue custody 首次留下 same-target exact-body exposure 的次数
    goodDirection: neutral
    category: activation
    component: F254-D1.2a
    source: derived:freshness-windowed-replay.queue
  freshness.queued_handled:
    label: queued 已处理闭环
    means: 选定窗口内 Queue 当前 revision 由 exact target outcome evidence 关闭为 handled 的次数
    goodDirection: neutral
    category: activation
    component: F254-D1.2b
    source: derived:freshness-windowed-replay.queue
  freshness.queue_admitted:
    label: queued 责任入场
    means: 选定窗口内 TTL-0 Queue custody 新建的 entry-target 生命周期数
    goodDirection: neutral
    category: activation
    component: F254-E21/E22
    source: derived:freshness-windowed-replay.queue
  freshness.queue_withdrawn:
    label: queued 责任撤回
    means: 选定窗口内 Queue 当前 revision 以显式 withdrawn 终态关闭的 entry-target 数
    goodDirection: neutral
    category: context
    component: F254-E21/E22
    source: derived:freshness-windowed-replay.queue
  freshness.queue_failed:
    label: queued 执行失败
    means: 选定窗口内 Queue 当前 revision 以 failed/interrupted/cancelled 证据关闭的 entry-target 数
    goodDirection: lower
    category: friction
    component: F254-E21/E22
    source: derived:freshness-windowed-replay.queue
  freshness.queue_seen_unhandled_at_window_end:
    label: 窗口末已读未闭环
    means: 在窗口结束点已留下 exact-body exposure、但当前 Queue 生命周期尚无终态的 entry-target 数
    goodDirection: lower
    category: friction
    component: F254-E21/E22
    source: derived:freshness-windowed-replay.queue
  freshness.queue_pending_at_window_end:
    label: 窗口末 Queue 未终态
    means: 在窗口结束点已入场但尚无 handled/withdrawn/failed 终态的 entry-target 数
    goodDirection: lower
    category: friction
    component: F254-E21/E22
    source: derived:freshness-windowed-replay.queue
  freshness.queued_handled_gap:
    label: queued read/handled 缺口
    means: queued_seen 与 queued_handled 的差距；持续升高说明读到但未闭环、失败保留、或 succeeded=handled 推断需要校准
    goodDirection: lower
    category: derived
    component: F254-D1.2
    source: derived:freshness-windowed-replay.queue
  freshness.provider_notice_opportunity:
    label: provider notice 机会
    means: 选定窗口内 provider-native exact-boundary notice opportunity 数
    goodDirection: neutral
    category: context
    component: F254-D2
    source: derived:freshness-windowed-replay.provider
  freshness.provider_notice_prepared:
    label: provider notice 已准备
    means: 选定窗口内已构造、等待 provider transport 接纳的 notice 数
    goodDirection: neutral
    category: activation
    component: F254-D2
    source: derived:freshness-windowed-replay.provider
  freshness.provider_notice_delivered:
    label: provider notice 已送达
    means: 选定窗口内 exact active turn 接纳的 provider-native notice 数
    goodDirection: neutral
    category: activation
    component: F254-D2
    source: derived:freshness-windowed-replay.provider
  freshness.provider_notice_seen:
    label: provider notice 正文已读
    means: 选定窗口内其 exact message identities 已被同猫完整读取的 provider-native notice 数
    goodDirection: neutral
    category: activation
    component: F254-D2
    source: derived:freshness-windowed-replay.provider
  freshness.provider_notice_handled:
    label: provider notice 已闭环
    means: 选定窗口内由 exact target outcome evidence 关闭的 provider-native notice 数
    goodDirection: neutral
    category: activation
    component: F254-D2
    source: derived:freshness-windowed-replay.provider
  freshness.provider_notice_missed:
    label: provider notice 未送达
    means: 选定窗口内留下 typed missReason 的 provider-native notice 数
    goodDirection: lower
    category: friction
    component: F254-D2
    source: derived:freshness-windowed-replay.provider
  freshness.provider_protocol_observed:
    label: provider 协议边界观测
    means: 选定窗口内进入 closed classifier 的 provider protocol item 数，包含 unknown 与 deferred/no-data
    goodDirection: neutral
    category: context
    component: F254-D2
    source: derived:freshness-windowed-replay.provider
  freshness.closure_stage:
    label: closure 正式阶段
    means: v1.2 记录 formal_committed 与 preflight_blocked，区分“页面曾显示”与“正式可水合”
    goodDirection: neutral
    category: activation
    component: F254-v1.2
    source: cat_cafe.freshness.closure_stage
  freshness.replay.eligible_samples:
    label: replay 合格样本
    means: selector 从兼容 TTL-0 legacy closure 与八类 server-owned fixture 中解析出的结构性样本数；无 live closure 时结构 verdict 为 no-data，但必须另读 windowed activity
    goodDirection: neutral
    category: context
    component: F254-AC-E9
    source: derived:freshness-closure-replay
  freshness.replay.failed_samples:
    label: replay 不变量失败
    means: 可见旧答、责任无 custody、重复 final、target 缺口、same-batch 误触发、预算越界或终态无证据的样本数
    goodDirection: lower
    category: friction
    component: F254-AC-E9
    source: derived:freshness-closure-replay
  freshness.replay.attention_samples:
    label: replay 待处理责任
    means: 虽未违反结构不变量，但仍处于 blocked 或 unresolved durable responsibility 的 live 样本数
    goodDirection: lower
    category: friction
    component: F254-AC-E9
    source: derived:freshness-closure-replay
systemThreadId: thread_eval_freshness
evalCat:
  catId: gpt52
  handle: "@gpt52"
  model: gpt-5.4
frequency: weekly
triggerPolicy:
  mode: time_only
  maxDetectionDelayHours: 168
sourceAdapter: f254-freshness-replay
sourceRefsKind: freshness-closure-replay
threadPolicy:
  role: working-home
  stateSot: registry
  allowedContent:
    - longitudinal-analysis
    - verdict-discussion
    - handoff-drafts
legacyScheduledTaskIds: []
handoffTargetResolver:
  featureId: F254
  ownerCatId: codex-sol
  threadLookup: feature-thread
sla:
  acknowledgeHours: 48
  reevalWithinHours: 168
