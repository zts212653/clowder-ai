---
domainId: eval:friction
displayName: Friction Signal Eval
systemThreadId: thread_eval_friction
# evalCat: current opus runtime member. The local catalog no longer exposes
# legacy eval runner ids, so scheduled invocations must use opus.
evalCat:
  catId: opus
  handle: "@opus"
  model: claude-sonnet-5
# F245 PR2: 本家 3-day cadence — N-day infra landed.
# Community default remains `weekly` in community eval-domains/ copies.
frequency: every-3d
sourceAdapter: f245-friction-rollup
sourceRefsKind: friction-rollup-snapshot
threadPolicy:
  role: working-home
  stateSot: registry
  allowedContent:
    - longitudinal-analysis
    - verdict-discussion
    - handoff-drafts
legacyScheduledTaskIds: []
# Actionable friction findings route to the harness-eval owner (Phase D wires
# per-finding propose_thread; until then the owner triages from here).
# ownerCatId must be a REGISTERED catId in the runtime catalog.
handoffTargetResolver:
  featureId: F245
  ownerCatId: opus
  threadLookup: feature-thread
sla:
  acknowledgeHours: 48
  reevalWithinHours: 168
# Gated OFF until the friction report producer (P1-3/4) + verdict generator (P1-6)
# are wired — otherwise the weekly cron would invoke a friction eval cat that
# can't publish (501 / silent-broken fire, same failure eval:sop hit 2026-06-06).
# Flipped to true in PR1b (P1-7) after the end-to-end live sink is wired + verified
# green (publish_verdict eval:friction → friction-rollup-snapshot → live verdict).
enabled: true
