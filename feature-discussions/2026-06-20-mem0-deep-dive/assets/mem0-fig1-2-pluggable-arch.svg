<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="appG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAF1FF"/><stop offset="1" stop-color="#C3D8FF"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4E6"/><stop offset="1" stop-color="#FFE7C4"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAFBEF"/><stop offset="1" stop-color="#D3F2DB"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <marker id="arrB" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#1D4ED8"/></marker>
    <marker id="arrN" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
  </defs>

  <rect x="0" y="0" width="1100" height="650" fill="#ffffff"/>
  <text x="550" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">图 1·2 · 可插拔分层架构：mem0 是「层」，不是「库」</text>
  <text x="550" y="72" text-anchor="middle" font-size="14" fill="#64748b">编排层架在现有存储之上，后端全可替换 —— 切换只改配置，不改上层代码</text>

  <rect x="440" y="92" width="220" height="50" rx="12" fill="url(#appG)" stroke="#94a3b8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="550" y="123" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">你的 AI Agent / App</text>

  <line x1="550" y1="142" x2="550" y2="190" stroke="#1D4ED8" stroke-width="2.2" marker-end="url(#arrB)"/>
  <text x="565" y="170" font-size="12" fill="#6b7280">memory.add / memory.search</text>

  <rect x="350" y="192" width="400" height="74" rx="14" fill="url(#blue)" stroke="#1D4ED8" stroke-width="2.4" filter="url(#sh)"/>
  <text x="550" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A8A">mem0 编排层</text>
  <text x="550" y="247" text-anchor="middle" font-size="13" fill="#2563EB">抽取 · 对账 · 检索融合（真正的产品在这里）</text>

  <!-- Group A: 模型能力 -->
  <rect x="60" y="336" width="420" height="250" rx="14" fill="#FFF9F0" stroke="#FBC088" stroke-width="1.5"/>
  <text x="82" y="362" font-size="13.5" font-weight="700" fill="#9A3412">🧠 模型能力 · 可替换</text>

  <rect x="86" y="384" width="184" height="178" rx="10" fill="url(#orange)" stroke="#EA580C" stroke-width="1.8"/>
  <text x="178" y="418" text-anchor="middle" font-size="16" font-weight="700" fill="#9A3412">LLM</text>
  <text x="178" y="442" text-anchor="middle" font-size="11.5" fill="#C2410C">GPT-4o-mini /</text>
  <text x="178" y="459" text-anchor="middle" font-size="11.5" fill="#C2410C">Qwen-plus …</text>
  <line x1="106" y1="476" x2="250" y2="476" stroke="#FBC088" stroke-width="1"/>
  <text x="178" y="502" text-anchor="middle" font-size="11.5" fill="#9A3412">写入时抽事实、</text>
  <text x="178" y="519" text-anchor="middle" font-size="11.5" fill="#9A3412">判断冲突</text>

  <rect x="288" y="384" width="170" height="178" rx="10" fill="url(#orange)" stroke="#EA580C" stroke-width="1.8"/>
  <text x="373" y="418" text-anchor="middle" font-size="16" font-weight="700" fill="#9A3412">Embedder</text>
  <text x="373" y="442" text-anchor="middle" font-size="11" fill="#C2410C">text-embedding-</text>
  <text x="373" y="459" text-anchor="middle" font-size="11" fill="#C2410C">3-small / v4 …</text>
  <line x1="308" y1="476" x2="438" y2="476" stroke="#FBC088" stroke-width="1"/>
  <text x="373" y="502" text-anchor="middle" font-size="11.5" fill="#9A3412">文本转向量</text>

  <!-- Group B: 存储后端 -->
  <rect x="520" y="336" width="520" height="250" rx="14" fill="#F2FBF5" stroke="#9BD3AC" stroke-width="1.5"/>
  <text x="542" y="362" font-size="13.5" font-weight="700" fill="#15803D">🗄️ 存储后端 · 可替换</text>

  <rect x="544" y="384" width="158" height="178" rx="10" fill="url(#green)" stroke="#16A34A" stroke-width="2"/>
  <rect x="560" y="396" width="84" height="22" rx="11" fill="#16A34A"/>
  <text x="602" y="412" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">核心承重</text>
  <text x="623" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#14532D">向量库</text>
  <text x="623" y="486" text-anchor="middle" font-size="11" fill="#166534">Qdrant /</text>
  <text x="623" y="503" text-anchor="middle" font-size="11" fill="#166534">PGVector /</text>
  <text x="623" y="520" text-anchor="middle" font-size="11" fill="#166534">AnalyticDB …</text>

  <rect x="716" y="384" width="158" height="178" rx="10" fill="#F0FBF3" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="7 5"/>
  <rect x="732" y="396" width="60" height="22" rx="11" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="762" y="412" text-anchor="middle" font-size="11" font-weight="700" fill="#15803D">可选</text>
  <text x="795" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#14532D">图库 mem0g</text>
  <text x="795" y="486" text-anchor="middle" font-size="11.5" fill="#166534">实体关系图谱</text>
  <text x="795" y="506" text-anchor="middle" font-size="11.5" fill="#166534">Neo4j …</text>

  <rect x="888" y="384" width="136" height="178" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.8"/>
  <text x="956" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">元数据 / KV</text>
  <text x="956" y="486" text-anchor="middle" font-size="11.5" fill="#475569">user / session</text>
  <text x="956" y="503" text-anchor="middle" font-size="11.5" fill="#475569">/ agent</text>

  <!-- arrows API -> backends -->
  <path d="M505,266 L185,382" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arrN)"/>
  <path d="M528,266 L370,382" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arrN)"/>
  <path d="M568,266 L620,382" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arrN)"/>
  <path d="M584,266 L793,382" stroke="#16A34A" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrN)"/>
  <path d="M592,266 L954,382" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arrN)"/>

  <text x="550" y="618" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">💡 可插拔：切换任一后端只改配置，不改上层代码 —— 这正是大厂能轻松接管 mem0 的根本原因</text>
</svg>
