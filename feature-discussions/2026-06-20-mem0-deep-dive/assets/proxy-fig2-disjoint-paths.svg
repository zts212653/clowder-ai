<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAF1FF"/><stop offset="1" stop-color="#C3D8FF"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE7F0"/><stop offset="1" stop-color="#F8CFE0"/></linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E7ECF3"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <marker id="arrB" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1D4ED8"/></marker>
    <marker id="arrR" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#C2185B"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="590" fill="#ffffff"/>
  <text x="560" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#0f172a">图 3·2 · 两条不相交的数据通路</text>
  <text x="560" y="73" text-anchor="middle" font-size="14.5" fill="#64748b">proxy 和 mem0 根本不在同一条路上 —— 平行、不相交，连搬的东西都不是一类</text>

  <!-- ===== TOP rail: proxy / SQL ===== -->
  <rect x="50" y="100" width="1020" height="150" rx="16" fill="#F4F8FF" stroke="#C3D8FF" stroke-width="1.5"/>
  <rect x="74" y="89" width="220" height="26" rx="13" fill="#1D4ED8" filter="url(#sh)"/>
  <text x="184" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">① SQL 流量通路 · proxy</text>

  <!-- nodes -->
  <rect x="92" y="145" width="148" height="60" rx="12" fill="url(#slate)" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/>
  <text x="166" y="181" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">应用 / DBA</text>

  <rect x="388" y="135" width="204" height="80" rx="14" fill="url(#blue)" stroke="#1D4ED8" stroke-width="2.4" filter="url(#sh)"/>
  <text x="490" y="171" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A8A">proxy 读写分离</text>
  <text x="490" y="194" text-anchor="middle" font-size="12" fill="#2563EB">哑路由 · 只看读 / 写字节</text>

  <rect x="838" y="123" width="172" height="46" rx="11" fill="url(#slate)" stroke="#64748B" stroke-width="1.6"/>
  <text x="924" y="151" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">主库（写）</text>
  <rect x="838" y="181" width="172" height="46" rx="11" fill="url(#slate)" stroke="#64748B" stroke-width="1.6"/>
  <text x="924" y="209" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">只读节点（读）</text>

  <!-- arrows -->
  <line x1="240" y1="175" x2="380" y2="175" stroke="#1D4ED8" stroke-width="2.4" marker-end="url(#arrB)"/>
  <text x="310" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2563EB">SQL 报文</text>
  <path d="M592,162 L838,146" fill="none" stroke="#1D4ED8" stroke-width="2.2" marker-end="url(#arrB)"/>
  <text x="712" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#2563EB">写</text>
  <path d="M592,190 L838,204" fill="none" stroke="#1D4ED8" stroke-width="2.2" marker-end="url(#arrB)"/>
  <text x="712" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#2563EB">读</text>

  <!-- ===== MIDDLE band: disjoint ===== -->
  <rect x="50" y="264" width="1020" height="92" rx="12" fill="#FBFAF7" stroke="#E5E0D5" stroke-width="1.5"/>
  <rect x="438" y="252" width="244" height="26" rx="13" fill="#fff" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#B91C1C">✗ 两条通路不相交 · 无接触点</text>

  <!-- 3 contrasts -->
  <text x="230" y="305" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">数据形态</text>
  <text x="230" y="330" text-anchor="middle" font-size="13" fill="#1E3A8A">SQL 报文 <tspan fill="#94a3b8" font-weight="700">⟂</tspan> <tspan fill="#9D174D">对话语义</tspan></text>
  <line x1="390" y1="290" x2="390" y2="332" stroke="#E5E0D5" stroke-width="1.4"/>

  <text x="560" y="305" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">触发时机</text>
  <text x="560" y="330" text-anchor="middle" font-size="13" fill="#1E3A8A">每条 SQL 请求 <tspan fill="#94a3b8" font-weight="700">⟂</tspan> <tspan fill="#9D174D">对话轮次</tspan></text>
  <line x1="730" y1="290" x2="730" y2="332" stroke="#E5E0D5" stroke-width="1.4"/>

  <text x="890" y="305" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">调用方</text>
  <text x="890" y="330" text-anchor="middle" font-size="13" fill="#1E3A8A">应用 / DBA <tspan fill="#94a3b8" font-weight="700">⟂</tspan> <tspan fill="#9D174D">Agent 开发者</tspan></text>

  <!-- ===== BOTTOM rail: mem0 / 对话 ===== -->
  <rect x="50" y="372" width="1020" height="150" rx="16" fill="#FFF5FA" stroke="#F8CFE0" stroke-width="1.5"/>
  <rect x="74" y="361" width="232" height="26" rx="13" fill="#C2185B" filter="url(#sh)"/>
  <text x="190" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">② 对话语义通路 · mem0</text>

  <rect x="92" y="417" width="148" height="60" rx="12" fill="url(#slate)" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/>
  <text x="166" y="446" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">AI Agent</text>
  <text x="166" y="465" text-anchor="middle" font-size="11.5" fill="#64748b">开发者</text>

  <rect x="388" y="407" width="204" height="80" rx="14" fill="url(#rose)" stroke="#C2185B" stroke-width="2.4" filter="url(#sh)"/>
  <text x="490" y="443" text-anchor="middle" font-size="17" font-weight="700" fill="#9D174D">mem0 记忆层</text>
  <text x="490" y="466" text-anchor="middle" font-size="12" fill="#BE185D">提取对话事实 · 语义检索</text>

  <rect x="838" y="417" width="172" height="60" rx="12" fill="url(#rose)" stroke="#C2185B" stroke-width="2" filter="url(#sh)"/>
  <text x="924" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#9D174D">向量库</text>
  <text x="924" y="465" text-anchor="middle" font-size="11.5" fill="#BE185D">语义向量</text>

  <line x1="240" y1="447" x2="380" y2="447" stroke="#C2185B" stroke-width="2.4" marker-end="url(#arrR)"/>
  <text x="310" y="438" text-anchor="middle" font-size="11.5" font-weight="600" fill="#BE185D">对话</text>
  <line x1="592" y1="447" x2="830" y2="447" stroke="#C2185B" stroke-width="2.4" marker-end="url(#arrR)"/>
  <text x="711" y="438" text-anchor="middle" font-size="11.5" font-weight="600" fill="#BE185D">向量</text>

  <text x="560" y="558" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">唯一的共同点是「都叫中间件」—— 词面巧合，不是架构接触点；融合 = 硬把两条不相干的管道焊一起</text>
</svg>
