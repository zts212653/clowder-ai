<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E7ECF3"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAF1FF"/><stop offset="1" stop-color="#C3D8FF"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAFBEF"/><stop offset="1" stop-color="#CFF0D6"/></linearGradient>
    <linearGradient id="redg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEF2F2"/><stop offset="1" stop-color="#FDE0E0"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ECFDFA"/><stop offset="1" stop-color="#CCF3EC"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEF7E6"/><stop offset="1" stop-color="#FCE9BE"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <marker id="arrG" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#16A34A"/></marker>
    <marker id="arrR" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="arrT" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#0D9488"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="540" fill="#ffffff"/>
  <text x="560" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#0f172a">图 3·7 · 演进路线图：每一步一个判断</text>
  <text x="560" y="73" text-anchor="middle" font-size="14.5" fill="#64748b">横向把数据访问做宽（多协议平台）= 正道；纵向把对话记忆塞进通路 = 错配</text>

  <!-- ===== spine: 现状 → 演进 → 扩协议 ===== -->
  <!-- 现状 -->
  <rect x="44" y="206" width="196" height="106" rx="14" fill="url(#slate)" stroke="#94a3b8" stroke-width="2" filter="url(#sh)"/>
  <rect x="60" y="218" width="62" height="22" rx="11" fill="#64748B"/>
  <text x="91" y="234" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">起点</text>
  <text x="142" y="236" font-size="14.5" font-weight="700" fill="#334155">现状 proxy</text>
  <text x="60" y="266" font-size="13" font-weight="700" fill="#475569">= MyCat 残体</text>
  <text x="60" y="291" font-size="11.5" fill="#64748b">阉割分片 · 仅 MySQL · 封闭</text>

  <line x1="240" y1="259" x2="276" y2="259" stroke="#16A34A" stroke-width="2.6" marker-end="url(#arrG)"/>

  <!-- 演进 -->
  <rect x="280" y="206" width="196" height="106" rx="14" fill="url(#blue)" stroke="#1D4ED8" stroke-width="2.2" filter="url(#sh)"/>
  <text x="296" y="234" font-size="14.5" font-weight="700" fill="#1E3A8A">① 演进 MaxScale</text>
  <text x="296" y="261" font-size="12" fill="#2563EB">可插拔 proxy</text>
  <text x="296" y="281" font-size="11.5" fill="#2563EB">protocol / router / filter</text>
  <rect x="296" y="290" width="92" height="20" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="342" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#15803D">✅ 方向对</text>

  <line x1="476" y1="259" x2="512" y2="259" stroke="#16A34A" stroke-width="2.6" marker-end="url(#arrG)"/>

  <!-- 扩协议 -->
  <rect x="516" y="206" width="196" height="106" rx="14" fill="url(#green)" stroke="#16A34A" stroke-width="2.2" filter="url(#sh)"/>
  <text x="532" y="234" font-size="14.5" font-weight="700" fill="#14532D">② 扩多协议</text>
  <text x="532" y="261" font-size="12" fill="#166534">MySQL ✅ · PG ✅</text>
  <text x="532" y="281" font-size="12" fill="#166534">Oracle（单独评估）</text>
  <rect x="532" y="290" width="164" height="20" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="614" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">✅ 正道 · 先过 BSL 许可证</text>

  <line x1="712" y1="259" x2="734" y2="259" stroke="#16A34A" stroke-width="2.6" marker-end="url(#arrG)"/>

  <!-- ===== decision gate: 集成 mem0? ===== -->
  <polygon points="797,212 861,259 797,306 733,259" fill="url(#amber)" stroke="#D97706" stroke-width="2.2" filter="url(#sh)"/>
  <text x="797" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">③ 集成</text>
  <text x="797" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">mem0？</text>

  <!-- fork up: ❌ 嵌入 -->
  <path d="M845,238 L873,168" fill="none" stroke="#DC2626" stroke-width="2.4" marker-end="url(#arrR)"/>
  <rect x="878" y="108" width="218" height="112" rx="14" fill="url(#redg)" stroke="#DC2626" stroke-width="2.4" filter="url(#sh)"/>
  <text x="898" y="136" font-size="14.5" font-weight="700" fill="#B91C1C">❌ 嵌入对话 mem0</text>
  <text x="898" y="160" font-size="12" fill="#991B1B">塞进 SQL 转发关键路径（B2）</text>
  <text x="898" y="184" font-size="11.5" fill="#991B1B">通路错配 · 延迟灾难</text>
  <text x="898" y="205" font-size="11.5" fill="#991B1B">运维恶化（故障域 / SLA / 安全）</text>

  <!-- fork down: ✅ 旁路 -->
  <path d="M845,280 L873,378" fill="none" stroke="#0D9488" stroke-width="2.4" marker-end="url(#arrT)"/>
  <rect x="878" y="326" width="218" height="112" rx="14" fill="url(#teal)" stroke="#0D9488" stroke-width="2.4" filter="url(#sh)"/>
  <text x="898" y="354" font-size="14.5" font-weight="700" fill="#134E4A">✅ 旁路 SQL 智能（tee）</text>
  <text x="898" y="378" font-size="12" fill="#115E59">tee 异步复制 · 故障隔离</text>
  <text x="898" y="402" font-size="11.5" fill="#115E59">增值清晰（语义缓存 / 索引建议）</text>
  <text x="898" y="423" font-size="11.5" font-weight="700" fill="#0F766E">但那是 DB-ops AI，不是 mem0</text>

  <!-- legend for fork -->
  <text x="430" y="400" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">①②横向做宽 = 一路 ✅ 可行</text>
  <text x="430" y="424" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">③ 到「集成 mem0」才分叉</text>

  <line x1="44" y1="470" x2="1096" y2="470" stroke="#E5E7EB" stroke-width="1.4"/>
  <text x="560" y="500" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">横向把数据访问做宽 ✅ 一路可行；到「集成 mem0」分叉 —— 嵌入对话记忆 ❌ 错配，旁路 SQL 智能 ✅（但那不是 mem0）</text>
</svg>
