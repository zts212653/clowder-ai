<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAF1FF"/><stop offset="1" stop-color="#C3D8FF"/></linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E7ECF3"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ECFDFA"/><stop offset="1" stop-color="#CCF3EC"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <marker id="arrB" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1D4ED8"/></marker>
    <marker id="arrT" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
  <text x="560" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#0f172a">图 3·4 · 要加 AI，走旁路异步 —— 绝不进转发关键路径</text>
  <text x="560" y="73" text-anchor="middle" font-size="14.5" fill="#64748b">转发关键路径保持纯粹；旁路镜像一份 SQL 流，喂给独立 AI 模块沉淀「SQL 操作记忆」</text>

  <!-- critical path lane -->
  <rect x="50" y="104" width="1020" height="128" rx="16" fill="#F4F8FF" stroke="#C3D8FF" stroke-width="1.5"/>
  <rect x="74" y="93" width="360" height="26" rx="13" fill="#1D4ED8" filter="url(#sh)"/>
  <text x="254" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">转发关键路径 · 保持纯粹（确定性 · 低延迟）</text>

  <rect x="92" y="140" width="140" height="56" rx="12" fill="url(#slate)" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/>
  <text x="162" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">应用</text>

  <rect x="392" y="128" width="200" height="80" rx="14" fill="url(#blue)" stroke="#1D4ED8" stroke-width="2.6" filter="url(#sh)"/>
  <text x="492" y="162" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A8A">proxy 读写分离</text>
  <text x="492" y="186" text-anchor="middle" font-size="12.5" fill="#2563EB">纯粹转发 · 不挂 AI</text>

  <rect x="850" y="126" width="170" height="42" rx="11" fill="url(#slate)" stroke="#64748B" stroke-width="1.6"/>
  <text x="935" y="153" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">主库（写）</text>
  <rect x="850" y="178" width="170" height="42" rx="11" fill="url(#slate)" stroke="#64748B" stroke-width="1.6"/>
  <text x="935" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">只读节点（读）</text>

  <line x1="232" y1="168" x2="384" y2="168" stroke="#1D4ED8" stroke-width="2.6" marker-end="url(#arrB)"/>
  <path d="M592,158 L850,147" fill="none" stroke="#1D4ED8" stroke-width="2.4" marker-end="url(#arrB)"/>
  <path d="M592,184 L850,199" fill="none" stroke="#1D4ED8" stroke-width="2.4" marker-end="url(#arrB)"/>

  <!-- mirror branch (dashed) -->
  <path d="M492,208 L492,320" fill="none" stroke="#0D9488" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arrT)"/>
  <rect x="540" y="244" width="278" height="48" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.4"/>
  <text x="679" y="264" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F766E">镜像一份 SQL 操作流</text>
  <text x="679" y="283" text-anchor="middle" font-size="11.5" fill="#0D9488">虚线 · 异步 · 不阻塞转发</text>

  <!-- AI sidecar module -->
  <rect x="342" y="320" width="300" height="158" rx="14" fill="url(#teal)" stroke="#0D9488" stroke-width="2.4" filter="url(#sh)"/>
  <text x="492" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#134E4A">独立 AI 模块（旁路）</text>
  <line x1="362" y1="364" x2="622" y2="364" stroke="#99E6DA" stroke-width="1.3"/>
  <text x="362" y="389" font-size="12.5" font-weight="600" fill="#0F766E">沉淀 SQL 操作记忆：</text>
  <text x="362" y="414" font-size="12.5" fill="#115E59">· 常被一起查的表 · 慢查询模式</text>
  <text x="362" y="438" font-size="12.5" fill="#115E59">· 访问热点 · 索引建议</text>
  <text x="362" y="465" font-size="12" font-weight="700" fill="#0F766E">＝ DBA / 运维视角的记忆</text>

  <!-- iron law badge -->
  <rect x="342" y="496" width="300" height="40" rx="12" fill="#ECFDF5" stroke="#0D9488" stroke-width="1.6"/>
  <text x="492" y="521" text-anchor="middle" font-size="13" font-weight="700" fill="#0F766E">🔒 旁路挂掉 ↛ 影响转发 · 故障完全隔离</text>

  <!-- memory distinction box -->
  <rect x="700" y="320" width="360" height="216" rx="14" fill="#FBFAF7" stroke="#E5E0D5" stroke-width="1.6"/>
  <text x="880" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">两种记忆别混淆</text>
  <rect x="722" y="366" width="316" height="64" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.4"/>
  <text x="738" y="389" font-size="13" font-weight="700" fill="#0F766E">旁路 = SQL 操作记忆</text>
  <text x="738" y="412" font-size="12" fill="#115E59">"SQL 是怎么被访问的"（运维）✅ 能挂</text>
  <rect x="722" y="440" width="316" height="64" rx="10" fill="#FCE7F0" stroke="#F1A6C5" stroke-width="1.4"/>
  <text x="738" y="463" font-size="13" font-weight="700" fill="#9D174D">mem0 = 对话记忆</text>
  <text x="738" y="486" font-size="12" fill="#BE185D">"用户说过什么"（对话）✗ 非 proxy 的活</text>
  <text x="880" y="524" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">能挂的只有前者 —— 而前者不是 mem0</text>

  <text x="560" y="600" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">proxy 能"长出"的 AI = 面向 SQL 运维的旁路智能，不是 mem0 的对话记忆 —— 且绝不进转发关键路径</text>
</svg>
