<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="appG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E6"/><stop offset="1" stop-color="#FFD9A8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAFBEF"/><stop offset="1" stop-color="#CFF0D6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrO" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#E2691A"/>
    </marker>
    <marker id="arrG" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="700" fill="#ffffff"/>

  <text x="470" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#C2410C">阿里云 · 记忆能力下沉进数据库</text>
  <text x="470" y="72" text-anchor="middle" font-size="14" fill="#6b7280">AnalyticDB Memory Service —— 记忆服务紧贴存储层，数据不出库</text>

  <rect x="355" y="100" width="230" height="52" rx="12" fill="url(#appG)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="470" y="132" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">AI Agent / 应用</text>

  <line x1="470" y1="152" x2="470" y2="204" stroke="#E2691A" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="486" y="182" font-size="12" fill="#6b7280">标准化接口 / 嵌入式 SDK</text>

  <rect x="90" y="208" width="760" height="466" rx="18" fill="#FFFBF4" stroke="#F0A868" stroke-width="2"/>
  <text x="112" y="235" font-size="15" font-weight="700" fill="#B45309">阿里云数据库 · AnalyticDB for MySQL / PolarDB</text>
  <rect x="688" y="216" width="150" height="28" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="763" y="235" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400E">🔒 数据不出库</text>

  <rect x="220" y="258" width="500" height="74" rx="12" fill="url(#orange)" stroke="#E2691A" stroke-width="2.2" filter="url(#sh)"/>
  <text x="470" y="289" text-anchor="middle" font-size="17" font-weight="700" fill="#9A3412">AnalyticDB Memory Service（记忆服务层）</text>
  <text x="470" y="314" text-anchor="middle" font-size="13" fill="#C2410C">支持 mem0 + 自研 ReMe 双框架</text>

  <rect x="140" y="378" width="250" height="72" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.8"/>
  <text x="265" y="408" text-anchor="middle" font-size="15" font-weight="700" fill="#9A3412">通义千问 qwen-plus</text>
  <text x="265" y="430" text-anchor="middle" font-size="12.5" fill="#C2410C">提取 · 对账</text>

  <rect x="550" y="378" width="250" height="72" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.8"/>
  <text x="675" y="408" text-anchor="middle" font-size="15" font-weight="700" fill="#9A3412">text-embedding-v4</text>
  <text x="675" y="430" text-anchor="middle" font-size="12.5" fill="#C2410C">Embedding（1536 维）</text>

  <path d="M322,332 L280,376" stroke="#E2691A" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
  <path d="M618,332 L660,376" stroke="#E2691A" stroke-width="2" fill="none" marker-end="url(#arrO)"/>

  <line x1="470" y1="332" x2="470" y2="470" stroke="#16A34A" stroke-width="2.4" marker-end="url(#arrG)"/>
  <text x="478" y="432" font-size="11.5" fill="#15803D">记忆读写</text>

  <rect x="170" y="472" width="600" height="182" rx="12" fill="url(#green)" stroke="#16A34A" stroke-width="2.2" filter="url(#sh)"/>
  <text x="470" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#14532D">存储底座（存储引擎内置）</text>
  <line x1="195" y1="515" x2="745" y2="515" stroke="#86C99A" stroke-width="1"/>
  <text x="200" y="543" font-size="13.5" fill="#166534">▸ 三路混合检索：向量 HNSW_PQ + JSON 索引 + 全文 BM25</text>
  <text x="200" y="575" font-size="13.5" fill="#166534">▸ 记忆生命周期：记忆分层 · 周期反思 · 一致性维护 · 智能遗忘</text>
  <text x="200" y="613" font-size="13.5" font-weight="600" fill="#15803D">🔒 检索 / 遗忘在存储层就近完成 · 数据不出库</text>
</svg>
