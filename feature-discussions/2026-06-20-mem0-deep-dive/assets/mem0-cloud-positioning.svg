<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="appG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E6"/><stop offset="1" stop-color="#FFD9A8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAFBEF"/><stop offset="1" stop-color="#CFF0D6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF1FF"/><stop offset="1" stop-color="#C3D8FF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrO" markerWidth="13" markerHeight="13" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#EA580C"/>
    </marker>
    <marker id="arrB" markerWidth="13" markerHeight="13" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrG" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="820" fill="#ffffff"/>

  <text x="660" y="46" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">mem0 的两种云上站位：阿里云 vs 火山引擎</text>
  <text x="660" y="78" text-anchor="middle" font-size="15.5" fill="#64748b">同一个 mem0，两家放在云架构里完全相反的层 —— 阿里云「下沉贴存储」，火山「独立上浮」</text>

  <!-- layer bands -->
  <rect x="40" y="98" width="1240" height="84" rx="10" fill="#F8FAFC"/>
  <rect x="40" y="190" width="1240" height="210" rx="10" fill="#EFF4FF"/>
  <rect x="40" y="408" width="1240" height="312" rx="10" fill="#F0FBF3"/>
  <rect x="48" y="110" width="86" height="26" rx="13" fill="#E2E8F0"/>
  <text x="91" y="128" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">应用层</text>
  <rect x="48" y="202" width="158" height="26" rx="13" fill="#DBEAFE"/>
  <text x="127" y="220" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E40AF">AI · 模型服务层</text>
  <rect x="48" y="420" width="140" height="26" rx="13" fill="#DCFCE7"/>
  <text x="118" y="438" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">数据 · 存储层</text>

  <!-- center divider -->
  <line x1="660" y1="190" x2="660" y2="708" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- shared app -->
  <rect x="560" y="114" width="200" height="50" rx="12" fill="url(#appG)" stroke="#94a3b8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="660" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">AI Agent / 应用</text>

  <!-- side headers -->
  <rect x="250" y="120" width="210" height="34" rx="17" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.4"/>
  <text x="355" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#9A3412">阿里云 · 数据库视角</text>
  <rect x="860" y="120" width="210" height="34" rx="17" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
  <text x="965" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">火山引擎 · AI 云视角</text>

  <!-- big position metaphor arrows + VS -->
  <line x1="606" y1="250" x2="606" y2="430" stroke="#EA580C" stroke-width="14" opacity="0.18" stroke-linecap="round" marker-end="url(#arrO)"/>
  <line x1="714" y1="430" x2="714" y2="250" stroke="#2563EB" stroke-width="14" opacity="0.18" stroke-linecap="round" marker-end="url(#arrB)"/>
  <circle cx="660" cy="372" r="23" fill="#0f172a"/>
  <text x="660" y="379" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">VS</text>
  <text x="606" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">下沉</text>
  <text x="714" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">上浮</text>

  <!-- ===== LEFT: 阿里云 (mem0 LOW, in storage band) ===== -->
  <path d="M610,164 L348,440" stroke="#EA580C" stroke-width="2.4" fill="none" marker-end="url(#arrO)"/>
  <text x="455" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C" paint-order="stroke" stroke="#EFF4FF" stroke-width="4">↓ 调用下沉进数据库</text>

  <rect x="150" y="448" width="380" height="230" rx="16" fill="#FFFBF4" stroke="#EA580C" stroke-width="2"/>
  <text x="170" y="473" font-size="14" font-weight="700" fill="#9A3412">阿里云数据库 · ADB / PolarDB</text>

  <rect x="175" y="486" width="330" height="60" rx="10" fill="url(#orange)" stroke="#EA580C" stroke-width="2" filter="url(#sh)"/>
  <text x="340" y="510" text-anchor="middle" font-size="15" font-weight="700" fill="#9A3412">AnalyticDB Memory Service</text>
  <text x="340" y="531" text-anchor="middle" font-size="12" fill="#C2410C">mem0 + 自研 ReMe 双框架</text>

  <line x1="340" y1="546" x2="340" y2="566" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arrG)"/>

  <rect x="175" y="568" width="330" height="98" rx="10" fill="url(#green)" stroke="#16A34A" stroke-width="1.8"/>
  <text x="340" y="592" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532D">存储底座（引擎内置）</text>
  <text x="340" y="616" text-anchor="middle" font-size="12" fill="#166534">向量 HNSW_PQ + JSON + 全文 BM25</text>
  <text x="340" y="638" text-anchor="middle" font-size="12" fill="#166534">记忆分层 · 智能遗忘 · 周期反思</text>

  <rect x="190" y="686" width="300" height="26" rx="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="340" y="704" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400E">🔒 记忆贴存储层 · 数据不出库</text>

  <!-- ===== RIGHT: 火山 (mem0 HIGH, in AI band) ===== -->
  <path d="M710,164 L980,246" stroke="#2563EB" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
  <text x="868" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8" paint-order="stroke" stroke="#EFF4FF" stroke-width="4">↑ 独立服务</text>

  <rect x="820" y="250" width="320" height="64" rx="12" fill="url(#blue)" stroke="#1D4ED8" stroke-width="2.2" filter="url(#sh)"/>
  <text x="980" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">记忆库 Mem0（独立 PaaS）</text>
  <text x="980" y="298" text-anchor="middle" font-size="12" fill="#2563EB">抽取 · 存储 · 精准调用</text>

  <text x="980" y="344" text-anchor="middle" font-size="12" fill="#64748b">编排下游后端</text>

  <path d="M980,314 L888,468" stroke="#2563EB" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>
  <path d="M980,314 L1060,468" stroke="#F59E0B" stroke-width="2.2" fill="none" marker-end="url(#arrB)"/>
  <path d="M980,314 L976,554" stroke="#2563EB" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>

  <rect x="812" y="470" width="150" height="66" rx="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="887" y="498" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A8A">VikingDB 向量库</text>
  <text x="887" y="518" text-anchor="middle" font-size="11.5" fill="#2563EB">混合检索 · 动态重排</text>

  <rect x="978" y="470" width="162" height="66" rx="9" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.2" filter="url(#sh)"/>
  <text x="1059" y="498" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400E">★ 字节图数据库</text>
  <text x="1059" y="518" text-anchor="middle" font-size="11.5" fill="#B45309">记忆图谱 · 多跳推理</text>

  <rect x="812" y="556" width="328" height="58" rx="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="976" y="581" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A8A">火山方舟 Ark · 豆包 Doubao</text>
  <text x="976" y="601" text-anchor="middle" font-size="11.5" fill="#2563EB">LLM + Embedding + Rerank</text>

  <rect x="812" y="634" width="328" height="26" rx="13" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.1"/>
  <text x="976" y="652" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E40AF">独立 PaaS · 站 AI 服务层 · 编排多后端</text>

  <!-- bottom takeaway -->
  <rect x="40" y="742" width="1240" height="56" rx="12" fill="#0F172A"/>
  <text x="660" y="769" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">阿里云让「数据库长出记忆」(下沉贴存储)  ·  火山把「记忆做成独立服务」(上浮到 AI 层)</text>
  <text x="660" y="789" text-anchor="middle" font-size="12.5" fill="#cbd5e1">两家各用基础设施王牌补 mem0 命门：火山补「图」(字节图数据库) · 阿里云补「遗忘 / 混合检索」(存储引擎内置)</text>
</svg>
