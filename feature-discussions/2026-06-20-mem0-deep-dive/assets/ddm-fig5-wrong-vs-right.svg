<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAF1FF"/><stop offset="1" stop-color="#C3D8FF"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAFBEF"/><stop offset="1" stop-color="#CFF0D6"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE7F0"/><stop offset="1" stop-color="#F8CFE0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <marker id="arrB" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#1D4ED8"/></marker>
    <marker id="arrN" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
  </defs>

  <rect x="0" y="0" width="1100" height="640" fill="#ffffff"/>
  <text x="550" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">图 5 · 错误 vs 正确：缝合 or 解耦</text>

  <!-- LEFT: WRONG -->
  <rect x="40" y="80" width="480" height="470" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="60" y="114" font-size="16.5" font-weight="700" fill="#B91C1C">❌ 融合：缝进一个引擎</text>

  <rect x="90" y="160" width="380" height="240" rx="12" fill="#ffffff" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="280" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">DDM ⊗ mem0（缝进一个引擎）</text>
  <line x1="120" y1="220" x2="440" y2="370" stroke="#FCA5A5" stroke-width="1.5"/>
  <line x1="440" y1="220" x2="120" y2="370" stroke="#FCA5A5" stroke-width="1.5"/>
  <line x1="150" y1="380" x2="420" y2="215" stroke="#FCA5A5" stroke-width="1.5"/>
  <circle cx="240" cy="300" r="80" fill="#CFF0D6" opacity="0.72" stroke="#16A34A" stroke-width="1.5"/>
  <circle cx="330" cy="300" r="80" fill="#F8CFE0" opacity="0.72" stroke="#C2185B" stroke-width="1.5"/>
  <text x="195" y="285" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">确定性</text>
  <text x="378" y="285" text-anchor="middle" font-size="13.5" font-weight="700" fill="#BE185D">概率性</text>
  <text x="285" y="312" text-anchor="middle" font-size="30" font-weight="800" fill="#B91C1C">⊗</text>
  <text x="285" y="356" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991B1B">混在一起</text>

  <rect x="92" y="470" width="116" height="30" rx="15" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.1"/>
  <text x="150" y="490" text-anchor="middle" font-size="12.5" font-weight="600" fill="#B91C1C">✗ 职责不纯</text>
  <rect x="222" y="470" width="104" height="30" rx="15" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.1"/>
  <text x="274" y="490" text-anchor="middle" font-size="12.5" font-weight="600" fill="#B91C1C">✗ 难维护</text>
  <rect x="340" y="470" width="120" height="30" rx="15" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.1"/>
  <text x="400" y="490" text-anchor="middle" font-size="12.5" font-weight="600" fill="#B91C1C">✗ 故障耦合</text>

  <!-- RIGHT: RIGHT -->
  <rect x="580" y="80" width="480" height="470" rx="16" fill="#F0FBF3" stroke="#16A34A" stroke-width="1.8"/>
  <text x="600" y="114" font-size="16.5" font-weight="700" fill="#15803D">✅ 解耦：各自纯粹 + 统一控制面</text>

  <rect x="675" y="166" width="290" height="66" rx="12" fill="url(#blue)" stroke="#1D4ED8" stroke-width="2.2" filter="url(#sh)"/>
  <text x="820" y="197" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">统一控制面 / API</text>
  <text x="820" y="219" text-anchor="middle" font-size="12" fill="#2563EB">薄接口 · 编排两层协作</text>
  <rect x="868" y="138" width="150" height="26" rx="13" fill="#FEF9C3" stroke="#F59E0B" stroke-width="1.1"/>
  <text x="943" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400E">💡 创新放这里</text>

  <path d="M770,232 L715,316" stroke="#1D4ED8" stroke-width="2.2" fill="none" marker-end="url(#arrB)"/>
  <path d="M870,232 L925,316" stroke="#1D4ED8" stroke-width="2.2" fill="none" marker-end="url(#arrB)"/>

  <rect x="620" y="318" width="180" height="86" rx="12" fill="url(#rose)" stroke="#C2185B" stroke-width="2" filter="url(#sh)"/>
  <text x="710" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#9D174D">mem0</text>
  <text x="710" y="378" text-anchor="middle" font-size="12.5" fill="#BE185D">管记忆 · 概率性</text>

  <rect x="840" y="318" width="180" height="86" rx="12" fill="url(#green)" stroke="#16A34A" stroke-width="2" filter="url(#sh)"/>
  <text x="930" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#14532D">DDM</text>
  <text x="930" y="378" text-anchor="middle" font-size="12.5" fill="#166534">管分片 · 确定性</text>

  <text x="820" y="350" text-anchor="middle" font-size="11" fill="#64748b">可选持久化</text>
  <line x1="800" y1="362" x2="838" y2="362" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrN)"/>

  <rect x="632" y="470" width="116" height="30" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.1"/>
  <text x="690" y="490" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803D">✓ 职责纯粹</text>
  <rect x="762" y="470" width="104" height="30" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.1"/>
  <text x="814" y="490" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803D">✓ 易维护</text>
  <rect x="880" y="470" width="120" height="30" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.1"/>
  <text x="940" y="490" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803D">✓ 故障隔离</text>

  <rect x="40" y="586" width="1020" height="38" rx="10" fill="#0F172A"/>
  <text x="550" y="610" text-anchor="middle" font-size="14.5" font-weight="700" fill="#f8fafc">创新应放在「统一控制面 / 接口」，而不是把两个引擎缝在一起</text>
</svg>
