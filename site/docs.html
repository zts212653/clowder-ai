  <script>
    /* Docs page logic */
    const REPO = 'zts212653/clowder-ai';
    const BRANCH = 'main';
    const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    let currentDoc = 'README.md';
    let docLoadGeneration = 0;

    // Document relationships map
    const DOC_RELATIONS = {
      'README.md': ['SETUP.md', 'CONTRIBUTING.md', 'docs/VISION.md'],
      'SETUP.md': ['README.md', 'docs/configuration/startup.md'],
      'CONTRIBUTING.md': ['docs/SOP.md', 'SECURITY.md'],
      'docs/VISION.md': ['docs/design/clowder-ai-brand.md', 'README.md'],
      'docs/SOP.md': ['CONTRIBUTING.md'],
    };

    function docUrl(path) {
      // Local dev: relative path from site/ to repo root
      // Production (GitHub Pages): fetch from raw.githubusercontent
      return IS_LOCAL ? `../${path}` : `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${path}`;
    }

    function currentLang() {
      return document.documentElement.lang === 'zh' ? 'zh' : 'en';
    }

    function t(key) {
      return window.I18N?.[currentLang()]?.[key] || window.I18N?.en?.[key] || key;
    }

    async function loadDoc(path, langOverride) {
      if (langOverride) {
        setLang(langOverride, { notify: false });
        filterFeatures(document.getElementById('feat-search').value);
      }
      const requestedLang = langOverride || currentLang();
      const requestGeneration = ++docLoadGeneration;
      currentDoc = path;
      const content = document.getElementById('doc-content');
      const nameEl = document.getElementById('doc-current-name');
      const linkEl = document.getElementById('doc-github-link');

      // Update UI state
      const name = path.split('/').pop().replace('.md', '');
      nameEl.textContent = name;
      linkEl.href = `https://github.com/${REPO}/blob/${BRANCH}/${path}`;

      // Highlight active sidebar item
      document.querySelectorAll('.doc-nav-item').forEach(btn => {
        const isActive = btn.dataset.doc === path;
        btn.classList.toggle('bg-terracotta/10', isActive);
        btn.classList.toggle('text-terracotta', isActive);
        btn.classList.toggle('font-medium', isActive);
      });

      // Loading state
      content.innerHTML = `<div class="text-center py-20 text-stone-500 dark:text-slate-500"><svg class="w-6 h-6 mx-auto mb-3 animate-spin" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>${escapeHtml(t('docs.loading.document'))}</div>`;

      try {
        const result = await window._fetchLocalizedMarkdown(path, requestedLang, candidate => fetch(docUrl(candidate)));
        if (requestGeneration !== docLoadGeneration) return;
        const { path: resolvedPath, markdown: md } = result;
        linkEl.href = `https://github.com/${REPO}/blob/${BRANCH}/${resolvedPath}`;
        content.innerHTML = window._sanitizeMarkdown(md, { DOMPurify, marked });
        window._assignDocHeadingIds(content);
        // Rewrite relative links to point at GitHub or load in-viewer
        rewriteDocLinks(content, resolvedPath);
      } catch (err) {
        if (requestGeneration !== docLoadGeneration) return;
        content.innerHTML = `<div class="text-center py-20"><p class="text-stone-500 dark:text-slate-500 mb-3">${escapeHtml(t('docs.error.document'))}</p><a href="https://github.com/${REPO}/blob/${BRANCH}/${path}" target="_blank" class="text-terracotta hover:underline text-sm">${t('docs.viewongithub')}</a></div>`;
      }

      // Show related docs
      showRelated(path);
    }

    /**
     * Rewrite relative links in rendered markdown to point at GitHub blob/raw.
     * URL resolution delegates to lib/doc-links.mjs (shared with tests).
     */
    function rewriteDocLinks(container, docPath) {
      // Known doc paths that can be loaded in-viewer
      const loadable = new Set();
      document.querySelectorAll('.doc-nav-item').forEach(btn => {
        if (btn.dataset.doc) loadable.add(btn.dataset.doc);
      });

      container.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href');
        const result = window._resolveDocLink(href, docPath, loadable);
        if (result.type === 'skip') return;
        if (result.type === 'viewer') {
          a.href = '#';
          a.addEventListener('click', e => {
            e.preventDefault();
            loadDoc(result.path, result.lang).then(() => {
              if (result.hash) {
                const anchor = document.getElementById(result.hash.slice(1));
                if (anchor) anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }
            });
          });
        } else {
          a.href = result.url;
          a.target = '_blank';
          a.rel = 'noopener';
        }
      });

      // Rewrite relative image srcs to GitHub raw
      container.querySelectorAll('img[src]').forEach(img => {
        const src = img.getAttribute('src');
        const resolved = window._resolveImageSrc(src, docPath);
        if (resolved) img.src = resolved;
      });
    }

    function showRelated(path) {
      const container = document.getElementById('doc-related');
      const links = document.getElementById('doc-related-links');
      const related = DOC_RELATIONS[path];
      if (!related || !related.length) { container.classList.add('hidden'); return; }
      container.classList.remove('hidden');
      links.innerHTML = related.map(r => {
        const name = r.split('/').pop().replace('.md', '');
        return `<button onclick="loadDoc('${r}')" class="px-3 py-1.5 rounded-lg border border-stone-200 dark:border-slate-700 text-sm text-stone-600 dark:text-slate-400 hover:border-terracotta/50 hover:text-terracotta transition">${name}</button>`;
      }).join('');
    }

    function filterDocs(query) {
      const q = query.toLowerCase();
      document.querySelectorAll('.doc-nav-item').forEach(btn => {
        const text = btn.textContent.toLowerCase();
        const match = !q || text.includes(q);
        btn.closest('li').style.display = match ? '' : 'none';
      });
      document.querySelectorAll('.doc-category').forEach(cat => {
        const visible = cat.querySelectorAll('li[style=""]').length > 0 ||
                        cat.querySelectorAll('li:not([style])').length > 0;
        cat.style.display = visible ? '' : 'none';
      });
    }

    // ===== Dynamic Feature Index =====
    let allFeatures = [];
    let featStatusFilter = 'all';
    let featureIndexState = 'loading';

    async function loadFeatureIndex() {
      featureIndexState = 'loading';
      filterFeatures(document.getElementById('feat-search').value);
      try {
        const res = await fetch(docUrl('docs/features/index.json'));
        if (!res.ok) throw new Error(`${res.status}`);
        const data = await res.json();
        allFeatures = (data.features || []).map(f => ({
          ...f,
          normalizedStatus: normalizeStatus(f.status || ''),
          path: `docs/features/${f.file}`,
        }));
        featureIndexState = 'ready';
        document.getElementById('feat-count').textContent = allFeatures.length;
        filterFeatures(document.getElementById('feat-search').value);
        populateMobileFeatures(allFeatures);
      } catch (err) {
        featureIndexState = 'error';
        filterFeatures(document.getElementById('feat-search').value);
      }
    }

    function normalizeStatus(raw) {
      const s = raw.toLowerCase();
      if (s.startsWith('done') || s.startsWith('closed') || s.includes('✅')) return 'done';
      if (s.startsWith('in-progress') || s.startsWith('in progress') || s.startsWith('active') || s.startsWith('doing') || s.startsWith('implementation') || s.startsWith('review') || s.startsWith('reopened') || s.startsWith('phase')) return 'in-progress';
      if (s.startsWith('spec') || s.startsWith('idea') || s.startsWith('frozen')) return 'planned';
      if (s.includes('done')) return 'done';
      if (s.includes('progress') || s.includes('active')) return 'in-progress';
      return 'other';
    }

    function renderFeatureList(features) {
      const list = document.getElementById('feat-list');
      if (!features.length) {
        list.innerHTML = `<li class="px-2 py-2 text-xs text-stone-400 dark:text-slate-600">${escapeHtml(t('docs.no.features'))}</li>`;
        return;
      }
      list.innerHTML = features.map(f => {
        return `<li><button class="doc-nav-item feat-nav-item w-full text-left px-2 py-1.5 rounded-md text-sm hover:bg-stone-100 dark:hover:bg-slate-800 transition truncate" data-doc="${f.path}" onclick="loadDoc('${f.path}')"><span class="text-stone-400 dark:text-slate-500">${escapeHtml(f.id)}</span> ${escapeHtml(f.name)}</button></li>`;
      }).join('');
    }

    function populateMobileFeatures(features) {
      const group = document.getElementById('mobile-feat-group');
      if (!group) return;
      group.innerHTML = features.map(f =>
        `<option value="${f.path}">${f.id}: ${escapeHtml(f.name)}</option>`
      ).join('');
    }

    function renderFeatureMessage(key) {
      const message = escapeHtml(t(key));
      document.getElementById('feat-list').innerHTML =
        `<li class="px-2 py-2 text-xs text-stone-400 dark:text-slate-600">${message}</li>`;
      const group = document.getElementById('mobile-feat-group');
      if (group) group.innerHTML = `<option disabled>${message}</option>`;
    }

    function filterFeatures(query) {
      const view = window._selectFeatureIndexView(
        featureIndexState,
        allFeatures,
        query,
        featStatusFilter,
      );
      if (view.kind === 'message') {
        renderFeatureMessage(view.key);
        return;
      }
      renderFeatureList(view.features);
    }

    function filterFeaturesByStatus(status) {
      featStatusFilter = status;
      document.querySelectorAll('.feat-status-btn').forEach(btn => {
        const isActive = btn.dataset.status === status;
        btn.classList.toggle('bg-terracotta/10', isActive);
        btn.classList.toggle('text-terracotta', isActive);
        btn.classList.toggle('font-medium', isActive);
      });
      filterFeatures(document.getElementById('feat-search').value);
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    window.addEventListener('clowder:languagechange', () => {
      loadDoc(currentDoc);
      filterFeatures(document.getElementById('feat-search').value);
    });

    // Load default doc + feature index on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadDoc('README.md');
      loadFeatureIndex();
    });
  </script>
</body>
</html>
