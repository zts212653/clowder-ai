id: D1
name: 身份锚定
stage: per-turn
order: 100
version: 1
enabled: true

# Content resolution
template: d1-identity-anchor.md
resolver: D1IdentityAnchorResolver

# Dependencies
inputs:
  - identity

# Variable metadata (canonical source for Console editor)
variables:
  - name: DISPLAY_NAME
    description: 当前猫的显示名
    placeholder: ""
  - name: NICKNAME_PART
    description: 当前猫昵称后缀（如 /小狸）
    placeholder: ""
  - name: CAT_ID
    description: 当前猫的稳定 ID
    placeholder: ""
  - name: RUNTIME_MODEL
    description: 当前运行模型
    placeholder: ""
# Override constraints
disableable: false

# Classification (Phase 1 3-axis)
safetyTier: readonly
transparencyTier: visible-by-default
governanceTier: immutable

# CVO-facing
userExplanation: "每轮重申身份以防偏移"
