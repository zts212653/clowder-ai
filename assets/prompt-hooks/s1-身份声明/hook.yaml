id: S1
name: 身份声明
stage: session-init
order: 800
version: 1
enabled: true

# Content resolution
template: s1-identity.md
resolver: S1IdentityResolver

# Dependencies
inputs:
  - displayName
  - roleDescription
  - identity

# Variable metadata (canonical source for Console editor)
variables:
  - name: NAME_LABEL
    description: 当前猫的完整名称
    placeholder: ""
  - name: PROVIDER_LABEL
    description: 模型提供商标签
    placeholder: ""
  - name: NICKNAME_ORIGIN
    description: 昵称由来说明
    placeholder: ""
  - name: ROLE_DESCRIPTION
    description: 角色描述
    placeholder: ""
  - name: PERSONALITY
    description: 性格描述
    placeholder: ""
# Override constraints
disableable: false

# Classification (Phase 1 3-axis)
safetyTier: readonly
transparencyTier: visible-by-default
governanceTier: immutable

# CVO-facing
userExplanation: "猫的身份、角色和昵称"
