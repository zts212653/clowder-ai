id: S14
name: 主人画像与关系指针
stage: session-init
order: 850
version: 1
enabled: true

# Content resolution
template: s14-owner-profile.md
resolver: S14OwnerProfileResolver

# Dependencies
inputs:
  - ownerProfileSection

# Variable metadata (canonical source for Console editor)
variables:
  - name: OWNER_PROFILE_SECTION
    description: 已按 F231 契约渲染的 owner capsule 与可用 profile pointers
    placeholder: ""
# Override constraints
disableable: false

# Classification (Phase 1 3-axis)
# readonly is load-bearing: HookPipeline returns a contentOverride verbatim without
# rendering variables, so an activated edit containing the placeholder would replace
# the owner's real profile with the literal {{OWNER_PROFILE_SECTION}}.
safetyTier: readonly
transparencyTier: opt-in-view
governanceTier: immutable

# operator-facing
userExplanation: "你的主人画像与关系指针：会话开始时挂载，内容按需从 profile 读取"
