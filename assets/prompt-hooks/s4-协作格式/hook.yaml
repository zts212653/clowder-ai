id: S4
name: 协作格式
stage: session-init
order: 1100
version: 1
enabled: true

# Content resolution
template: s4-collaboration-format.md
resolver: S4CollabFormatResolver

# Dependencies
inputs:
  - collaborationStyle

# Variable metadata (canonical source for Console editor)
variables:
  - name: CALLABLE_MENTIONS
    description: 当前可 @ 的队友句柄列表
    placeholder: "@布偶猫 @缅因猫"
  - name: EXAMPLE_TARGET
    description: 一个具体队友句柄示例，用于展示正确/错误 @ 格式
    placeholder: "@opus"
  - name: DUPLICATE_NAMES_HINT
    description: 当出现同名队友时的额外提示（可为空）
    placeholder: ""

# Override constraints
disableable: true

# Classification (Phase 1 3-axis)
safetyTier: readonly
transparencyTier: opt-in-view
governanceTier: human-gated

# CVO-facing
userExplanation: "猫猫之间的协作格式要求"
