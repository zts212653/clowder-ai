# sync-manifest.yaml — Cat Café → Clowder AI 开源同步清单
# 版本: 3
# 更新: 2026-03-12
# 三猫共识: allowlist export（白名单导出），不是 blacklist deletion
# docs/ 细粒度导出（三猫 + 铲屎官共识 2026-03-12）

version: 3
target_repo: clowder-ai
license: MIT

# ── 整包导出（managed_roots）──────────────────────────────────
# 整个目录树导出，包含 package.json/tsconfig/src/test 等所有构建闭包文件
managed_roots:
  - packages/api
  - packages/web
  - packages/shared
  - packages/mcp-server
  - packages/finance          # F207 finance fact package (mcp-server workspace dependency)
  - desktop                # F179: Electron desktop shell + Win/Mac build scripts (release-desktop.yml 依赖)
  - cat-cafe-skills        # 运行时依赖 + 核心差异化
  - guides                 # F155 guide registry + flow YAMLs (check:guides/runtime dependency)
  - sop-definitions        # F203 SOP definition truth source (check:sop-definitions runtime closure)
  - assets/prompt-templates # F237 L0 segment templates loaded by compile-system-prompt-l0.mjs
  - docs/architecture      # 架构文档（直出）
  - docs/setup             # SETUP 配置截图（直出）
  # F192 eval 基础设施：整个 eval-domains/ 目录（domain registry yaml + community-fixtures
  # 示例）作为 root 整目录导出。改成 managed_root 而非逐个 managed_files，是因为加新 eval
  # domain（如 F192 E-sop 的 eval-sop.yaml）时反复漏更新 manifest → outbound sync 缺文件 →
  # test:public 红（eval-hub-read-model / community-fixtures）。整目录导出让未来加 domain
  # 自动同步。eval-domains/ 全部内容都是公开 eval 基础设施，无内部专用文件。
  - docs/harness-feedback/eval-domains
  # 注：猫猫头像在 packages/web/public/avatars/ 中，已被 packages/web 整包包含

