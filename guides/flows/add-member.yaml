# F150 Guide Flow: 添加成员
# P0 验证场景 — 引导到添加成员入口
# Schema: OrchestrationFlow v2 (tag-based engine)

schemaVersion: 1
id: add-member
name: 添加成员
description: 引导你完成新成员创建并补充成员信息

steps:
  - id: open-hub
    target: hub.trigger
    tips: 点击这里打开 Hub 控制台
    advance: click

  - id: go-to-cats
    target: cats.overview
    tips: 进入成员管理页面
    advance: click

  - id: click-add-member
    target: cats.add-member
    tips: 点击这里开始添加新成员
    advance: click

  - id: choose-client
    target: add-member.client
    tips: 先选择这个成员要使用的 Client（如 Codex、OpenCode、Claude）
    advance: click

  - id: choose-provider-account
    target: add-member.provider-profile
    tips: 为这个成员选择认证账号；后续模型会绑定在这套 Provider 配置上
    advance: click

  - id: choose-model
    target: add-member.model
    tips: 选择默认模型，完成成员的基础运行配置
    advance: click

  - id: create-member
    target: add-member.submit
    tips: 点击创建成员并进入详情编辑页
    advance: click

  - id: done
    target: member-editor.profile
    tips: 补充成员信息并点击保存；保存成功后会自动完成本次引导
    advance: confirm
