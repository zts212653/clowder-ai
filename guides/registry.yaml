    priority: P1
    cross_system: false
    estimated_time: 3min

  - id: connect-wechat
    name: 对接微信
    description: 引导你完成微信渠道的接入和扫码配置
    flow_file: flows/connect-wechat.yaml
    keywords:
      - 对接微信
      - 连接微信
      - 微信接入
      - 配置微信
      - 微信扫码
