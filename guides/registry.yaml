    name: 添加账户认证
    description: 引导你完成 API Key 认证账号的创建和配置
    flow_file: flows/add-account-auth.yaml
    keywords:
      - 添加账户
      - 添加认证
      - 添加apikey
      - 新增apikey
      - 配置apikey
      - 添加api key
      - 添加模型
      - add account
      - add api key
      - add apikey
