    cross_system: false
    estimated_time: 3min

  - id: edit-member-auth
    name: 修改成员认证与模型
    description: 引导你为成员配置认证信息和默认模型
    flow_file: flows/edit-member-auth.yaml
    keywords:
      - 修改成员
      - 修改认证
      - 修改模型
      - 配置模型
      - 配置认证
      - 修改provider
      - 修改client
      - edit member auth
      - change model
      - configure provider
