name: Desktop Nightly

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch in this repository'
        default: next
        type: string
      suite:
        description: 'Smoke selects L0, full selects L0–L3'
        default: smoke
        type: choice
        options: [smoke, full]
      platform:
        description: 'Desktop target'
        default: all
        type: choice
        options: [all, windows-x64, macos-arm64, macos-x64]
      version:
        description: 'Optional package version override'
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-nightly-${{ inputs.branch || 'next' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.target.outputs.source }}
      version: ${{ steps.target.outputs.version }}
      date: ${{ steps.target.outputs.date }}
      platforms: ${{ steps.target.outputs.platforms }}
      mac: ${{ steps.target.outputs.mac }}
      arch: ${{ steps.target.outputs.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: target
        name: Freeze the source and requested coverage
        env:
          BRANCH: ${{ inputs.branch || 'next' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          git check-ref-format "refs/heads/$BRANCH"
          git fetch --no-tags origin "refs/heads/$BRANCH"
          source="$(git rev-parse --verify FETCH_HEAD)"
          version="$VERSION_OVERRIDE"
          if [[ -z "$version" ]]; then
            version="$(git show "$source:desktop/package.json" | jq -er .version)"
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          case "$PLATFORM" in
            all) platforms='["windows-x64","macos-arm64","macos-x64"]'; mac='["arm64","x64"]'; arch=all ;;
            windows-x64) platforms='["windows-x64"]'; mac='[]'; arch=all ;;
            macos-arm64) platforms='["macos-arm64"]'; mac='["arm64"]'; arch=arm64 ;;
            macos-x64) platforms='["macos-x64"]'; mac='["x64"]'; arch=x64 ;;
            *) exit 2 ;;
          esac
          {
            echo "source=$source"
            echo "version=$version"
            echo "date=$(TZ=Asia/Shanghai date +%F)"
            echo "platforms=$platforms"
            echo "mac=$mac"
            echo "arch=$arch"
          } >> "$GITHUB_OUTPUT"
      - name: Report a source or configuration blocker
        if: failure()
        run: echo '桌面回归未能冻结待测提交或包版本。检查同一作业中的 Freeze the source and requested coverage。' >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    needs: resolve
    if: contains(fromJSON(needs.resolve.outputs.platforms), 'windows-x64')
    uses: ./.github/workflows/build-windows-desktop.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      source-sha: ${{ needs.resolve.outputs.source }}

  build-mac:
    needs: resolve
    if: needs.resolve.outputs.mac != '[]'
    uses: ./.github/workflows/build-mac-dmg.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      source-sha: ${{ needs.resolve.outputs.source }}
      arch: ${{ needs.resolve.outputs.arch }}

  verify-windows:
    needs: [resolve, build-windows]
    if: always() && needs.resolve.result == 'success' && contains(fromJSON(needs.resolve.outputs.platforms), 'windows-x64') && !cancelled()
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SOURCE_SHA: ${{ needs.resolve.outputs.source }}
      CANDIDATE_VERSION: ${{ needs.resolve.outputs.version }}
      CANDIDATE_DIRECT_ARTIFACTS: '1'
      NIGHTLY_SUITE: ${{ inputs.suite || 'smoke' }}
      NIGHTLY_PLATFORMS: ${{ needs.resolve.outputs.platforms }}
      NIGHTLY_DATE: ${{ needs.resolve.outputs.date }}
      NIGHTLY_PLATFORM: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/desktop-acceptance
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allocate a fresh verification root
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP "f330-candidate-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $candidate | Out-Null
          "CANDIDATE_ROOT=$candidate" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        id: installer
        continue-on-error: true
        with:
          name: windows-installer-${{ needs.resolve.outputs.version }}-attempt-${{ github.run_attempt }}
          path: ${{ env.CANDIDATE_ROOT }}/installer-distribution
      - uses: actions/download-artifact@v4
        id: portable
        if: inputs.suite == 'full'
        continue-on-error: true
        with:
          name: windows-portable-${{ needs.resolve.outputs.version }}-attempt-${{ github.run_attempt }}
          path: ${{ env.CANDIDATE_ROOT }}/portable-distribution
      - name: Verify the real distributions selected by the suite
        shell: pwsh
        env:
          INSTALLER_DOWNLOAD: ${{ steps.installer.outcome }}
          PORTABLE_DOWNLOAD: ${{ steps.portable.outcome }}
        run: |
          $kinds = @()
          if ($env:INSTALLER_DOWNLOAD -eq 'success') { $kinds += 'installer' }
          if ($env:PORTABLE_DOWNLOAD -eq 'success') { $kinds += 'portable' }
          if ($kinds.Count) { node .github/desktop-acceptance/distributions.mjs @kinds }
      - name: Collect per-case results
        if: always() && env.CANDIDATE_ROOT != ''
        shell: pwsh
        run: node .github/desktop-acceptance/nightly-evidence.mjs collect (Join-Path $env:CANDIDATE_ROOT 'evidence')
      - uses: actions/upload-artifact@v4
        if: always() && env.CANDIDATE_ROOT != ''
        with:
          name: desktop-evidence-windows-x64-attempt-${{ github.run_attempt }}
          path: ${{ env.CANDIDATE_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 30

  verify-mac:
    needs: [resolve, build-mac]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.mac != '[]' && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.resolve.outputs.mac || '[]') }}
    runs-on: ${{ matrix.arch == 'x64' && 'macos-15-intel' || 'macos-latest' }}
    timeout-minutes: 30
    env:
      CANDIDATE_SOURCE_SHA: ${{ needs.resolve.outputs.source }}
      CANDIDATE_VERSION: ${{ needs.resolve.outputs.version }}
      NIGHTLY_SUITE: ${{ inputs.suite || 'smoke' }}
      NIGHTLY_PLATFORMS: ${{ needs.resolve.outputs.platforms }}
      NIGHTLY_DATE: ${{ needs.resolve.outputs.date }}
      NIGHTLY_PLATFORM: macos-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/desktop-acceptance
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}-${{ needs.resolve.outputs.version }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dmg-distribution
      - name: Verify the installed application from the real DMG
        run: bash .github/desktop-acceptance/macos.sh "$RUNNER_TEMP/dmg-distribution" "$RUNNER_TEMP/desktop-evidence"
      - name: Collect per-case results
        if: always()
        run: node .github/desktop-acceptance/nightly-evidence.mjs collect "$RUNNER_TEMP/desktop-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-macos-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-evidence
          if-no-files-found: error
          retention-days: 30

  report:
    needs: [resolve, verify-windows, verify-mac]
    if: always() && needs.resolve.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SOURCE_SHA: ${{ needs.resolve.outputs.source }}
      CANDIDATE_VERSION: ${{ needs.resolve.outputs.version }}
      NIGHTLY_SUITE: ${{ inputs.suite || 'smoke' }}
      NIGHTLY_PLATFORMS: ${{ needs.resolve.outputs.platforms }}
      NIGHTLY_DATE: ${{ needs.resolve.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/desktop-acceptance
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-evidence-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-report
      - name: Summarize selected cases including missing evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-report"
          node .github/desktop-acceptance/nightly-evidence.mjs report "$RUNNER_TEMP/desktop-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-nightly-report-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-report/report.*
          if-no-files-found: error
          retention-days: 30
