# Windows Smoke Tests
# Target-owned by the open-source repo — NOT managed by upstream sync.
# See sync-manifest.yaml target_owned_files.
#
# Runs Windows-specific tests that cannot be validated on Linux/macOS CI.
# Covers: CLI .cmd shim resolution, ProcessLivenessProbe platform guard,
# and ManagedRunner parent/descendant process-tree cleanup.

name: Windows Smoke

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'designs/**'
      - 'assets/**'

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cat-cafe/shared build
      - run: pnpm --filter @cat-cafe/api build
      - name: Install OpenCode behavior baseline
        run: npm install --global opencode-ai@1.18.9
      - name: Verify OpenCode model ID routing
        run: >-
          node --test
          packages/api/test/opencode-model-id-ci-contract.test.js
          packages/api/test/opencode-model-id-request.test.js
        env:
          REQUIRE_OPENCODE_MODEL_ID_TEST: '1'
      - name: Windows-relevant tests
        run: |
          node --test packages/api/test/cli-spawn-win.test.js
          node --test packages/api/test/process-liveness-probe.test.js
          node --test packages/api/test/pick-directory.test.js
      - name: ManagedRunner Windows process-tree cleanup
        run: >-
          node --test
          packages/api/test/managed-runner-process-tree.test.js
          packages/api/test/managed-runner-windows.test.js
      - name: Desktop config behavioral tests (PowerShell)
        run: node --test desktop/generate-desktop-config-behavior.test.js
      # Platform-independent decision logic behind the macOS bundle arch guard.
      # It refuses to ship a DMG whose native modules target the build host
      # instead of the requested arch (measured on run 34461497456).
      - name: Desktop macOS bundle arch-guard tests
        run: node --test desktop/scripts/lib/mac-native-arch.test.mjs
      # The Windows installer bundles a portable Node runtime. Guessing its
      # version produced installers whose API could not load native modules.
      - name: Desktop build Node-version guard tests
        run: node --test desktop/scripts/lib/resolve-build-node.test.js
      # runtime-manifest.json is the single source for the desktop runtime
      # versions. This guard fails when package.json, the CI workflows, the
      # build scripts or the README drift away from it.
      - name: Desktop runtime-manifest consistency guard
        run: node --test desktop/scripts/lib/runtime-manifest.test.mjs
      # Decides whether an INSTALLED tree is usable. The real check runs against
      # a freshly installed app (see ci/desktop-install-smoke); these cases keep
      # the decision logic honest without needing an installer.
      - name: Desktop installed-layout checks
        run: node --test desktop/scripts/lib/installed-layout.test.mjs
      # The runtime smoke starts from an installed tree (see ci/desktop-install-smoke);
      # these cases cover the decisions it makes about what to probe.
      - name: Desktop runtime-smoke helper tests
        run: node --test desktop/scripts/smoke-runtime.test.js
      # The Web build wrapper spawned node_modules/.bin tools without a shell,
      # which is ENOENT on Windows — this is what made the Windows installer
      # impossible to build. Windows-only in effect; harmless elsewhere.
      - name: Web build signal-exit wrapper tests
        run: node --test scripts/run-preserving-signal-exit.test.mjs
      # Platform-agnostic desktop tests, wired here because this workflow is the
      # one that reliably runs on PRs (the public test lane is currently red on
      # main before it reaches desktop/*.test.js).
      - name: Desktop runtime tests (Redis ownership, loopback, warnings, shutdown)
        run: >-
          node --test
          desktop/redis-ownership.test.js
          desktop/desktop-instance.test.js
          desktop/service-manager-redis-ownership.test.js
          desktop/service-manager-loopback.test.js
          desktop/service-manager-shutdown.test.js
          desktop/service-manager-ports.test.js
          desktop/service-manager.test.js
          desktop/port-pair.test.js
          desktop/routes-manifest.test.js
          desktop/shutdown-plan.test.js
          desktop/startup-warning.test.js
