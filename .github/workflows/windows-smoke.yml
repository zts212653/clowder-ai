name: Windows Resource Readiness
run-name: F290 Collective Windows private paths at 999d531e

# Isolated probe branch only. The default-branch desktop workflow is unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collective-private-path:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
        working-directory: plugin-source
    env:
      EXPECTED_COLLECTIVE_SOURCE: 999d531ebef7a3224bd32d841f8038ac5105c01d
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          sparse-checkout: .github/desktop-acceptance
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zts212653/clowder-ai-plugins
          ref: ${{ env.EXPECTED_COLLECTIVE_SOURCE }}
          path: plugin-source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          package_json_file: plugin-source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Bind the actual OS, source and runner identity
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:EXPECTED_COLLECTIVE_SOURCE) { throw 'Wrong source checkout' }
          $evidence = Join-Path $env:RUNNER_TEMP "f330-collective-private-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          "PROBE_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try {
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            $metadata = [ordered]@{
              source = $source
              platform = (node -p 'process.platform').Trim()
              node = (node --version).Trim()
              windows = [Environment]::OSVersion.VersionString
              currentSid = $identity.User.Value
              elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
              startedAt = [DateTime]::UtcNow.ToString('o')
            }
          } finally { $identity.Dispose() }
          $metadata | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $evidence 'metadata.json')
          if ($metadata.platform -cne 'win32' -or -not $metadata.elevated) { throw 'The five checks require native elevated Windows' }
      - name: Install the reviewed source dependencies
        run: |
          pnpm install --frozen-lockfile --filter @clowder-ai/collective-connector...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the five native first-boot, reopen and ACL checks
        run: |
          $watch = [Diagnostics.Stopwatch]::StartNew()
          pnpm --filter @clowder-ai/collective-connector exec node --import tsx --test --test-reporter=tap --test-concurrency=1 test/windows-private-path.test.ts 2>&1 |
            Tee-Object -FilePath (Join-Path $env:PROBE_EVIDENCE 'native.tap')
          $testExit = $LASTEXITCODE
          $watch.Stop()
          $metaPath = Join-Path $env:PROBE_EVIDENCE 'metadata.json'
          $metadata = Get-Content -Raw $metaPath | ConvertFrom-Json -AsHashtable
          git diff --quiet
          $metadata.trackedSourceClean = ($LASTEXITCODE -eq 0)
          $metadata.exitCode = $testExit
          $metadata.elapsedMs = $watch.ElapsedMilliseconds
          $metadata.finishedAt = [DateTime]::UtcNow.ToString('o')
          $metadata.sourceFiles = @('src/private-path-access.ts', 'test/windows-private-path.test.ts') | ForEach-Object {
            $file = Join-Path 'packages/collective-connector' $_
            @{ path = $_; sha256 = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() }
          }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $metaPath
          node "$env:GITHUB_WORKSPACE/harness/.github/desktop-acceptance/collective-windows-result.mjs" $metaPath (Join-Path $env:PROBE_EVIDENCE 'native.tap') (Join-Path $env:PROBE_EVIDENCE 'result.json') $env:EXPECTED_COLLECTIVE_SOURCE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native facts even when a check fails
        if: always() && env.PROBE_EVIDENCE != ''
        uses: actions/upload-artifact@v4
        with:
          name: collective-windows-private-${{ github.run_id }}
          path: ${{ env.PROBE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
