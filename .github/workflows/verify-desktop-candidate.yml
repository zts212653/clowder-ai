name: macOS installer port conflict proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: ${{ matrix.arch == 'x64' && 'macos-15-intel' || 'macos-latest' }}
    timeout-minutes: 35
    env:
      ARCH: ${{ matrix.arch }}
      CANDIDATE_SOURCE_SHA: 3569a9b6422723faf3a586b68232c140f84b44a1
      CANDIDATE_VERSION: '1.14.0'
      NIGHTLY_PLATFORM: macos-${{ matrix.arch }}
      NIGHTLY_PLATFORMS: '["macos-arm64","macos-x64"]'
      NIGHTLY_SUITE: full
      NIGHTLY_DATE: '2026-11-07'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/desktop-acceptance
            scripts/test-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}-1.14.0-attempt-1
          run-id: 42322304957
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/distribution
      - name: Verify the real original DMG
        shell: bash
        run: |
          files=("$RUNNER_TEMP/distribution"/*.dmg)
          [[ "${#files[@]}" == 1 ]]
          case "$ARCH" in
            arm64) expected=b3796e07bcbea7f655412ba9d7abd086aaea8239a036eb06ef33567f642c46c1 ;;
            x64) expected=a62a5298765fe8fde19f3906dc1baa27ded687cba88b8cbbc94e791e6048834a ;;
            *) exit 2 ;;
          esac
          [[ "$(shasum -a 256 "${files[0]}" | cut -d ' ' -f1)" == "$expected" ]]
          bash .github/desktop-acceptance/macos.sh "$RUNNER_TEMP/distribution" "$RUNNER_TEMP/desktop-evidence"
      - name: Collect the installation and independent port preflight results
        if: always()
        run: node .github/desktop-acceptance/nightly-evidence.mjs collect "$RUNNER_TEMP/desktop-evidence"
      - name: Assert the three actual app scenarios
        run: jq -e '.status == "passed" and .cleanupConfirmed == true and (.checks | length == 3 and all(.[]; .status == "passed"))' "$RUNNER_TEMP/desktop-evidence/mac-port-conflicts.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-macos-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-evidence
          retention-days: 14