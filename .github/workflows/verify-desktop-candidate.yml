name: Windows installer port conflict proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CANDIDATE_SOURCE_SHA: 12514727ac0f4e13384c0ae50607ab4899af1f40
      CANDIDATE_VERSION: '1.14.0'
      CANDIDATE_DIRECT_ARTIFACTS: '1'
      NIGHTLY_DATE: '2026-11-07'
      NIGHTLY_SUITE: full
      NIGHTLY_PLATFORM: windows-x64
      NIGHTLY_PLATFORMS: '["windows-x64"]'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/desktop-acceptance
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify original installer artifact and allocate isolated root
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifact = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/42278446613/artifacts" --jq '.artifacts[]|select(.name=="windows-installer-1.14.0-attempt-1" and .expired==false)|{id,digest}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.id -ne 13534667720 -or $artifact.digest -ne 'sha256:95a11df6c393e337949b99c02fe2c6397abdf0775db02b7da4ced88a127e7b8a') { throw 'Unexpected producer artifact' }
          $root = Join-Path $env:RUNNER_TEMP "f330-candidate-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $root | Out-Null
          "CANDIDATE_ROOT=$root" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-1.14.0-attempt-1
          run-id: 42278446613
          github-token: ${{ github.token }}
          path: ${{ env.CANDIDATE_ROOT }}/installer-distribution
      - name: Exercise the original installer with the full Windows verifier
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:CANDIDATE_ROOT 'installer-distribution') -File)
          if ($files.Count -ne 1 -or (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash -ne 'B30A3B1CB3F6B926692B26AA4BD33E36E5EAA96D5E7C33E85CBA3552B9BD7F74') { throw 'Installer digest changed' }
          node .github/desktop-acceptance/distributions.mjs installer
          exit $LASTEXITCODE
      - name: Collect selected results including port conflict evidence
        if: always() && env.CANDIDATE_ROOT != ''
        shell: pwsh
        run: node .github/desktop-acceptance/nightly-evidence.mjs collect (Join-Path $env:CANDIDATE_ROOT 'evidence')
      - uses: actions/upload-artifact@v4
        if: always() && env.CANDIDATE_ROOT != ''
        with:
          name: desktop-evidence-windows-x64-attempt-${{ github.run_attempt }}
          path: ${{ env.CANDIDATE_ROOT }}/evidence
          retention-days: 14