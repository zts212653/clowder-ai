name: Desktop report artifact handoff proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-evidence-*-attempt-1
          run-id: 42278446613
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/desktop-report
      - uses: actions/download-artifact@v4
        with:
          name: desktop-nightly-report-attempt-1
          run-id: 42278446613
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/desktop-report
      - name: Verify original run identity and all checksum files
        shell: bash
        run: |
          cd "$RUNNER_TEMP/desktop-report"
          jq -e '.runId == "42278446613" and .attempt == "1" and .source == "12514727ac0f4e13384c0ae50607ab4899af1f40" and .catalogRevision == "2710f9634ac49e17f478263b4212b2620460b4ee"' report.json
          jq -er '.Hash' desktop-evidence-windows-x64-attempt-1/installer/distribution-sha256.json
          awk '{print $1}' desktop-evidence-macos-arm64-attempt-1/distribution-sha256.txt desktop-evidence-macos-x64-attempt-1/distribution-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-nightly-report-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-report/report.*
            ${{ runner.temp }}/desktop-report/desktop-evidence-*-attempt-${{ github.run_attempt }}/installer/distribution-sha256.json
            ${{ runner.temp }}/desktop-report/desktop-evidence-*-attempt-${{ github.run_attempt }}/distribution-sha256.txt
          if-no-files-found: error
          retention-days: 14