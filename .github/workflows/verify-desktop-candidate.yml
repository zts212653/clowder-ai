name: Desktop macOS artifact proof
on:
  workflow_dispatch:
    inputs:
      producer-run:
        required: true
        type: string
      producer-head:
        required: true
        type: string
      version:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  x64:
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      PRODUCER_RUN: ${{ inputs.producer-run }}
      CANDIDATE_SOURCE_SHA: ${{ inputs.producer-head }}
      CANDIDATE_VERSION: ${{ inputs.version }}
      NIGHTLY_PLATFORM: macos-x64
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/desktop-acceptance
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind the existing artifact to its producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-evidence"
          [[ "$PRODUCER_RUN" =~ ^[1-9][0-9]*$ && "$CANDIDATE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN" |
            jq -e --arg sha "$CANDIDATE_SOURCE_SHA" '.head_sha == $sha and .event == "workflow_dispatch" and .path == ".github/workflows/release-desktop.yml"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/artifacts" |
            jq -e --arg name "macos-dmg-x64-$CANDIDATE_VERSION" --arg sha "$CANDIDATE_SOURCE_SHA" \
            '[.artifacts[] | select(.name == $name and .workflow_run.head_sha == $sha and .expired == false and (.digest | startswith("sha256:")))] | if length == 1 then .[0] else error("Expected one matching artifact") end' \
            > "$RUNNER_TEMP/desktop-evidence/producer-artifact.json"
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg-x64-${{ inputs.version }}
          run-id: ${{ inputs.producer-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dmg-distribution
      - name: Install, launch and restore the real DMG
        run: bash .github/desktop-acceptance/macos.sh "$RUNNER_TEMP/dmg-distribution" "$RUNNER_TEMP/desktop-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-x64-artifact-proof
          path: ${{ runner.temp }}/desktop-evidence
          retention-days: 14
