name: Integrated Windows release upgrade proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SOURCE_SHA: 3569a9b6422723faf3a586b68232c140f84b44a1
      CANDIDATE_VERSION: '1.14.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/desktop-acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allocate a fresh upgrade root
        shell: pwsh
        run: |
          $candidate=Join-Path $env:RUNNER_TEMP "f330-candidate-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $candidate|Out-Null
          "CANDIDATE_ROOT=$candidate" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-1.14.0-attempt-1
          run-id: 42322304957
          github-token: ${{ github.token }}
          path: ${{ env.CANDIDATE_ROOT }}/upgrade-candidate-distribution
      - uses: actions/download-artifact@v4
        with:
          name: desktop-build-hash-windows-x64-attempt-1
          run-id: 42322304957
          github-token: ${{ github.token }}
          path: ${{ env.CANDIDATE_ROOT }}/candidate-hash
      - name: Run the unchanged upgrade verifier
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/desktop-acceptance/windows-upgrade.ps1
      - uses: actions/upload-artifact@v4
        if: always() && env.CANDIDATE_ROOT != ''
        with:
          name: desktop-evidence-windows-upgrade-attempt-${{ github.run_attempt }}
          path: ${{ env.CANDIDATE_ROOT }}/evidence
          retention-days: 14