name: Desktop failure attribution proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, fixed, normal]
    env:
      MODE: ${{ matrix.mode }}
      CANDIDATE_SOURCE_SHA: 3569a9b6422723faf3a586b68232c140f84b44a1
      CANDIDATE_VERSION: '1.14.0'
      NIGHTLY_PLATFORM: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: .github/desktop-acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg-arm64-1.14.0-attempt-1
          run-id: 42304140475
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/distribution
      - name: Exercise Mac with the same real DMG
        shell: bash
        run: |
          files=("$RUNNER_TEMP/distribution"/*.dmg)
          [[ "${#files[@]}" == 1 ]]
          [[ "$(shasum -a 256 "${files[0]}" | cut -d ' ' -f1)" == f6963ddc70f1ff054c001f05491e72468f35e7b97dd149fc52052e0bc3b6de4b ]]
          if [[ "$MODE" == baseline ]]; then
            git show HEAD^:.github/desktop-acceptance/macos.sh > .github/desktop-acceptance/macos.sh
          fi
          if [[ "$MODE" != normal ]]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/desktop-acceptance/browser.mjs")
          source = p.read_text()
          marker = "  const healthResponse = await fetch("
          assert source.count(marker) == 1
          p.write_text(source.replace(marker, "  throw new Error('Injected verification failure after renderer ready');\n" + marker))
          PY
          fi
          result=0
          bash .github/desktop-acceptance/macos.sh "$RUNNER_TEMP/distribution" "$RUNNER_TEMP/evidence" || result=$?
          receipt="$RUNNER_TEMP/evidence/dmg-result.json"
          if [[ "$MODE" == baseline ]]; then
            [[ "$result" != 0 ]]
            jq -e '.status == "failed" and .code == "macos-cleanup-unconfirmed" and .cleanupConfirmed == false' "$receipt"
          elif [[ "$MODE" == fixed ]]; then
            [[ "$result" != 0 ]]
            jq -e '.status == "failed" and .code == "macos-create" and .cleanupConfirmed == true' "$receipt"
          else
            [[ "$result" == 0 ]]
            jq -e '.status == "passed" and .code == "macos-complete" and .cleanupConfirmed == true' "$receipt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-failure-${{ matrix.mode }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, fixed]
    env:
      MODE: ${{ matrix.mode }}
      CANDIDATE_SOURCE_SHA: 3569a9b6422723faf3a586b68232c140f84b44a1
      CANDIDATE_VERSION: '1.14.0'
      CANDIDATE_DIRECT_ARTIFACTS: '1'
      NIGHTLY_SUITE: full
      NIGHTLY_DATE: '2026-11-07'
      NIGHTLY_PLATFORM: windows-x64
      NIGHTLY_PLATFORMS: '["windows-x64"]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github/desktop-acceptance
            scripts/test-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allocate isolated root
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "f330-candidate-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $root | Out-Null
          "CANDIDATE_ROOT=$root" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-1.14.0-attempt-1
          run-id: 42304140475
          github-token: ${{ github.token }}
          path: ${{ env.CANDIDATE_ROOT }}/installer-distribution
      - name: Exercise optional probe interruption with the same real EXE
        shell: pwsh
        run: |
          $files=@(Get-ChildItem -LiteralPath "$env:CANDIDATE_ROOT/installer-distribution" -File)
          if ($files.Count -ne 1 -or (Get-FileHash -LiteralPath $files[0].FullName).Hash -ne 'DDE5648C0DF73E3D574BA9AA06A548F4452AE5970F5B23E5757C13FD328813D9') {throw 'Installer hash changed'}
          $file='.github/desktop-acceptance/windows.ps1'
          if($env:MODE -eq 'baseline'){ git show "HEAD^:$file" | Set-Content -LiteralPath $file }
          $content=Get-Content -Raw -LiteralPath $file
          $marker='function Test-PortConflicts([string]$Exe, [string]$Install, [string]$Output, [int[]]$Ports) {'
          if(-not $content.Contains($marker)){throw 'Expected fault site not found'}
          $content.Replace($marker,($marker + [char]10 + "  throw 'Injected optional port probe interruption'")) | Set-Content -LiteralPath $file
          node .github/desktop-acceptance/distributions.mjs installer
          $nativeExit=$LASTEXITCODE
          $root="$env:CANDIDATE_ROOT/evidence"
          node .github/desktop-acceptance/nightly-evidence.mjs collect $root
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $suite=Get-Content -Raw -LiteralPath "$root/receipts.json"|ConvertFrom-Json
          $l0=$suite.receipts|Where-Object id -eq 'WIN-CLEAN-INSTALL'
          $l1=$suite.receipts|Where-Object id -eq 'WIN-PORT-PREFLIGHT'
          if($env:MODE -eq 'baseline'){
            if($nativeExit -eq 0 -or $l0.code -ne 'windows-install' -or $l1.code -ne 'windows-port-preflight-unavailable'){throw 'Old behavior did not reproduce'}
          } else {
            if(-not(Test-Path -LiteralPath "$root/installer/create-checks.json") -or $l0.code -eq 'windows-install' -or $l1.code -ne 'windows-port-preflight-interrupted'){throw 'Optional probe still contaminated L0 attribution'}
          }
          $l0,$l1|ConvertTo-Json -Depth 4 -Compress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-failure-${{ matrix.mode }}
          path: ${{ env.CANDIDATE_ROOT }}/evidence
          retention-days: 14