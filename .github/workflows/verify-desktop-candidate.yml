name: Desktop Windows same-package restore diagnosis
on:
  workflow_dispatch:
    inputs:
      producer-run:
        required: true
        type: string
      producer-head:
        required: true
        type: string
      version:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [unaltered, observer]
    env:
      PRODUCER_RUN: ${{ inputs.producer-run }}
      CANDIDATE_SOURCE_SHA: ${{ inputs.producer-head }}
      CANDIDATE_VERSION: ${{ inputs.version }}
      CANDIDATE_DIRECT_ARTIFACTS: '1'
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/desktop-acceptance
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the exact original producer and allocate test directories
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:PRODUCER_RUN -ne '42270800297' -or $env:CANDIDATE_SOURCE_SHA -ne '12514727ac0f4e13384c0ae50607ab4899af1f40' -or $env:CANDIDATE_VERSION -ne '1.14.0') { throw 'Unexpected reproduction coordinates' }
          $artifact = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PRODUCER_RUN/artifacts" --jq '.artifacts[]|select(.name=="windows-installer-1.14.0-attempt-1" and .expired==false)|{id,digest}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.id -ne 13532920124 -or $artifact.digest -ne 'sha256:fde036f1f97109c6b5466d6b008be12023ce6a63e0efa3b3f3985ce8f2b3c89d') { throw 'Unexpected original workflow artifact' }
          $root = Join-Path $env:RUNNER_TEMP "f330-candidate-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $root | Out-Null
          "CANDIDATE_ROOT=$root" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-1.14.0-attempt-1
          run-id: ${{ inputs.producer-run }}
          github-token: ${{ github.token }}
          path: ${{ env.CANDIDATE_ROOT }}/installer-distribution
      - name: Run same-package install and restore
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:CANDIDATE_ROOT 'installer-distribution') -File)
          if ($files.Count -ne 1 -or (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash -ne '8B43301AE4551108010D05548BD8D02BC6F0539BBB646F656B9CB56F107EDEA1') { throw 'Installer bytes differ from the original failing attempt' }
          if ($env:MODE -eq 'observer') {
            & .github/desktop-acceptance/windows.ps1 -Distribution installer -AttemptId ([guid]::NewGuid().ToString()) -ObservePrivatePath
          } else {
            node .github/desktop-acceptance/distributions.mjs installer
          }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always() && env.CANDIDATE_ROOT != ''
        with:
          name: windows-restore-${{ matrix.mode }}
          path: ${{ env.CANDIDATE_ROOT }}/evidence
          retention-days: 14