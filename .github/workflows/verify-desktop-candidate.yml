name: Verify Desktop Candidate

# Consumes existing artifacts. Never builds, tags, publishes or uploads release assets.
on:
  workflow_dispatch:
    inputs:
      producer-run:
        description: Artifact-only release-desktop run ID with successful Windows producer job
        required: true
        type: string
      producer-head:
        description: Exact 40-character public source SHA of that run
        required: true
        type: string
      version:
        description: Exact candidate semver
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Install, launch and restore Windows EXE and ZIP
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PRODUCER_RUN: ${{ inputs.producer-run }}
      PRODUCER_HEAD: ${{ inputs.producer-head }}
      CANDIDATE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/desktop-acceptance
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check candidate verifier contracts
        run: node --test .github/desktop-acceptance/*.test.mjs
      - name: Verify producer identity and download exact artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/desktop-acceptance/input.mjs
      - name: Exercise both actual distributions in isolated instances
        shell: pwsh
        run: node .github/desktop-acceptance/distributions.mjs
      - name: Preserve actual receipts, screenshots and bounded instance logs
        if: always() && env.CANDIDATE_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-${{ github.run_id }}
          path: ${{ env.CANDIDATE_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 30
